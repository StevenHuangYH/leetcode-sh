ked Track: LC 0162 find peak element", "short": "LC 0162 find peak element", "path": "top-100/lc-0162-find-peak-element", "type": "problem", "notes": "# LeetCode 162. Find Peak Element (\u5bfb\u627e\u5cf0\u503c)\n## Step-by-Step Code Walkthrough & Notes / \u4ee3\u7801\u9010\u884c\u8be6\u89e3\u4e0e\u77e5\u8bc6\u70b9\u603b\u7ed3\n\n- **Difficulty:** Medium (\u9ad8\u9891\u9762\u8bd5\u7ecf\u5178\u9898 / \u4e8c\u5206\u67e5\u627e\u6781\u503c\u70b9)\n- **Tags:** Array, Binary Search\n- **Corresponding Python File:** [`top-100/lc-0162-find-peak-element.py`](top-100/lc-0162-find-peak-element.py)\n\n---\n\n## 1. Problem Statement / \u9898\u76ee\u63cf\u8ff0\n\n* **[EN]** A peak element is an element that is strictly greater than its neighbors.\n  * Given a **0-indexed** integer array `nums`, find a peak element, and return its index. If the array contains multiple peaks, return the index to **any of the peaks**.\n  * You may imagine that `nums[-1] = nums[n] = -\u221e`. In other words, an element is always considered to be strictly greater than a neighbor that is outside the array.\n  * **Requirement:** You must write an algorithm that runs in $\\mathcal{O}(\\log n)$ time.\n* **[CN]** \u5cf0\u503c\u5143\u7d20\u662f\u6307\u5176\u503c\u4e25\u683c\u5927\u4e8e\u5de6\u53f3\u76f8\u90bb\u503c\u7684\u5143\u7d20\u3002\n  * \u7ed9\u4f60\u4e00\u4e2a\u6574\u6570\u6570\u7ec4 `nums`\uff0c\u627e\u5230\u5cf0\u503c\u5143\u7d20\u5e76\u8fd4\u56de\u5176\u7d22\u5f15\u3002\u6570\u7ec4\u53ef\u80fd\u5305\u542b\u591a\u4e2a\u5cf0\u503c\uff0c\u5728\u8fd9\u79cd\u60c5\u51b5\u4e0b\uff0c\u8fd4\u56de **\u4efb\u4f55\u4e00\u4e2a\u5cf0\u503c** \u6240\u5728\u4f4d\u7f6e\u5373\u53ef\u3002\n  * \u4f60\u53ef\u4ee5\u5047\u8bbe `nums[-1] = nums[n] = -\u221e` \u3002\u4e5f\u5c31\u662f\u8bf4\uff0c\u4efb\u4f55\u8d85\u51fa\u6570\u7ec4\u8fb9\u754c\u7684\u76f8\u90bb\u5143\u7d20\u90fd\u89c6\u4f5c\u8d1f\u65e0\u7a77\u5c0f\u3002\n  * **\u8981\u6c42**\uff1a\u4f60\u5fc5\u987b\u8bbe\u8ba1\u5e76\u5b9e\u73b0\u65f6\u95f4\u590d\u6742\u5ea6\u4e3a $\\mathcal{O}(\\log n)$ \u7684\u7b97\u6cd5\u89e3\u51b3\u6b64\u95ee\u9898\u3002\n\n### Constraints / \u7ea6\u675f\u6761\u4ef6\n* $1 \\le \\text{nums.length} \\le 1000$\n* $-2^{31} \\le \\text{nums}[i] \\le 2^{31} - 1$\n* \u5bf9\u4e8e\u6240\u6709\u6709\u6548\u7684 $i$\uff0c\u90fd\u6709 $\\text{nums}[i] \\neq \\text{nums}[i + 1]$\uff08\u76f8\u90bb\u5143\u7d20\u4e25\u683c\u4e0d\u76f8\u7b49\uff09\u3002\n\n---\n\n## 2. Core Idea: Why Binary Search Works on Unsorted Arrays / \u6838\u5fc3\u89e3\u6cd5\uff1a\u4e3a\u4ec0\u4e48\u65e0\u5e8f\u6570\u7ec4\u4e5f\u80fd\u4e8c\u5206\uff1f\n\n### \ud83d\udca1 \u6838\u5fc3\u6d1e\u5bdf\u4e0e\u6570\u5b66\u539f\u7406\n\u5f88\u591a\u4eba\u8bef\u4ee5\u4e3a\u4e8c\u5206\u67e5\u627e\u53ea\u80fd\u7528\u4e8e\u201c\u5355\u8c03\u6709\u5e8f\u201d\u7684\u6570\u7ec4\u3002\u4f46\u4e8c\u5206\u67e5\u627e\u7684\u672c\u8d28\u662f **\u201c\u4e24\u6bb5\u6027 (Bipartiteness)\u201d** \u2014\u2014 \u53ea\u8981\u6bcf\u6b21\u901a\u8fc7\u67d0\u9879\u6027\u8d28\u80fd\u591f\u660e\u786e **\u6392\u9664\u6389\u4e00\u534a\u4e0d\u53ef\u80fd\u5305\u542b\u7b54\u6848\uff08\u6216\u5fc5\u7136\u5305\u542b\u7b54\u6848\uff09\u7684\u641c\u7d22\u7a7a\u95f4**\uff0c\u5373\u53ef\u8fdb\u884c\u5bf9\u534a\u7f29\u5c0f\uff0c\u5728 $\\mathcal{O}(\\log n)$ \u590d\u6742\u5ea6\u5185\u627e\u5230\u89e3\u3002\n\n#### 1. \u8fb9\u754c\u6761\u4ef6\u5960\u5b9a\u6781\u503c\u57fa\u7840\uff1a\n\u9898\u76ee\u5047\u8bbe $nums[-1] = nums[n] = -\\infty$\uff0c\u4e14\u76f8\u90bb\u5143\u7d20\u7edd\u4e0d\u76f8\u7b49\uff08$nums[i] \\neq nums[i+1]$\uff09\u3002\n\u8fd9\u4fdd\u8bc1\u4e86\u6570\u7ec4\u4ece\u8fb9\u754c\u51fa\u53d1\u5fc5\u7136\u662f\u4e00\u4e2a\u201c\u5347\u5761\u201d\uff0c\u5728\u53e6\u4e00\u4fa7\u8fb9\u754c\u524d\u5fc5\u7136\u662f\u4e00\u4e2a\u201c\u964d\u5761\u201d\uff0c**\u6574\u4e2a\u6570\u7ec4\u4e2d\u5fc5\u5b9a\u81f3\u5c11\u5b58\u5728\u4e00\u4e2a\u5c40\u90e8\u5cf0\u503c**\u3002\n\n#### 2. \u201c\u4e0a\u5761\u5fc5\u6709\u9876\u201d\u5f15\u7406 (The Climbing Theorem)\uff1a\n\u6211\u4eec\u4efb\u9009\u4e00\u4e2a\u4f4d\u7f6e $mid$\uff0c\u6bd4\u8f83 $nums[mid]$ \u548c\u5176\u53f3\u4fa7\u76f8\u90bb\u5143\u7d20 $nums[mid + 1]$\uff1a\n\n```\n       \u60c5\u51b5 1: nums[mid] < nums[mid+1] (\u4e0a\u5761)        \u60c5\u51b5 2: nums[mid] > nums[mid+1] (\u4e0b\u5761)\n                 \u5cf0\u503c\u5fc5\u5b9a\u5728\u53f3\u4fa7 (\u542b mid+1)                     \u5cf0\u503c\u5fc5\u5b9a\u5728\u5de6\u4fa7 (\u542b mid \u672c\u8eab)\n\n                   /\\                                     /\\\n                  /  \\                                   /  \\\n                 /    \\   ... nums[n]=-\u221e                /    \\\n                /                                            \\\n           mid+1                                              mid\n            /                                                  \\\n          mid                                                 mid+1\n          /                                                       \\\n  nums[-1]=-\u221e                                                    nums[n]=-\u221e\n```\n\n* **\u60c5\u51b5 1\uff1a$nums[mid] < nums[mid + 1]$\uff08\u5904\u4e8e\u4e0a\u5761\u6bb5\uff09**\n  * \u4ece $mid$ \u5230 $mid + 1$ \u6570\u503c\u5728\u589e\u5927\u3002\n  * \u7531\u4e8e\u6570\u7ec4\u53f3\u8fb9\u754c $nums[n] = -\\infty$\uff0c\u4ece $mid + 1$ \u5411\u53f3\u8d70\u6700\u7ec8\u5fc5\u5b9a\u8981\u201c\u4e0b\u843d\u201d\u3002\n  * \u56e0\u6b64\uff0c**\u5728 $[mid + 1, \\dots]$ \u7684\u53f3\u534a\u533a\u95f4\u5185\u5fc5\u5b9a\u5b58\u5728\u81f3\u5c11\u4e00\u4e2a\u5cf0\u503c**\uff01\n  * \u6211\u4eec\u53ea\u9700\u5f80\u53f3\u534a\u533a\u7f29\u5c0f\u641c\u7d22\u8303\u56f4\u3002\n* **\u60c5\u51b5 2\uff1a$nums[mid] > nums[mid + 1]$\uff08\u5904\u4e8e\u4e0b\u5761\u6bb5\uff09**\n  * \u4ece $mid$ \u5230 $mid + 1$ \u6570\u503c\u5728\u51cf\u5c0f\u3002\n  * \u7531\u4e8e\u6570\u7ec4\u5de6\u8fb9\u754c $nums[-1] = -\\infty$\uff0c\u4ece $mid$ \u5411\u5de6\u8d70\u6700\u7ec8\u4e5f\u5fc5\u5b9a\u8981\u201c\u4e0b\u843d\u201d\u3002\n  * \u56e0\u6b64\uff0c**\u5728 $[\\dots, mid]$ \u7684\u5de6\u534a\u533a\u95f4\u5185\uff08\u5305\u542b $mid$ \u672c\u8eab\uff09\u5fc5\u5b9a\u5b58\u5728\u81f3\u5c11\u4e00\u4e2a\u5cf0\u503c**\uff01\n  * \u6211\u4eec\u53ea\u9700\u5f80\u5de6\u534a\u533a\uff08\u4fdd\u7559 $mid$\uff09\u7f29\u5c0f\u641c\u7d22\u8303\u56f4\u3002\n\n---\n\n### \ud83c\udfa8 \u7ea2\u84dd\u67d3\u8272\u6cd5\u6a21\u578b (Red-Blue Coloring Framework)\n\u91c7\u7528\u7075\u8336\u5c71\u827e\u5e9c\u7684\u7ea2\u84dd\u67d3\u8272\u4f53\u7cfb\uff1a\n* **\u84dd\u8272\u6027\u8d28 (Blue)**\uff1a\u6ee1\u8db3 $nums[i] > nums[i + 1]$\uff08\u5904\u4e8e\u5cf0\u503c\u6216\u4e0b\u5761\u6bb5\uff0c\u7b54\u6848\u5728 $i$ \u6216\u5176\u5de6\u4fa7\uff09\u3002\n* **\u7ea2\u8272\u6027\u8d28 (Red)**\uff1a\u6ee1\u8db3 $nums[i] < nums[i + 1]$\uff08\u5904\u4e8e\u4e0a\u5761\u6bb5\uff0c\u7b54\u6848\u5728 $i$ \u7684\u4e25\u683c\u53f3\u4fa7\uff09\u3002\n* \u521d\u59cb\u65f6\uff0c\u6240\u6709\u4f4d\u7f6e\u672a\u77e5\u3002\u4e8c\u5206\u4e0d\u65ad\u5c06\u5de6\u534a\u8fb9\u67d3\u6210\u7ea2\u8272\uff0c\u53f3\u534a\u8fb9\u67d3\u6210\u84dd\u8272\u3002\n* \u6700\u7ec8\u6536\u655b\u70b9\uff1a**\u7b2c\u4e00\u4e2a\u84dd\u8272\u4f4d\u7f6e\u5373\u4e3a\u4e00\u4e2a\u5408\u6cd5\u7684\u5cf0\u503c\u5143\u7d20\u7d22\u5f15**\uff01\n\n---\n\n## 3. Step-by-Step Code Walkthrough / \u4ee3\u7801\u9010\u884c\u8be6\u89e3\n\n\u4ee5\u5f00\u533a\u95f4 `(-1, n - 1)` \u6a21\u7248\u4e3a\u4f8b\uff1a\n\n```python\nfrom typing import List\n\nclass Solution:\n    def findPeakElement(self, nums: List[int]) -> int:\n        # \u5f00\u533a\u95f4 (-1, n - 1)\n        left = -1\n        right = len(nums) - 1\n```\n\n* **[EN] Action:** Initializes the open interval search range `(left, right) = (-1, n - 1)`.\n  * **Why `right = len(nums) - 1` instead of `len(nums)`?** Because we will compare `nums[mid]` with `nums[mid + 1]`. To prevent index out-of-bound errors on `mid + 1`, `mid` must not exceed `n - 2`. In an open interval `(-1, n - 1)`, the maximum possible value of `mid` is $n - 2$.\n* **[CN] \u52a8\u4f5c**\uff1a\u521d\u59cb\u5316\u5f00\u533a\u95f4\u4e8c\u5206\u8303\u56f4 `(left, right) = (-1, n - 1)`\u3002\n  * **\u4e3a\u4ec0\u4e48 `right = len(nums) - 1` \u800c\u4e0d\u662f `len(nums)`\uff1f** \u56e0\u4e3a\u540e\u7eed\u6211\u4eec\u8981\u8bbf\u95ee `nums[mid + 1]`\u3002\u4e3a\u4e86\u4fdd\u8bc1 `mid + 1` \u4e0d\u8d8a\u754c\uff0c`mid` \u6700\u5927\u53ea\u80fd\u53d6\u5230 $n - 2$\u3002\u5728\u5f00\u533a\u95f4 `(-1, n - 1)` \u4e2d\uff0c\u5185\u90e8\u7684\u5019\u9009\u4e0b\u6807\u6700\u5927\u6b63\u597d\u662f $n - 2$\u3002\n\n---\n\n```python\n        while left + 1 < right:\n            mid = (left + right) // 2\n```\n\n* **[EN] Action:** Continues binary search while the open interval contains at least one unchecked element (`left + 1 < right`). Computes the middle index `mid`.\n* **[CN] \u52a8\u4f5c**\uff1a\u5f53\u5f00\u533a\u95f4\u5185\u4ecd\u6709\u672a\u63a2\u660e\u5143\u7d20\u65f6\uff08\u5373 `left + 1 < right`\uff09\u6301\u7eed\u5faa\u73af\uff0c\u8ba1\u7b97\u4e2d\u70b9 `mid`\u3002\n\n---\n\n```python\n            if nums[mid] > nums[mid + 1]:\n                right = mid  # \u67d3\u4e3a\u84dd\u8272\uff0c\u5cf0\u503c\u5728 mid \u6216\u5176\u5de6\u4fa7\n            else:\n                left = mid   # \u67d3\u4e3a\u7ea2\u8272\uff0c\u5cf0\u503c\u5728 mid \u7684\u4e25\u683c\u53f3\u4fa7\n```\n\n* **[EN] Logic:**\n  * If `nums[mid] > nums[mid + 1]`: The sequence is sloping downwards. The peak is at `mid` or somewhere to the left of `mid`. Shrink the open interval right boundary to `mid` (`right = mid`).\n  * Else (`nums[mid] < nums[mid + 1]`): The sequence is sloping upwards. The peak is strictly to the right of `mid`. Shrink the open interval left boundary to `mid` (`left = mid`).\n* **[CN] \u903b\u8f91**\uff1a\n  * \u82e5 `nums[mid] > nums[mid + 1]`\uff1a\u5904\u4e8e\u4e0b\u5761\u6bb5\uff0c`mid` \u53ef\u80fd\u662f\u5cf0\u9876\uff0c\u6216\u8005\u5cf0\u9876\u5728 `mid` \u7684\u5de6\u4fa7\u3002\u5c06\u53f3\u8fb9\u754c\u6536\u7f29\u81f3 `mid`\uff08\u5f00\u533a\u95f4\u53f3\u8fb9\u754c\u4e0d\u5305\u542b\uff0c\u4f46 `right` \u6307\u9488\u8bb0\u5f55\u4e86\u5f53\u524d\u5df2\u77e5\u7684\u84dd\u8272\u6700\u5de6\u4f4d\u7f6e\uff09\u3002\n  * \u5426\u5219\uff08`nums[mid] < nums[mid + 1]`\uff09\uff1a\u5904\u4e8e\u4e0a\u5761\u6bb5\uff0c`mid` \u7edd\u4e0d\u53ef\u80fd\u662f\u5cf0\u9876\uff0c\u5cf0\u9876\u5fc5\u7136\u5728 `mid` \u7684\u4e25\u683c\u53f3\u4fa7\u3002\u5c06\u5de6\u8fb9\u754c\u6536\u7f29\u81f3 `mid`\u3002\n\n---\n\n```python\n        return right\n```\n\n* **[EN] Action:** When the loop terminates, `left + 1 == right`. `right` points to the first blue element (the peak), which is our answer.\n* **[CN] \u52a8\u4f5c**\uff1a\u5faa\u73af\u7ec8\u6b62\u65f6 `left + 1 == right`\uff0c`right` \u7cbe\u786e\u6307\u5411\u7b2c\u4e00\u4e2a\u67d3\u4e3a\u84dd\u8272\u7684\u5143\u7d20\uff08\u5373\u5cf0\u503c\u4f4d\u7f6e\uff09\uff0c\u76f4\u63a5\u8fd4\u56de `right`\u3002\n\n---\n\n## 4. The Three Interval Paradigms / \u4e8c\u5206\u67e5\u627e\u7684\u4e09\u79cd\u533a\u95f4\u6a21\u7248\u6df1\u5ea6\u5bf9\u6bd4\n\n\u672c\u9898\u53ef\u65e0\u7f1d\u9002\u914d\u4e8c\u5206\u67e5\u627e\u7684\u4e09\u79cd\u7ecf\u5178\u533a\u95f4\u6a21\u7248\uff08\u95ed\u533a\u95f4\u3001\u5de6\u95ed\u53f3\u5f00\u3001\u5f00\u533a\u95f4\uff09\uff1a\n\n```\n1. \u95ed\u533a\u95f4 [0, n - 2]           2. \u5de6\u95ed\u53f3\u5f00 [0, n - 1)          3. \u5f00\u533a\u95f4 (-1, n - 1)\n   left         right             left         right             left         right\n    \u2193             \u2193                \u2193             \u2193                \u2193             \u2193\n [  0   . . .   n-2  ]          [  0   . . .   n-1  )          ( -1   . . .   n-1  )\n```\n\n| \u7ef4\u5ea6 | 1. \u95ed\u533a\u95f4 `[left, right]` | 2. \u5de6\u95ed\u53f3\u5f00 `[left, right)` | 3. \u5f00\u533a\u95f4 `(left, right)` |\n| :--- | :--- | :--- | :--- |\n| **\u521d\u59cb\u8303\u56f4** | `left = 0, right = n - 2` | `left = 0, right = n - 1` | `left = -1, right = n - 1` |\n| **\u5faa\u73af\u6761\u4ef6** | `while left <= right:` | `while left < right:` | `while left + 1 < right:` |\n| **\u82e5 $nums[mid] < nums[mid+1]$** | `left = mid + 1` | `left = mid + 1` | `left = mid` |\n| **\u82e5 $nums[mid] > nums[mid+1]$** | `right = mid - 1` | `right = mid` | `right = mid` |\n| **\u5faa\u73af\u7ed3\u675f\u72b6\u6001** | `right + 1 == left` | `left == right` | `left + 1 == right` |\n| **\u8fd4\u56de\u503c** | `return left` | `return left` (\u6216 `right`) | `return right` |\n\n### \u4e09\u79cd\u6a21\u7248\u7684\u5b8c\u6574\u4ee3\u7801\u5bf9\u6bd4\uff1a\n\n```python\nfrom typing import List\n\n# 1. \u5f00\u533a\u95f4\u6a21\u7248 (-1, n - 1) \u2014\u2014 \u63a8\u8350\uff0c\u8fb9\u754c\u6781\u5176\u5bf9\u79f0\u4f18\u96c5\nclass SolutionOpen:\n    def findPeakElement(self, nums: List[int]) -> int:\n        left = -1\n        right = len(nums) - 1\n        while left + 1 < right:\n            mid = (left + right) // 2\n            if nums[mid] > nums[mid + 1]:\n                right = mid\n            else:\n                left = mid\n        return right\n\n# 2. \u95ed\u533a\u95f4\u6a21\u7248 [0, n - 2]\nclass SolutionClosed:\n    def findPeakElement(self, nums: List[int]) -> int:\n        left = 0\n        right = len(nums) - 2\n        while left <= right:\n            mid = (left + right) // 2\n            if nums[mid] > nums[mid + 1]:\n                right = mid - 1\n            else:\n                left = mid + 1\n        return left\n\n# 3. \u5de6\u95ed\u53f3\u5f00\u6a21\u7248 [0, n - 1)\nclass SolutionHalfOpen:\n    def findPeakElement(self, nums: List[int]) -> int:\n        left = 0\n        right = len(nums) - 1\n        while left < right:\n            mid = (left + right) // 2\n            if nums[mid] > nums[mid + 1]:\n                right = mid\n            else:\n                left = mid + 1\n        return left\n```\n\n---\n\n## 5. Step-by-Step Walkthrough with Examples / \u6837\u4f8b\u56fe\u89e3\u5206\u6790\n\n### \u6837\u4f8b 1: `nums = [1, 2, 3, 1]` ($n = 4$)\n\u76ee\u6807\uff1a\u5bfb\u627e\u5cf0\u503c\u5143\u7d20\uff08\u5cf0\u503c\u4e3a `3`\uff0c\u4e0b\u6807\u4e3a `2`\uff09\u3002\n\n* **\u521d\u59cb\u5316**\uff08\u5f00\u533a\u95f4\uff09\uff1a`left = -1`, `right = 3` (\u641c\u7d22\u5f00\u533a\u95f4 `(-1, 3)`)\n* **\u7b2c 1 \u8f6e**\uff1a\n  * `mid = (-1 + 3) // 2 = 1`\n  * \u6bd4\u8f83 `nums[1] = 2` \u4e0e `nums[2] = 3`\uff1a`nums[1] < nums[2]`\uff08\u4e0a\u5761\uff09\n  * \u7ea2\u8272\u533a\u57df\u6269\u5927\uff0c\u4ee4 `left = mid = 1`\u3002\u533a\u95f4\u53d8\u4e3a `(1, 3)`\u3002\n* **\u7b2c 2 \u8f6e**\uff1a\n  * `mid = (1 + 3) // 2 = 2`\n  * \u6bd4\u8f83 `nums[2] = 3` \u4e0e `nums[3] = 1`\uff1a`nums[2] > nums[3]`\uff08\u4e0b\u5761\uff09\n  * \u84dd\u8272\u533a\u57df\u6269\u5927\uff0c\u4ee4 `right = mid = 2`\u3002\u533a\u95f4\u53d8\u4e3a `(1, 2)`\u3002\n* **\u7ec8\u6b62**\uff1a`left + 1 == 2 == right`\uff0c\u5faa\u73af\u7ed3\u675f\u3002\n* **\u8fd4\u56de**\uff1a`right = 2`\uff0c\u5bf9\u5e94\u503c `nums[2] = 3`\uff0c\u6b63\u786e\uff01\n\n---\n\n### \u6837\u4f8b 2: `nums = [1, 2, 1, 3, 5, 6, 4]` ($n = 7$)\n\u76ee\u6807\uff1a\u6570\u7ec4\u4e2d\u6709\u4e24\u4e2a\u5cf0\u503c\uff1a\u4e0b\u6807 `1`\uff08\u503c\u4e3a 2\uff09\u548c\u4e0b\u6807 `5`\uff08\u503c\u4e3a 6\uff09\uff0c\u8fd4\u56de\u4efb\u4e00\u4e2a\u5747\u53ef\u3002\n\n* **\u521d\u59cb\u5316**\uff1a`left = -1`, `right = 6` (\u641c\u7d22\u5f00\u533a\u95f4 `(-1, 6)`)\n* **\u7b2c 1 \u8f6e**\uff1a\n  * `mid = (-1 + 6) // 2 = 2`\n  * `nums[2] = 1 < nums[3] = 3` $\\to$ `left = 2`\u3002\u533a\u95f4\u53d8\u4e3a `(2, 6)`\u3002\n* **\u7b2c 2 \u8f6e**\uff1a\n  * `mid = (2 + 6) // 2 = 4`\n  * `nums[4] = 5 < nums[5] = 6` $\\to$ `left = 4`\u3002\u533a\u95f4\u53d8\u4e3a `(4, 6)`\u3002\n* **\u7b2c 3 \u8f6e**\uff1a\n  * `mid = (4 + 6) // 2 = 5`\n  * `nums[5] = 6 > nums[6] = 4` $\\to$ `right = 5`\u3002\u533a\u95f4\u53d8\u4e3a `(4, 5)`\u3002\n* **\u7ec8\u6b62**\uff1a`left + 1 == right`\uff0c\u8fd4\u56de `right = 5`\uff08\u503c\u4e3a 6\uff09\uff0c\u6b63\u786e\uff01\n\n---\n\n### \u6781\u7aef\u60c5\u51b5\u6d4b\u8bd5\uff1a\n1. **\u5355\u8c03\u9012\u589e\u6570\u7ec4** `[1, 2, 3, 4, 5]`\uff1a\n   * \u6bcf\u6b21\u6bd4\u8f83\u5747\u6ee1\u8db3 $nums[mid] < nums[mid+1]$\uff0c`left` \u4f1a\u4e0d\u65ad\u53f3\u79fb\uff0c\u6700\u7ec8\u6536\u655b\u4e8e\u6700\u540e\u4e00\u4e2a\u5143\u7d20\u4e0b\u6807 `4`\uff08\u503c\u4e3a 5\uff09\u3002\n2. **\u5355\u8c03\u9012\u51cf\u6570\u7ec4** `[5, 4, 3, 2, 1]`\uff1a\n   * \u6bcf\u6b21\u6bd4\u8f83\u5747\u6ee1\u8db3 $nums[mid] > nums[mid+1]$\uff0c`right` \u4f1a\u4e0d\u65ad\u5de6\u79fb\uff0c\u6700\u7ec8\u6536\u655b\u4e8e\u7b2c\u4e00\u4e2a\u5143\u7d20\u4e0b\u6807 `0`\uff08\u503c\u4e3a 5\uff09\u3002\n3. **\u5355\u5143\u7d20\u6570\u7ec4** `[1]` ($n = 1$)\uff1a\n   * `left = -1`, `right = 0`\u3002\n   * `left + 1 < right` \u6761\u4ef6\u4e3a `-1 + 1 < 0` $\\to$ `0 < 0` (False)\uff0c\u5faa\u73af\u76f4\u63a5\u4e0d\u6267\u884c\uff0c\u8fd4\u56de `right = 0`\uff0c\u5b8c\u7f8e\u6210\u7acb\uff01\n\n---\n\n## 6. Key FAQs & Edge Cases / \u6838\u5fc3\u7b54\u7591\u4e0e\u8fb9\u754c\u5206\u6790\n\n### Q1: \u4e3a\u4ec0\u4e48\u533a\u95f4\u53f3\u8fb9\u754c\u53ea\u5230 $n - 2$\uff08\u6216\u5f00\u533a\u95f4 $n - 1$\uff09\uff1f\n* \u56e0\u4e3a\u5faa\u73af\u4f53\u5185\u9700\u8981\u8bbf\u95ee `nums[mid + 1]`\u3002\n* \u5982\u679c $mid$ \u80fd\u591f\u53d6\u5230 $n - 1$\uff0c\u8bbf\u95ee `nums[mid + 1]` \u5c31\u4f1a\u53d8\u6210 `nums[n]`\uff0c\u4ece\u800c\u89e6\u53d1 **IndexError (\u6570\u7ec4\u8d8a\u754c)**\u3002\n* \u9650\u5236\u641c\u7d22\u4e0a\u9650\u540e\uff0c$mid$ \u7684\u6700\u5927\u53ef\u80fd\u53d6\u503c\u4e3a $n - 2$\uff0c\u56e0\u6b64 $mid + 1 \\le n - 1$\uff0c\u7edd\u5bf9\u5b89\u5168\u3002\n\n### Q2: \u4e3a\u4ec0\u4e48\u9898\u76ee\u4fdd\u8bc1\u76f8\u90bb\u5143\u7d20\u4e25\u683c\u4e0d\u76f8\u7b49\uff1f\u5982\u679c\u6709\u76f8\u7b49\u5143\u7d20\uff08\u5982 `[1, 2, 2, 1]`\uff09\u8fd8\u80fd\u4e8c\u5206\u5417\uff1f\n* \u5982\u679c\u5b58\u5728\u76f8\u7b49\u5143\u7d20\uff08$nums[mid] == nums[mid+1]$\uff09\uff0c\u5f53\u51fa\u73b0\u5e73\u5761\u65f6\uff0c\u6211\u4eec**\u65e0\u6cd5\u5224\u65ad\u5cf0\u503c\u5728\u5de6\u8fb9\u8fd8\u662f\u5728\u53f3\u8fb9**\uff08\u4f8b\u5982 `[1, 1, 1, 2, 1]` vs `[1, 2, 1, 1, 1]`\uff0c\u4e2d\u70b9\u5904\u90fd\u662f\u5e73\u5761\uff0c\u4f46\u5cf0\u503c\u5206\u5e03\u5728\u4e0d\u540c\u4fa7\uff09\u3002\n* \u5728\u5b58\u5728\u76f8\u7b49\u76f8\u90bb\u5143\u7d20\u7684\u60c5\u51b5\u4e0b\uff0c\u6700\u574f\u60c5\u51b5\u4e0b\u5fc5\u987b\u9000\u5316\u4e3a $\\mathcal{O}(n)$ \u7684\u7ebf\u6027\u626b\u63cf\uff08\u7c7b\u4f3c LeetCode 154 \u65cb\u8f6c\u6392\u5e8f\u6570\u7ec4\u7684\u6700\u5c0f\u503c\u7684\u7279\u5224\u903b\u8f91\uff09\u3002\n\n### Q3: \u4e3a\u4ec0\u4e48\u8fd9\u9053\u9898\u6709\u591a\u4e2a\u5cf0\u503c\u65f6\uff0c\u4e8c\u5206\u4ecd\u80fd\u6b63\u786e\u627e\u5230\u5176\u4e2d\u4e00\u4e2a\uff1f\n* \u4e8c\u5206\u7684\u8fc7\u7a0b\u6bcf\u6b21\u90fd\u4e22\u5f03\u4e00\u6bb5\u5fc5\u7136\u5305\u542b\u6216\u4e0d\u5305\u542b\u67d0\u7c7b\u7279\u5f81\u7684\u534a\u533a\u3002\n* \u5373\u4f7f\u4e24\u4fa7\u90fd\u6709\u5cf0\u503c\uff0c\u53ea\u8981\u6211\u4eec\u9009\u62e9\u7684\u4e00\u4fa7\u6839\u636e\u201c\u722c\u5761\u5b9a\u7406\u201d**\u5fc5\u5b9a\u5b58\u5728\u81f3\u5c11\u4e00\u4e2a\u5cf0\u503c**\uff0c\u4e8c\u5206\u5c31\u80fd\u6cbf\u7740\u8be5\u8def\u5f84\u9501\u5b9a\u8be5\u4fa7\u7684\u5c40\u90e8\u5cf0\u503c\uff0c\u6ee1\u8db3\u9898\u76ee\u201c\u8fd4\u56de\u4efb\u4f55\u4e00\u4e2a\u5cf0\u503c\u201d\u7684\u8981\u6c42\u3002\n\n---\n\n## 7. Complexity Analysis / \u590d\u6742\u5ea6\u5206\u6790\n\n| \u6307\u6807 | \u590d\u6742\u5ea6 | \u8be6\u89e3 |\n| :--- | :--- | :--- |\n| **\u65f6\u95f4\u590d\u6742\u5ea6 (Time)** | $\\mathcal{O}(\\log n)$ | \u6bcf\u6b21\u6bd4\u8f83\u4e2d\u70b9\u76f8\u90bb\u4e24\u5143\u7d20\u5373\u53ef\u5c06\u641c\u7d22\u7a7a\u95f4\u51cf\u534a\uff0c\u6700\u5927\u5faa\u73af\u6b21\u6570\u4e3a $\\lceil\\log_2 n\\rceil$\u3002\u6ee1\u8db3\u9898\u76ee\u4e25\u683c\u8981\u6c42\u7684\u5bf9\u6570\u65f6\u9650\u3002 |\n| **\u7a7a\u95f4\u590d\u6742\u5ea6 (Space  1\n\n        return left", "diff": "Medium", "py_file": "top-100/lc-0162-find-peak-element.py", "md_file": "top-100/lc-0162-find-peak-element.md"}, "top-100/lc-0167-two-sum-ii-input-array-is-sorted": {"key": "top-100/lc-0167-two-sum-ii-input-array-is-sorted", "category": "Top 100 Liked Track", "title": "Top 100 Liked Track: LC 0167 two sum ii input array is sorted", "short": "LC 0167 two sum ii input array is sorted", "path": "top-100/lc-0167-two-sum-ii-input-array-is-sorted", "type": "problem", "notes": "# LeetCode 167. Two Sum II - Input Array Is Sorted\n## Step-by-Step Code Walkthrough & Notes / \u4ee3\u7801\u9010\u884c\u8be6\u89e3\u4e0e\u77e5\u8bc6\u70b9\u603b\u7ed3\n\n- **Difficulty:** Medium (\u9762\u8bd5\u9ad8\u9891 / \u7ecf\u5178\u53cc\u6307\u9488)\n- **Tags:** Array, Two Pointers, Binary Search\n- **Corresponding Python File:** [`s-lc-167.py`](top-100/lc-0167-two-sum-ii-input-array-is-sorted.py)\n\n---\n\n## 1. Problem Statement / \u9898\u76ee\u63cf\u8ff0\n\n* **[EN]** Given a **1-indexed** array of integers `numbers` that is already **sorted in non-decreasing order**, find two numbers such that they add up to a specific `target` number. Return the indices of the two numbers, `index1` and `index2`, added by one as an integer array `[index1, index2]` of length 2.\n  * **Constraints:** You must use only $\\mathcal{O}(1)$ extra space. There is exactly one solution. You may not use the same element twice.\n* **[CN]** \u7ed9\u4f60\u4e00\u4e2a\u4e0b\u6807\u4ece **1 \u5f00\u59cb** \u7684\u6574\u6570\u6570\u7ec4 `numbers` \uff0c\u8be5\u6570\u7ec4\u5df2\u6309 **\u975e\u9012\u51cf\u987a\u5e8f\u6392\u5217** \u3002\u8bf7\u4f60\u4ece\u6570\u7ec4\u4e2d\u627e\u51fa\u6ee1\u8db3\u76f8\u52a0\u4e4b\u548c\u7b49\u4e8e\u76ee\u6807\u6570 `target` \u7684\u4e24\u4e2a\u6570\u3002\u8fd4\u56de\u8fd9\u4e24\u4e2a\u6570\u7684\u4e0b\u6807 `index1` \u548c `index2`\uff08\u4ee5\u957f\u4e3a 2 \u7684\u6574\u6570\u6570\u7ec4 `[index1, index2]` \u5f62\u5f0f\u8fd4\u56de\uff0c\u4e0b\u6807\u4ece 1 \u5f00\u59cb\uff09\u3002\n  * **\u7ea6\u675f\u6761\u4ef6**\uff1a\u4f60\u53ea\u80fd\u4f7f\u7528 $\\mathcal{O}(1)$ \u7684\u989d\u5916\u7a7a\u95f4\uff1b\u6d4b\u8bd5\u7528\u4f8b\u6709\u4e14\u4ec5\u6709\u4e00\u4e2a\u6709\u6548\u7b54\u6848\uff1b\u4e0d\u80fd\u91cd\u590d\u4f7f\u7528\u76f8\u540c\u7684\u5143\u7d20\u3002\n\n---\n\n## 2. Step-by-Step Code Walkthrough / \u4ee3\u7801\u9010\u884c\u8be6\u89e3\n\n### \u65b9\u6848 1\uff1a\u53cc\u6307\u9488\u5bf9\u649e\u6cd5 (Two Pointers - Optimal $\\mathcal{O}(1)$ Space)\n\n```python\nclass Solution:\n    def twoSum(self, numbers: List[int], target: int) -> List[int]:\n        left = 0\n        right = len(numbers) - 1\n```\n\n* **[EN] Action:** Initializes `left` pointer at the first element index (`0`) and `right` pointer at the last element index (`len(numbers) - 1`).\n  * **Why Two Pointers?** Because the array is **sorted**. The smallest elements are on the left, and the largest elements are on the right.\n* **[CN] \u52a8\u4f5c**\uff1a\u521d\u59cb\u5316\u5de6\u6307\u9488 `left = 0` \u6307\u5411\u6570\u7ec4\u9996\u7aef\uff08\u6700\u5c0f\u503c\uff09\uff0c\u53f3\u6307\u9488 `right = len(numbers) - 1` \u6307\u5411\u6570\u7ec4\u672b\u7aef\uff08\u6700\u5927\u503c\uff09\u3002\n  * **\u4e3a\u4ec0\u4e48\u7528\u53cc\u6307\u9488\uff1f** \u56e0\u4e3a\u6570\u7ec4\u662f**\u6709\u5e8f\uff08\u975e\u9012\u51cf\uff09**\u7684\u3002\u5de6\u4fa7\u662f\u8f83\u5c0f\u6570\uff0c\u53f3\u4fa7\u662f\u8f83\u5927\u6570\uff0c\u53ef\u4ee5\u901a\u8fc7\u79fb\u52a8\u6307\u9488\u5355\u8c03\u6027\u5730\u6539\u53d8\u4e24\u6570\u4e4b\u548c\u3002\n\n---\n\n```python\n        while left < right:\n            curr_sum = numbers[left] + numbers[right]\n```\n\n* **[EN] Action:** Loops as long as `left < right`. Calculates the sum of the elements at the two pointers: `curr_sum = numbers[left] + numbers[right]`.\n  * **Why `left < right` instead of `left <= right`?** The problem forbids using the exact same element twice (`1 <= index1 < index2 <= n`).\n* **[CN] \u52a8\u4f5c**\uff1a\u5f53 `left < right` \u65f6\u8fdb\u5165\u5faa\u73af\uff0c\u8ba1\u7b97\u5f53\u524d\u5de6\u53f3\u6307\u9488\u6240\u6307\u4e24\u6570\u4e4b\u548c `curr_sum`\u3002\n  * **\u4e3a\u4ec0\u4e48\u662f `left < right` \u800c\u4e0d\u662f `<=`\uff1f** \u9898\u76ee\u660e\u786e\u8bf4\u660e\u4e0d\u80fd\u91cd\u590d\u4f7f\u7528\u540c\u4e00\u4e2a\u5143\u7d20\u4e24\u6b21\uff08\u5fc5\u987b\u662f\u4e24\u4e2a\u4e0d\u540c\u4f4d\u7f6e\u7684\u6570\uff09\u3002\n\n---\n\n```python\n            if curr_sum == target:\n                return [left + 1, right + 1]\n```\n\n* **[EN] Action:** If `curr_sum == target`, the target pair is found.\n  * **Why `+ 1`?** The problem states that the array is **1-indexed**, while Python lists are **0-indexed**. Adding `1` converts `0-based` indices into `1-based` indices.\n* **[CN] \u52a8\u4f5c**\uff1a\u82e5\u4e24\u6570\u4e4b\u548c\u521a\u597d\u7b49\u4e8e `target`\uff0c\u7acb\u5373\u8fd4\u56de\u4e0b\u6807\u6570\u7ec4\u3002\n  * **\u4e3a\u4ec0\u4e48\u8981 `+ 1`\uff1f** \u9898\u76ee\u8981\u6c42\u8fd4\u56de **1-based index**\uff08\u4e0b\u6807\u4ece 1 \u5f00\u59cb\u8ba1\uff09\uff0c\u800c Python \u5217\u8868\u662f 0-based \u7d22\u5f15\uff0c\u6240\u4ee5\u4e24\u7aef\u5747\u9700\u52a0 1\u3002\n\n---\n\n```python\n            elif curr_sum < target:\n                left += 1\n```\n\n* **[EN] Logic:** If `curr_sum < target`, the sum is too small.\n  * **Why `left += 1`?** Since the array is sorted in ascending order, moving `left` to the right (`left + 1`) increases the value of `numbers[left]`, thus increasing `curr_sum`.\n* **[CN] \u903b\u8f91**\uff1a\u5982\u679c\u5f53\u524d\u548c `curr_sum < target`\uff0c\u8bf4\u660e\u5f53\u524d\u548c\u504f\u5c0f\u3002\n  * **\u4e3a\u4ec0\u4e48 `left += 1`\uff1f** \u6570\u7ec4\u662f\u5347\u5e8f\u6392\u5217\u7684\uff0c\u5c06\u5de6\u6307\u9488\u5411\u53f3\u79fb\u52a8\u4e00\u4f4d\u53ef\u4ee5\u589e\u5927 `numbers[left]` \u7684\u503c\uff0c\u4ece\u800c\u4f7f\u4e24\u6570\u4e4b\u548c\u589e\u5927\u3002\n\n---\n\n```python\n            else:\n                right -= 1\n```\n\n* **[EN] Logic:** If `curr_sum > target`, the sum is too large.\n  * **Why `right -= 1`?** Moving `right` to the left (`right - 1`) decreases the value of `numbers[right]`, thus reducing `curr_sum`.\n* **[CN] \u903b\u8f91**\uff1a\u5982\u679c\u5f53\u524d\u548c `curr_sum > target`\uff0c\u8bf4\u660e\u5f53\u524d\u548c\u504f\u5927\u3002\n  * **\u4e3a\u4ec0\u4e48 `right -= 1`\uff1f** \u5c06\u53f3\u6307\u9488\u5411\u5de6\u79fb\u52a8\u4e00\u4f4d\u53ef\u4ee5\u51cf\u5c0f `numbers[right]` \u7684\u503c\uff0c\u4ece\u800c\u4f7f\u4e24\u6570\u4e4b\u548c\u51cf\u5c0f\u3002\n\n---\n\n```python\n        return []\n```\n\n* **[EN] Action:** Fallback return. (Per constraints, a solution is guaranteed to exist).\n* **[CN] \u52a8\u4f5c**\uff1a\u515c\u5e95\u8fd4\u56de\uff08\u9898\u76ee\u4fdd\u8bc1\u5fc5\u5b9a\u5b58\u5728\u552f\u4e00\u89e3\uff09\u3002\n\n---\n\n## 3. Key FAQs & Concept Clarifications / \u6838\u5fc3\u7b54\u7591\u4e0e\u539f\u7406\n\n### Q1: \u4e3a\u4ec0\u4e48\u5bf9\u649e\u53cc\u6307\u9488\u4e0d\u4f1a\u6f0f\u6389\u89e3\uff1f(Why are we sure no valid pair is missed?)\n* \u5047\u8bbe\u552f\u4e00\u6b63\u786e\u7684\u7b54\u6848\u662f\u4e0b\u6807\u5bf9 $(i^*, j^*)$\u3002\n* \u4e00\u5f00\u59cb $left = 0 \\le i^*$\uff0c$right = n-1 \\ge j^*$\u3002\n* \u5982\u679c $left$ \u8fd8\u6ca1\u5230 $i^*$ \u4f46 $right$ \u5df2\u7ecf\u5230\u4e86 $j^*$\uff1a\n  * \u6b64\u65f6 $numbers[left] + numbers[right] = numbers[left] + numbers[j^*] < numbers[i^*] + numbers[j^*] = target$\n  * \u56e0\u4e3a\u548c\u5fc5\u5b9a\u5c0f\u4e8e $target$\uff0c\u7b97\u6cd5\u53ea\u4f1a\u6267\u884c `left += 1`\uff0c**\u7edd\u4e0d\u4f1a\u628a\u5df2\u7ecf\u505c\u5728\u6b63\u786e\u4f4d\u7f6e\u7684 $right$ \u5de6\u79fb**\uff01\n* \u540c\u7406\uff0c\u82e5 $left$ \u5148\u5230\u8fbe $i^*$\uff0c\u548c\u5fc5\u5b9a\u5927\u4e8e $target$\uff0c\u7b97\u6cd5\u53ea\u4f1a\u6267\u884c `right -= 1`\u3002\n* \u56e0\u6b64\u4e24\u4e2a\u6307\u9488\u5fc5\u7136\u5728 $(i^*, j^*)$ \u5904\u6c47\u5408\uff0c**\u7edd\u4e0d\u4f1a\u9519\u8fc7\u6b63\u786e\u7b54\u6848**\u3002\n\n---\n\n### Q2: LC 1 (Two Sum) vs LC 167 (Two Sum II) \u7684\u5bf9\u6bd4\n\n| \u7ef4\u5ea6 | LeetCode 1 (\u65e0\u5e8f\u6570\u7ec4) | LeetCode 167 (\u6709\u5e8f\u6570\u7ec4) |\n| :--- | :--- | :--- |\n| **\u6570\u7ec4\u72b6\u6001** | \u65e0\u5e8f (Unsorted) | \u5df2\u5347\u5e8f\u6392\u5e8f (Sorted non-decreasing) |\n| **\u63a8\u8350\u89e3\u6cd5** | \u54c8\u5e0c\u8868 (Hash Map) | \u53cc\u6307\u9488\u5bf9\u649e (Two Pointers) |\n| **\u65f6\u95f4\u590d\u6742\u5ea6** | $\\mathcal{O}(n)$ | $\\mathcal{O}(n)$ |\n| **\u7a7a\u95f4\u590d\u6742\u5ea6** | $\\mathcal{O}(n)$ (\u9700\u8981\u989d\u5916\u5b57\u5178) | $\\mathcal{O}(1)$ (\u4ec5\u53cc\u6307\u9488\u53d8\u91cf\uff0c\u6ee1\u8db3\u8fdb\u9636\u8981\u6c42) |\n| **\u4e0b\u6807\u89c4\u8303** | 0-indexed | 1-indexed (\u9700 `+ 1`) |\n\n---\n\n## 4. Alternative Methods / \u5176\u4ed6\u89e3\u6cd5\u5bf9\u6bd4\n\n### \u65b9\u6848 2\uff1a\u4e8c\u5206\u67e5\u627e (Binary Search)\n* **\u601d\u8def**\uff1a\u904d\u5386\u6bcf\u4e2a\u5143\u7d20 `numbers[i]`\uff0c\u5728\u533a\u95f4 `[i + 1, n - 1]` \u4e2d\u4e8c\u5206\u67e5\u627e\u8865\u6570 `complement = target - numbers[i]`\u3002\n* **\u590d\u6742\u5ea6**\uff1a\u65f6\u95f4 $\\mathcal{O}(n \\log n)$\uff0c\u7a7a\u95f4 $\\mathcal{O}(1)$\u3002\n\n```python\nclass SolutionBinarySearch:\n    def twoSum(self, numbers: List[int], target: int) -> List[int]:\n        n = len(numbers)\n        for i in range(n):\n            complement = target - numbers[i]\n            low, high = i + 1, n - 1\n            while low <= high:\n                mid = low + (high - low) // 2\n                if numbers[mid] == complement:\n                    return [i + 1, mid + 1]\n                elif numbers[mid] < complement:\n                    low = mid + 1\n                else:\n                    high = mid - 1\n        return []\n```\n\n---\n\n## 5. Complexity Analysis / \u590d\u6742\u5ea6\u5206\u6790\n\n| \u65b9\u6cd5 | \u65f6\u95f4\u5 u3002 \u2502\n\u2502                                                                             \u2502\n\u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n```\n\n---\n\n### \ud83d\udca1 \u6838\u5fc3\u673a\u5236\uff1a\u4e09\u6307\u9488\u534f\u540c\u6ed1\u79fb\u6362\u5411 (`pre`, `cur`, `nxt`)\n\n\u5355\u5411\u94fe\u8868\u7684\u7279\u70b9\u662f\u6bcf\u4e2a\u8282\u70b9\u53ea\u6709\u4e00\u4e2a\u6307\u5411\u4e0b\u4e00\u4e2a\u8282\u70b9\u7684\u6307\u9488 `next`\u3002\n\u53cd\u8f6c\u94fe\u8868\u7684\u6838\u5fc3\u5c31\u5728\u4e8e\uff1a**\u5c06\u5f53\u524d\u8282\u70b9 `cur.next` \u7684\u6307\u5411\u4ece\u539f\u6765\u7684\u4e0b\u4e00\u4e2a\u8282\u70b9\u6539\u4e3a\u6307\u5411\u524d\u4e00\u4e2a\u8282\u70b9 `pre`**\u3002\n\n#### \u52a8\u6001\u6307\u9488\u6ed1\u79fb\u5168\u6d41\u7a0b ASCII \u56fe\u89e3\uff1a\n\n```\n\u521d\u59cb\u72b6\u6001 (Initial State):\n     pre       cur        nxt\n      \u2193         \u2193          \u2193\n    None       [1]   ->   [2]   ->   [3]   ->   None\n\n\u7b2c 1 \u6b65\uff1a\u6682\u5b58 nxt = cur.next (\u9632\u6b62\u94fe\u8868\u540e\u7eed\u65ad\u88c2\u4e22\u5931)\n\u7b2c 2 \u6b65\uff1a\u6362\u5411 cur.next = pre (\u6307\u5411\u524d\u9762)\n\u7b2c 3 \u6b65\uff1a\u524d\u79fb pre = cur\n\u7b2c 4 \u6b65\uff1a\u524d\u79fb cur = nxt\n\n\u7b2c 1 \u8f6e\u540e (After Iteration 1):\n              pre        cur        nxt\n               \u2193          \u2193          \u2193\n    None  <-  [1]        [2]   ->   [3]   ->   None\n\n\u7b2c 2 \u8f6e\u540e (After Iteration 2):\n                         pre        cur        nxt\n                          \u2193          \u2193          \u2193\n    None  <-  [1]  <-    [2]        [3]   ->   None\n\n\u7b2c 3 \u8f6e\u540e (After Iteration 3):\n                                    pre        cur (None)\n                                     \u2193          \u2193\n    None  <-  [1]  <-    [2]  <-    [3]        None\n\n\u5faa\u73af\u7ec8\u6b62\uff1acur \u4e3a None\uff0cpre \u505c\u5728\u539f\u94fe\u8868\u7684\u5c3e\u8282\u70b9\uff08\u5373\u53cd\u8f6c\u540e\u7684\u65b0\u5934\u8282\u70b9 [3]\uff09\uff0c\u76f4\u63a5\u8fd4\u56de pre\uff01\n```\n\n---\n\n## 4. Step-by-Step Code Walkthrough / \u4ee3\u7801\u9010\u884c\u8be6\u89e3\n\n\u57fa\u4e8e\u4f60\u5728 `top-100/lc-0206-reverse-linked-list.py` \u4e2d\u7684\u6807\u51c6\u5b9e\u73b0\uff1a\n\n```python\n# Definition for singly-linked list.\nclass ListNode:\n    def __init__(self, val=0, next=None):\n        self.val = val\n        self.next = next\n\nfrom typing import Optional\n\nclass Solution:\n    def reverseList(self, head: Optional[ListNode]) -> Optional[ListNode]:\n        pre = None\n        cur = head\n```\n\n* **[EN] Action:** Initializes `pre` pointer to `None` and `cur` pointer to `head`.\n  * **Why `pre = None`?** Because the original head node will become the tail node of the reversed list, and a list tail must point to `None`.\n* **[CN] \u52a8\u4f5c**\uff1a\u521d\u59cb\u5316\u524d\u9a71\u6307\u9488 `pre = None`\uff0c\u5f53\u524d\u6307\u9488 `cur = head`\u3002\n  * **\u4e3a\u4ec0\u4e48 `pre` \u521d\u59cb\u4e3a `None`\uff1f** \u539f\u94fe\u8868\u7684\u5934\u8282\u70b9\u53cd\u8f6c\u540e\u5c06\u53d8\u4e3a\u65b0\u94fe\u8868\u7684\u5c3e\u8282\u70b9\uff0c\u800c\u94fe\u8868\u5c3e\u90e8\u5fc5\u987b\u6307\u5411 `None`\u3002\n\n---\n\n```python\n        while cur:\n            nxt = cur.next\n            cur.next = pre\n            pre = cur\n            cur = nxt\n\n        return pre\n```\n\n* **[EN] Action:** Loops through every node in the linked list in 4 synchronized steps:\n  1. `nxt = cur.next`: Caches the remaining sublist before severing references.\n  2. `cur.next = pre`: Inverts the pointer backwards.\n  3. `pre = cur`: Advances the reversed sublist's head.\n  4. `cur = nxt`: Moves to the next node.\n  5. `return pre`: When `cur` becomes `None`, `pre` sits on the new head.\n* **[CN] \u52a8\u4f5c**\uff1a\u56db\u6b65\u8282\u594f\u63a8\u8fdb\u6307\u9488\u5e76\u5b8c\u6210\u6362\u5411\uff1a\n  1. `nxt = cur.next`\uff1a**\u6682\u5b58\u540e\u7ee7**\u3002\u4fdd\u5168\u672a\u5904\u7406\u7684\u540e\u7eed\u94fe\u8868\uff0c\u9632\u6b62\u6307\u9488\u65ad\u88c2\u5f15\u53d1\u5185\u5b58\u4e22\u5931\u3002\n  2. `cur.next = pre`\uff1a**\u6307\u9488\u6362\u5411**\u3002\u5c06\u5f53\u524d\u8282\u70b9\u7684\u540e\u7ee7\u6307\u9488\u53cd\u8f6c\u6307\u5411\u524d\u9a71\u3002\n  3. `pre = cur`\uff1a**\u524d\u9a71\u6b65\u8fdb**\u3002\u5c06\u5df2\u53cd\u8f6c\u5b50\u94fe\u8868\u7684\u5934\u6307\u9488\u66f4\u65b0\u4e3a\u5f53\u524d\u8282\u70b9\u3002\n  4. `cur = nxt`\uff1a**\u5f53\u524d\u6b65\u8fdb**\u3002\u5f53\u524d\u6307\u9488\u524d\u79fb\u5230\u6682\u5b58\u7684\u4e0b\u4e00\u4e2a\u5f85\u5904\u7406\u8282\u70b9\u3002\n  5. `return pre`\uff1a\u5f53 `cur` \u89e6\u5e95\u5230\u8fbe `None` \u7ed3\u675f\u65f6\uff0c`pre` \u7cbe\u51c6\u505c\u7559\u5728\u53cd\u8f6c\u540e\u7684\u65b0\u5934\u8282\u70b9\uff0c\u76f4\u63a5\u8fd4\u56de\u3002\n\n---\n\n## 5. Interview Simulation & Follow-Up Pivots / \u9762\u8bd5\u5b98\u73b0\u573a\u8ffd\u95ee\u6f14\u7ec3\n\n### \ud83c\udfa4 \u8ffd\u95ee 1\uff1a\u94fe\u8868\u53ef\u4ee5\u9009\u7528\u9012\u5f52\u65b9\u5f0f\u5b8c\u6210\u53cd\u8f6c\u5417\uff1f\u9012\u5f52\u4e0e\u8fed\u4ee3\u5982\u4f55\u505a\u5de5\u7a0b\u6743\u8861\uff1f\n\n* **\u9012\u5f52\u5b9e\u73b0\u4ee3\u7801**\uff1a\n  ```python\n  # \u8303\u5f0f 2: \u9012\u5f52\u53cd\u8f6c (Recursive Approach)\n  class SolutionRecursive:\n      def reverseList(self, head: Optional[ListNode]) -> Optional[ListNode]:\n          if head is None or head.next is None:\n              return head\n          \n          # \u9012\u5f52\u6df1\u5165\u5230\u94fe\u8868\u672b\u5c3e\uff0cnew_head \u59cb\u7ec8\u951a\u5b9a\u539f\u94fe\u8868\u7684\u5c3e\u8282\u70b9 (\u65b0\u5934\u8282\u70b9)\n          new_head = self.reverseList(head.next)\n          \n          # \u56de\u6eaf\u9636\u6bb5\u53cd\u8f6c\u6307\u9488\uff1a\u8ba9 head \u7684\u4e0b\u4e00\u4e2a\u8282\u70b9\u6307\u5411\u81ea\u5df1\n          head.next.next = head\n          head.next = None  # \u5207\u65ad\u539f\u6b63\u5411\u94fe\u63a5\u9632\u6210\u73af\n          \n          return new_head\n  ```\n* **\u5168\u65b9\u4f4d\u67b6\u6784\u5bf9\u6bd4**\uff1a\n\n| \u7ef4\u5ea6 | \u8fed\u4ee3\u6cd5 (Iterative - \u63a8\u8350) | \u9012\u5f52\u6cd5 (Recursive) |\n| :--- | :--- | :--- |\n| **\u65f6\u95f4\u590d\u6742\u5ea6** | $\\mathcal{O}(n)$ | $\\mathcal{O}(n)$ |\n| **\u7a7a\u95f4\u590d\u6742\u5ea6** | $\\mathcal{O}(1)$ (\u4e25\u683c\u5e38\u6570) | $\\mathcal{O}(n)$ (\u7cfb\u7edf\u8c03\u7528\u6808\u6df1\u5ea6\u4e3a $n$) |\n| **\u6808\u6ea2\u51fa\u98ce\u9669** | \u65e0\uff08\u652f\u6301\u4efb\u610f\u8d85\u957f\u94fe\u8868\uff09 | \u5f53\u94fe\u8868\u8fc7\u957f\uff08\u5982 $>1000$\uff09\u53ef\u80fd\u5f15\u53d1\u6808\u6ea2\u51fa |\n| **\u4ee3\u7801\u601d\u7ef4** | \u81ea\u524d\u5f80\u540e\u6ed1\u79fb\u6362\u5411 | \u81ea\u540e\u5f80\u524d\u5728\u56de\u6eaf\u9636\u6bb5\u6362\u5411 |\n\n---\n\n### \ud83c\udfa4 \u8ffd\u95ee 2\uff1a\u4e3a\u4ec0\u4e48\u5fc5\u987b\u5728 `cur.next = pre` \u4e4b\u524d\u6682\u5b58 `nxt = cur.next`\uff1f\n\n* **\u9762\u8bd5\u5b98\u610f\u56fe**\uff1a\u8003\u5bdf\u6307\u9488\u5f15\u7528\u8d4b\u503c\u7684\u5e95\u5c42\u673a\u5236\u4e0e\u5bf9\u201c\u60ac\u6302\u6307\u9488/\u65ad\u94fe\u4e22\u5931\u201d\u7684\u9632\u8303\u610f\u8bc6\u3002\n* **\u6838\u5fc3\u89e3\u6790**\uff1a\n  * \u5355\u5411\u94fe\u8868\u4e2d\u7684\u8282\u70b9\u53ea\u80fd\u901a\u8fc7\u5176\u524d\u9a71\u7684 `next` \u5f15\u7528\u5bfb\u5740\u3002\n  * \u5982\u679c\u5148\u6267\u884c `cur.next = pre`\uff0c`cur` \u7684\u540e\u7ee7\u6307\u9488\u88ab\u7acb\u5373\u8986\u76d6\u3002\u6b64\u65f6\u539f\u94fe\u8868\u540e\u7eed\u6240\u6709\u7684\u8282\u70b9\u5c06\u6ca1\u6709\u4efb\u4f55\u6307\u9488\u5f15\u7528\u6307\u5411\u5b83\u4eec\uff0c\u5bfc\u81f4**\u6574\u4e2a\u540e\u7eed\u94fe\u8868\u5728\u5185\u5b58\u4e2d\u5931\u8054\u65ad\u88c2\uff08Dangling Sublist\uff09**\u3002\n  * \u56e0\u6b64\u5fc5\u987b\u5148\u4f7f\u7528\u72ec\u7acb\u7684\u4e34\u65f6\u5f15\u7528 `nxt` \u9501\u4f4f\u540e\u7eed\u8282\u70b9\u5730\u5740\u3002\n\n---\n\n## 6. The Error Log & Dry-Run / \u9519\u9898\u6392\u67e5\u4e0e\u5b9e\u4f8b\u63a8\u6f14\n\n### \u26a0\ufe0f \u9519\u9898\u6392\u67e5\u4e0e\u53cd\u6a21\u5f0f\u8bca\u65ad (The Error Log: Anti-Patterns & Defensive Fixes)\n\n```\n\u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n\u2502 \u26a0\ufe0f \u53cd\u6a21\u5f0f 1\uff1a\u672a\u6682\u5b58\u540e\u7ee7\u76f4\u63a5\u53cd\u8f6c\u5bfc\u81f4\u65ad\u94fe\u4e22\u5931 (Missing Next Cache)                                            \u2502\n\u251c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2524\n\u2502 \u274c \u9519\u8bef\u5199\u6cd5:                                                                                                \u2502\n\u2502    cur.next = pre  # \u81f4\u547d\uff1acur.next \u539f\u5148\u6307\u5411\u7684\u8282\u70b9\u4e22\u5931\uff01\u540e\u7eed cur = cur.next \u53d8\u6210\u8fdb\u5165\u6b7b\u5faa\u73af\u6216 None           \u2502\n\u2502    pre = cur                                                                                                \u2502\n\u2502                                                                                                             \u2502\n\u2502 \ud83c\udfaf \u7ffb\u8f66\u673a\u7406 (Root Cause):                                                                                   \u2502\n\u2502    \u6307\u9488\u8d4b\u503c\u5177\u6709\u7834\u574f\u6027\uff08Destructive Write\uff09\u3002\u8986\u76d6\u6307\u9488\u524d\u5fc5\u987b\u5148\u7f13\u5b58\u76ee\u6807\u5730\u5740\u3002                                 \u2502\n\u2502                                                                                                             \u2502\n\u2502 \ud83d\udee1\ufe0f \u9632\u5fa1\u53e3\u8bc0 (Invariant):                                                                                   \u2502\n\u2502    \u3010\u5148\u5b58\u540e\u65ad\uff0c\u56db\u6b65\u8282\u5f8b\u3011\uff1a`nxt = cur.next` -> `cur.next = pre` -> `pre = cur` -> `cur = nxt`               \u2502\n\u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n```\n\n| \u5e38\u89c1\u6613\u9519\u53cd\u6a21\u5f0f (Buggy Anti-Pattern) | \u7ffb\u8f66\u73b0\u8c61\u4e0e\u75c7\u72b6 (Symptom) | \u6df1\u5c42\u7ffb\u8f66\u673a\u7406 (Root Cause) | \u9632\u5fa1\u6027\u4fee\u590d\u7b56\u7565 (Defensive Invariant) |\n| :--- | :--- | :--- | :--- |\n| **\u672a\u7f13\u5b58 `cur.next` \u5148\u6362\u5411** | \u94fe\u8868\u5728\u7b2c 1 \u4e2a\u8282\u70b9\u5904\u622a\u65ad\uff0c\u8fd4\u56de\u53ea\u6709 1 \u4e2a\u8282\u70b9 | \u7834\u574f\u4e86\u539f\u94fe\u8868\u5411\u540e\u5bfb\u5740\u7684\u5355\u5411\u5f15\u7528\u94fe | \u4e25\u683c\u9075\u5faa\u56db\u6b65\u6ed1\u79fb\u987a\u5e8f\uff0c\u5148\u53d6 `nxt = cur.next` |\n| **\u5faa\u73af\u6761\u4ef6\u8bef\u5199\u4e3a `while cur.next:`** | \u6700\u540e\u4e00\u4e2a\u5c3e\u8282\u70b9\u6ca1\u6709\u88ab\u53cd\u8f6c\uff0c\u76f4\u63a5\u4e22\u5931\u65b0\u5934 | \u63d0\u524d\u4e00\u8f6e\u8df3\u51fa\u5faa\u73af\uff0c\u5c3e\u8282\u70b9\u6307\u9488\u672a\u6362\u5411 | \u4e25\u683c\u4f7f\u7528 `while cur:` \u786e\u4fdd\u6240\u6709\u8282\u70b9\u5747\u88ab\u5904\u7406 |\n| **\u9012\u5f52\u6cd5\u56de\u6eaf\u6f0f\u5199 `head.next = None`** | \u94fe\u8868\u51fa\u73b0\u73af\u5e76\u5728\u904d\u5386\u65f6\u9677\u5165\u65e0\u9650\u6b7b\u5faa\u73af | \u539f\u5934\u8282\u70b9\u4e0e\u7b2c 2 \u8282\u70b9\u5f62\u6210\u4e86\u53cc\u5411\u4e92\u76f8\u6307\u5411 | \u9012\u5f52\u56de\u6eaf\u5fc5\u52a0 `head.next = None` \u5207\u65ad\u539f\u6b63\u5411\u94fe\u63a5 |\n\n---\n\n### \ud83c\udfa8 \u5b9e\u4f8b\u5168\u7a0b\u63a8\u6f14\u8868 (Complete Dry-Run)\n\n**\u8f93\u5165**\uff1a`head = [1, 2, 3]`\n\n| \u8f6e\u6b21 | `cur` \u4f4d\u7f6e | `pre` \u4f4d\u7f6e | \u6682\u5b58 `nxt` | \u6267\u884c `cur.next = pre` \u540e\u7684\u5c40\u90e8\u5f62\u6001 | \u6b65\u8fdb\u540e `pre, cur` |\n| :---: | :---: | :---: | :---: | :--- | :--- |\n| **\u521d\u59cb** | `[1]` | `None` | \u2014 | `None` | `pre=None, cur=[1]` |\n| **\u7b2c 1 \u8f6e** | `[1]` | `None` | `[2]` | `[1] -> None` | `pre=[1], cur=[2]` |\n| **\u7b2c 2 \u8f6e** | `[2]` | `[1]` | `[3]` | `[2] -> [1] -> None` | `pre=[2], cur=[3]` |\n| **\u7b2c 3 \u8f6e** | `[3]` | `[2]` | `None` | `[3] -> [2] -> [1] -> None` | `pre=[3], cur=None` |\n| **\u7ec8\u6b62** | `None` | `[3]` | \u2014 | \u5faa\u73af\u7ed3\u675f\uff0c\u8fd4\u56de `pre` (`[3]`) | \u8fd4\u56de `[3, 2, 1]` (\u6b63\u786e) |\n\n---\n\n## 7. Complexity Analysis / \u590d\u6742\u5ea6\u5206\u6790\n\n| \u7ef4\u5ea6 | \u590d\u6742\u5ea6 | \u8bf4\u660e\u4e0e\u7406\u8bba\u652f\u6491 |\n| :--- | :---: | :--- |\n| **\u65f6\u95f4\u590d\u6742\u5ea6 (Time Complexity)** | $\\mathcal{O}(n)$ | \u5355\u8d9f\u7ebf\u6027\u626b\u63cf\uff0c\u6bcf\u4e2a\u8282\u70b9\u6267\u884c\u5e38\u6570\u6b21\u6307\u9488\u8bfb\u5199\u4e0e\u8d4b\u503c\u64cd\u4f5c\uff0c\u603b\u65f6\u95f4\u4e3a $\\mathcal{O}(n)$\u3002 |\n| **\u7a7a\u95f4\u590d\u6742\u5ea6 (Space Complexity)** | $\\mathcal{O}(1)$ | \u4ec5\u4f7f\u7528 `pre`, `cur`, `nxt` \u4e09\u4e2a\u6307\u9488\u53d8\u91cf\uff0c\u539f\u5730\u4fee\u6539\u6307\u9488\uff0c\u65e0\u989d\u5916\u5185\u5b58\u5206\u914d\u3002 |\n", "code": "# Definition for singly-linked list.\nclass ListNode:\n    def __init__(self, val=0, next=None):\n        self.val = val\n        self.next = next\n\nfrom typing import Optional\n\nclass Solution:\n    def reverseList(self, head: Optional[ListNode]) -> Optional[ListNode]:\n        pre = None\n        cur = head\n        while cur:\n            nxt = cur.next\n            cur.next = pre\n            pre = cur\n            cur = nxt\n\n        return pre\n", "diff": "Easy", "py_file": "top-100/lc-0206-reverse-linked-list.py", "md_file": "top-100/lc-0206-reverse-linked-list.md"}, "top-100/lc-0207-course-schedule": {"key": "top-100/lc-0207-course-schedule", "category": "Top 100 Liked Track", "title": "Top 100 Liked Track: LC 0207 course schedule", "short": "LC 0207 course schedule", "path": "top-100/lc-0207-course-schedule", "type": "problem", "notes": "", "code": "from typing import List, Optional\n\nclass Solution:\n    pass\n", "diff": "Medium", "py_file": "top-100/lc-0207-course-schedule.py", "md_file": ""}, "top-100/lc-0208-implement-trie-prefix-tree": {"key": "top-100/lc-0208-implement-trie-prefix-tree", "category": "Top 100 Liked Track", "title": "Top 100 Liked Track: LC 0208 implement trie prefix tree", "short": "LC 0208 implement trie prefix tree", "path": "top-100/lc-0208-implement-trie-prefix-tree", "type": "problem", "notes": "", "code": "from typing import List, Optional\n\nclass Solution:\n    pass\n", "diff": "Medium", "py_file": "top-100/lc-0208-implement-trie-prefix-tree.py", "md_file": ""}, "top-100/lc-0209-minimum-size-subarray-sum": {"key": "top-100/lc-0209-minimum-size-subarray-sum", "category": "Top 100 Liked Track", "title": "Top 100 Liked Track: LC 0209 minimum size subarray sum", "short": "LC 0209 minimum size subarray sum", "path": "top-100/lc-0209-minimum-size-subarray-sum", "type": "problem", "notes": "# LeetCode 209. Minimum Size Subarray Sum (\u957f\u5ea6\u6700\u5c0f\u7684\u5b50\u6570\u7ec4)\n## Step-by-Step Code Walkthrough & Notes / \u4ee3\u7801\u9010\u884c\u8be6\u89e3\u4e0e\u77e5\u8bc6\u70b9\u603b\u7ed3\n\n- **Difficulty:** Medium (\u6ed1\u52a8\u7a97\u53e3\u7ecf\u5178\u5165\u95e8\u9898)\n- **Tags:** Array, Binary Search, Sliding Window, Prefix Sum\n- **Corresponding Python Files:**\n  - [`top-100/lc-0209-minimum-size-subarray-sum.py`](file:///mnt/c/Users/steve/iCloudDrive/desktop/leetcode-sh/top-100/lc-0209-minimum-size-subarray-sum.py)\n  - [`luffy/06-lc-0209-minimum-size-subarray-sum.py`](file:///mnt/c/Users/steve/iCloudDrive/desktop/leetcode-sh/luffy/06-lc-0209-minimum-size-subarray-sum.py)\n\n---\n\n## 1. Problem Statement / \u9898\u76ee\u63cf\u8ff0\n\n* **[EN]** Given an array of positive integers `nums` and a positive integer `target`, return the **minimal length** of a contiguous subarray `[nums[l], nums[l+1], ..., nums[r-1], nums[r]]` of which the sum is greater than or equal to `target`. If there is no such subarray, return `0` instead.\n* **[CN]** \u7ed9\u5b9a\u4e00\u4e2a\u542b\u6709 `n` \u4e2a\u6b63\u6574\u6570\u7684\u6570\u7ec4\u548c\u4e00\u4e2a\u6b63\u6574\u6570 `target` \u3002\u627e\u51fa\u8be5\u6570\u7ec4\u4e2d\u6ee1\u8db3\u5176\u603b\u548c\u5927\u4e8e\u7b49\u4e8e `target` \u7684\u957f\u5ea6\u6700\u5c0f\u7684 **\u8fde\u7eed\u5b50\u6570\u7ec4** `[nums[l], nums[l+1], ..., nums[r-1], nums[r]]` \uff0c\u5e76\u8fd4\u56de\u5176\u957f\u5ea6\u3002\u5982\u679c\u4e0d\u5b58\u5728\u7b26\u5408\u6761\u4ef6\u7684\u5b50\u6570\u7ec4\uff0c\u8fd4\u56de `0` \u3002\n\n---\n\n## 2. Core Idea: Variable-Size Sliding Window / \u6838\u5fc3\u89e3\u6cd5\uff1a\u53d8\u957f\u6ed1\u52a8\u7a97\u53e3\n\n```python\nfrom typing import List\n\nclass Solution:\n    def minSubArrayLen(self, target: int, nums: List[int]) -> int:\n        slow = 0\n        fast = 0\n        sum = 0\n        min_len = float('inf')\n        \n        while fast < len(nums):\n            sum += nums[fast]\n            \n            while sum >= target:\n                min_len = min(min_len, fast - slow + 1)\n                sum -= nums[slow]\n                slow += 1\n                \n            fast += 1\n            \n        return min_len if min_len != float('inf') else 0\n```\n\n---\n\n## 3. Step-by-Step Code Walkthrough / \u4ee3\u7801\u9010\u884c\u8be6\u89e3\n\n### 1. \u521d\u59cb\u5316\u6307\u9488\u4e0e\u72b6\u6001\u53d8\u91cf\n\n```python\nslow = 0\nfast = 0\nsum = 0\nmin_len = float('inf')\n```\n\n* **`slow` (\u5de6\u6307\u9488 / \u7a97\u53e3\u5de6\u8fb9\u754c)**\uff1a\u6307\u5411\u5f53\u524d\u6ed1\u52a8\u7a97\u53e3\u7684\u8d77\u59cb\u4f4d\u7f6e\u3002\n* **`fast` (\u53f3\u6307\u9488 / \u7a97\u53e3\u53f3\u8fb9\u754c)**\uff1a\u6307\u5411\u5f53\u524d\u6ed1\u52a8\u7a97\u53e3\u7684\u7ed3\u675f\u4f4d\u7f6e\u3002\n* **`sum` (\u7a97\u53e3\u5185\u5143\u7d20\u7d2f\u52a0\u548c)**\uff1a\u8bb0\u5f55\u533a\u95f4 `[slow, fast]` \u5185\u6240\u6709\u6b63\u6574\u6570\u7684\u548c\u3002\n* **`min_len = float('inf')` (\u6700\u5c0f\u957f\u5ea6)**\uff1a\u521d\u59cb\u5316\u4e3a\u6b63\u65e0\u7a77\u5927\uff0c\u7528\u4e8e\u540e\u7eed\u53d6 `min` \u66f4\u65b0\u3002\n\n---\n\n### 2. \u6269\u5f20\u7a97\u53e3 (Expand Window via `fast`)\n\n```python\nwhile fast < len(nums):\n    sum += nums[fast]\n```\n\n* **\u52a8\u4f5c**\uff1a\u5916\u5c42\u5faa\u73af\u904d\u5386\u6570\u7ec4\uff0c\u53f3\u6307\u9488 `fast` \u6bcf\u6b21\u5411\u53f3\u6269\u5c55\u4e00\u6b65\uff0c\u5c06\u65b0\u5143\u7d20 `nums[fast]` \u52a0\u5165\u7a97\u53e3\uff0c\u7d2f\u52a0\u5230 `sum` \u4e2d\u3002\n\n---\n\n### 3. \u6536\u7f29\u7a97\u53e3\u4e0e\u66f4\u65b0\u7b54\u6848 (Shrink Window via `slow`)\n\n```python\n    while sum >= target:\n        min_len = min(min_len, fast - slow + 1)\n        sum -= nums[slow]\n        slow += 1\n```\n\n* **\u89e6\u53d1\u6761\u4ef6**\uff1a\u5f53\u5f53\u524d\u7a97\u53e3\u7684\u7d2f\u52a0\u548c `sum >= target` \u65f6\uff0c\u8bf4\u660e\u5f53\u524d\u533a\u95f4 `[slow, fast]` \u5df2\u7ecf\u6ee1\u8db3\u6761\u4ef6\u3002\n* **\u52a8\u4f5c**\uff1a\n  1. **\u66f4\u65b0\u6700\u77ed\u957f\u5ea6**\uff1a\u5f53\u524d\u7a97\u53e3\u957f\u5ea6\u4e3a `fast - slow + 1`\uff0c\u7528 `min_len = min(min_len, fast - slow + 1)` \u8bb0\u5f55\u5386\u53f2\u6700\u5c0f\u503c\u3002\n  2. **\u6536\u7f29\u5de6\u8fb9\u754c**\uff1a\u5c1d\u8bd5\u5c06\u5de6\u7aef\u70b9 `nums[slow]` \u79fb\u51fa\u7a97\u53e3\uff08`sum -= nums[slow]`\uff09\uff0c\u5e76\u5c06\u5de6\u6307\u9488\u5411\u53f3\u79fb `slow += 1`\u3002\n  3. **\u5faa\u73af\u5224\u65ad**\uff1a\u53ea\u8981\u79fb\u51fa\u540e `sum` \u4ecd\u7136 `>= target`\uff0c\u5c31\u7ee7\u7eed\u6536\u7f29\uff0c\u4ee5\u5bfb\u627e\u66f4\u77ed\u7684\u5408\u6cd5\u7a97\u53e3\uff1b\u76f4\u5230 `sum < target` \u65f6\u9000\u51fa\u5185\u5c42\u5faa\u73af\u3002\n\n---\n\n### 4. \u6b65\u8fdb\u53f3\u6307\u9488\u4e0e\u8fd4\u56de\u7ed3\u679c\n\n```python\n    fast += 1\n    \nreturn min_len if min_len != float('inf') else 0\n```\n\n* **`fast += 1`**\uff1a\u53f3\u6307\u9488\u7ee7\u7eed\u5411\u53f3\u63a2\u7d22\u4e0b\u4e00\u4e2a\u5143\u7d20\u3002\n* **\u8fd4\u56de\u503c\u5224\u65ad**\uff1a\u5982\u679c\u6574\u8f6e\u626b\u63cf\u540e `min_len` \u4ecd\u4e3a\u521d\u59cb\u503c `float('inf')`\uff0c\u8bf4\u660e\u6ca1\u6709\u4efb\u4f55\u5b50\u6570\u7ec4\u7684\u548c\u80fd\u591f\u8fbe\u5230 `target`\uff0c\u6309\u9898\u610f\u8fd4\u56de `0`\uff1b\u5426\u5219\u8fd4\u56de\u627e\u5230\u7684\u6700\u77ed\u957f\u5ea6 `min_len`\u3002\n\n---\n\n## 4. Execution Trace Example / \u6a21\u62df\u8fd0\u884c\u5168\u8fc7\u7a0b\n\n\u5047\u8bbe `target = 7, nums = [2, 3, 1, 2, 4, 3]`\uff1a\n\n| \u6b65\u9aa4 | `fast` (`num`) | `slow` | \u7a97\u53e3\u5185\u5143\u7d20 `nums[slow..fast]` | \u7a97\u53e3\u548c `sum` | `sum >= 7`? | \u5f53\u524d\u66f4\u65b0 `min_len` |\n| :---: | :---: | :---: | :---: | :---: | :---: | :---: |\n| 1 | 0 (`2`) | 0 | `[2]` | 2 | \u5426 | $\\infty$ |\n| 2 | 1 (`3`) | 0 | `[2, 3]` | 5 | \u5426 | $\\infty$ |\n| 3 | 2 (`1`) | 0 | `[2, 3, 1]` | 6 | \u5426 | $\\infty$ |\n| 4 | 3 (`2`) | 0 | `[2, 3, 1, 2]` | **8** | **\u662f** | $\\min(\\infty, 3-0+1) = \\mathbf{4}$ |\n| 4a | (\u6536\u7f29) | 1 | `[3, 1, 2]` | 6 (\u51cf\u53bb2) | \u5426 | 4 |\n| 5 | 4 (`4`) | 1 | `[3, 1, 2, 4]` | **10** | **\u662f** | $\\min(4, 4-1+1) = \\mathbf{4}$ |\n| 5a | (\u6536\u7f29) | 2 | `[1, 2, 4]` | **7** (\u51cf\u53bb3) | **\u662f** | $\\min(4, 4-2+1) = \\mathbf{3}$ |\n| 5b | (\u6536\u7f29) | 3 | `[2, 4]` | 6 (\u51cf\u53bb1) | \u5426 | 3 |\n| 6 | 5 (`3`) | 3 | `[2, 4, 3]` | **9** | **\u662f** | $\\min(3, 5-3+1) = \\mathbf{3}$ |\n| 6a | (\u6536\u7f29) | 4 | `[4, 3]` | **7** (\u51cf\u53bb2) | **\u662f** | $\\min(3, 5-4+1) = \\mathbf{2}$ |\n| 6b | (\u6536\u7f29) | 5 | `[3]` | 3 (\u51cf\u53bb4) | \u5426 | 2 |\n\n* \u6700\u7ec8\u8fd4\u56de\u6700\u4f18\u89e3\uff1a**`2`** (\u5bf9\u5e94\u5b50\u6570\u7ec4 `[4, 3]`)\u3002\n\n---\n\n## 5. Complexity Analysis / \u590d\u6742\u5ea6\u5206\u6790\n\n* **\u65f6\u95f4\u590d\u6742\u5ea6 (Time Complexity):** $\\mathcal{O}(n)$\n  * \u6838\u5fc3\u5173\u952e\uff1a\u867d\u7136\u4ee3\u7801\u4e2d\u51fa\u73b0\u4e86\u4e24\u5c42\u5d4c\u5957\u7684 `while` \u5faa\u73af\uff0c\u4f46\u6bcf\u4e2a\u5143\u7d20\u5728\u6574\u4e2a\u8fc7\u7a0b\u4e2d**\u6700\u591a\u88ab `fast` \u8bbf\u95ee\u52a0\u5165\u7a97\u53e3 1 \u6b21\uff0c\u6700\u591a\u88ab `slow` \u79fb\u51fa\u7a97\u53e3 1 \u6b21**\u3002\n  * \u64cd\u4f5c\u603b\u6b21\u6570\u4e0d\u8d85\u8fc7 $2n$\uff0c\u5747\u644a\u65f6\u95f4\u590d\u6742\u5ea6\u4e3a\u4e25\u683c\u7684 $\\mathcal{O}(n)$\u3002\n* **\u7a7a\u95f4\u590d\u6742\u5ea6 (Space Complexity):** $\\mathcal{O}(1)$\n  * \u4ec5\u4f7f\u7528\u4e86\u51e0\u4e2a\u5e38\u6570\u7ea7\u522b\u7684\u6574\u578b\u6307\u9488\u4e0e\u6c42\u548c\u53d8\u91cf\uff0c\u65e0\u989d\u5916\u5185\u5b58\u5f00\u9500\u3002\n", "code": "from typing import List\n\n\n#sliding windows\nclass Solution:\n    def minSubArrayLen(self, target: int, nums: List[int]) -> int:\n        n = len(nums)\n        ans = n + 1 #the answer could be initialize as inf or n+1\n        s = 0\n        left = 0\n\n        for right, x in enumerate(nums): #x: nums[right]\n            s += x\n          \n            # while s - nums[left] >= target:\n            #     s -= nums[left]\n            #     left += 1\n            # if s >= left:\n            #     ans = min(ans, right- left + 1)\n\n            while s >= target:\n                ans = min(ans, right-left +1)\n                s-=nums[left]\n                left += 1\n\n\n\n        return ans if ans <= n else 0", "diff": "Medium", "py_file": "top-100/lc-0209-minimum-size-subarray-sum.py", "md_file": "top-100/lc-0209-minimum-size-subarray-sum.md"}, "top-100/lc-0215-kth-largest-element-in-an-array": {"key": "top-100/lc-0215-kth-largest-element-in-an-array", "category": "Top 100 Liked Track", "title": "Top 100 Liked Tr "key": "top-100/lc-0621-task-scheduler", "category": "Top 100 Liked Track", "title": "Top 100 Liked Track: LC 0621 task scheduler", "short": "LC 0621 task scheduler", "path": "top-100/lc-0621-task-scheduler", "type": "problem", "notes": "", "code": "from typing import List, Optional\n\nclass Solution:\n    pass\n", "diff": "Medium", "py_file": "top-100/lc-0621-task-scheduler.py", "md_file": ""}, "top-100/lc-0647-palindromic-substrings": {"key": "top-100/lc-0647-palindromic-substrings", "category": "Top 100 Liked Track", "title": "Top 100 Liked Track: LC 0647 palindromic substrings", "short": "LC 0647 palindromic substrings", "path": "top-100/lc-0647-palindromic-substrings", "type": "problem", "notes": "", "code": "from typing import List, Optional\n\nclass Solution:\n    pass\n", "diff": "Medium", "py_file": "top-100/lc-0647-palindromic-substrings.py", "md_file": ""}, "top-100/lc-0713-subarray-product-less-than-k": {"key": "top-100/lc-0713-subarray-product-less-than-k", "category": "Top 100 Liked Track", "title": "Top 100 Liked Track: LC 0713 subarray product less than k", "short": "LC 0713 subarray product less than k", "path": "top-100/lc-0713-subarray-product-less-than-k", "type": "problem", "notes": "# LeetCode 713. Subarray Product Less Than K (\u4e58\u79ef\u5c0f\u4e8e K \u7684\u5b50\u6570\u7ec4)\n## Step-by-Step Code Walkthrough & Notes / \u4ee3\u7801\u9010\u884c\u8be6\u89e3\u4e0e\u77e5\u8bc6\u70b9\u603b\u7ed3\n\n- **Difficulty:** Medium (\u6ed1\u52a8\u7a97\u53e3\u7ecf\u5178\u9898 / \u533a\u95f4\u8ba1\u6570)\n- **Tags:** Array, Sliding Window\n- **Corresponding Python File:** [`top-100/lc-0713-subarray-product-less-than-k.py`](file:///mnt/c/Users/steve/iCloudDrive/desktop/leetcode-sh/top-100/lc-0713-subarray-product-less-than-k.py)\n\n---\n\n## 1. Problem Statement / \u9898\u76ee\u63cf\u8ff0\n\n* **[EN]** Given an array of integers `nums` and an integer `k`, return the number of contiguous subarrays where the product of all the elements in the subarray is strictly less than `k`.\n* **[CN]** \u7ed9\u4f60\u4e00\u4e2a\u6574\u6570\u6570\u7ec4 `nums` \u548c\u4e00\u4e2a\u6574\u6570 `k` \uff0c\u8bf7\u4f60\u8fd4\u56de\u5b50\u6570\u7ec4\u5185\u6240\u6709\u5143\u7d20\u7684\u4e58\u79ef\u4e25\u683c\u5c0f\u4e8e `k` \u7684\u8fde\u7eed\u5b50\u6570\u7ec4\u7684\u6570\u76ee\u3002\n\n---\n\n## 2. Code Implementation / \u4ee3\u7801\u5b9e\u73b0\n\n```python\nfrom typing import List\n\nclass Solution:\n    def numSubarrayProductLessThanK(self, nums: List[int], k: int) -> int:\n        # \u8fb9\u754c\u7279\u5224\uff1a\u6b63\u6574\u6570\u6570\u7ec4\u5b50\u6570\u7ec4\u4e58\u79ef\u6700\u5c0f\u4e3a 1\u3002\u5f53 k <= 1 \u65f6\uff0c\u4e0d\u53ef\u80fd\u4e25\u683c\u5c0f\u4e8e k\uff0c\u76f4\u63a5\u8fd4\u56de 0\n        if k <= 1:\n            return 0\n\n        ans = 0\n        prod = 1\n        left = 0\n\n        for right, x in enumerate(nums):\n            # 1. \u6269\u5f20\u7a97\u53e3\uff1a\u5c06\u65b0\u5143\u7d20\u4e58\u5165\u5f53\u524d\u7a97\u53e3\u603b\u4e58\u79ef\n            prod *= x\n            \n            # 2. \u6536\u7f29\u7a97\u53e3\uff1a\u5f53\u4e58\u79ef >= k\uff08\u4e0d\u5408\u6cd5\uff09\u65f6\uff0c\u6301\u7eed\u4ece\u5de6\u7aef\u79fb\u51fa\u5143\u7d20\n            while prod >= k:\n                prod //= nums[left]\n                left += 1\n                \n            # 3. \u6838\u5fc3\u8ba1\u6570\uff1a\u4ee5\u5f53\u524d right \u4e3a\u56fa\u5b9a\u53f3\u7aef\u70b9\u7684\u5408\u6cd5\u8fde\u7eed\u5b50\u6570\u7ec4\u6570\u76ee\u6070\u4e3a\u7a97\u53e3\u957f\u5ea6\n            ans += right - left + 1\n\n        return ans\n```\n\n---\n\n## 3. Step-by-Step Code Walkthrough / \u9010\u884c\u903b\u8f91\u5256\u6790\n\n### Step 1: \u8fb9\u754c\u7279\u5224 (`if k <= 1: return 0`)\n* **[EN] Why `k <= 1` returns 0?**\n  * Per problem constraints, all elements in `nums` are positive integers ($\\ge 1$).\n  * The minimum possible product of any non-empty subarray is $1$.\n  * If $k = 0$ or $k = 1$, no subarray can have a product **strictly less than** $k$. We can immediately return $0$.\n  * **Critical Side Benefit:** Guaranteeing $k \\ge 2$ in the loop ensures that `left` will never run past `right + 1`.\n* **[CN] \u4e3a\u4ec0\u4e48 `k <= 1` \u76f4\u63a5\u8fd4\u56de 0\uff1f**\n  * \u9898\u76ee\u89c4\u5b9a\u6570\u7ec4\u4e2d\u6240\u6709\u5143\u7d20\u90fd\u662f\u6b63\u6574\u6570\uff08$\\ge 1$\uff09\u3002\n  * \u4efb\u610f\u975e\u7a7a\u5b50\u6570\u7ec4\u7684\u4e58\u79ef\u81f3\u5c11\u4e3a 1\u3002\n  * \u82e5 $k = 0$ \u6216 $k = 1$\uff0c\u4e0d\u53ef\u80fd\u5b58\u5728\u4e58\u79ef**\u4e25\u683c\u5c0f\u4e8e** $k$ \u7684\u5b50\u6570\u7ec4\uff0c\u56e0\u6b64\u76f4\u63a5\u8fd4\u56de 0\u3002\n  * **\u989d\u5916\u5173\u952e\u6536\u76ca**\uff1a\u4fdd\u8bc1\u4e86\u540e\u7eed\u5faa\u73af\u4e2d $k \\ge 2$\uff0c\u4ece\u800c\u5f7b\u5e95\u907f\u514d\u4e86 `left` \u6307\u9488\u8d8a\u754c\u7684\u95ee\u9898\u3002\n\n---\n\n### Step 2: \u6269\u5f20\u7a97\u53e3 (`prod *= x`)\n* **[EN] Action:** For each element $x$ at index `right`, multiply `prod` by $x$ to expand the current window `nums[left..right]`.\n* **[CN] \u52a8\u4f5c**\uff1a\u53f3\u6307\u9488 `right` \u9010\u4e2a\u679a\u4e3e\u5143\u7d20 $x$\uff0c\u5c06 $x$ \u4e58\u5165\u5f53\u524d\u7a97\u53e3\u603b\u4e58\u79ef `prod` \u4e2d\u3002\n\n---\n\n### Step 3: \u6536\u7f29\u7a97\u53e3 (`while prod >= k: prod //= nums[left]; left += 1`)\n* **[EN] Action:** If `prod >= k`, the current window's product is too large. Shrink the window from the left by dividing out `nums[left]` and moving `left` forward until `prod < k`.\n* **[CN] \u52a8\u4f5c**\uff1a\u82e5\u4e58\u79ef `prod >= k` \u8d85\u51fa\u4e0a\u9650\uff0c\u5219\u4e0d\u65ad\u901a\u8fc7\u9664\u4ee5\u5de6\u7aef\u70b9 `nums[left]` \u5e76\u53f3\u79fb `left += 1` \u6765\u6536\u7f29\u7a97\u53e3\uff0c\u76f4\u5230\u7a97\u53e3\u5185\u4e58\u79ef\u91cd\u65b0\u6ee1\u8db3 `prod < k`\u3002\n\n---\n\n### Step 4: \u6838\u5fc3\u8ba1\u6570\u516c\u5f0f (`ans += right - left + 1`)\n* **[EN] Why `right - left + 1`?**\n  * When `nums[left..right]` has a product $< k$, **every contiguous subarray ending at `right`** starting from index $i$ ($left \\le i \\le right$) is guaranteed to have a product $< k$ (because all numbers $\\ge 1$, shorter subarrays have $\\le$ products).\n  * The number of valid subarrays ending at index `right` is exactly `right - left + 1`.\n  * For example, with window `[10, 5, 2]` (`left = 0, right = 2`), valid subarrays ending at `2` are:\n    1. `[2]` (length 1)\n    2. `[5, 2]` (length 2)\n    3. `[10, 5, 2]` (length 3)\n    Total = $2 - 0 + 1 = 3$.\n* **[CN] \u4e3a\u4ec0\u4e48\u7d2f\u52a0\u7684\u662f `right - left + 1`\uff1f**\n  * \u5f53\u533a\u95f4 `nums[left..right]` \u7684\u4e58\u79ef $< k$ \u65f6\uff0c\u7531\u4e8e\u6240\u6709\u6570\u5747\u4e3a\u6b63\u6574\u6570\uff0c\u4ee5 `right` \u7ed3\u5c3e\u3001\u8d77\u70b9\u5728 $[left, right]$ \u8303\u56f4\u5185\u7684**\u6240\u6709\u8fde\u7eed\u5b50\u6570\u7ec4**\u4e58\u79ef\u5fc5\u7136\u4e5f\u90fd $< k$\u3002\n  * \u4ee5\u5f53\u524d `right` \u4e3a**\u53f3\u7aef\u70b9**\u7684\u5408\u6cd5\u5b50\u6570\u7ec4\u4e2a\u6570\uff0c\u521a\u597d\u7b49\u4e8e\u5f53\u524d\u7a97\u53e3\u7684\u957f\u5ea6\uff1a`right - left + 1`\u3002\n  * \u4f8b\u5982\u5f53\u524d\u7a97\u53e3\u662f `[10, 5, 2]`\uff08`left=0, right=2`\uff09\uff0c\u4ee5\u672b\u5c3e `2` \u7ed3\u5c3e\u7684\u5408\u6cd5\u5b50\u6570\u7ec4\u4e3a\uff1a\n    1. `[2]`\n    2. `[5, 2]`\n    3. `[10, 5, 2]`\n    \u521a\u597d\u662f $2 - 0 + 1 = 3$ \u4e2a\uff01\u6bcf\u6b21\u679a\u4e3e `right` \u65f6\u7d2f\u52a0\u65b0\u589e\u7684\u8fd9\u6279\u5b50\u6570\u7ec4\uff0c\u4e0d\u91cd\u4e0d\u6f0f\u3002\n\n---\n\n## 4. Deep Dive: Why Write It This Way? / \u6df1\u5ea6\u8ffd\u95ee\uff1a\u4e3a\u4ec0\u4e48\u8fd9\u4e48\u5199\uff1f\n\n### Q1: \u4e3a\u4ec0\u4e48\u662f\u9664\u6cd5 `prod //= nums[left]`\uff1f\u4e3a\u4ec0\u4e48\u7528\u6574\u9664 `//=`\uff1f\n* **\u4e58\u6cd5\u7684\u9006\u8fd0\u7b97**\uff1a\u5728\u6c42\u548c\u7684\u6ed1\u52a8\u7a97\u53e3\u4e2d\uff0c\u79fb\u51fa\u5143\u7d20\u4f7f\u7528\u51cf\u6cd5\uff08`sum -= nums[left]`\uff09\uff1b\u5728\u6c42\u4e58\u79ef\u7684\u6ed1\u52a8\u7a97\u53e3\u4e2d\uff0c\u79fb\u51fa\u5143\u7d20\u5bf9\u5e94\u7684\u9006\u8fd0\u7b97\u5373\u4e3a\u9664\u6cd5\u3002\n* **\u907f\u514d\u6d6e\u70b9\u6570\u7cbe\u5ea6\u8bef\u5dee**\uff1a$nums[left]$ \u662f\u4e58\u79ef `prod` \u7684\u56e0\u6570\uff0c\u6574\u9664\u4fdd\u8bc1\u9664\u5f97\u5c3d\u4e14\u7ed3\u679c\u59cb\u7ec8\u4e3a `int`\uff0c\u907f\u514d\u6d6e\u70b9\u6570\u8ba1\u7b97\u4ea7\u751f\u7684\u820d\u5165\u8bef\u5dee\uff08\u5982 `1.0000000000000002`\uff09\u3002\n\n### Q2: \u4e3a\u4ec0\u4e48\u7528 `while` \u5faa\u73af\u800c\u4e0d\u662f `if`\uff1f\n* \u52a0\u5165\u65b0\u5143\u7d20 $x$ \u540e\uff0c\u4e58\u79ef\u53ef\u80fd\u4f1a\u53d8\u5f97\u975e\u5e38\u5927\uff0c\u4ec5\u79fb\u51fa 1 \u4e2a $nums[left]$ \u4e0d\u4e00\u5b9a\u80fd\u6ee1\u8db3 $< k$ \u7684\u8981\u6c42\u3002\n* \u5fc5\u987b\u901a\u8fc7 `while` \u5faa\u73af\u6301\u7eed\u79fb\u51fa\u591a\u4e2a\u5de6\u7aef\u5143\u7d20\uff0c\u76f4\u5230\u4e58\u79ef\u4e25\u683c\u5c0f\u4e8e $k$ \u4e3a\u6b62\u3002\n\n### Q3: \u4f1a\u4e0d\u4f1a\u53d1\u751f `left` \u8d8a\u754c\u6216\u6b7b\u5faa\u73af\uff1f\n* **\u4e0d\u4f1a**\u3002\u82e5\u5355\u5143\u7d20 $nums[right] \\ge k$\uff1a\n  * `left` \u4f1a\u4e00\u76f4\u53f3\u79fb\u76f4\u5230 `left == right`\uff0c\u6267\u884c `prod //= nums[right]` \u540e `prod` \u53d8\u4e3a `1`\uff0c\u4e14 `left` \u53d8\u4e3a `right + 1`\u3002\n  * \u56e0\u4e3a\u524d\u7f6e\u68c0\u67e5\u4fdd\u8bc1\u4e86 $k \\ge 2$\uff0c\u4e0b\u4e00\u8f6e\u68c0\u67e5 `while prod >= k` \u5373 `1 >= k` \u5224\u5b9a\u4e3a `False`\uff0c\u5faa\u73af\u7acb\u5373\u9000\u51fa\u3002\n  * \u6b64\u65f6 `right - left + 1 = right - (right + 1) + 1 = 0`\uff0c\u5bf9\u7b54\u6848\u8d21\u732e\u4e3a 0\uff0c\u5b8c\u5168\u6b63\u786e\u4e14\u5b89\u5168\u3002\n\n---\n\n## 5. Execution Trace Example / \u6a21\u62df\u8fd0\u884c\u5168\u8fc7\u7a0b\n\n\u4ee5 `nums = [10, 5, 2, 6], k = 100` \u4e3a\u4f8b\uff1a\n\n| `right` | `x` | `prod` (\u4e58\u5165\u540e) | `while prod >= 100` (\u6536\u7f29) | \u6700\u7ec8 `left` | \u6700\u7ec8\u7a97\u53e3 `nums[left..right]` | \u65b0\u589e\u5408\u6cd5\u5b50\u6570\u7ec4 (\u4ee5 `right` \u7ed3\u5c3e) | `ans += right - left + 1` | \u5f53\u524d `ans` |\n| :---: | :---: | :---: | :---: | :---: | :---: | :---: | :---: | :---: |\n| 0 | 10 | 10 | \u4e0d\u89e6\u53d1 (10 < 100) | 0 | `[10]` | `[10]` | $0 - 0 + 1 = 1$ | **1** |\n| 1 | 5 | 50 | \u4e0d\u89e6\u53d1 (50 < 100) | 0 | `[10, 5]` | `[5]`, `[10, 5]` | $1 - 0 + 1 = 2$ | **3** |\n| 2 | 2 | 100 | **\u89e6\u53d1**\uff1a`prod //= 10` $\\rightarrow$ 10, `left` = 1 | 1 | `[5, 2]` | `[2]`, `[5, 2]` | $2 - 1 + 1 = 2$ | **5** |\n| 3 | 6 | 60 | \u4e0d\u89e6\u53d1 (60 < 100) | 1 | `[5, 2, 6]` | `[6]`, `[2, 6]`, `[5, 2, 6]` | $3 - 1 + 1 = 3$ | **8** |\n\n* \u6700\u7ec8\u603b\u5408\u6cd5\u5b50\u6570\u7ec4\u6570\u76ee\u4e3a\uff1a**`8`**\u3002\n\n---\n\n## 6. Complexity Analysis / \u590d\u6742\u5ea6\u5206\u6790\n\n| \u7ef4\u5ea6 | \u590d\u6742\u5ea6 | \u6838\u5fc3\u89e3\u6790 |\n| :--- | :--- | :--- |\n| **\u65f6\u95f4\u590d\u6742\u5ea6 (Time)** | $\\mathcal{O}(n)$ | \u6bcf\u4e2a\u5143\u7d20\u6700\u591a\u88ab `right` \u4e58\u5165 1 \u6b21\uff0c\u88ab `left` \u9664\u51fa 1 \u6b21\uff0c\u4e24\u6307\u9488\u5747\u5355\u8c03\u9012\u589e\uff0c\u603b\u8fd0\u7b97\u6b21\u6570 $\\le 2n$\u3002 |\n| **\u7a7a\u95f4\u590d\u6742\u5ea6 (Space)** | $\\mathcal{O}(1)$ | \u4ec5\u4f7f\u7528 `ans`, `prod`, `left`, `right` \u56db\u4e2a\u53d8\u91cf\uff0c\u7a7a\u95f4\u5e38\u6570\u7ea7\u3002 |\n", "code": "from typing import List\n\n# 713. Subarray Product Less Than K (\u4e58\u79ef\u5c0f\u4e8e K \u7684\u5b50\u6570\u7ec4)\n# https://leetcode.com/problems/subarray-product-less-than-k/\n\n# ==============================================================================\n# Method: Sliding Window (\u6ed1\u52a8\u7a97\u53e3 / \u53cc\u6307\u9488)\n# Time Complexity: O(n) | Space Complexity: O(1)\n# ==============================================================================\nclass Solution:\n    def numSubarrayProductLessThanK(self, nums: List[int], k: int) -> int:\n        #l r\n        # [l,r] [l+1, r].. [r,r]\n\n        # \u8fb9\u754c\u6761\u4ef6\uff1a\u56e0\u4e3a nums[i] >= 1\uff0c\u6240\u4ee5\u5b50\u6570\u7ec4\u4e58\u79ef\u81f3\u5c11\u4e3a 1\u3002\n        # \u5f53 k <= 1 \u65f6\uff0c\u4e0d\u5b58\u5728\u4e25\u683c\u5c0f\u4e8e k \u7684\u4e58\u79ef\uff0c\u76f4\u63a5\u8fd4\u56de 0\u3002\n        if k <= 1:\n            return 0\n\n        ans = 0\n        prod = 1\n        left = 0\n\n        for right, x in enumerate(nums):\n            prod *= x\n            \n            # \u5f53\u7a97\u53e3\u5185\u4e58\u79ef >= k \u65f6\uff0c\u6536\u7f29\u5de6\u8fb9\u754c\n            while prod >= k:\n                prod /= nums[left]\n                left += 1\n                \n            # \u6838\u5fc3\u8ba1\u6570\uff1a\u4ee5 right \u7ed3\u5c3e\u4e14\u5408\u6cd5\u7684\u8fde\u7eed\u5b50\u6570\u7ec4\u4e2a\u6570\u6070\u597d\u4e3a right - left + 1\n            ans += right - left + 1\n\n        return ans\n", "diff": "Medium", "py_file": "top-100/lc-0713-subarray-product-less-than-k.py", "md_file": "top-100/lc-0713-subarray-product-less-than-k.md"}, "top-100/lc-0739-daily-temperatures": {"key": "top-100/lc-0739-daily-temperatures", "category": "Top 100 Liked Track", "title": "Top 100 Liked Track: LC 0739 daily temperatures", "short": "LC 0739 daily temperatures", "path": "top-100/lc-0739-daily-temperatures", "type": "problem", "notes": "", "code": "from typing import List, Optional\n\nclass Solution:\n    pass\n", "diff": "Medium", "py_file": "top-100/lc-0739-daily-temperatures.py", "md_file": ""}, "daily-practice/lc-0025-reverse-nodes-in-k-group": {"key": "daily-practice/lc-0025-reverse-nodes-in-k-group", "category": "Daily Practice Track", "title": "Daily Practice Track: LC 0025 reverse nodes in k group", "short": "LC 0025 reverse nodes in k group", "path": "daily-practice/lc-0025-reverse-nodes-in-k-group", "type": "problem", "notes": "# LeetCode 25. Reverse Nodes in k-Group (K \u4e2a\u4e00\u7ec4\u7ffb\u8f6c\u94fe\u8868)\n## Step-by-Step Code Walkthrough & Notes / \u4ee3\u7801\u9010\u884c\u8be6\u89e3\u4e0e\u77e5\u8bc6\u70b9\u603b\u7ed3\n\n- **Difficulty:** Hard (\u94fe\u8868\u6307\u9488\u64cd\u4f5c\u7ec8\u6781\u9762\u8bd5\u9898 / \u5c40\u90e8\u53cd\u8f6c\u4e0e\u5faa\u73af\u7f1d\u5408)\n- **Tags:** Linked List, Recursion\n- **Corresponding Python File:** [`daily-practice/lc-0025-reverse-nodes-in-k-group.py`](daily-practice/lc-0025-reverse-nodes-in-k-group.py)\n\n---\n\n## 1. Problem Statement / \u9898\u76ee\u63cf\u8ff0\n\n* **[EN]** Given the `head` of a singly linked list, reverse the nodes of the list `k` at a time, and return the modified list.\n  * `k` is a positive integer and is less than or equal to the length of the linked list.\n  * If the number of nodes is not a multiple of `k` then left-out nodes, in the end, should remain as it is.\n  * You may not alter the values in the list's nodes, only nodes themselves may be changed.\n* **[CN]** \u7ed9\u4f60\u94fe\u8868\u7684\u5934\u8282\u70b9 `head` \uff0c\u6bcf `k` \u4e2a\u8282\u70b9\u4e00\u7ec4\u8fdb\u884c\u7ffb\u8f6c\uff0c\u8bf7\u4f60\u8fd4\u56de\u4fee\u6539\u540e\u7684\u94fe\u8868\u3002\n  * `k` \u662f\u4e00\u4e2a\u6b63\u6574\u6570\uff0c\u5b83\u7684\u503c\u5c0f\u4e8e\u6216\u7b49\u4e8e\u94fe\u8868\u7684\u957f\u5ea6\u3002\n  * \u5982\u679c\u8282\u70b9\u603b\u6570\u4e0d\u662f `k` \u7684\u6574\u6570\u500d\uff0c\u90a3\u4e48\u6700\u540e\u5269\u4f59\u7684\u8282\u70b9\u5e94\u5f53\u4fdd\u6301\u539f\u6709\u987a\u5e8f\u3002\n  * \u4f60\u4e0d\u80fd\u53ea\u662f\u5355\u7eaf\u7684\u6539\u53d8\u8282\u70b9\u5185\u90e8\u7684\u503c\uff0c\u800c\u662f\u9700\u8981\u5b9e\u9645\u8fdb\u884c\u8282\u70b9\u6307\u9488\u7684\u4ea4\u6362\u4e0e\u91cd\u8fde\u3002\n\n### Constraints / \u7ea6\u675f\u6761\u4ef6\n* \u94fe\u8868\u4e2d\u8282\u70b9\u7684\u6570\u76ee\u4e3a `n`\n* $1 \\le k \\le n \\le 5000$\n* $0 \\le \\text{Node.val} \\le 1000$\n* **\u8fdb\u9636 (Follow-up)**\uff1a\u4f60\u80fd\u5426\u8bbe\u8ba1\u4e00\u4e2a\u53
