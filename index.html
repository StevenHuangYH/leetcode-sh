x_sum, current_sum)\n            \n        return max_sum\n```\n\n---\n\n## 3. Kadane's Algorithm Intuition / \u7b97\u6cd5\u539f\u7406\u89e3\u6790\n\n1. **\u6838\u5fc3\u72b6\u6001\u8f6c\u79fb\u65b9\u7a0b**\uff1a\n   $$dp[i] = \\max(nums[i], dp[i-1] + nums[i])$$\n2. **\u8d2a\u5fc3/\u52a8\u6001\u89c4\u5212\u76f4\u89c9**\uff1a\n   * \u5982\u679c\u524d\u9762\u7684\u5b50\u6570\u7ec4\u548c `current_sum` \u53d8\u6210\u4e86\u8d1f\u6570\uff0c\u5b83\u5bf9\u540e\u7eed\u4efb\u4f55\u5143\u7d20\u7684\u7d2f\u52a0\u53ea\u4f1a\u8d77\u5230\u201c\u526f\u4f5c\u7528\u201d\uff08\u62d6\u540e\u817f\uff09\u3002\n   * \u56e0\u6b64\uff0c\u5f53 `current_sum + num < num`\uff08\u5373 `current_sum < 0`\uff09\u65f6\uff0c\u6211\u4eec\u5e94\u8be5\u76f4\u63a5\u679c\u65ad\u820d\u5f03\u524d\u9762\u7684\u7d2f\u52a0\uff0c\u5c06\u5f53\u524d\u5143\u7d20 `num` \u4f5c\u4e3a\u5168\u65b0\u5b50\u6570\u7ec4\u7684\u8d77\u70b9\u3002\n3. **\u5168\u5c40\u7ef4\u62a4\u6700\u5927\u503c**\uff1a\n   * \u6bcf\u6b21\u66f4\u65b0 `current_sum` \u540e\uff0c\u4f7f\u7528 `max_sum = max(max_sum, current_sum)` \u8bb0\u5f55\u5168\u5c40\u5386\u53f2\u6700\u9ad8\u503c\u3002\n\n---\n\n## 4. Complexity Analysis / \u590d\u6742\u5ea6\u5206\u6790\n\n* **\u65f6\u95f4\u590d\u6742\u5ea6 (Time):** $\\mathcal{O}(n)$ \u2014\u2014 \u4ec5\u9700\u5355\u6b21\u7ebf\u6027\u626b\u63cf\u3002\n* **\u7a7a\u95f4\u590d\u6742\u5ea6 (Space):** $\\mathcal{O}(1)$ \u2014\u2014 \u4ec5\u7ef4\u62a4\u4e24\u4e2a\u6d6e\u70b9/\u6574\u578b\u72b6\u6001\u53d8\u91cf\u3002\n", "code": "#maximum subarry\n\n#kadene\n#current_max=max(today, current_sum + today)\n#max_sum = max(max_sum. current_sum)\n\nfrom typing import List\n\nclass Solution:\n    def maxSubArray(self, nums: List[int]) -> int:\n        current_sum=0\n        max_sum = float(\"-inf\")\n\n        \n        for num in nums:\n            current_sum=max(num, current_sum + num)\n            max_sum=max(max_sum, current_sum)\n        return max_sum\n\n    \n\n        ", "diff": "Medium", "py_file": "top-100/lc-0053-maximum-subarray.py", "md_file": "top-100/lc-0053-maximum-subarray.md"}, "top-100/lc-0167-two-sum-ii-input-array-is-sorted": {"key": "top-100/lc-0167-two-sum-ii-input-array-is-sorted", "category": "\ud83d\udd25 Top 100 Liked Track", "title": "\ud83d\udd25 Top 100 Liked Track: LC 0167 two sum ii input array is sorted", "short": "LC 0167 two sum ii input array is sorted", "path": "top-100/lc-0167-two-sum-ii-input-array-is-sorted", "type": "problem", "notes": "# LeetCode 167. Two Sum II - Input Array Is Sorted\n## Step-by-Step Code Walkthrough & Notes / \u4ee3\u7801\u9010\u884c\u8be6\u89e3\u4e0e\u77e5\u8bc6\u70b9\u603b\u7ed3\n\n- **Difficulty:** Medium (\u9762\u8bd5\u9ad8\u9891 / \u7ecf\u5178\u53cc\u6307\u9488)\n- **Tags:** Array, Two Pointers, Binary Search\n- **Corresponding Python File:** [`s-lc-167.py`](top-100/lc-0167-two-sum-ii-input-array-is-sorted.py)\n\n---\n\n## 1. Problem Statement / \u9898\u76ee\u63cf\u8ff0\n\n* **[EN]** Given a **1-indexed** array of integers `numbers` that is already **sorted in non-decreasing order**, find two numbers such that they add up to a specific `target` number. Return the indices of the two numbers, `index1` and `index2`, added by one as an integer array `[index1, index2]` of length 2.\n  * **Constraints:** You must use only $\\mathcal{O}(1)$ extra space. There is exactly one solution. You may not use the same element twice.\n* **[CN]** \u7ed9\u4f60\u4e00\u4e2a\u4e0b\u6807\u4ece **1 \u5f00\u59cb** \u7684\u6574\u6570\u6570\u7ec4 `numbers` \uff0c\u8be5\u6570\u7ec4\u5df2\u6309 **\u975e\u9012\u51cf\u987a\u5e8f\u6392\u5217** \u3002\u8bf7\u4f60\u4ece\u6570\u7ec4\u4e2d\u627e\u51fa\u6ee1\u8db3\u76f8\u52a0\u4e4b\u548c\u7b49\u4e8e\u76ee\u6807\u6570 `target` \u7684\u4e24\u4e2a\u6570\u3002\u8fd4\u56de\u8fd9\u4e24\u4e2a\u6570\u7684\u4e0b\u6807 `index1` \u548c `index2`\uff08\u4ee5\u957f\u4e3a 2 \u7684\u6574\u6570\u6570\u7ec4 `[index1, index2]` \u5f62\u5f0f\u8fd4\u56de\uff0c\u4e0b\u6807\u4ece 1 \u5f00\u59cb\uff09\u3002\n  * **\u7ea6\u675f\u6761\u4ef6**\uff1a\u4f60\u53ea\u80fd\u4f7f\u7528 $\\mathcal{O}(1)$ \u7684\u989d\u5916\u7a7a\u95f4\uff1b\u6d4b\u8bd5\u7528\u4f8b\u6709\u4e14\u4ec5\u6709\u4e00\u4e2a\u6709\u6548\u7b54\u6848\uff1b\u4e0d\u80fd\u91cd\u590d\u4f7f\u7528\u76f8\u540c\u7684\u5143\u7d20\u3002\n\n---\n\n## 2. Step-by-Step Code Walkthrough / \u4ee3\u7801\u9010\u884c\u8be6\u89e3\n\n### \u65b9\u6848 1\uff1a\u53cc\u6307\u9488\u5bf9\u649e\u6cd5 (Two Pointers - Optimal $\\mathcal{O}(1)$ Space)\n\n```python\nclass Solution:\n    def twoSum(self, numbers: List[int], target: int) -> List[int]:\n        left = 0\n        right = len(numbers) - 1\n```\n\n* **[EN] Action:** Initializes `left` pointer at the first element index (`0`) and `right` pointer at the last element index (`len(numbers) - 1`).\n  * **Why Two Pointers?** Because the array is **sorted**. The smallest elements are on the left, and the largest elements are on the right.\n* **[CN] \u52a8\u4f5c**\uff1a\u521d\u59cb\u5316\u5de6\u6307\u9488 `left = 0` \u6307\u5411\u6570\u7ec4\u9996\u7aef\uff08\u6700\u5c0f\u503c\uff09\uff0c\u53f3\u6307\u9488 `right = len(numbers) - 1` \u6307\u5411\u6570\u7ec4\u672b\u7aef\uff08\u6700\u5927\u503c\uff09\u3002\n  * **\u4e3a\u4ec0\u4e48\u7528\u53cc\u6307\u9488\uff1f** \u56e0\u4e3a\u6570\u7ec4\u662f**\u6709\u5e8f\uff08\u975e\u9012\u51cf\uff09**\u7684\u3002\u5de6\u4fa7\u662f\u8f83\u5c0f\u6570\uff0c\u53f3\u4fa7\u662f\u8f83\u5927\u6570\uff0c\u53ef\u4ee5\u901a\u8fc7\u79fb\u52a8\u6307\u9488\u5355\u8c03\u6027\u5730\u6539\u53d8\u4e24\u6570\u4e4b\u548c\u3002\n\n---\n\n```python\n        while left < right:\n            curr_sum = numbers[left] + numbers[right]\n```\n\n* **[EN] Action:** Loops as long as `left < right`. Calculates the sum of the elements at the two pointers: `curr_sum = numbers[left] + numbers[right]`.\n  * **Why `left < right` instead of `left <= right`?** The problem forbids using the exact same element twice (`1 <= index1 < index2 <= n`).\n* **[CN] \u52a8\u4f5c**\uff1a\u5f53 `left < right` \u65f6\u8fdb\u5165\u5faa\u73af\uff0c\u8ba1\u7b97\u5f53\u524d\u5de6\u53f3\u6307\u9488\u6240\u6307\u4e24\u6570\u4e4b\u548c `curr_sum`\u3002\n  * **\u4e3a\u4ec0\u4e48\u662f `left < right` \u800c\u4e0d\u662f `<=`\uff1f** \u9898\u76ee\u660e\u786e\u8bf4\u660e\u4e0d\u80fd\u91cd\u590d\u4f7f\u7528\u540c\u4e00\u4e2a\u5143\u7d20\u4e24\u6b21\uff08\u5fc5\u987b\u662f\u4e24\u4e2a\u4e0d\u540c\u4f4d\u7f6e\u7684\u6570\uff09\u3002\n\n---\n\n```python\n            if curr_sum == target:\n                return [left + 1, right + 1]\n```\n\n* **[EN] Action:** If `curr_sum == target`, the target pair is found.\n  * **Why `+ 1`?** The problem states that the array is **1-indexed**, while Python lists are **0-indexed**. Adding `1` converts `0-based` indices into `1-based` indices.\n* **[CN] \u52a8\u4f5c**\uff1a\u82e5\u4e24\u6570\u4e4b\u548c\u521a\u597d\u7b49\u4e8e `target`\uff0c\u7acb\u5373\u8fd4\u56de\u4e0b\u6807\u6570\u7ec4\u3002\n  * **\u4e3a\u4ec0\u4e48\u8981 `+ 1`\uff1f** \u9898\u76ee\u8981\u6c42\u8fd4\u56de **1-based index**\uff08\u4e0b\u6807\u4ece 1 \u5f00\u59cb\u8ba1\uff09\uff0c\u800c Python \u5217\u8868\u662f 0-based \u7d22\u5f15\uff0c\u6240\u4ee5\u4e24\u7aef\u5747\u9700\u52a0 1\u3002\n\n---\n\n```python\n            elif curr_sum < target:\n                left += 1\n```\n\n* **[EN] Logic:** If `curr_sum < target`, the sum is too small.\n  * **Why `left += 1`?** Since the array is sorted in ascending order, moving `left` to the right (`left + 1`) increases the value of `numbers[left]`, thus increasing `curr_sum`.\n* **[CN] \u903b\u8f91**\uff1a\u5982\u679c\u5f53\u524d\u548c `curr_sum < target`\uff0c\u8bf4\u660e\u5f53\u524d\u548c\u504f\u5c0f\u3002\n  * **\u4e3a\u4ec0\u4e48 `left += 1`\uff1f** \u6570\u7ec4\u662f\u5347\u5e8f\u6392\u5217\u7684\uff0c\u5c06\u5de6\u6307\u9488\u5411\u53f3\u79fb\u52a8\u4e00\u4f4d\u53ef\u4ee5\u589e\u5927 `numbers[left]` \u7684\u503c\uff0c\u4ece\u800c\u4f7f\u4e24\u6570\u4e4b\u548c\u589e\u5927\u3002\n\n---\n\n```python\n            else:\n                right -= 1\n```\n\n* **[EN] Logic:** If `curr_sum > target`, the sum is too large.\n  * **Why `right -= 1`?** Moving `right` to the left (`right - 1`) decreases the value of `numbers[right]`, thus reducing `curr_sum`.\n* **[CN] \u903b\u8f91**\uff1a\u5982\u679c\u5f53\u524d\u548c `curr_sum > target`\uff0c\u8bf4\u660e\u5f53\u524d\u548c\u504f\u5927\u3002\n  * **\u4e3a\u4ec0\u4e48 `right -= 1`\uff1f** \u5c06\u53f3\u6307\u9488\u5411\u5de6\u79fb\u52a8\u4e00\u4f4d\u53ef\u4ee5\u51cf\u5c0f `numbers[right]` \u7684\u503c\uff0c\u4ece\u800c\u4f7f\u4e24\u6570\u4e4b\u548c\u51cf\u5c0f\u3002\n\n---\n\n```python\n        return []\n```\n\n* **[EN] Action:** Fallback return. (Per constraints, a solution is guaranteed to exist).\n* **[CN] \u52a8\u4f5c**\uff1a\u515c\u5e95\u8fd4\u56de\uff08\u9898\u76ee\u4fdd\u8bc1\u5fc5\u5b9a\u5b58\u5728\u552f\u4e00\u89e3\uff09\u3002\n\n---\n\n## 3. Key FAQs & Concept Clarifications / \u6838\u5fc3\u7b54\u7591\u4e0e\u539f\u7406\n\n### Q1: \u4e3a\u4ec0\u4e48\u5bf9\u649e\u53cc\u6307\u9488\u4e0d\u4f1a\u6f0f\u6389\u89e3\uff1f(Why are we sure no valid pair is missed?)\n* \u5047\u8bbe\u552f\u4e00\u6b63\u786e\u7684\u7b54\u6848\u662f\u4e0b\u6807\u5bf9 $(i^*, j^*)$\u3002\n* \u4e00\u5f00\u59cb $left = 0 \\le i^*$\uff0c$right = n-1 \\ge j^*$\u3002\n* \u5982\u679c $left$ \u8fd8\u6ca1\u5230 $i^*$ \u4f46 $right$ \u5df2\u7ecf\u5230\u4e86 $j^*$\uff1a\n  * \u6b64\u65f6 $numbers[left] + numbers[right] = numbers[left] + numbers[j^*] < numbers[i^*] + numbers[j^*] = target$\n  * \u56e0\u4e3a\u548c\u5fc5\u5b9a\u5c0f\u4e8e $target$\uff0c\u7b97\u6cd5\u53ea\u4f1a\u6267\u884c `left += 1`\uff0c**\u7edd\u4e0d\u4f1a\u628a\u5df2\u7ecf\u505c\u5728\u6b63\u786e\u4f4d\u7f6e\u7684 $right$ \u5de6\u79fb**\uff01\n* \u540c\u7406\uff0c\u82e5 $left$ \u5148\u5230\u8fbe $i^*$\uff0c\u548c\u5fc5\u5b9a\u5927\u4e8e $target$\uff0c\u7b97\u6cd5\u53ea\u4f1a\u6267\u884c `right -= 1`\u3002\n* \u56e0\u6b64\u4e24\u4e2a\u6307\u9488\u5fc5\u7136\u5728 $(i^*, j^*)$ \u5904\u6c47\u5408\uff0c**\u7edd\u4e0d\u4f1a\u9519\u8fc7\u6b63\u786e\u7b54\u6848**\u3002\n\n---\n\n### Q2: LC 1 (Two Sum) vs LC 167 (Two Sum II) \u7684\u5bf9\u6bd4\n\n| \u7ef4\u5ea6 | LeetCode 1 (\u65e0\u5e8f\u6570\u7ec4) | LeetCode 167 (\u6709\u5e8f\u6570\u7ec4) |\n| :--- | :--- | :--- |\n| **\u6570\u7ec4\u72b6\u6001** | \u65e0\u5e8f (Unsorted) | \u5df2\u5347\u5e8f\u6392\u5e8f (Sorted non-decreasing) |\n| **\u63a8\u8350\u89e3\u6cd5** | \u54c8\u5e0c\u8868 (Hash Map) | \u53cc\u6307\u9488\u5bf9\u649e (Two Pointers) |\n| **\u65f6\u95f4\u590d\u6742\u5ea6** | $\\mathcal{O}(n)$ | $\\mathcal{O}(n)$ |\n| **\u7a7a\u95f4\u590d\u6742\u5ea6** | $\\mathcal{O}(n)$ (\u9700\u8981\u989d\u5916\u5b57\u5178) | $\\mathcal{O}(1)$ (\u4ec5\u53cc\u6307\u9488\u53d8\u91cf\uff0c\u6ee1\u8db3\u8fdb\u9636\u8981\u6c42) |\n| **\u4e0b\u6807\u89c4\u8303** | 0-indexed | 1-indexed (\u9700 `+ 1`) |\n\n---\n\n## 4. Alternative Methods / \u5176\u4ed6\u89e3\u6cd5\u5bf9\u6bd4\n\n### \u65b9\u6848 2\uff1a\u4e8c\u5206\u67e5\u627e (Binary Search)\n* **\u601d\u8def**\uff1a\u904d\u5386\u6bcf\u4e2a\u5143\u7d20 `numbers[i]`\uff0c\u5728\u533a\u95f4 `[i + 1, n - 1]` \u4e2d\u4e8c\u5206\u67e5\u627e\u8865\u6570 `complement = target - numbers[i]`\u3002\n* **\u590d\u6742\u5ea6**\uff1a\u65f6\u95f4 $\\mathcal{O}(n \\log n)$\uff0c\u7a7a\u95f4 $\\mathcal{O}(1)$\u3002\n\n```python\nclass SolutionBinarySearch:\n    def twoSum(self, numbers: List[int], target: int) -> List[int]:\n        n = len(numbers)\n        for i in range(n):\n            complement = target - numbers[i]\n            low, high = i + 1, n - 1\n            while low <= high:\n                mid = low + (high - low) // 2\n                if numbers[mid] == complement:\n                    return [i + 1, mid + 1]\n                elif numbers[mid] < complement:\n                    low = mid + 1\n                else:\n                    high = mid - 1\n        return []\n```\n\n---\n\n## 5. Complexity Analysis / \u590d\u6742\u5ea6\u5206\u6790\n\n| \u65b9\u6cd5 | \u65f6\u95f4\u590d\u6742\u5ea6 (Time) | \u7a7a\u95f4\u590d\u6742\u5ea6 (Space) | \u8bc4\u4ef7 |\n| :--- | :--- | :--- | :--- |\n| **\u53cc\u6307\u9488\u5bf9\u649e\u6cd5 (Optimal)** | $\\mathcal{O}(n)$ | $\\mathcal{O}(1)$ | \u2b50 **\u6700\u4f18\u89e3**\uff0c\u7ebf\u6027\u626b\u63cf\uff0c\u96f6\u989d\u5916\u5185\u5b58\u5f00\u9500 |\n| **\u4e8c\u5206\u67e5\u627e\u6cd5** | $\\mathcal{O}(n \\log n)$ | $\\mathcal{O}(1)$ | \u6ee1\u8db3\u7a7a\u95f4\u8981\u6c42\uff0c\u4f46\u65f6\u95f4\u7a0d\u6162 |\n| **\u54c8\u5e0c\u8868\u6cd5** | $\\mathcal{O}(n)$ | $\\mathcal{O}(n)$ | \u4e0d\u7b26\u5408\u9898\u76ee $\\mathcal{O}(1)$ \u7a7a\u95f4\u9650\u5236 |\n", "code": "\nfrom typing import List\n\nclass Solution:\n    def twoSum(self, numbers: List[int], target: int) -> List[int]:\n        left = 0\n        n=len(numbers)\n        right = n-1\n\n        while left < right:\n            result = numbers[left]+numbers[right]\n\n            if result == target:\n                break\n            if result > target:\n                right -= 1\n            else:\n                left+=1\n            \n\n        return [left+1,right+1]\n            \n        \n    \n\n        ", "diff": "Medium", "py_file": "top-100/lc-0167-two-sum-ii-input-array-is-sorted.py", "md_file": "top-100/lc-0167-two-sum-ii-input-array-is-sorted.md"}, "top-100/lc-0209-minimum-size-subarray-sum": {"key": "top-100/lc-0209-minimum-size-subarray-sum", "category": "\ud83d\udd25 Top 100 Liked Track", "title": "\ud83d\udd25 Top 100 Liked Track: LC 0209 minimum size subarray sum", "short": "LC 0209 minimum size subarray sum", "path": "top-100/lc-0209-minimum-size-subarray-sum", "type": "problem", "notes": "# LeetCode 209. Minimum Size Subarray Sum (\u957f\u5ea6\u6700\u5c0f\u7684\u5b50\u6570\u7ec4)\n## Step-by-Step Code Walkthrough & Notes / \u4ee3\u7801\u9010\u884c\u8be6\u89e3\u4e0e\u77e5\u8bc6\u70b9\u603b\u7ed3\n\n- **Difficulty:** Medium (\u6ed1\u52a8\u7a97\u53e3\u7ecf\u5178\u5165\u95e8\u9898)\n- **Tags:** Array, Binary Search, Sliding Window, Prefix Sum\n- **Corresponding Python Files:**\n  - [`top-100/lc-0209-minimum-size-subarray-sum.py`](file:///mnt/c/Users/steve/iCloudDrive/desktop/leetcode-sh/top-100/lc-0209-minimum-size-subarray-sum.py)\n  - [`luffy/06-lc-0209-minimum-size-subarray-sum.py`](file:///mnt/c/Users/steve/iCloudDrive/desktop/leetcode-sh/luffy/06-lc-0209-minimum-size-subarray-sum.py)\n\n---\n\n## 1. Problem Statement / \u9898\u76ee\u63cf\u8ff0\n\n* **[EN]** Given an array of positive integers `nums` and a positive integer `target`, return the **minimal length** of a contiguous subarray `[nums[l], nums[l+1], ..., nums[r-1], nums[r]]` of which the sum is greater than or equal to `target`. If there is no such subarray, return `0` instead.\n* **[CN]** \u7ed9\u5b9a\u4e00\u4e2a\u542b\u6709 `n` \u4e2a\u6b63\u6574\u6570\u7684\u6570\u7ec4\u548c\u4e00\u4e2a\u6b63\u6574\u6570 `target` \u3002\u627e\u51fa\u8be5\u6570\u7ec4\u4e2d\u6ee1\u8db3\u5176\u603b\u548c\u5927\u4e8e\u7b49\u4e8e `target` \u7684\u957f\u5ea6\u6700\u5c0f\u7684 **\u8fde\u7eed\u5b50\u6570\u7ec4** `[nums[l], nums[l+1], ..., nums[r-1], nums[r]]` \uff0c\u5e76\u8fd4\u56de\u5176\u957f\u5ea6\u3002\u5982\u679c\u4e0d\u5b58\u5728\u7b26\u5408\u6761\u4ef6\u7684\u5b50\u6570\u7ec4\uff0c\u8fd4\u56de `0` \u3002\n\n---\n\n## 2. Core Idea: Variable-Size Sliding Window / \u6838\u5fc3\u89e3\u6cd5\uff1a\u53d8\u957f\u6ed1\u52a8\u7a97\u53e3\n\n```python\nfrom typing import List\n\nclass Solution:\n    def minSubArrayLen(self, target: int, nums: List[int]) -> int:\n        slow = 0\n        fast = 0\n        sum = 0\n        min_len = float('inf')\n        \n        while fast < len(nums):\n            sum += nums[fast]\n            \n            while sum >= target:\n                min_len = min(min_len, fast - slow + 1)\n                sum -= nums[slow]\n                slow += 1\n                \n            fast += 1\n            \n        return min_len if min_len != float('inf') else 0\n```\n\n---\n\n## 3. Step-by-Step Code Walkthrough / \u4ee3\u7801\u9010\u884c\u8be6\u89e3\n\n### 1. \u521d\u59cb\u5316\u6307\u9488\u4e0e\u72b6\u6001\u53d8\u91cf\n\n```python\nslow = 0\nfast = 0\nsum = 0\nmin_len = float('inf')\n```\n\n* **`slow` (\u5de6\u6307\u9488 / \u7a97\u53e3\u5de6\u8fb9\u754c)**\uff1a\u6307\u5411\u5f53\u524d\u6ed1\u52a8\u7a97\u53e3\u7684\u8d77\u59cb\u4f4d\u7f6e\u3002\n* **`fast` (\u53f3\u6307\u9488 / \u7a97\u53e3\u53f3\u8fb9\u754c)**\uff1a\u6307\u5411\u5f53\u524d\u6ed1\u52a8\u7a97\u53e3\u7684\u7ed3\u675f\u4f4d\u7f6e\u3002\n* **`sum` (\u7a97\u53e3\u5185\u5143\u7d20\u7d2f\u52a0\u548c)**\uff1a\u8bb0\u5f55\u533a\u95f4 `[slow, fast]` \u5185\u6240\u6709\u6b63\u6574\u6570\u7684\u548c\u3002\n* **`min_len = float('inf')` (\u6700\u5c0f\u957f\u5ea6)**\uff1a\u521d\u59cb\u5316\u4e3a\u6b63\u65e0\u7a77\u5927\uff0c\u7528\u4e8e\u540e\u7eed\u53d6 `min` \u66f4\u65b0\u3002\n\n---\n\n### 2. \u6269\u5f20\u7a97\u53e3 (Expand Window via `fast`)\n\n```python\nwhile fast < len(nums):\n    sum += nums[fast]\n```\n\n* **\u52a8\u4f5c**\uff1a\u5916\u5c42\u5faa\u73af\u904d\u5386\u6570\u7ec4\uff0c\u53f3\u6307\u9488 `fast` \u6bcf\u6b21\u5411\u53f3\u6269\u5c55\u4e00\u6b65\uff0c\u5c06\u65b0\u5143\u7d20 `nums[fast]` \u52a0\u5165\u7a97\u53e3\uff0c\u7d2f\u52a0\u5230 `sum` \u4e2d\u3002\n\n---\n\n### 3. \u6536\u7f29\u7a97\u53e3\u4e0e\u66f4\u65b0\u7b54\u6848 (Shrink Window via `slow`)\n\n```python\n    while sum >= target:\n        min_len = min(min_len, fast - slow + 1)\n        sum -= nums[slow]\n        slow += 1\n```\n\n* **\u89e6\u53d1\u6761\u4ef6**\uff1a\u5f53\u5f53\u524d\u7a97\u53e3\u7684\u7d2f\u52a0\u548c `sum >= target` \u65f6\uff0c\u8bf4\u660e\u5f53\u524d\u533a\u95f4 `[slow, fast]` \u5df2\u7ecf\u6ee1\u8db3\u6761\u4ef6\u3002\n* **\u52a8\u4f5c**\uff1a\n  1. **\u66f4\u65b0\u6700\u77ed\u957f\u5ea6**\uff1a\u5f53\u524d\u7a97\u53e3\u957f\u5ea6\u4e3a `fast - slow + 1`\uff0c\u7528 `min_len = min(min_len, fast - slow + 1)` \u8bb0\u5f55\u5386\u53f2\u6700\u5c0f\u503c\u3002\n  2. **\u6536\u7f29\u5de6\u8fb9\u754c**\uff1a\u5c1d\u8bd5\u5c06\u5de6\u7aef\u70b9 `nums[slow]` \u79fb\u51fa\u7a97\  s-=nums[left]\n                left += 1\n\n\n\n        return ans if ans <= n else 0", "diff": "Medium", "py_file": "top-100/lc-0209-minimum-size-subarray-sum.py", "md_file": "top-100/lc-0209-minimum-size-subarray-sum.md"}, "top-100/lc-0713-subarray-product-less-than-k": {"key": "top-100/lc-0713-subarray-product-less-than-k", "category": "\ud83d\udd25 Top 100 Liked Track", "title": "\ud83d\udd25 Top 100 Liked Track: LC 0713 subarray product less than k", "short": "LC 0713 subarray product less than k", "path": "top-100/lc-0713-subarray-product-less-than-k", "type": "problem", "notes": "# LeetCode 713. Subarray Product Less Than K (\u4e58\u79ef\u5c0f\u4e8e K \u7684\u5b50\u6570\u7ec4)\n## Step-by-Step Code Walkthrough & Notes / \u4ee3\u7801\u9010\u884c\u8be6\u89e3\u4e0e\u77e5\u8bc6\u70b9\u603b\u7ed3\n\n- **Difficulty:** Medium (\u6ed1\u52a8\u7a97\u53e3\u7ecf\u5178\u9898 / \u533a\u95f4\u8ba1\u6570)\n- **Tags:** Array, Sliding Window\n- **Corresponding Python File:** [`top-100/lc-0713-subarray-product-less-than-k.py`](file:///mnt/c/Users/steve/iCloudDrive/desktop/leetcode-sh/top-100/lc-0713-subarray-product-less-than-k.py)\n\n---\n\n## 1. Problem Statement / \u9898\u76ee\u63cf\u8ff0\n\n* **[EN]** Given an array of integers `nums` and an integer `k`, return the number of contiguous subarrays where the product of all the elements in the subarray is strictly less than `k`.\n* **[CN]** \u7ed9\u4f60\u4e00\u4e2a\u6574\u6570\u6570\u7ec4 `nums` \u548c\u4e00\u4e2a\u6574\u6570 `k` \uff0c\u8bf7\u4f60\u8fd4\u56de\u5b50\u6570\u7ec4\u5185\u6240\u6709\u5143\u7d20\u7684\u4e58\u79ef\u4e25\u683c\u5c0f\u4e8e `k` \u7684\u8fde\u7eed\u5b50\u6570\u7ec4\u7684\u6570\u76ee\u3002\n\n---\n\n## 2. Code Implementation / \u4ee3\u7801\u5b9e\u73b0\n\n```python\nfrom typing import List\n\nclass Solution:\n    def numSubarrayProductLessThanK(self, nums: List[int], k: int) -> int:\n        # \u8fb9\u754c\u7279\u5224\uff1a\u6b63\u6574\u6570\u6570\u7ec4\u5b50\u6570\u7ec4\u4e58\u79ef\u6700\u5c0f\u4e3a 1\u3002\u5f53 k <= 1 \u65f6\uff0c\u4e0d\u53ef\u80fd\u4e25\u683c\u5c0f\u4e8e k\uff0c\u76f4\u63a5\u8fd4\u56de 0\n        if k <= 1:\n            return 0\n\n        ans = 0\n        prod = 1\n        left = 0\n\n        for right, x in enumerate(nums):\n            # 1. \u6269\u5f20\u7a97\u53e3\uff1a\u5c06\u65b0\u5143\u7d20\u4e58\u5165\u5f53\u524d\u7a97\u53e3\u603b\u4e58\u79ef\n            prod *= x\n            \n            # 2. \u6536\u7f29\u7a97\u53e3\uff1a\u5f53\u4e58\u79ef >= k\uff08\u4e0d\u5408\u6cd5\uff09\u65f6\uff0c\u6301\u7eed\u4ece\u5de6\u7aef\u79fb\u51fa\u5143\u7d20\n            while prod >= k:\n                prod //= nums[left]\n                left += 1\n                \n            # 3. \u6838\u5fc3\u8ba1\u6570\uff1a\u4ee5\u5f53\u524d right \u4e3a\u56fa\u5b9a\u53f3\u7aef\u70b9\u7684\u5408\u6cd5\u8fde\u7eed\u5b50\u6570\u7ec4\u6570\u76ee\u6070\u4e3a\u7a97\u53e3\u957f\u5ea6\n            ans += right - left + 1\n\n        return ans\n```\n\n---\n\n## 3. Step-by-Step Code Walkthrough / \u9010\u884c\u903b\u8f91\u5256\u6790\n\n### Step 1: \u8fb9\u754c\u7279\u5224 (`if k <= 1: return 0`)\n* **[EN] Why `k <= 1` returns 0?**\n  * Per problem constraints, all elements in `nums` are positive integers ($\\ge 1$).\n  * The minimum possible product of any non-empty subarray is $1$.\n  * If $k = 0$ or $k = 1$, no subarray can have a product **strictly less than** $k$. We can immediately return $0$.\n  * **Critical Side Benefit:** Guaranteeing $k \\ge 2$ in the loop ensures that `left` will never run past `right + 1`.\n* **[CN] \u4e3a\u4ec0\u4e48 `k <= 1` \u76f4\u63a5\u8fd4\u56de 0\uff1f**\n  * \u9898\u76ee\u89c4\u5b9a\u6570\u7ec4\u4e2d\u6240\u6709\u5143\u7d20\u90fd\u662f\u6b63\u6574\u6570\uff08$\\ge 1$\uff09\u3002\n  * \u4efb\u610f\u975e\u7a7a\u5b50\u6570\u7ec4\u7684\u4e58\u79ef\u81f3\u5c11\u4e3a 1\u3002\n  * \u82e5 $k = 0$ \u6216 $k = 1$\uff0c\u4e0d\u53ef\u80fd\u5b58\u5728\u4e58\u79ef**\u4e25\u683c\u5c0f\u4e8e** $k$ \u7684\u5b50\u6570\u7ec4\uff0c\u56e0\u6b64\u76f4\u63a5\u8fd4\u56de 0\u3002\n  * **\u989d\u5916\u5173\u952e\u6536\u76ca**\uff1a\u4fdd\u8bc1\u4e86\u540e\u7eed\u5faa\u73af\u4e2d $k \\ge 2$\uff0c\u4ece\u800c\u5f7b\u5e95\u907f\u514d\u4e86 `left` \u6307\u9488\u8d8a\u754c\u7684\u95ee\u9898\u3002\n\n---\n\n### Step 2: \u6269\u5f20\u7a97\u53e3 (`prod *= x`)\n* **[EN] Action:** For each element $x$ at index `right`, multiply `prod` by $x$ to expand the current window `nums[left..right]`.\n* **[CN] \u52a8\u4f5c**\uff1a\u53f3\u6307\u9488 `right` \u9010\u4e2a\u679a\u4e3e\u5143\u7d20 $x$\uff0c\u5c06 $x$ \u4e58\u5165\u5f53\u524d\u7a97\u53e3\u603b\u4e58\u79ef `prod` \u4e2d\u3002\n\n---\n\n### Step 3: \u6536\u7f29\u7a97\u53e3 (`while prod >= k: prod //= nums[left]; left += 1`)\n* **[EN] Action:** If `prod >= k`, the current window's product is too large. Shrink the window from the left by dividing out `nums[left]` and moving `left` forward until `prod < k`.\n* **[CN] \u52a8\u4f5c**\uff1a\u82e5\u4e58\u79ef `prod >= k` \u8d85\u51fa\u4e0a\u9650\uff0c\u5219\u4e0d\u65ad\u901a\u8fc7\u9664\u4ee5\u5de6\u7aef\u70b9 `nums[left]` \u5e76\u53f3\u79fb `left += 1` \u6765\u6536\u7f29\u7a97\u53e3\uff0c\u76f4\u5230\u7a97\u53e3\u5185\u4e58\u79ef\u91cd\u65b0\u6ee1\u8db3 `prod < k`\u3002\n\n---\n\n### Step 4: \u6838\u5fc3\u8ba1\u6570\u516c\u5f0f (`ans += right - left + 1`)\n* **[EN] Why `right - left + 1`?**\n  * When `nums[left..right]` has a product $< k$, **every contiguous subarray ending at `right`** starting from index $i$ ($left \\le i \\le right$) is guaranteed to have a product $< k$ (because all numbers $\\ge 1$, shorter subarrays have $\\le$ products).\n  * The number of valid subarrays ending at index `right` is exactly `right - left + 1`.\n  * For example, with window `[10, 5, 2]` (`left = 0, right = 2`), valid subarrays ending at `2` are:\n    1. `[2]` (length 1)\n    2. `[5, 2]` (length 2)\n    3. `[10, 5, 2]` (length 3)\n    Total = $2 - 0 + 1 = 3$.\n* **[CN] \u4e3a\u4ec0\u4e48\u7d2f\u52a0\u7684\u662f `right - left + 1`\uff1f**\n  * \u5f53\u533a\u95f4 `nums[left..right]` \u7684\u4e58\u79ef $< k$ \u65f6\uff0c\u7531\u4e8e\u6240\u6709\u6570\u5747\u4e3a\u6b63\u6574\u6570\uff0c\u4ee5 `right` \u7ed3\u5c3e\u3001\u8d77\u70b9\u5728 $[left, right]$ \u8303\u56f4\u5185\u7684**\u6240\u6709\u8fde\u7eed\u5b50\u6570\u7ec4**\u4e58\u79ef\u5fc5\u7136\u4e5f\u90fd $< k$\u3002\n  * \u4ee5\u5f53\u524d `right` \u4e3a**\u53f3\u7aef\u70b9**\u7684\u5408\u6cd5\u5b50\u6570\u7ec4\u4e2a\u6570\uff0c\u521a\u597d\u7b49\u4e8e\u5f53\u524d\u7a97\u53e3\u7684\u957f\u5ea6\uff1a`right - left + 1`\u3002\n  * \u4f8b\u5982\u5f53\u524d\u7a97\u53e3\u662f `[10, 5, 2]`\uff08`left=0, right=2`\uff09\uff0c\u4ee5\u672b\u5c3e `2` \u7ed3\u5c3e\u7684\u5408\u6cd5\u5b50\u6570\u7ec4\u4e3a\uff1a\n    1. `[2]`\n    2. `[5, 2]`\n    3. `[10, 5, 2]`\n    \u521a\u597d\u662f $2 - 0 + 1 = 3$ \u4e2a\uff01\u6bcf\u6b21\u679a\u4e3e `right` \u65f6\u7d2f\u52a0\u65b0\u589e\u7684\u8fd9\u6279\u5b50\u6570\u7ec4\uff0c\u4e0d\u91cd\u4e0d\u6f0f\u3002\n\n---\n\n## 4. Deep Dive: Why Write It This Way? / \u6df1\u5ea6\u8ffd\u95ee\uff1a\u4e3a\u4ec0\u4e48\u8fd9\u4e48\u5199\uff1f\n\n### Q1: \u4e3a\u4ec0\u4e48\u662f\u9664\u6cd5 `prod //= nums[left]`\uff1f\u4e3a\u4ec0\u4e48\u7528\u6574\u9664 `//=`\uff1f\n* **\u4e58\u6cd5\u7684\u9006\u8fd0\u7b97**\uff1a\u5728\u6c42\u548c\u7684\u6ed1\u52a8\u7a97\u53e3\u4e2d\uff0c\u79fb\u51fa\u5143\u7d20\u4f7f\u7528\u51cf\u6cd5\uff08`sum -= nums[left]`\uff09\uff1b\u5728\u6c42\u4e58\u79ef\u7684\u6ed1\u52a8\u7a97\u53e3\u4e2d\uff0c\u79fb\u51fa\u5143\u7d20\u5bf9\u5e94\u7684\u9006\u8fd0\u7b97\u5373\u4e3a\u9664\u6cd5\u3002\n* **\u907f\u514d\u6d6e\u70b9\u6570\u7cbe\u5ea6\u8bef\u5dee**\uff1a$nums[left]$ \u662f\u4e58\u79ef `prod` \u7684\u56e0\u6570\uff0c\u6574\u9664\u4fdd\u8bc1\u9664\u5f97\u5c3d\u4e14\u7ed3\u679c\u59cb\u7ec8\u4e3a `int`\uff0c\u907f\u514d\u6d6e\u70b9\u6570\u8ba1\u7b97\u4ea7\u751f\u7684\u820d\u5165\u8bef\u5dee\uff08\u5982 `1.0000000000000002`\uff09\u3002\n\n### Q2: \u4e3a\u4ec0\u4e48\u7528 `while` \u5faa\u73af\u800c\u4e0d\u662f `if`\uff1f\n* \u52a0\u5165\u65b0\u5143\u7d20 $x$ \u540e\uff0c\u4e58\u79ef\u53ef\u80fd\u4f1a\u53d8\u5f97\u975e\u5e38\u5927\uff0c\u4ec5\u79fb\u51fa 1 \u4e2a $nums[left]$ \u4e0d\u4e00\u5b9a\u80fd\u6ee1\u8db3 $< k$ \u7684\u8981\u6c42\u3002\n* \u5fc5\u987b\u901a\u8fc7 `while` \u5faa\u73af\u6301\u7eed\u79fb\u51fa\u591a\u4e2a\u5de6\u7aef\u5143\u7d20\uff0c\u76f4\u5230\u4e58\u79ef\u4e25\u683c\u5c0f\u4e8e $k$ \u4e3a\u6b62\u3002\n\n### Q3: \u4f1a\u4e0d\u4f1a\u53d1\u751f `left` \u8d8a\u754c\u6216\u6b7b\u5faa\u73af\uff1f\n* **\u4e0d\u4f1a**\u3002\u82e5\u5355\u5143\u7d20 $nums[right] \\ge k$\uff1a\n  * `left` \u4f1a\u4e00\u76f4\u53f3\u79fb\u76f4\u5230 `left == right`\uff0c\u6267\u884c `prod //= nums[right]` \u540e `prod` \u53d8\u4e3a `1`\uff0c\u4e14 `left` \u53d8\u4e3a `right + 1`\u3002\n  * \u56e0\u4e3a\u524d\u7f6e\u68c0\u67e5\u4fdd\u8bc1\u4e86 $k \\ge 2$\uff0c\u4e0b\u4e00\u8f6e\u68c0\u67e5 `while prod >= k` \u5373 `1 >= k` \u5224\u5b9a\u4e3a `False`\uff0c\u5faa\u73af\u7acb\u5373\u9000\u51fa\u3002\n  * \u6b64\u65f6 `right - left + 1 = right - (right + 1) + 1 = 0`\uff0c\u5bf9\u7b54\u6848\u8d21\u732e\u4e3a 0\uff0c\u5b8c\u5168\u6b63\u786e\u4e14\u5b89\u5168\u3002\n\n---\n\n## 5. Execution Trace Example / \u6a21\u62df\u8fd0\u884c\u5168\u8fc7\u7a0b\n\n\u4ee5 `nums = [10, 5, 2, 6], k = 100` \u4e3a\u4f8b\uff1a\n\n| `right` | `x` | `prod` (\u4e58\u5165\u540e) | `while prod >= 100` (\u6536\u7f29) | \u6700\u7ec8 `left` | \u6700\u7ec8\u7a97\u53e3 `nums[left..right]` | \u65b0\u589e\u5408\u6cd5\u5b50\u6570\u7ec4 (\u4ee5 `right` \u7ed3\u5c3e) | `ans += right - left + 1` | \u5f53\u524d `ans` |\n| :---: | :---: | :---: | :---: | :---: | :---: | :---: | :---: | :---: |\n| 0 | 10 | 10 | \u4e0d\u89e6\u53d1 (10 < 100) | 0 | `[10]` | `[10]` | $0 - 0 + 1 = 1$ | **1** |\n| 1 | 5 | 50 | \u4e0d\u89e6\u53d1 (50 < 100) | 0 | `[10, 5]` | `[5]`, `[10, 5]` | $1 - 0 + 1 = 2$ | **3** |\n| 2 | 2 | 100 | **\u89e6\u53d1**\uff1a`prod //= 10` $\\rightarrow$ 10, `left` = 1 | 1 | `[5, 2]` | `[2]`, `[5, 2]` | $2 - 1 + 1 = 2$ | **5** |\n| 3 | 6 | 60 | \u4e0d\u89e6\u53d1 (60 < 100) | 1 | `[5, 2, 6]` | `[6]`, `[2, 6]`, `[5, 2, 6]` | $3 - 1 + 1 = 3$ | **8** |\n\n* \u6700\u7ec8\u603b\u5408\u6cd5\u5b50\u6570\u7ec4\u6570\u76ee\u4e3a\uff1a**`8`**\u3002\n\n---\n\n## 6. Complexity Analysis / \u590d\u6742\u5ea6\u5206\u6790\n\n| \u7ef4\u5ea6 | \u590d\u6742\u5ea6 | \u6838\u5fc3\u89e3\u6790 |\n| :--- | :--- | :--- |\n| **\u65f6\u95f4\u590d\u6742\u5ea6 (Time)** | $\\mathcal{O}(n)$ | \u6bcf\u4e2a\u5143\u7d20\u6700\u591a\u88ab `right` \u4e58\u5165 1 \u6b21\uff0c\u88ab `left` \u9664\u51fa 1 \u6b21\uff0c\u4e24\u6307\u9488\u5747\u5355\u8c03\u9012\u589e\uff0c\u603b\u8fd0\u7b97\u6b21\u6570 $\\le 2n$\u3002 |\n| **\u7a7a\u95f4\u590d\u6742\u5ea6 (Space)** | $\\mathcal{O}(1)$ | \u4ec5\u4f7f\u7528 `ans`, `prod`, `left`, `right` \u56db\u4e2a\u53d8\u91cf\uff0c\u7a7a\u95f4\u5e38\u6570\u7ea7\u3002 |\n", "code": "from typing import List\n\n# 713. Subarray Product Less Than K (\u4e58\u79ef\u5c0f\u4e8e K \u7684\u5b50\u6570\u7ec4)\n# https://leetcode.com/problems/subarray-product-less-than-k/\n\n# ==============================================================================\n# Method: Sliding Window (\u6ed1\u52a8\u7a97\u53e3 / \u53cc\u6307\u9488)\n# Time Complexity: O(n) | Space Complexity: O(1)\n# ==============================================================================\nclass Solution:\n    def numSubarrayProductLessThanK(self, nums: List[int], k: int) -> int:\n        #l r\n        # [l,r] [l+1, r].. [r,r]\n\n        # \u8fb9\u754c\u6761\u4ef6\uff1a\u56e0\u4e3a nums[i] >= 1\uff0c\u6240\u4ee5\u5b50\u6570\u7ec4\u4e58\u79ef\u81f3\u5c11\u4e3a 1\u3002\n        # \u5f53 k <= 1 \u65f6\uff0c\u4e0d\u5b58\u5728\u4e25\u683c\u5c0f\u4e8e k \u7684\u4e58\u79ef\uff0c\u76f4\u63a5\u8fd4\u56de 0\u3002\n        if k <= 1:\n            return 0\n\n        ans = 0\n        prod = 1\n        left = 0\n\n        for right, x in enumerate(nums):\n            prod *= x\n            \n            # \u5f53\u7a97\u53e3\u5185\u4e58\u79ef >= k \u65f6\uff0c\u6536\u7f29\u5de6\u8fb9\u754c\n            while prod >= k:\n                prod /= nums[left]\n                left += 1\n                \n            # \u6838\u5fc3\u8ba1\u6570\uff1a\u4ee5 right \u7ed3\u5c3e\u4e14\u5408\u6cd5\u7684\u8fde\u7eed\u5b50\u6570\u7ec4\u4e2a\u6570\u6070\u597d\u4e3a right - left + 1\n            ans += right - left + 1\n\n        return ans\n", "diff": "Medium", "py_file": "top-100/lc-0713-subarray-product-less-than-k.py", "md_file": "top-100/lc-0713-subarray-product-less-than-k.md"}, "daily-practice/lc-2029-stone-game-ix": {"key": "daily-practice/lc-2029-stone-game-ix", "category": "\ud83d\udcc5 Daily Practice Track", "title": "\ud83d\udcc5 Daily Practice Track: LC 2029 stone game ix", "short": "LC 2029 stone game ix", "path": "daily-practice/lc-2029-stone-game-ix", "type": "problem", "notes": "Here is the bilingual Markdown file for the step-by-step code explanation. You can copy this and save it as a `.md` file.\n\n```markdown\n# LeetCode 2029. Stone Game IX \n## Step-by-Step Code Walkthrough / \u4ee3\u7801\u9010\u884c\u8be6\u89e3\n\n### 1. Initializing Counters (\u521d\u59cb\u5316\u8ba1\u6570\u5668)\n```python\ncnt0 = cnt1 = cnt2 = 0\n\n```\n\n* **[EN] Action:** Creates three variables initialized to 0.\n**Purpose:** Tracks the count of stones with remainders 0, 1, and 2 when divided by 3. Since the goal is to avoid sums divisible by 3, the exact values don't matter, only their remainders.\n* **[CN] \u52a8\u4f5c**\uff1a\u521b\u5efa\u4e86\u4e09\u4e2a\u53d8\u91cf\uff0c\u521d\u59cb\u503c\u90fd\u8bbe\u4e3a 0\u3002\n**\u76ee\u7684**\uff1a\u5206\u522b\u7528\u6765\u7edf\u8ba1\u9664\u4ee5 3 \u4f59\u6570\u5206\u522b\u4e3a 0\u30011\u30012 \u7684\u77f3\u5934\u7684\u6570\u91cf\u3002\u56e0\u4e3a\u6e38\u620f\u7684\u6838\u5fc3\u662f\u4e0d\u8ba9\u603b\u548c\u88ab 3 \u6574\u9664\uff0c\u6240\u4ee5\u77f3\u5934\u7684\u5177\u4f53\u9762\u503c\u4e0d\u91cd\u8981\uff0c\u4f59\u6570\u624d\u91cd\u8981\u3002\n\n---\n\n### 2. Categorizing Stones (\u904d\u5386\u77f3\u5934\u5e76\u5206\u7c7b)\n\n```python\nfor val in stones:\n    rem = val % 3\n    if rem == 0:\n        cnt0 += 1\n    elif rem == 1:\n        cnt1 += 1\n    else:\n        cnt2 += 1\n\n```\n\n* **[EN] Action:** Loops through each stone (`val`) in the `stones` array.\n**Math:** `rem = val % 3` calculates the remainder of the stone's value divided by 3.\n**Sorting:** The `if...elif...else` block categorizes the stones into their respective \"buckets\" (`cnt0`, `cnt1`, or `cnt2`) based on the remainder.\n* **[CN] \u52a8\u4f5c**\uff1a\u904d\u5386\u6570\u7ec4 `stones` \u4e2d\u7684\u6bcf\u4e00\u5757\u77f3\u5934\uff08`val`\uff09\u3002\n**\u8ba1\u7b97**\uff1a`rem = val % 3` \u8ba1\u7b97\u8fd9\u5757\u77f3\u5934\u7684\u9762\u503c\u9664\u4ee5 3 \u7684\u4f59\u6570\u3002\n**\u5206\u62e3**\uff1a`if...elif...else` \u8bed\u53e5\u6839\u636e\u4f59\u6570\u628a\u77f3\u5934\u653e\u8fdb\u5bf9\u5e94\u7684\u201c\u6876\u201d\u91cc\uff08\u4f59\u6570\u4e3a0\u589e\u52a0`cnt0`\uff0c\u4f59\u6570\u4e3a1\u589e\u52a0`cnt1`\uff0c\u4f59\u6570\u4e3a2\u589e\u52a0`cnt2`\uff09\u3002\n\n---\n\n### 3. Handling Even 0s (\u5904\u7406\u5076\u6570\u4e2a 0 \u7684\u60c5\u51b5)\n\n```python\nif cnt0 % 2 == 0:\n    return cnt1 >= 1 and cnt2 >= 1\n\n```\n\n* **[EN] Logic:** `cnt0 % 2 == 0` checks if the number of remainder-0 stones (\"skip turn\" cards) is even.\n**Game Theory:** If even, Alice playing a 0 is immediately countered by Bob playing a 0. They cancel out, maintaining Alice's first-mover advantage.\n**Conclusion:** With the advantage kept, Alice wins (`True`) as long as the pool has at least one `1` AND at least one `2` to start the game safely. If she lacks either, she eventually traps herself (`False`).\n* **[CN] \u5224\u65ad\u903b\u8f91**\uff1a`cnt0 % 2 == 0` \u7528\u6765\u68c0\u67e5\u4f59\u6570\u4e3a 0 \u7684\u77f3\u5934\uff08\u76f8\u5f53\u4e8e\u201c\u8df3\u8fc7\u56de\u5408\u201d\u724c\uff09\u7684\u6570\u91cf\u662f\u4e0d\u662f\u5076\u6570\u3002\n**\u535a\u5f08\u5206\u6790**\uff1a\u5982\u679c\u66 Statement / \u9898\u76ee\u63cf\u8ff0\n\n* **[EN]** Given a string `s`, return the **maximum length** of a substring such that each character in the substring appears **at most twice**.\n* **[CN]** \u7ed9\u4f60\u4e00\u4e2a\u5b57\u7b26\u4e32 `s` \uff0c\u8bf7\u627e\u51fa\u6ee1\u8db3\u6bcf\u4e2a\u5b57\u7b26 **\u6700\u591a\u51fa\u73b0\u4e24\u6b21** \u7684\u6700\u957f\u5b50\u5b57\u7b26\u4e32\uff0c\u5e76\u8fd4\u56de\u8be5\u5b50\u5b57\u7b26\u4e32\u7684 **\u6700\u5927\u957f\u5ea6** \u3002\n\n---\n\n## 2. Code Implementation / \u4ee3\u7801\u5b9e\u73b0\n\n```python\nclass Solution:\n    def maximumLengthSubstring(self, s: str) -> int:\n        right = 0\n        left = 0\n        counts = {}\n        max_len = 0\n\n        while right < len(s):\n            # \u5f53\u53f3\u7aef\u5b57\u7b26\u5df2\u7ecf\u51fa\u73b0\u4e86 2 \u6b21\uff0c\u52a0\u5165\u65b0\u5b57\u7b26\u5c31\u4f1a\u8d85\u6807 (\u8fbe\u5230 3 \u6b21)\n            # \u56e0\u6b64\u5fc5\u987b\u6536\u7f29\u5de6\u8fb9\u754c\uff0c\u76f4\u5230\u8be5\u5b57\u7b26\u9891\u6570\u51cf\u5c11\n            if counts.get(s[right], 0) == 2:\n                counts[s[left]] -= 1\n                left += 1\n            else:\n                counts[s[right]] = counts.get(s[right], 0) + 1\n                max_len = max(max_len, right - left + 1)\n                right += 1\n\n        return max_len\n```\n\n---\n\n## 3. Step-by-Step Walkthrough / \u9010\u6b65\u6838\u5fc3\u903b\u8f91\n\n1. **\u53d8\u957f\u6ed1\u52a8\u7a97\u53e3**\uff1a\u7ef4\u62a4\u5de6\u53f3\u6307\u9488 `left` \u548c `right` \u4ee5\u53ca\u5b57\u7b26\u9891\u6570\u54c8\u5e0c\u8868 `counts`\u3002\n2. **\u5408\u6cd5\u72b6\u6001\u6269\u5f20**\uff1a\u5f53 `counts.get(s[right], 0) < 2` \u65f6\uff0c\u5c06\u5b57\u7b26\u9891\u6570\u52a0 1\uff0c\u66f4\u65b0\u6700\u957f\u957f\u5ea6 `max_len = max(max_len, right - left + 1)`\uff0c\u5e76\u5c06 `right += 1`\u3002\n3. **\u8d85\u6807\u72b6\u6001\u6536\u7f29**\uff1a\u5f53 `counts.get(s[right], 0) == 2` \u65f6\uff0c\u5f53\u524d\u5b57\u7b26\u4e0d\u80fd\u518d\u52a0\u5165\u7a97\u53e3\u3002\u901a\u8fc7\u4e0d\u65ad\u4ece\u5de6\u7aef\u79fb\u51fa\u5b57\u7b26\uff08`counts[s[left]] -= 1; left += 1`\uff09\uff0c\u76f4\u5230\u5f53\u524d\u5b57\u7b26\u53ef\u4ee5\u5408\u6cd5\u52a0\u5165\u3002\n\n---\n\n## 4. Complexity Analysis / \u590d\u6742\u5ea6\u5206\u6790\n\n* **\u65f6\u95f4\u590d\u6742\u5ea6 (Time):** $\\mathcal{O}(n)$ \u2014\u2014 \u6bcf\u4e2a\u5b57\u7b26\u6700\u591a\u88ab `right` \u8bbf\u95ee\u4e00\u6b21\uff0c\u88ab `left` \u79fb\u51fa\u4e00\u6b21\u3002\n* **\u7a7a\u95f4\u590d\u6742\u5ea6 (Space):** $\\mathcal{O}(|\\Sigma|)$ \u2014\u2014 \u54c8\u5e0c\u8868\u6700\u591a\u5b58\u50a8 26 \u4e2a\u5c0f\u5199\u82f1\u6587\u5b57\u6bcd\uff0c\u7a7a\u95f4\u5f00\u9500\u4e3a $\\mathcal{O}(1)$\u3002\n", "code": "# 3090. Maximum Length Substring With Two Occurrences\n# https://leetcode.com/problems/maximum-length-substring-with-two-occurrences/\n\n\n\nclass Solution:\n    def maximumLengthSubstring(self, s: str) -> int:\n        right=0\n        left=0\n        counts={}\n        max_len=0\n\n        while right < len(s):\n            if counts.get(s[right],0) == 2:\n                counts[s[left]] -= 1\n                left +=1 \n\n            else:\n                counts[s[right]] = counts.get(s[right], 0) + 1\n                max_len=max(max_len, right - left + 1)\n                right += 1\n\n        return max_len\n\n        \n\n\n        #.get()\n        #", "diff": "Easy", "py_file": "daily-practice/lc-3090-maximum-length-substring-with-at-most-two-occurrences.py", "md_file": "daily-practice/lc-3090-maximum-length-substring-with-at-most-two-occurrences.md"}, "daily-practice/lc-3471-find-the-largest-almost-missing-integer": {"key": "daily-practice/lc-3471-find-the-largest-almost-missing-integer", "category": "\ud83d\udcc5 Daily Practice Track", "title": "\ud83d\udcc5 Daily Practice Track: LC 3471 find the largest almost missing integer", "short": "LC 3471 find the largest almost missing integer", "path": "daily-practice/lc-3471-find-the-largest-almost-missing-integer", "type": "problem", "notes": "# LeetCode 3471. Find the Largest Almost Missing Integer\n## Step-by-Step Code Walkthrough & Notes / \u4ee3\u7801\u9010\u884c\u8be6\u89e3\u4e0e\u77e5\u8bc6\u70b9\u603b\u7ed3\n\n- **Difficulty:** Easy\n- **Tags:** Array, Hash Table, Sliding Window, Math\n- **Corresponding Python File:** [`daily-practice/lc-3471-find-the-largest-almost-missing-integer.py`](daily-practice/lc-3471-find-the-largest-almost-missing-integer.py)\n\n---\n\n## 1. Problem Statement / \u9898\u76ee\u63cf\u8ff0\n\n* **[EN]** You are given an integer array `nums` and an integer `k`. An integer `x` is defined as **\"almost missing\"** if it appears in **exactly one** contiguous subarray of size `k`. Return the **largest** almost missing integer. If no such integer exists, return `-1`.\n* **[CN]** \u7ed9\u4f60\u4e00\u4e2a\u6574\u6570\u6570\u7ec4 `nums` \u548c\u4e00\u4e2a\u6574\u6570 `k`\u3002\u5982\u679c\u4e00\u4e2a\u6574\u6570 `x` \u5728 `nums` \u4e2d**\u6070\u597d\u51fa\u73b0\u5728 1 \u4e2a**\u957f\u5ea6\u4e3a `k` \u7684\u8fde\u7eed\u5b50\u6570\u7ec4\u4e2d\uff0c\u5219\u79f0 `x` \u4e3a**\u201c\u51e0\u4e4e\u7f3a\u5931\u7684\u6574\u6570\u201d**\u3002\u8fd4\u56de**\u6700\u5927\u7684**\u51e0\u4e4e\u7f3a\u5931\u6574\u6570\uff1b\u82e5\u4e0d\u5b58\u5728\uff0c\u8fd4\u56de `-1`\u3002\n\n---\n\n## 2. Step-by-Step Code Walkthrough / \u4ee3\u7801\u9010\u884c\u8be6\u89e3\n\n### \u65b9\u6848 1\uff1a\u5b9a\u957f\u6ed1\u52a8\u7a97\u53e3 + Set \u53bb\u91cd + Dict \u8ba1\u6570 (Fixed Sliding Window)\n\n```python\nclass Solution:\n    def largestInteger(self, nums: List[int], k: int) -> int:\n        window_counts = {}\n```\n\n* **[EN] Action:** Initializes an empty dictionary `window_counts = {}`.\n  * **Why `{}` instead of `[]`?** `{}` is a **Dictionary (Hash Map)** that stores `Key : Value` pairs (`number : window_count`). A List `[]` cannot map arbitrary integers to counts in $\\mathcal{O}(1)$ time.\n* **[CN] \u52a8\u4f5c**\uff1a\u521d\u59cb\u5316\u4e00\u4e2a\u7a7a\u5b57\u5178 `window_counts = {}`\u3002\n  * **\u4e3a\u4ec0\u4e48\u7528 `{}` \u800c\u4e0d\u7528 `[]`\uff1f** `{}` \u662f**\u5b57\u5178\uff08\u54c8\u5e0c\u8868\uff09**\uff0c\u7528\u4e8e\u4fdd\u5b58 `\u6570\u5b57 : \u51fa\u73b0\u7a97\u53e3\u6b21\u6570` \u7684\u952e\u503c\u5bf9\u6620\u5c04\u3002\u5217\u8868 `[]` \u65e0\u6cd5\u4ee5 $\\mathcal{O}(1)$ \u65f6\u95f4\u628a\u4efb\u610f\u6570\u5b57\u5f53\u4f5c Key \u8fdb\u884c\u9891\u6570\u7edf\u8ba1\u3002\n\n---\n\n```python\n        # Slide a fixed window of size k across nums\n        for i in range(len(nums) - k + 1):\n            current_window = nums[i : i + k]\n```\n\n* **[EN] Action:** Iterates from `i = 0` to `n - k`, cutting out each contiguous slice `nums[i : i + k]` of fixed size `k`.\n  * **Pattern Difference from `lc4` & `lc6`:** `lc4` and `lc6` use **dynamic (variable-size)** windows that expand/shrink with two pointers. LC 3471 uses a **fixed-size** window of length `k`.\n* **[CN] \u52a8\u4f5c**\uff1a\u904d\u5386\u6240\u6709\u8d77\u70b9 `i`\uff0c\u6bcf\u6b21\u622a\u53d6\u957f\u5ea6\u56fa\u5b9a\u4e3a `k` \u7684\u5b50\u6570\u7ec4 `nums[i : i + k]`\u3002\n  * **\u4e0e `lc4` / `lc6` \u7684\u533a\u522b**\uff1a`lc4` / `lc6` \u662f**\u53d8\u957f\u6ed1\u52a8\u7a97\u53e3**\uff0c\u5de6\u53f3\u6307\u9488\u6839\u636e\u6761\u4ef6\u52a8\u6001\u4f38\u7f29\uff1b\u800c\u672c\u9898\u662f**\u5b9a\u957f\u6ed1\u52a8\u7a97\u53e3**\uff0c\u7a97\u53e3\u957f\u5ea6\u59cb\u7ec8\u4e3a $k$\u3002\n\n---\n\n```python\n            # Use set() so that duplicate numbers inside the SAME window are only counted once\n            for num in set(current_window):\n                window_counts[num] = window_counts.get(num, 0) + 1\n```\n\n* **[EN] Action:** Converts the current window into a `set()` and increments the count for each unique number.\n  * **What is `set()` used for?** `set()` automatically **removes duplicates** within the current window. If a window is `[7, 2, 1, 7]`, `set` reduces it to `{1, 2, 7}` so that the number `7` is counted as appearing in this window only **once**.\n  * **What does `.get(num, 0)` do?** Returns the existing count if `num` is already in the dictionary; otherwise returns `0`.\n* **[CN] \u52a8\u4f5c**\uff1a\u5c06\u5f53\u524d\u7a97\u53e3\u8f6c\u4e3a\u96c6\u5408 `set()`\uff0c\u5e76\u8ba9\u5176\u4e2d\u6bcf\u4e2a\u4e0d\u540c\u5143\u7d20\u7684\u8ba1\u6570\u52a0 1\u3002\n  * **`set()` \u7684\u4f5c\u7528**\uff1a**\u81ea\u52a8\u53bb\u91cd**\u3002\u5982\u679c\u4e00\u4e2a\u7a97\u53e3\u662f `[7, 2, 1, 7]`\uff0c\u8f6c\u6210 `set` \u540e\u53d8\u6210 `{1, 2, 7}`\uff0c\u786e\u4fdd\u6570\u5b57 `7` \u5728\u8fd9\u4e00\u4e2a\u7a97\u53e3\u4e2d\u53ea\u88ab\u8ba1\u5165 1 \u6b21\u3002\n  * **`.get(num, 0)` \u7684\u4f5c\u7528**\uff1a\u5982\u679c `num` \u5df2\u7ecf\u5728\u5b57\u5178\u91cc\uff0c\u53d6\u5176\u65e7\u503c\uff1b\u5982\u679c\u4e0d\u5728\uff0c\u7ed9\u9ed8\u8ba4\u503c `0`\u3002\n\n---\n\n```python\n        # Find the largest number that appeared in EXACTLY 1 window\n        max_val = -1\n        for num, count in window_counts.items():\n            if count == 1:\n                max_val = max(max_val, num)\n                \n        return max_val\n```\n\n* **[EN] Action:** Scans the dictionary to find all numbers where `count == 1`, returning the maximum value. If no number has `count == 1`, returns the default `-1`.\n* **[CN] \u52a8\u4f5c**\uff1a\u904d\u5386\u5b57\u5178\u4e2d\u6240\u6709 `count == 1` \u7684\u5019\u9009\u6570\u5b57\uff0c\u53d6\u6700\u5927\u503c `max_val` \u8fd4\u56de\uff1b\u82e5\u6ca1\u6709\u4efb\u4f55\u6570\u5b57\u6ee1\u8db3\u6761\u4ef6\uff0c\u76f4\u63a5\u8fd4\u56de\u521d\u59cb\u503c `-1`\u3002\n\n---\n\n## 3. Key FAQs & Concept Clarifications / \u6838\u5fc3\u7b54\u7591\n\n### Q1: \u793a\u4f8b 1 \u4e2d `nums = [3, 9, 2, 1, 7], k = 3`\uff0c\u4e3a\u4ec0\u4e48\u7b54\u6848\u662f 7 \u800c\u4e0d\u662f 9\uff1f\n* **\u6240\u6709\u957f\u5ea6\u4e3a 3 \u7684\u7a97\u53e3\uff1a**\n  1. `[3, 9, 2]`\n  2. `[9, 2, 1]`\n  3. `[2, 1, 7]`\n* **\u7edf\u8ba1\u51fa\u73b0\u7a97\u53e3\u6570\uff1a**\n  * `9` \u51fa\u73b0\u5728\u4e86\u7a97\u53e3 1 \u548c\u7a97\u53e3 2 $\\rightarrow$ **\u51fa\u73b0 2 \u6b21** \u274c\uff08\u88ab\u6dd8\u6c70\uff0c\u4e0d\u7b26\u5408\u201c\u6070\u597d 1 \u6b21\u201d\uff09\n  * `3` \u51fa\u73b0\u5728\u7a97\u53e3 1 $\\rightarrow$ **\u51fa\u73b0 1 \u6b21** \u2705\n  * `7` \u51fa\u73b0\u5728\u7a97\u53e3 3 $\\rightarrow$ **\u51fa\u73b0 1 \u6b21** \u2705\n* \u5728\u7b26\u5408\u6761\u4ef6\u7684 `{3, 7}` \u4e2d\uff0c\u6700\u5927\u7684\u662f **`7`** ($\\max(3, 7) = 7$)\u3002\n\n---\n\n### Q2: \u4ec0\u4e48\u65f6\u5019\u4f1a\u8fd4\u56de `-1`\uff1f\n* \u5f53\u6570\u7ec4\u4e2d\u7684**\u6bcf\u4e00\u4e2a\u6570\u5b57**\u90fd\u51fa\u73b0\u5728 0 \u4e2a\u6216 $\\ge 2$ \u4e2a\u957f\u5ea6\u4e3a $k$ \u7684\u5b50\u6570\u7ec4\u4e2d\u65f6\u3002\n* **\u4f8b\u5982 `nums = [0, 0], k = 1`\uff1a** \u4e24\u4e2a\u957f\u5ea6\u4e3a 1 \u7684\u7a97\u53e3 `[0]` \u548c `[0]` \u90fd\u5305\u542b 0\uff0c\u6240\u4ee5 0 \u51fa\u73b0\u4e86 2 \u6b21\uff0c\u6ca1\u6709\u7b26\u5408\u201c\u6070\u597d 1 \u6b21\u201d\u7684\u6570\u5b57\uff0c\u8fd4\u56de **`-1`**\u3002\n\n---\n\n### Q3: \u53d8\u957f\u6ed1\u52a8\u7a97\u53e3 (`lc4`, `lc6`) vs \u5b9a\u957f\u6ed1\u52a8\u7a97\u53e3 (\u672c\u9898) \u7684\u5bf9\u6bd4\n\n| \u7ef4\u5ea6 | `lc4` (LC 3) / `lc6` (LC 209) | `lc3471` (Almost Missing) |\n| :--- | :--- | :--- |\n| **\u7a97\u53e3\u5927\u5c0f** | **\u53d8\u957f**\uff1a\u7a97\u53e3\u5927\u5c0f\u52a8\u6001\u6539\u53d8 | **\u5b9a\u957f**\uff1a\u56fa\u5b9a\u4e3a $k$ |\n| **\u6c42\u89e3\u76ee\u6807** | \u6c42\u89e3\u6700\u957f/\u6700\u77ed\u7684**\u7a97\u53e3\u957f\u5ea6**\uff08`max_len` / `min_len`\uff09 | \u7edf\u8ba1\u843d\u5728\u7a97\u53e3\u5185\u7684**\u6570\u5b57\u9891\u6570** |\n| **\u6307\u9488\u79fb\u52a8** | `left` \u548c `right` \u6839\u636e\u6761\u4ef6\u52a8\u6001\u4f38\u7f29 | \u6bcf\u6b21\u6574\u4f53\u5e73\u79fb $k$ \u957f\u5ea6\u7684\u5207\u7247 |\n\n---\n\n## 4. \u65b9\u6848 2\uff1a$\\mathcal{O}(n)$ \u6700\u4f18\u6570\u5b66\u5206\u7c7b\u8ba8\u8bba (Optimal Math Approach)\n\n\u901a\u8fc7\u6570\u5b66\u63a8\u5bfc\uff0c\u4efb\u4f55\u5185\u90e8\u5143\u7d20\uff08$0 < i < n - 1$\uff09\u5728 $1 < k < n$ \u65f6\u5fc5\u7136\u88ab\u81f3\u5c11 2 \u4e2a\u7a97\u53e3\u8986\u76d6\u3002\u56e0\u6b64\u53ea\u6709\u4e24\u7aef\u5143\u7d20\u624d\u53ef\u80fd\u662f\u7b54\u6848\uff1a\n\n```python\nclass SolutionOptimal:\n    def largestInteger(self, nums: List[int], k: int) -> int:\n        n = len(nums)\n        freq = Counter(nums)\n        \n        # Case 1: k == 1 -> \u8fd4\u56de\u5168\u5c40\u53ea\u51fa\u73b0 1 \u6b21\u7684\u6700\u5927\u5143\u7d20\n        if k == 1:\n            unique_nums = [x for x, c in freq.items() if c == 1]\n            return max(unique_nums) if unique_nums else -1\n        \n        # Case 2: k == n -> \u6574\u4e2a\u6570\u7ec4\u5c31\u662f\u552f\u4e00\u7684\u7a97\u53e3\uff0c\u8fd4\u56de\u6700\u5927\u5143\u7d20\n        if k == n:\n            return max(nums)\n        \n        # Case 3: 1 < k < n -> \u53ea\u6709 nums[0] \u548c nums[-1] \u53ef\u80fd\u662f\u5019\u9009\n        candidates = []\n        if freq[nums[0]] == 1:\n            candidates.append(nums[0])\n        if freq[nums[-1]] == 1:\n            candidates.append(nums[-1])\n            \n        return max(candidates) if candidates else -1\n```\n\n---\n\n## 5. Complexity Analysis / \u590d\u6742\u5ea6\u5206\u6790\n\n* **\u5b9a\u957f\u6ed1\u52a8\u7a97\u53e3\u6cd5 (Method 1):**\n  * **\u65f6\u95f4\u590d\u6742\u5ea6 (Time):** $\\mathcal{O}(n \\times k)$ \u2014 \u904d\u5386 $n - k + 1$ \u4e2a\u7a97\u53e3\uff0c\u6bcf\u4e2a\u7a97\u53e3\u5207\u7247\u53ca\u8f6c set \u9700\u8981 $\\mathcal{O}(k)$\u3002\n  * **\u7a7a\u95f4\u590d\u6742\u5ea6 (Space):** $\\mathcal{O}(n)$ \u2014 \u54c8\u5e0c\u8868\u5b58\u50a8\u4e0d\u540c\u5143\u7d20\u9891\u6570\u3002\n* **\u6570\u5b66\u5206\u7c7b\u8ba8\u8bba\u6cd5 (Method 2):**\n  * **\u65f6\u95f4\u590d\u6742\u5ea6 (Time):** $\\mathcal{O}(n)$ \u2014 \u4ec5\u9700\u4e00\u6b21\u7ebf\u6027\u626b\u63cf\u7edf\u8ba1\u9891\u6570\u3002\n  * **\u7a7a\u95f4\u590d\u6742\u5ea6 (Space):** $\\mathcal{O}(n)$ \u2014 \u5b58\u50a8\u9891\u6570\u54c8\u5e0c\u8868\u3002\n", "code": "from typing import List\nfrom collections import Counter\n\n# 3471. Find the Largest Almost Missing Integer\n# https://leetcode.com/problems/find-the-largest-almost-missing-integer/\n\n# ==============================================================================\n# Method 1: Fixed-Size Sliding Window (\u5b9a\u957f\u6ed1\u52a8\u7a97\u53e3 + Set \u53bb\u91cd + Dict \u9891\u6570\u7edf\u8ba1)\n# Intuitive approach using sliding window pattern\n# ==============================================================================\nclass Solution:\n    def largestInteger(self, nums: List[int], k: int) -> int:\n        window_counts = {}\n        \n        # Slide a fixed window of size k across nums\n        for i in range(len(nums) - k + 1):\n            current_window = nums[i : i + k]\n            \n            # Use set() so that duplicate numbers inside the SAME window are only counted once\n            for num in set(current_window):\n                window_counts[num] = window_counts.get(num, 0) + 1\n        \n        # Find the largest number that appeared in EXACTLY 1 window\n        max_val = -1\n        for num, count in window_counts.items():\n            if count == 1:\n                max_val = max(max_val, num)\n                \n        return max_val\n\n\n# ==============================================================================\n# Method 2: Mathematical Case Analysis (O(n) \u6700\u4f18\u6570\u5b66\u5206\u7c7b\u8ba8\u8bba)\n# ==============================================================================\nclass SolutionOptimal:\n    def largestInteger(self, nums: List[int], k: int) -> int:\n        n = len(nums)\n        freq = Counter(nums)\n        \n        # Case 1: k == 1 (Every element is its own window -> max unique element)\n        if k == 1:\n            unique_nums = [x for x, c in freq.items() if c == 1]\n            return max(unique_nums) if unique_nums else -1\n        \n        # Case 2: k == n (Only 1 window containing all elements -> max element)\n        if k == n:\n            return max(nums)\n        \n        # Case 3: 1 < k < n (Only boundary elements nums[0] and nums[-1] can appear once)\n        candidates = []\n        if freq[nums[0]] == 1:\n            candidates.append(nums[0])\n        if freq[nums[-1]] == 1:\n            candidates.append(nums[-1])\n            \n        return max(candidates) if candidates else -1", "diff": "Easy", "py_file": "daily-practice/lc-3471-find-the-largest-almost-missing-integer.py", "md_file": "daily-practice/lc-3471-find-the-largest-almost-missing-integer.md"}, "luffy/01-lc-2235-add-two-integers": {"key": "luffy/01-lc-2235-add-two-integers", "category": "\ud83d\udcda Luffy Curriculum (01-42)", "title": "\ud83d\udcda Luffy Curriculum (01-42): 01 LC 2235 add two integers", "short": "01 LC 2235 add two integers", "path": "luffy/01-lc-2235-add-two-integers", "type": "problem", "notes": "# 2235. Add Two Integers\n## Problem Walkthrough & Solution Notes\n\n- **Difficulty:** Easy\n- **Category:** Luffy Structured Curriculum\n- **Core Technique:** Basic Arithmetic\n- **LeetCode Link:** [2235. Add Two Integers](https://leetcode.com/problems/add-two-integers/)\n- **Corresponding Python File:** [`luffy/01-lc-2235-add-two-integers.py`](file:///mnt/c/Users/steve/iCloudDrive/desktop/leetcode-sh/luffy/01-lc-2235-add-two-integers.py)\n\n---\n\n## 1. Problem Overview & Core Strategy\n\nReturn num1 + num2 directly.\n\n---\n\n## 2. Key Algorithmic Steps\n\n1. **Initialization**: Set up required variables, pointers, hash maps, or queues.\n2. **State Transition / Traversal**: Process elements iteratively or recursively while maintaining invariant states.\n3. **Result Calculation & Return**: Return optimal answer.\n\n---\n\n## 3. Complexity Analysis\n\n- **Time Complexity:** Optimal based on algorithm constraint.\n- **Space Complexity:** Controlled within minimal required auxiliary space.\n", "code": "#lc-2235\n\n#add two integers\n\nclass Solution:\n    def sum(self, num1: int, num2: int) -> int:\n        return num1+num2\n    ", "diff": "Easy", "py_file": "luffy/01-lc-2235-add-two-integers.py", "md_file": "luffy/01-lc-2235-add-two-integers.md"}, "luffy/02-lc-0001-two-sum": {"key": "luffy/02-lc-0001-two-sum", "category": "\ud83d\udcda Luffy Curriculum (01-42)", "title": "\ud83d\udcda Luffy Curriculum (01-42): 02 LC 0001 two sum", "short": "02 LC 0001 two sum", "path": "luffy/02-lc-0001-two-sum", "type": "problem", "notes": "# 1. Two Sum\n## Problem Walkthrough & Solution Notes\n\n- **Difficulty:** Easy\n- **Category:** Luffy Structured Curriculum\n- **Core Technique:** Hash Map (Complement)\n- **LeetCode Link:** [1. Two Sum](https://leetcode.com/problems/two-sum/)\n- **Corresponding Python File:** [`luffy/02-lc-0001-two-sum.py`](file:///mnt/c/Users/steve/iCloudDrive/desktop/leetcode-sh/luffy/02-lc-0001-two-sum.py)\n\n---\n\n## 1. Problem Overview & Core Strategy\n\nUse a hash map to store seen numbers and their indices, checking if target - x exists.\n\n---\n\n## 2. Key Algorithmic Steps\n\n1. **Initialization**: Set up required variables, pointers, hash maps, or queues.\n2. **State Transition / Traversal**: Process elements iteratively or recursively while maintaining invariant states.\n3. **Result Calculation & Return**: Return optimal answer.\n\n---\n\n## 3. Complexity Analysis\n\n- **Time Complexity:** Optimal based on algorithm constraint.\n- **Space Complexity:** Controlled within minimal required auxiliary space.\n", "code": "from typing import List\n\nclass Solution3: #even better hash table\n    def twoSum(self, nums: List[int], target: int) -> List[int]:\n        cache={}\n        for i,item in enumerate(nums):\n            other = target - item\n            if other in cache:\n                return [i, cache[other]]\n            cache[item] = i\n        return []\n\n\n#when you need to find two numbers in a list that add up to a specific target, \n# you can use a hash table (dictionary) to store the numbers you've seen so far and their indices. This allows you to check in constant time if the complement (the number needed to reach the target) exists in the hash table. The provided code implements this approach efficiently.", "diff": "Easy", "py_file": "luffy/02-lc-0001-two-sum.py", "md_file": "luffy/02-lc-0001-two-sum.md"}, "luffy/03-lc-0167-two-sum-ii-input-array-is-sorted": {"key": "luffy/03-lc-0167-two-sum-ii-input-array-is-sorted", "category": "\ud83d\udcda Luffy Curriculum (01-42)", "title": "\ud83d\udcda Luffy Curriculum (01-42): 03 LC 0167 two sum ii input array is sorted", "short": "03 LC 0167 two sum ii input array is sorted", "path": "luffy/03-lc-0167-two-sum-ii-input-array-is-sorted", "type": "problem", "notes": "# 167. Two Sum II - Input Array Is Sorted\n## Problem Walkthrough & Solution Notes\n\n- **Difficulty:** Medium\n- **Category:** Luffy Structured Curriculum\n- **Core Technique:** Two Pointers (Inward)\n- **LeetCode Link:** [167. Two Sum II - Input Array Is Sorted](https://leetcode.com/problems/two-sum-ii-input-array-is-sorted/)\n- **Corresponding Python File:** [`luffy/03-lc-0167-two-sum-ii-input-array-is-sorted.py`](file:///mnt/c/Users/steve/iCloudDrive/desktop/leetcode-sh/luffy/03-lc-0167-two-sum-ii-input-array-is-sorted.py)\n\n---\n\n## 1. Problem Overview & Core Strategy\n\nUse left and right pointers moving inward based on comparison of sum vs target.\n\n---\n\n## 2. Key Algorithmic Steps\n\n1. **Initialization**: Set up required variables, pointers, hash maps, or queues.\n2. **State Transition / Traversal**: Process elements iteratively or recursively while maintaining invariant states.\n3. **Result Calculation & Return**: Return optimal answer.\n\n---\n\n## 3. Complexity Analysis\n\n- **Time Complexity:** Optimal based on algorithm constraint.\n- **Space Complexity:** Controlled within minimal required auxiliary space.\n", "code": "from typing import List\n\nclass Solution:\n    def twoSum(self, numbers: List[int], target: int) -> List[int]:\n        cache={}\n        for i,item in enumerate(numbers):\n            other = target - item\n            if other in cache:\n                return(cache[other]+1,i+1)\n            cache[item] = i\n\n\nclass Solution2:\n    def twoSum(self, numbers: List[int], target: int) -> List[int]:\n        #two pointer approach\n        left = 0\n        right = len(numbers) - 1\n        while left != right:\n            sum = numbers[left] + numbers[right]\n            if sum == target:\n                return[left+1, right+1]\n            elif sum < target:\n                left += 1\n            elif sum > target:\n                right -= 1\n\n\n#two pointer approach is more efficient than hash table approach in this case \n# because the input list is sorted. The two pointer approach has a time complexity of O(n) \n# and a space complexity of O(1), while the hash table approach has a time complexity of O(n) \n# but a space complexity of O(n) due to the additional storage used for the hash table.\n            \n            \n#note:\n#if the list is already sorteed\n#two pointer approach is the general methond\n\n\n\n                \n        ", "diff": "Medium", "py_file": "luffy/03-lc-0167-two-sum-ii-input-array-is-sorted.py", "md_file": "luffy/03-lc-0167-two-sum-ii-input-array-is-sorted.md"}, "luffy/04-lc-0003-longest-substring-without-repeating-characters": {"key": "luffy/04-lc-0003-longest-substring-without-repeating-characters", "category": "\ud83d\udcda Luffy Curriculum (01-42)", "title": "\ud83d\udcda Luffy Curriculum (01-42): 04 LC 0003 longest substring without repeating characters", "short": "04 LC 0003 longest substring without repeating characters", "path": "luffy/04-lc-0003-longest-substring-without-repeating-characters", "type": "problem", "notes": "# 3. Longest Substring Without Repeating Characters\n## Problem Walkthrough & Solution Notes\n\n- **Difficulty:** Medium\n- **Category:** Luffy Structured Curriculum\n- **Core Technique:** Dynamic Sliding Window\n- **LeetCode Link:** [3. Longest Substring Without Repeating Characters](https://leetcode.com/problems/longest-substring-without-repeating-characters/)\n- **Corresponding Python File:** [`luffy/04-lc-0003-longest-substring-without-repeating-characters.py`](file:///mnt/c/Users/steve/iCloudDrive/desktop/leetcode-sh/luffy/04-lc-0003-longest-substring-without-repeating-characters.py)\n\n---\n\n## 1. Problem Overview & Core Strategy\n\nMaintain a frequency table or set for the current window, contracting left when a duplicate is seen.\n\n---\n\n## 2. Key Algorithmic Steps\n\n1. **Initialization**: Set up required variables, pointers, hash maps, or queues.\n2. **State Transition / Traversal**: Process elements iteratively or recursively while maintaining invariant states.\n3. **Result Calculation & Return**: Return optimal answer.\n\n---\n\n## 3. Complexity Analysis\n\n- **Time Complexity:** Optimal based on algorithm constraint.\n- **Space Complexity:** Controlled within minimal required auxiliary space.\n", "code": "from typing import List\n\n\n#try sliding window \nclass Solution:\n    def lengthOfLongestSubstring(self, s: str) -> int:\n        left = 0\n        right =0\n        my_set = set()\n        max_len = 0\n        while right < len(s):\n            if s[right] in my_set: #if the set has recorded\n                my_set.remove(s[left])\n                left += 1\n            else: # if the current character is not in the set\n                my_set.add(s[right])\n                max_len = max(max_len, right-left+1)\n                right += 1\n\n        return max_len\n    \n    \n                ", "diff": "Medium", "py_file": "luffy/04-lc-0003-longest-substring-without-repeating-characters.py", "md_file": "luffy/04-lc-0003-longest-substring-without-repeating-characters.md"}, "luffy/05-lc-0026-remove-duplicates-from-sorted-array": {"key": "luffy/05-lc-0026-remove-duplicates-from-sorted-array", "category": "\ud83d\udcda Luffy Curriculum (01-42)", "title": "\ud83d\udcda Luffy Curriculum (01-42): 05 LC 0026 remove duplicates from sorted array", "short": "05 LC 0026 remove duplicates from sorted array", "path": "luffy/05-lc-0026-remove-duplicates-from-sorted-array", "type": "problem", "notes": "# 26. Remove Duplicates from Sorted Array\n## Problem Walkthrough & Solution Notes\n\n- **Difficulty:** Easy\n- **Category:** Luffy Structured Curriculum\n- **Core Technique:** Slow & Fast Two Pointers\n- **LeetCode Link:** [26. Remove Duplicates from Sorted Array](https://leetcode.com/problems/remove-duplicates-from-sorted-array/)\n- **Corresponding Python File:** [`luffy/05-lc-0026-remove-duplicates-from-sorted-array.py`](file:///mnt/c/Users/steve/iCloudDrive/desktop/leetcode-sh/luffy/05-lc-0026-remove-duplicates-from-sorted-array.py)\n\n---\n\n## 1. Problem Overview & Core Strategy\n\nFast pointer scans array; slow pointer places unique elements in-place.\n\n---\n\n## 2. Key Algorithmic Steps\n\n1. **Initialization**: Set up required variables, pointers, hash maps, or queues.\n2. **State Transition / Traversal**: Process elements iteratively or recursively while maintaining invariant states.\n3. **Result Calculation & Return**: Return optimal answer.\n\n---\n\n## 3. Complexity Analysis\n\n- **Time Complexity:** Optimal based on algorithm constraint.\n- **Space Complexity:** Controlled within minimal required auxiliary space.\n", "code": "from typing import List\n\n\nclass Solution:\n    def removeDuplicates(self, nums: List[int]) -> int:\n        read=0\n        write=0\n        while read<len(nums):\n            if nums[read]==nums[write]:\n                read+=1\n            else:\n                write+=1\n                nums[write]=nums[read]\n\n        return write+1\n        ", "diff": "Easy", "py_file": "luffy/05-lc-0026-remove-duplicates-from-sorted-array.py", "md_file": "luffy/05-lc-0026-remove-duplicates-from-sorted-array.md"}, "luffy/06-lc-0209-minimum-size-subarray-sum": {"key": "luffy/06-lc-0209-minimum-size-subarray-sum", "category": "\ud83d\udcda Luffy Curriculum (01-42)", "title": "\ud83d\udcda Luffy Curriculum (01-42): 06 LC 0209 minimum size subarray sum", "short": "06 LC 0209 minimum size subarray sum", "path": "luffy/06-lc-0209-minimum-size-subarray-sum", "type": "problem", "notes": "# 209. Minimum Size Subarray Sum\n## Problem Walkthrough & Solution Notes\n\n- **Difficulty:** Medium\n- **Category:** Luffy Structured Curriculum\n- **Core Technique:** Dynamic Sliding Window\n- **LeetCode Link:** [209. Minimum Size Subarray Sum](https://leetcode.com/problems/minimum-size-subarray-sum/)\n- **Corresponding Python File:** [`luffy/06-lc-0209-minimum-size-subarray-sum.py`](file:///mnt/c/Users/steve/iCloudDrive/desktop/leetcode-sh/luffy/06-lc-0209-minimum-size-subarray-sum.py)\n\n---\n\n## 1. Problem Overview & Core Strategy\n\nExpand right to reach target sum, then shrink left to find minimal length.\n\n---\n\n## 2. Key Algorithmic Steps\n\n1. **Initialization**: Set up required variables, pointers, hash maps, or queues.\n2. **State Transition / Traversal**: Process elements iteratively or recursively while maintaining invariant states.\n3. **Result Calculation & Return**: Return optimal answer.\n\n---\n\n## 3. Complexity Analysis\n\n- **Time Complexity:** Optimal based on algorithm constraint.\n- **Space Complexity:** Controlled within minimal required auxiliary space.\n", "code": "from typing import List\n\n#sliding window \n#sum >= target?\nclass Solution:\n    def minSubArrayLen(self, target: int, nums: List[int]) -> int:\n        slow = 0\n        fast = 0\n        sum = 0\n        min_len = float('inf')\n        \n        while fast < len(nums):\n            sum += nums[fast]\n            \n            while sum >= target:\n                min_len = min(min_len, fast - slow + 1)\n                sum -= nums[slow]\n                slow += 1\n                \n            fast += 1\n            \n        return min_len if min_len != float('inf') else 0\n    \n#note: \n# target has not yet met, move fast pointer to the right\n# when target has met, move slow pointer to the right to find the minimum length of subarry\n\n\n            ", "diff": "Medium", "py_file": "luffy/06-lc-0209-minimum-size-subarray-sum.py", "md_file": "luffy/06-lc-0209-minimum-size-subarray-sum.md"}, "luffy/07-lc-0704-binary-search": {"key": "luffy/07-lc-0704-binary-search", "category": "\ud83d\udcda Luffy Curriculum (01-42)", "title": "\ud83d\udcda Luffy Curriculum (01-42): 07 LC 0704 binary search", "short": "07 LC 0704 binary search", "path": "luffy/07-lc-0704-binary-search", "type": "problem", "notes": "# 704. Binary Search\n## Problem Walkthrough & Solution Notes\n\n- **Difficulty:** Easy\n- **Category:** Luffy Structured Curriculum\n- **Core Technique:** Binary Search\n- **LeetCode Link:** [704. Binary Search](https://leetcode.com/problems/binary-search/)\n- **Corresponding Python File:** [`luffy/07-lc-0704-binary-search.py`](file:///mnt/c/Users/steve/iCloudDrive/desktop/leetcode-sh/luffy/07-lc-0704-binary-search.py)\n\n---\n\n## 1. Problem Overview & Core Strategy\n\nSearch in closed interval [left, right] with mid calculation avoiding overflow.\n\n---\n\n## 2. Key Algorithmic Steps\n\n1. **Initialization**: Set up required variables, pointers, hash maps, or queues.\n2. **State Transition / Traversal**: Process elements iteratively or recursively while maintaining invariant states.\n3. **Result Calculation & Return**: Return optimal answer.\n\n---\n\n## 3. Complexity Analysis\n\n- **Time Complexity:** Optimal based on algorithm constraint.\n- **Space Complexity:** Controlled within minimal required auxiliary space.\n", "code": "from typing import List\n\n#binary search\n#left closed and right closed interval\n\nclass Solution:\n    def search(self, nums: List[int], target: int) -> int:\n        left = 0\n        right = len(nums) #binary search property\n\n        mid = (left + right) //2\n\n        while left < right: # left must be smaller than the right\n            if nums[mid] == target:\n                return mid\n            elif nums[mid] < target:\n                left = mid + 1 # since mid is not target, so +1\n            elif nums[mid] > target:\n                right = mid\n            \n            mid = (left + right)//2\n\n        return mid\n    \n            \n\n            \n            \n        ", "diff": "Easy", "py_file": "luffy/07-lc-0704-binary-search.py", "md_file": "luffy/07-lc-0704-binary-search.md"}, "luffy/08-lc-0059-spiral-matrix-ii": {"key": "luffy/08-lc-0059-spiral-matrix-ii", "category": "\ud83d\udcda Luffy Curriculum (01-42)", "title": "\ud83d\udcda Luffy Curriculum (01-42): 08 LC 0059 spiral matrix ii", "short": "08 LC 0059 spiral matrix ii", "path": "luffy/08-lc-0059-spiral-matrix-ii", "type": "problem", "notes": "# 59. Spiral Matrix II\n## Problem Walkthrough & Solution Notes\n\n- **Difficulty:** Medium\n- **Category:** Luffy Structured Curriculum\n- **Core Technique:** Matrix Boundary Simulation\n- **LeetCode Link:** [59. Spiral Matrix II](https://leetcode.com/problems/spiral-matrix-ii/)\n- **Corresponding Python File:** [`luffy/08-lc-0059-spiral-matrix-ii.py`](file:///mnt/c/Users/steve/iCloudDrive/desktop/leetcode-sh/luffy/08-lc-0059-spiral-matrix-ii.py)\n\n---\n\n## 1. Problem Overview & Core Strategy\n\nSimulate filling layers with top, bottom, left, right boundary constraints.\n\n---\n\n## 2. Key Algorithmic Steps\n\n1. **Initialization**: Set up required variables, pointers, hash maps, or queues.\n2. **State Transition / Traversal**: Process elements iteratively or recursively while maintaining invariant states.\n3. **Result Calculation & Return**: Return optimal answer.\n\n---\n\n## 3. Complexity Analysis\n\n- **Time Complexity:** Optimal based on algorithm constraint.\n- **Space Complexity:** Controlled within minimal required auxiliary space.\n", "code": "from typing import List\n\n\n# use for loop\n# mat[row][column]\n# i -> row  up to buttom index\n# j -> left to right index\nclass Solution:\n    def generateMatrix(self, n: int) -> List[List[int]]:\n        \n        mat = [\n            [0]*n for _ in range(n)\n        ]\n        count = 1\n        init_index = 0\n\n        while not count >= n**2: #\u8df3\u51fa\u5faa\u73af\u6761\u4ef6\u53d6\u53cd\n            for j in range(init_index, n-1-init_index):\n                mat[init_index][j] = count\n                count += 1\n            for i in range(init_index, n-1-init_index):\n                mat[i][n-1-init_index] = count\n                count += 1\n            for j in range(n-1-init_index, init_index, -1):\n                mat[n-1-init_index][j] = count\n                count += 1\n            for i in range(n-1-init_index, init_index, -1):\n                mat[i][init_index]= count\n                count += 1\n\n            init_index += 1\n        \n        if n%2==1:\n            mat[n//2][n//2]=count\n        return mat\n\n\nif __name__ == '__main__':\n    s = Solution()\n    print(s.generateMatrix(3)) \n\n\n\n    \n", "diff": "Medium", "py_file": "luffy/08-lc-0059-spiral-matrix-ii.py", "md_file": "luffy/08-lc-0059-spiral-matrix-ii.md"}, "luffy/09-lc-0059-spiral-matrix-ii-alt": {"key": "luffy/09-lc-0059-spiral-matrix-ii-alt", "category": "\ud83d\udcda Luffy Curriculum (01-42)", "title": "\ud83d\udcda Luffy Curriculum (01-42): 09 LC 0059 spiral matrix ii alt", "short": "09 LC 0059 spiral matrix ii alt", "path": "luffy/09-lc-0059-spiral-matrix-ii-alt", "type": "problem", "notes": "# 59. Spiral Matrix II (Alternative)\n## Problem Walkthrough & Solution Notes\n\n- **Difficulty:** Medium\n- **Category:** Luffy Structured Curriculum\n- **Core Technique:** Matrix Direction Vectors\n- **LeetCode Link:** [59. Spiral Matrix II (Alternative)](https://leetcode.com/problems/spiral-matrix-ii/)\n- **Corresponding Python File:** [`luffy/09-lc-0059-spiral-matrix-ii-alt.py`](file:///mnt/c/Users/steve/iCloudDrive/desktop/leetcode-sh/luffy/09-lc-0059-spiral-matrix-ii-alt.py)\n\n---\n\n## 1. Problem Overview & Core Strategy\n\nUse direction vectors (dx, dy) and rotate clockwise when hitting boundaries.\n\n---\n\n## 2. Key Algorithmic Steps\n\n1. **Initialization**: Set up required variables, pointers, hash maps, or queues.\n2. **State Transition / Traversal**: Process elements iteratively or recursively while maintaining invariant states.\n3. **Result Calculation & Return**: Return optimal answer.\n\n---\n\n## 3. Complexity Analysis\n\n- **Time Complexity:** Optimal based on algorithm constraint.\n- **Space Complexity:** Controlled within minimal required auxiliary space.\n", "code": "# Definition for singly-linked list.\nfrom typing import Optional\n\n\nclass ListNode:\n    def __init__(self, x):\n        self.val = x\n        self.next = None\n\nclass Solution:\n    def detectCycle(self, head: Optional[ListNode]) -> Optional[ListNode]:\n        slow=head\n        fast=head\n        while fast!=None and fast.next!=None:\n            slow=slow.next\n            fast=fast.next.next\n\n            if slow==fast: # \u76f8\u9047\n                point1=head\n                point2=slow\n                while point1!=point2:\n                    point1=point1.next\n                    point2=point2.next\n\n                # \u6b64\u65f6point1 \u548c point2 \u76f8\u9047\u5728 \u5165\u53e3\n                return point1\n\n        # \u6b64\u65f6\u8bf4\u660e\u6ca1\u6709 \u73af\n        return None\n\n\n\n\n\n", "diff": "Medium", "py_file": "luffy/09-lc-0059-spiral-matrix-ii-alt.py", "md_file": "luffy/09-lc-0059-spiral-matrix-ii-alt.md"}, "luffy/10-lc-0303-prefix-sum-practices": {"key": "luffy/10-lc-0303-prefix-sum-practices", "category": "\ud83d\udcda Luffy Curriculum (01-42)", "title": "\ud83d\udcda Luffy Curriculum (01-42): 10 LC 0303 prefix sum practices", "short": "10 LC 0303 prefix sum practices", "path": "luffy/10-lc-0303-prefix-sum-practices", "type": "problem", "notes": "# Prefix Sum Foundation Practices\n## Problem Walkthrough & Solution Notes\n\n- **Difficulty:** Easy\n- **Category:** Luffy Structured Curriculum\n- **Core Technique:** Prefix Sum & Cumulative Array\n- **LeetCode Link:** [Prefix Sum Foundation Practices](https://leetcode.com/problems/range-sum-query-immutable/)\n- **Corresponding Python File:** [`luffy/10-lc-0303-prefix-sum-practices.py`](file:///mnt/c/Users/steve/iCloudDrive/desktop/leetcode-sh/luffy/10-lc-0303-prefix-sum-practices.py)\n\n---\n\n## 1. Problem Overview & Core Strategy\n\nFoundational exercises on constructing and querying prefix sum arrays.\n\n---\n\n## 2. Key Algorithmic Steps\n\n1. **Initialization**: Set up required variables, pointers, hash maps, or queues.\n2. **State Transition / Traversal**: Process elements iteratively or recursively while maintaining invariant states.\n3. **Result Calculation & Return**: Return optimal answer.\n\n---\n\n## 3. Complexity Analysis\n\n- **Time Complexity:** Optimal based on algorithm constraint.\n- **Space Complexity:** Controlled within minimal required auxiliary space.\n", "code": "class Employee:\n    empCount = 0\n\n\n\n    def __init__(self, name, salary):\n        self.name = name\n        self.salary = salary\n        Employee.empCount += 1\n    \n\n    def displayCount(self):\n        print(\"Total Employee %d\" % Employee.empCount)\n    \n    def displayEmployee(self):\n        print(\"Name : \", self.name,  \", Salary: \", self.salary)\n\n\n        ", "diff": "Easy", "py_file": "luffy/10-lc-0303-prefix-sum-practices.py", "md_file": "luffy/10-lc-0303-prefix-sum-practices.md"}, "luffy/10-lc-0303-range-sum-query-immutable-alt": {"key": "luffy/10-lc-0303-range-sum-query-immutable-alt", "category": "\ud83d\udcda Luffy Curriculum (01-42)", "title": "\ud83d\udcda Luffy Curriculum (01-42): 10 LC 0303 range sum query immutable alt", "short": "10 LC 0303 range sum query immutable alt", "path": "luffy/10-lc-0303-range-sum-query-immutable-alt", "type": "problem", "notes": "# 303. Range Sum Query (Variant)\n## Problem Walkthrough & Solution Notes\n\n- **Difficulty:** Easy\n- **Category:** Luffy Structured Curriculum\n- **Core Technique:** Prefix Sum\n- **LeetCode Link:** [303. Range Sum Query (Variant)](https://leetcode.com/problems/range-sum-query-immutable/)\n- **Corresponding Python File:** [`luffy/10-lc-0303-range-sum-query-immutable-alt.py`](file:///mnt/c/Users/steve/iCloudDrive/desktop/leetcode-sh/luffy/10-lc-0303-range-sum-query-immutable-alt.py)\n\n---\n\n## 1. Problem Overview & Core Strategy\n\nAlternative 0-indexed prefix sum formulation.\n\n---\n\n## 2. Key Algorithmic Steps\n\n1. **Initialization**: Set up required variables, pointers, hash maps, or queues.\n2. **State Transition / Traversal**: Process elements iteratively or recursively while maintaining invariant states.\n3. **Result Calculation & Return**: Return optimal answer.\n\n---\n\n## 3. Complexity Analysis\n\n- **Time Complexity:** Optimal based on algorithm constraint.\n- **Space Complexity:** Controlled within minimal required auxiliary space.\n", "code": "from typing import List\nclass NumArray: #new\n\n    def __init__(self, nums: List[int]):\n        self.preSum = [0] * (len(nums) + 1) #\u7b2ci\u4e2aelement\u7684\u4f4d\u7f6e\u50a8\u5b58\u5217\u8868\u524di\u4e2a\u5143\u7d20\u7684\u548c\n        for i in range((len(nums))):\n            self.preSum[i+1] = self.preSum[i] + nums[i]\n\n\n\n    def sumRange(self, left: int, right: int) -> int: #new\n        return self.preSum[right+1] - self.preSum[left]\n        \n\n# Your NumArray object will be instantiated and called as such:\n# obj = NumArray(nums)\n# param_1 = obj.sumRange(left,right)\n      \n            \n\n\nif __name__ == '__main__':\n    a=NumArray([0,1,2,3,4,5,6])\n    a.sumRange(0,2)\n\n\n        \n\n", "diff": "Easy", "py_file": "luffy/10-lc-0303-range-sum-query-immutable-alt.py", "md_file": "luffy/10-lc-0303-range-sum-query-immutable-alt.md"}, "luffy/10-lc-0303-range-sum-query-immutable": {"key": "luffy/10-lc-0303-range-sum-query-immutable", "category": "\ud83d\udcda Luffy Curriculum (01-42)", "title": "\ud83d\udcda Luffy Curriculum (01-42): 10 LC 0303 range sum query immutable", "short": "10 LC 0303 range sum query immutable", "path": "luffy/10-lc-0303-range-sum-query-immutable", "type": "problem", "notes": "# 303. Range Sum Query - Immutable\n## Problem Walkthrough & Solution Notes\n\n- **Difficulty:** Easy\n- **Category:** Luffy Structured Curriculum\n- **Core Technique:** Prefix Sum Array\n- **LeetCode Link:** [303. Range Sum Query - Immutable](https://leetcode.com/problems/range-sum-query-immutable/)\n- **Corresponding Python File:** [`luffy/10-lc-0303-range-sum-query-immutable.py`](file:///mnt/c/Users/steve/iCloudDrive/desktop/leetcode-sh/luffy/10-lc-0303-range-sum-query-immutable.py)\n\n---\n\n## 1. Problem Overview & Core Strategy\n\nPrecompute prefix sums: query(i, j) = prefix[j+1] - prefix[i] in O(1).\n\n---\n\n## 2. Key Algorithmic Steps\n\n1. **Initialization**: Set up required variables, pointers, hash maps, or queues.\n2. **State Transition / Traversal**: Process elements iteratively or recursively while maintaining invariant states.\n3. **Result Calculation & Return**: Return optimal answer.\n\n---\n\n## 3. Complexity Analysis\n\n- **Time Complexity:** Optimal based on algorithm constraint.\n- **Space Complexity:** Controlled within minimal required auxiliary space.\n", "code": "from typing import List\nclass NumArray:\n\n    def __init__(self, nums: List[int]):\n        self.nums = nums\n\n\n        \n\n    def sumRange(self, left: int, right: int) -> int: #general way\n        my_sum = 0\n        for i in range(left, right+1):\n            my_sum +=self.nums[i]\n        return my_sum\n            \n\n\nif __name__ == '__main__':\n    a=NumArray([0,1,2,3,4,5,6])\n    a.sumRange(0,2)\n\n\n        \n\n\n# Your NumArray object will be instantiated and called as such:\n# obj = NumArray(nums)\n# param_1 = obj.sumRange(left,right)", "diff": "Easy", "py_file": "luffy/10-lc-0303-range-sum-query-immutable.py", "md_file": "luffy/10-lc-0303-range-sum-query-immutable.md"}, "luffy/10-oop-pre-main-practice": {"key": "luffy/10-oop-pre-main-practice", "category": "\ud83d\udcda Luffy Curriculum (01-42)", "title": "\ud83d\udcda Luffy Curriculum (01-42): 10 oop pre main practice", "short": "10 oop pre main practice", "path": "luffy/10-oop-pre-main-practice", "type": "problem", "notes": "# OOP Foundations Practice\n## Problem Walkthrough & Solution Notes\n\n- **Difficulty:** Easy\n- **Category:** Luffy Structured Curriculum\n- **Core Technique:** Object-Oriented Programming\n- **Corresponding Python File:** [`luffy/10-oop-pre-main-practice.py`](file:///mnt/c/Users/steve/iCloudDrive/desktop/leetcode-sh/luffy/10-oop-pre-main-practice.py)\n\n---\n\n## 1. Problem Overview & Core Strategy\n\nClasses, methods, and instance state management.\n\n---\n\n## 2. Key Algorithmic Steps\n\n1. **Initialization**: Set up required variables, pointers, hash maps, or queues.\n2. **State Transition / Traversal**: Process elements iteratively or recursively while maintaining invariant states.\n3. **Result Calculation & Return**: Return optimal answer.\n\n---\n\n## 3. Complexity Analysis\n\n- **Time Complexity:** Optimal based on algorithm constraint.\n- **Space Complexity:** Controlled within minimal required auxiliary space.\n", "code": "from  car import Car\n\n\ncar_1 = Car(\"Toyota\", \"Camry\", 2020, \"Blue\")\n\nprint(car_1.make)\nprint(car_1.model)\nprint(car_1.year)\nprint(car_1.color)\n\n\ncar_1.drive()\ncar_1.stop()\n", "diff": "Easy", "py_file": "luffy/10-oop-pre-main-practice.py", "md_file": "luffy/10-oop-pre-main-practice.md"}, "luffy/11-lc-0560-subarray-sum-equals-k": {"key": "luffy/11-lc-0560-subarray-sum-equals-k", "category": "\ud83d\udcda Luffy Curriculum (01-42)", "title": "\ud83d\udcda Luffy Curriculum (01-42): 11 LC 0560 subarray sum equals k", "short"
