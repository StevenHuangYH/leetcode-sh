list.\n  * Delete the given node. Note that by deleting the node, we do not mean removing it from memory. We mean:\n    * The value of the given node should not exist in the linked list.\n    * The number of nodes in the linked list should decrease by one.\n    * All the values before `node` should be in the same order.\n    * All the values after `node` should be in the same order.\n* **[CN]** \u6709\u4e00\u4e2a\u5355\u94fe\u8868\u7684 `head`\uff0c\u6211\u4eec\u60f3\u5220\u9664\u5b83\u5176\u4e2d\u7684\u4e00\u4e2a\u8282\u70b9 `node`\u3002\n  * \u7ed9\u4f60\u60f3\u5220\u9664\u7684\u8282\u70b9 `node` \u3002\u4f60\u5c06 **\u65e0\u6cd5\u8bbf\u95ee** \u7b2c\u4e00\u4e2a\u8282\u70b9 `head`\u3002\n  * \u94fe\u8868\u7684\u6240\u6709\u8282\u70b9\u7684\u503c\u90fd\u662f **\u552f\u4e00** \u7684\uff0c\u5e76\u4e14\u53ef\u4ee5\u4fdd\u8bc1\u7ed9\u5b9a\u7684\u8282\u70b9 `node` **\u4e0d\u662f\u94fe\u8868\u4e2d\u7684\u6700\u540e\u4e00\u4e2a\u8282\u70b9**\u3002\n  * \u5220\u9664\u7ed9\u5b9a\u7684\u8282\u70b9\u3002\u8bf7\u6ce8\u610f\uff0c\u5220\u9664\u8282\u70b9\u5e76\u4e0d\u662f\u6307\u4ece\u5185\u5b58\u4e2d\u5220\u9664\u5b83\u3002\u8fd9\u91cc\u7684\u610f\u601d\u662f\uff1a\n    * \u7ed9\u5b9a\u8282\u70b9\u7684\u503c\u4e0d\u5e94\u8be5\u5b58\u5728\u4e8e\u94fe\u8868\u4e2d\u3002\n    * \u94fe\u8868\u4e2d\u7684\u8282\u70b9\u6570\u5e94\u8be5\u51cf\u5c11 1\u3002\n    * `node` \u524d\u9762\u7684\u6240\u6709\u503c\u987a\u5e8f\u76f8\u540c\u3002\n    * `node` \u540e\u9762\u7684\u6240\u6709\u503c\u987a\u5e8f\u76f8\u540c\u3002\n\n### Constraints / \u7ea6\u675f\u6761\u4ef6\n* \u94fe\u8868\u4e2d\u8282\u70b9\u7684\u6570\u76ee\u8303\u56f4\u662f $[2, 1000]$\n* $-1000 \\le \\text{Node.val} \\le 1000$\n* \u94fe\u8868\u4e2d\u6bcf\u4e2a\u8282\u70b9\u7684\u503c\u90fd\u662f **\u552f\u4e00** \u7684\n* \u9700\u8981\u5220\u9664\u7684\u8282\u70b9 `node` \u662f\u94fe\u8868\u4e2d\u7684\u4e00\u4e2a **\u6709\u6548\u8282\u70b9** \uff0c\u4e14 **\u4e0d\u662f\u5c3e\u8282\u70b9**\n\n---\n\n## 2. Problem Blueprint & Core Invariant / \u9898\u610f\u8003\u70b9\u84dd\u56fe\u4e0e\u6838\u5fc3\u4e0d\u53d8\u91cf\n\n```\n\u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n\u2502 \ud83c\udfaf \u8003\u8bd5\u4e0e\u9762\u8bd5\u8003\u5bdf\u6838\u5fc3\u84dd\u56fe (Interview Blueprint)                             \u2502\n\u251c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2524\n\u2502 1. \u7ecf\u5178\u7834\u5c40\u601d\u7ef4\u8f6c\u53d8 (Paradigm Shift):                                       \u2502\n\u2502    \u2022 \u4f20\u7edf\u5220\u9664: \u9700\u8981\u524d\u9a71\u6307\u9488 pre\uff0c\u6267\u884c pre.next = cur.next\u3002                 \u2502\n\u2502    \u2022 \u65e0\u524d\u9a71\u5220\u9664: \u5c06\u540e\u7ee7\u8282\u70b9\u7684\u503c\u590d\u5236\u8fc7\u6765 (\u501f\u5c38\u8fd8\u9b42)\uff0c\u7136\u540e\u5220\u9664\u771f\u6b63\u7684\u540e\u7ee7\u8282\u70b9\u3002 \u2502\n\u2502 2. \u66ff\u7f6a\u7f8a\u6a21\u578b (The Scapegoat Pattern):                                      \u2502\n\u2502    \u2022 node.val = node.next.val   (\u628a\u4e0b\u4e00\u4e2a\u8282\u70b9\u7684\u503c\u5077\u8fc7\u6765\u4f2a\u88c5\u6210\u81ea\u5df1)          \u2502\n\u2502    \u2022 node.next = node.next.next (\u628a\u4e0b\u4e00\u4e2a\u8282\u70b9\u67b6\u7a7a\u8df3\u8fc7\u5e76\u79fb\u9664)                \u2502\n\u2502 3. \u7ea6\u675f\u524d\u63d0: \u9898\u76ee\u660e\u786e\u4fdd\u8bc1 node \u4e0d\u662f\u5c3e\u8282\u70b9 (node.next \u7edd\u4e0d\u4e3a None)\u3002         \u2502\n\u2502 4. \u6781\u81f4\u65f6\u7a7a: \u4e25\u683c O(1) \u65f6\u95f4\uff0cO(1) \u7a7a\u95f4\u3002                                    \u2502\n\u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n```\n\n---\n\n## 3. Core Idea, Mental Model & Pattern Lineage / \u6838\u5fc3\u601d\u8def\u4e0e\u601d\u7ef4\u8c31\u7cfb\n\n### \ud83e\udde0 \u94fe\u8868\u5220\u9664\u64cd\u4f5c\u601d\u7ef4\u8c31\u7cfb\u6f14\u5316\u6811 (Pattern Lineage)\n\n```\n\u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n\u2502 \ud83e\udde0 Linked List Deletion Pattern Lineage (\u94fe\u8868\u5220\u9664\u601d\u7ef4\u8c31\u7cfb\u6f14\u5316\u6811)             \u2502\n\u251c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2524\n\u2502                                                                             \u2502\n\u2502  Level 1 (Standard): LC 203 Remove Linked List Elements                     \u2502\n\u2502  \u2514\u2500 \u4e0d\u53d8\u91cf (Invariant): \u6709 head \u6307\u9488\uff0c\u54e8\u5175 dummy \u7ef4\u62a4\u524d\u9a71 pre.next = cur.next\u2502\n\u2502        \u2502                                                                    \u2502\n\u2502        \u25bc [\u6f14\u8fdb Twist: \u5012\u6570\u7b2c N \u4e2a\u8282\u70b9\u5220\u9664\uff0c\u53cc\u6307\u9488\u9884\u5148\u62c9\u5f00\u95f4\u8ddd]              \u2502\n\u2502  Level 2 (Two Pointers): LC 19 Remove Nth Node From End of List             \u2502\n\u2502  \u2514\u2500 \u4e0d\u53d8\u91cf (Invariant): \u5feb\u6307\u9488\u5148\u8d70 N \u6b65\u5b9a\u4f4d\u5f85\u5220\u8282\u70b9\u7684\u524d\u9a71\uff0c\u518d\u505a\u67b6\u7a7a\u3002        \u2502\n\u2502        \u2502                                                                    \u2502\n\u2502        \u25bc [\u6f14\u8fdb Twist: \u65e0 head \u8bbf\u95ee\u6743\uff0c\u65e0\u6cd5\u5bfb\u5740\u524d\u9a71 (\u672c\u9898 \u2605)]                \u2502\n\u2502  Level 3 (Scapegoat): LC 237 Delete Node in a Linked List                   \u2502\n\u2502  \u2514\u2500 \u4e0d\u53d8\u91cf (Invariant): \u66ff\u7f6a\u7f8a\u8986\u5199\u503c + \u8de8\u8fc7\u7269\u7406\u540e\u7ee7\u8282\u70b9 (node.val = nxt.val) \u2502\n\u2502                                                                             \u2502\n\u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n```\n\n---\n\n### \ud83d\udca1 \u6838\u5fc3\u673a\u5236\uff1a\u201c\u66ff\u7f6a\u7f8a / \u501f\u5c38\u8fd8\u9b42\u201d ASCII \u56fe\u89e3\n\n\u5047\u8bbe\u539f\u94fe\u8868\u4e3a `[4] -> [5] -> [1] -> [9]`\uff0c\u9700\u8981\u5220\u9664\u8282\u70b9 `[5]`\uff08\u6211\u4eec\u53ea\u62ff\u5230\u4e86\u6307\u5411 `[5]` \u7684\u6307\u9488 `node`\uff0c\u65e0\u6cd5\u8bbf\u95ee\u524d\u9762\u7684 `[4]`\uff09\uff1a\n\n```\n\u521d\u59cb\u72b6\u6001 (Initial):\n    [4] \u2500\u2500\u25ba [5] \u2500\u2500\u25ba [1] \u2500\u2500\u25ba [9] \u2500\u2500\u25ba None\n             \u25b2\n            node (\u5f85\u5220\u9664)\n\n\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n\u6b65\u9aa4 1\uff1a\u6570\u503c\u8986\u5199 (node.val = node.next.val)\n\u5c06\u4e0b\u4e00\u4e2a\u8282\u70b9 [1] \u7684\u503c\u590d\u5236\u5230\u5f53\u524d\u8282\u70b9 [5] \u4e0a\uff1a\n    [4] \u2500\u2500\u25ba [1] \u2500\u2500\u25ba [1] \u2500\u2500\u25ba [9] \u2500\u2500\u25ba None\n             \u25b2       \u25b2\n            node   node.next\n\n\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n\u6b65\u9aa4 2\uff1a\u8df3\u8fc7\u771f\u6b63\u7684\u540e\u7ee7\u8282\u70b9 (node.next = node.next.next)\n\u5c06\u5f53\u524d\u8282\u70b9\u76f4\u63a5\u8fde\u63a5\u5230\u4e0b\u4e0b\u4e2a\u8282\u70b9 [9]\uff0c\u67b6\u7a7a\u539f\u5148\u7684 [1]\uff1a\n    [4] \u2500\u2500\u25ba [1] \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u25ba [9] \u2500\u2500\u25ba None\n             \u25b2\n            node (\u73b0\u5728\u8868\u73b0\u4e3a\u503c 1)\n\n\u7ed3\u679c\uff1a\u94fe\u8868\u53d8\u4e3a [4] -> [1] -> [9]\uff0c\u8282\u70b9 [5] \u88ab\u6210\u529f\u201c\u5220\u9664\u201d\uff01\n```\n\n---\n\n## 4. Step-by-Step Code Walkthrough / \u4ee3\u7801\u9010\u884c\u8be6\u89e3\n\n\u57fa\u4e8e\u4f60\u5728 `daily-practice/lc-0237-delete-node-in-a-linked-list.py` \u4e2d\u7684\u6807\u51c6\u5b9e\u73b0\uff1a\n\n```python\n# Definition for singly-linked list.\nclass ListNode:\n    def __init__(self, x):\n        self.val = x\n        self.next = None\n\nclass Solution:\n    def deleteNode(self, node):\n        \"\"\"\n        :type node: ListNode\n        :rtype: void Do not return anything, modify node in-place instead.\n        \"\"\"\n```\n\n---\n\n```python\n        node.val = node.next.val\n```\n\n* **[EN] Action:** Copies the value of the succeeding node (`node.next.val`) into the current node (`node.val`).\n  * **Mental Model:** The current node disguises itself as the next node.\n* **[CN] \u52a8\u4f5c**\uff1a\u5c06\u540e\u7ee7\u8282\u70b9\u7684\u503c `node.next.val` \u8986\u5199\u5230\u5f53\u524d\u8282\u70b9 `node.val`\u3002\n  * **\u601d\u7ef4\u6a21\u578b**\uff1a\u5f53\u524d\u8282\u70b9\u5c06\u81ea\u8eab\u7684\u503c\u66ff\u6362\u4e3a\u4e0b\u4e00\u4e2a\u8282\u70b9\u7684\u503c\uff0c\u5b8c\u6210\u201c\u8eab\u4efd\u4f2a\u88c5\u201d\u3002\n\n---\n\n```python\n        node.next = node.next.next\n```\n\n* **[EN] Action:** Bypasses the next node by pointing `node.next` directly to `node.next.next`.\n  * **Result:** The original successor node is decoupled from the linked list, effectively deleting it from the sequence.\n* **[CN] \u52a8\u4f5c**\uff1a\u5c06\u5f53\u524d\u8282\u70b9\u7684 `next` \u6307\u9488\u8de8\u8fc7\u7d27\u90bb\u7684\u540e\u7ee7\u8282\u70b9\uff0c\u76f4\u63a5\u6307\u5411\u4e0b\u4e0b\u4e2a\u8282\u70b9 `node.next.next`\u3002\n  * **\u7ed3\u679c**\uff1a\u539f\u672c\u7684\u540e\u7ee7\u8282\u70b9\u88ab\u5f7b\u5e95\u79fb\u51fa\u94fe\u8868\u62d3\u6251\uff0c\u4ece\u800c\u4f7f\u5f97\u5f53\u524d\u8282\u70b9\u6210\u529f\u66ff\u6362\u4e86\u540e\u7ee7\u8282\u70b9\u5e76\u5b8c\u6210\u4e86\u8282\u70b9\u5220\u9664\u3002\n\n---\n\n## 5. Interview Simulation & Follow-Up Pivots / \u9762\u8bd5\u5b98\u73b0\u573a\u8ffd\u95ee\u6f14\u7ec3\n\n### \ud83c\udfa4 \u8ffd\u95ee 1\uff1a\u5982\u679c\u5f85\u5220\u9664\u7684\u8282\u70b9\u6070\u597d\u662f\u94fe\u8868\u7684\u6700\u540e\u4e00\u4e2a\u5c3e\u8282\u70b9\uff0c\u8fd9\u4e2a\u7b97\u6cd5\u8fd8\u80fd\u5de5\u4f5c\u5417\uff1f\n\n* **\u9762\u8bd5\u5b98\u610f\u56fe**\uff1a\u8003\u5bdf\u5019\u9009\u4eba\u5bf9\u8fb9\u754c\u7ea6\u675f\u4e0e\u6570\u636e\u7ed3\u6784\u7269\u7406\u672c\u8d28\u7684\u8ba4\u77e5\u6df1\u5ea6\u3002\n* **\u5256\u6790\u4e0e\u89e3\u7b54**\uff1a\n  * **\u4e0d\u80fd\u5de5\u4f5c**\u3002\u56e0\u4e3a\u5982\u679c `node` \u662f\u5c3e\u8282\u70b9\uff0c`node.next` \u4e3a `None`\uff0c\u6267\u884c `node.next.val` \u4f1a\u76f4\u63a5\u629b\u51fa `AttributeError: 'NoneType' object has no attribute 'val'`\u3002\n  * **\u66f4\u6df1\u5c42\u539f\u56e0**\uff1a\u5728**\u5355\u5411\u94fe\u8868**\u4e2d\uff0c\u5982\u679c\u4e0d\u7ed9\u5934\u8282\u70b9 `head`\uff0c\u4e14\u5f85\u5220\u9664\u8282\u70b9\u662f\u5c3e\u8282\u70b9\uff0c**\u5728\u6570\u5b66\u4e0a\u662f\u7edd\u5bf9\u65e0\u6cd5\u4ee5 $\\mathcal{O}(1)$ \u65f6\u95f4\u5220\u9664\u8be5\u8282\u70b9\u7684**\uff08\u56e0\u4e3a\u6ca1\u6709\u524d\u9a71\u5f15\u7528\u5c06\u5012\u6570\u7b2c\u4e8c\u4e2a\u8282\u70b9\u7684 `.next` \u7f6e\u4e3a `None`\uff09\u3002\n  * \u9898\u76ee\u6b63\u662f\u56e0\u6b64\u660e\u786e\u52a0\u5165\u4e86\u7ea6\u675f\uff1a*\u201c\u4fdd\u8bc1\u7ed9\u5b9a\u7684\u8282\u70b9 `node` \u4e0d\u662f\u5c3e\u8282\u70b9\u201d*\u3002\n\n---\n\n### \ud83c\udfa4 \u8ffd\u95ee 2\uff1a\u5728 C++ \u6216\u5e95\u5c42\u8bed\u8a00\u4e2d\uff0c\u8fd9\u79cd\u201c\u66ff\u7f6a\u7f8a\u201d\u5199\u6cd5\u4f1a\u6709\u5185\u5b58\u6cc4\u6f0f\u98ce\u9669\u5417\uff1f\n\n* **\u9762\u8bd5\u5b98\u610f\u56fe**\uff1a\u8003\u5bdf\u5de5\u7a0b\u843d\u5730\u4e2d\u7684\u5185\u5b58\u7ba1\u7406\uff08Memory Management\uff09\u3002\n* **\u5de5\u7a0b\u9632\u7ebf**\uff1a\n  * \u5728 Python \u4e2d\uff0c\u7531\u4e8e\u5783\u573e\u56de\u6536\u673a\u5236\uff08\u5f15\u7528\u8ba1\u6570 Reference Counting\uff09\uff0c\u88ab\u67b6\u7a7a\u7684\u540e\u7ee7\u8282\u70b9\u56e0\u5f15\u7528\u5f52\u96f6\u4f1a\u88ab GC \u81ea\u52a8\u56de\u6536\u3002\n  * \u4f46\u5728 **C++ / C** \u4e2d\uff0c\u76f4\u63a5 `node->next = node->next->next` \u4f1a\u5bfc\u81f4\u539f\u540e\u7ee7\u8282\u70b9\u7684\u5806\u5185\u5b58\u5f7b\u5e95\u5931\u8054\u5e76**\u9020\u6210\u5185\u5b58\u6cc4\u6f0f**\uff01\n  * **C++ \u6807\u51c6\u5b89\u5168\u5199\u6cd5**\uff1a\n    ```cpp\n    void deleteNode(ListNode* node) {\n        ListNode* next_node = node->next;\n        node->val = next_node->val;\n        node->next = next_node->next;\n        delete next_node; // \u663e\u5f0f\u91ca\u653e\u88ab\u67b6\u7a7a\u8282\u70b9\u7684\u5185\u5b58\n    }\n    ```\n\n---\n\n### \ud83c\udfa4 \u8ffd\u95ee 3\uff1a\u5982\u679c\u5916\u90e8\u5176\u4ed6\u7cfb\u7edf\u6301\u6709\u4e86\u88ab\u5220\u8282\u70b9\u7684\u6307\u9488/\u5f15\u7528\uff0c\u8fd9\u79cd\u8986\u5199\u503c\u7684\u65b9\u5f0f\u4f1a\u6709\u526f\u4f5c\u7528\u5417\uff1f\n\n* **\u9762\u8bd5\u5b98\u610f\u56fe**\uff1a\u8003\u5bdf\u5bf9\u201c\u5bf9\u8c61\u540c\u4e00\u6027 (Identity) \u4e0e\u4e0d\u53d8\u6027 (Immutability)\u201d\u7684\u5e76\u53d1/\u7cfb\u7edf\u67b6\u6784\u8ba4\u77e5\u3002\n* **\u526f\u4f5c\u7528\u5206\u6790**\uff1a\n  * \u82e5\u5916\u754c\u5176\u4ed6\u53d8\u91cf\u6301\u6709\u4e86 `node` \u7684\u5f15\u7528\uff0c\u5728\u6267\u884c\u8986\u5199\u540e\uff0c\u5916\u754c\u770b\u5230\u7684 `node.val` \u53d1\u751f\u4e86\u53d8\u5316\uff08\u53d8\u6210\u4e86\u4e0b\u4e00\u4e2a\u8282\u70b9\u7684\u503c\uff09\uff0c\u53ef\u80fd\u7834\u574f\u8c03\u7528\u65b9\u7684\u6570\u636e\u4e00\u81f4\u6027\u3002\n  * \u82e5\u5916\u754c\u6301\u6709\u4e86 `node.next` \u7684\u5f15\u7528\uff0c\u8be5\u5bf9\u8c61\u5728\u903b\u8f91\u4e0a\u5df2\u88ab\u5220\u9664\uff0c\u4f46\u5b9e\u9645\u4ecd\u7136\u72ec\u7acb\u5b58\u6d3b\u3002\n  * \u56e0\u6b64\u5728\u4e25\u8c28\u7684\u5de5\u4e1a\u7ea7\u7cfb\u7edf\u8bbe\u8ba1\u4e2d\uff0c\u63a8\u8350\u901a\u8fc7\u5305\u542b `head` \u7684\u6807\u51c6\u8fed\u4ee3\u5220\u9664\u4fdd\u6301\u5bf9\u8c61\u7269\u7406\u5b9e\u4f53\u7684\u7eaf\u6d01\u6027\u3002\n\n---\n\n## 6. The Error Log & Dry-Run / \u9519\u9898\u6392\u67e5\u4e0e\u5b9e\u4f8b\u63a8\u6f14\n\n### \u26a0\ufe0f \u9519\u9898\u6392\u67e5\u4e0e\u53cd\u6a21\u5f0f\u8bca\u65ad (The Error Log: Anti-Patterns & Defensive Fixes)\n\n```\n\u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n\u2502 \u26a0\ufe0f \u53cd\u6a21\u5f0f 1\uff1a\u8bef\u4ee5\u4e3a\u4fee\u6539\u5c40\u90e8\u53d8\u91cf\u5f15\u7528\u5373\u53ef\u6539\u53d8\u94fe\u8868\u62d3\u6251 `node = node.next`                                     \u2502\n\u251c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2524\n\u2502 \u274c \u9519\u8bef\u5199\u6cd5:                                                                                                \u2502\n\u2502    node = node.next  # \u81f4\u547d\uff1a\u8fd9\u4ec5\u4ec5\u6539\u53d8\u4e86\u51fd\u6570\u5185\u90e8\u5c40\u90e8\u53d8\u91cf node \u7684\u6307\u5411\uff0c\u94fe\u8868\u672c\u8eab\u7684\u4efb\u4f55\u8282\u70b9\u5747\u672a\u88ab\u4fee\u6539\uff01      \u2502\n\u2502                                                                                                             \u2502\n\u2502 \ud83c\udfaf \u7ffb\u8f66\u673a\u7406 (Root Cause):                                                                                   \u2502\n\u2502    Python \u4e2d\u53c2\u6570\u4f20\u9012\u662f\u201c\u5bf9\u8c61\u7684\u5f15\u7528\u4f20\u9012\u201d\uff08Pass by Object Reference\uff09\u3002\u91cd\u65b0\u7ed9\u5f62\u53c2\u8d4b\u503c\u53ea\u662f\u89e3\u9664\u4e86\u5f62\u53c2\u7ed1\u5b9a\uff0c     \u2502\n\u2502    \u6ca1\u6709\u4fee\u6539\u5bf9\u8c61\u5c5e\u6027\uff08\u5982 node.val \u6216 node.next\uff09\u3002                                                          \u2502\n\u2502                                                                                                             \u2502\n\u2502 \ud83d\udee1\ufe0f \u9632\u5fa1\u53e3\u8bc0 (Invariant):                                                                                   \u2502\n\u2502    \u3010\u6539\u5c5e\u6027\u800c\u975e\u6539\u53d8\u91cf\u3011\uff1a\u u7f8e\u5951\u5408\u9898\u610f\uff09\u3002\n\n---\n\n### \ud83c\udfa8 \u52a8\u6001\u6307\u9488\u6ed1\u79fb\u5168\u6d41\u7a0b ASCII \u56fe\u89e3\n\n```\n\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\nCase 1: \u5947\u6570\u94fe\u8868 [1, 2, 3, 4, 5] (n = 5)\n\u521d\u59cb:   [1] -> [2] -> [3] -> [4] -> [5] -> None\n        s,f\nStep 1: [1] -> [2] -> [3] -> [4] -> [5] -> None\n                s      f\nStep 2: [1] -> [2] -> [3] -> [4] -> [5] -> None\n                       s             f (fast.next is None, \u7ec8\u6b62!)\n\u7ed3\u679c: \u8fd4\u56de slow \u6307\u5411\u7684 [3]\n\n\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\nCase 2: \u5076\u6570\u94fe\u8868 [1, 2, 3, 4, 5, 6] (n = 6)\n\u521d\u59cb:   [1] -> [2] -> [3] -> [4] -> [5] -> [6] -> None\n        s,f\nStep 1: [1] -> [2] -> [3] -> [4] -> [5] -> [6] -> None\n                s      f\nStep 2: [1] -> [2] -> [3] -> [4] -> [5] -> [6] -> None\n                       s             f\nStep 3: [1] -> [2] -> [3] -> [4] -> [5] -> [6] -> None\n                              s                    f=None (fast is None, \u7ec8\u6b62!)\n\u7ed3\u679c: \u8fd4\u56de slow \u6307\u5411\u7684 [4] (\u7b2c\u4e8c\u4e2a\u4e2d\u70b9)\n```\n\n---\n\n## 4. Step-by-Step Code Walkthrough / \u4ee3\u7801\u9010\u884c\u8be6\u89e3\n\n\u57fa\u4e8e\u4f60\u5728 `daily-practice/lc-0876-middle-of-the-linked-list.py` \u4e2d\u7684\u7ecf\u5178\u5b9e\u73b0\uff1a\n\n```python\n# Definition for singly-linked list.\nclass ListNode:\n    def __init__(self, val=0, next=None):\n        self.val = val\n        self.next = next\n\nfrom typing import Optional\n\nclass Solution:\n    def middleNode(self, head: Optional[ListNode]) -> Optional[ListNode]:\n```\n\n---\n\n```python\n        slow = head\n        fast = head\n```\n\n* **[EN] Action:** Initializes both `slow` and `fast` pointers at the `head` node.\n  * **Invariant:** At start ($t=0$), distance traveled by `slow` is $0$, distance traveled by `fast` is $0$.\n* **[CN] \u52a8\u4f5c**\uff1a\u5c06\u5feb\u6162\u4e24\u4e2a\u6307\u9488 `slow` \u548c `fast` \u540c\u65f6\u521d\u59cb\u5316\u5728\u94fe\u8868\u7684\u5934\u8282\u70b9 `head`\u3002\n  * **\u4e0d\u53d8\u91cf**\uff1a\u521d\u59cb\u65f6\u523b\u4e24\u8005\u5747\u4f4d\u4e8e\u539f\u70b9\uff0c\u6b65\u957f\u6bd4\u6ee1\u8db3 $2:1$ \u7684\u524d\u63d0\u6761\u4ef6\u3002\n\n---\n\n```python\n        while fast and fast.next:\n            slow = slow.next\n            fast = fast.next.next\n```\n\n* **[EN] Action:** Traverses the list with two different speeds until `fast` reaches the end.\n  * **Guard Condition `while fast and fast.next`:** \n    * `fast` checks if the current fast pointer is valid (handles even lengths when `fast` lands on `None`).\n    * `fast.next` ensures `fast.next.next` will not raise an `AttributeError` (handles odd lengths when `fast` lands on the last node).\n  * **Pointer Advances:** `slow` moves forward by 1 step, while `fast` moves forward by 2 steps.\n* **[CN] \u52a8\u4f5c**\uff1a\u4e24\u6307\u9488\u4ee5\u4e0d\u540c\u901f\u7387\u5411\u524d\u63a8\u8fdb\uff0c\u76f4\u5230\u5feb\u6307\u9488\u89e6\u5e95\u3002\n  * **\u53cc\u91cd\u9632\u5fa1\u6761\u4ef6 `while fast and fast.next`**\uff1a\n    * `fast`\uff1a\u786e\u4fdd\u5f53\u524d\u5feb\u6307\u9488\u6709\u6548\uff0c\u9632\u6b62\u5076\u6570\u957f\u5ea6\u4e0b `fast` \u5df2\u7ecf\u8df3\u51fa\u94fe\u8868\uff08\u5230\u8fbe `None`\uff09\u65f6\u7ee7\u7eed\u8bbf\u95ee\u5f15\u53d1\u7a7a\u6307\u9488\u9519\u8bef\u3002\n    * `fast.next`\uff1a\u786e\u4fdd\u5feb\u6307\u9488\u5b58\u5728\u4e0b\u4e00\u4e2a\u8282\u70b9\uff0c\u9632\u6b62\u5947\u6570\u957f\u5ea6\u4e0b\u5728\u6700\u540e\u4e00\u4e2a\u8282\u70b9\u6267\u884c `fast.next.next` \u65f6\u5f15\u53d1 `AttributeError: 'NoneType' object has no attribute 'next'`\u3002\n  * **\u6b65\u8fdb\u64cd\u4f5c**\uff1a\u6162\u6307\u9488\u524d\u8fdb\u4e00\u6b65\uff08`slow = slow.next`\uff09\uff0c\u5feb\u6307\u9488\u524d\u8fdb\u4e24\u6b65\uff08`fast = fast.next.next`\uff09\u3002\n\n---\n\n```python\n        return slow\n```\n\n* **[EN] Action:** Returns `slow`, which is guaranteed to be pointing to the middle node (or second middle node for even lengths).\n* **[CN] \u52a8\u4f5c**\uff1a\u8fd4\u56de\u6b64\u65f6\u7684\u6162\u6307\u9488 `slow`\uff0c\u8be5\u8282\u70b9\u5373\u4e3a\u94fe\u8868\u7684\u4e2d\u70b9\u3002\n\n---\n\n## 5. Interview Simulation & Follow-Up Pivots / \u9762\u8bd5\u5b98\u73b0\u573a\u8ffd\u95ee\u6f14\u7ec3\n\n### \ud83c\udfa4 \u8ffd\u95ee 1\uff1a\u5982\u679c\u9762\u8bd5\u5b98\u8981\u6c42\u201c\u5bf9\u4e8e\u5076\u6570\u957f\u5ea6\u94fe\u8868\uff0c\u8fd4\u56de\u3010\u7b2c\u4e00\u4e2a\u3011\u4e2d\u95f4\u7ed3\u70b9\uff08\u5de6\u4e2d\u70b9\uff09\u201d\uff0c\u4ee3\u7801\u5e94\u8be5\u5982\u4f55\u4fee\u6539\uff1f\n\n* **\u9762\u8bd5\u5b98\u610f\u56fe**\uff1a\u8003\u5bdf\u4f60\u5bf9\u5feb\u6162\u6307\u9488\u8fb9\u754c\u6761\u4ef6\u7684\u7edd\u5bf9\u638c\u63a7\u529b\u3002\u5728 **LeetCode 148 (\u94fe\u8868\u5f52\u5e76\u6392\u5e8f)** \u548c **LeetCode 143 (\u91cd\u6392\u94fe\u8868)** \u4e2d\uff0c\u6211\u4eec\u9700\u8981\u4ece\u4e2d\u70b9\u5c06\u94fe\u8868\u65ad\u5f00\u6210\u524d\u540e\u4e24\u534a\uff0c\u6b64\u65f6\u5fc5\u987b\u5b9a\u4f4d\u5728 **\u5de6\u4e2d\u70b9 (First Middle)** \u624d\u80fd\u6b63\u786e\u65ad\u5f00\uff01\n* **\u7834\u5c40\u89e3\u6cd5 1\uff08\u6539\u53d8\u5faa\u73af\u7ec8\u6b62\u6761\u4ef6 - \u5e38\u7528\u63a8\u8350\uff09**\uff1a\n  ```python\n  # \u5b9a\u4f4d\u5de6\u4e2d\u70b9 (First Middle Node: [1,2,3,4,5,6] -> \u505c\u5728 3)\n  class SolutionFirstMiddle:\n      def middleNode(self, head: Optional[ListNode]) -> Optional[ListNode]:\n          slow = head\n          fast = head\n          # \u4ec5\u5f53\u524d\u65b9\u81f3\u5c11\u8fd8\u6709\u4e24\u4e2a\u8282\u70b9\u65f6\u624d\u7ee7\u7eed\u524d\u8fdb\n          while fast.next and fast.next.next:\n              slow = slow.next\n              fast = fast.next.next\n          return slow\n  ```\n* **\u7834\u5c40\u89e3\u6cd5 2\uff08\u8ba9\u5feb\u6307\u9488\u9886\u5148\u4e00\u6b65\u51fa\u53d1\uff09**\uff1a\n  ```python\n  class SolutionFirstMiddleFastAhead:\n      def middleNode(self, head: Optional[ListNode]) -> Optional[ListNode]:\n          slow = head\n          fast = head.next  # fast \u63d0\u524d\u9886\u5148\u4e00\u6b65\n          while fast and fast.next:\n              slow = slow.next\n              fast = fast.next.next\n          return slow\n  ```\n\n---\n\n### \ud83c\udfa4 \u8ffd\u95ee 2\uff1a\u9664\u4e86\u5feb\u6162\u53cc\u6307\u9488\uff0c\u8fd8\u6709\u54ea\u4e9b\u89e3\u6cd5\uff1f\u5404\u6709\u4ec0\u4e48\u4f18\u7f3a\u70b9\uff1f\n\n* **\u9762\u8bd5\u5b98\u610f\u56fe**\uff1a\u8003\u5bdf\u5bf9\u4e0d\u540c\u89e3\u6cd5\u5728\u65f6\u7a7a\u590d\u6742\u5ea6\u3001\u5185\u5b58\u5206\u914d\u3001\u4ee5\u53ca\u904d\u5386\u8d9f\u6570\u4e0a\u7684\u6743\u8861\u5bf9\u6bd4\u3002\n\n```python\n# \u8303\u5f0f 2: \u6570\u7ec4\u8f85\u52a9\u7a7a\u95f4\u6cd5 (Array Lookup - O(n) Space)\nclass SolutionArray:\n    def middleNode(self, head: Optional[ListNode]) -> Optional[ListNode]:\n        arr = []\n        cur = head\n        while cur:\n            arr.append(cur)\n            cur = cur.next\n        return arr[len(arr) // 2]\n```\n\n```python\n# \u8303\u5f0f 3: \u8ba1\u6570\u4e24\u8d9f\u904d\u5386\u6cd5 (Two-Pass Counting - O(1) Space, 2 Passes)\nclass SolutionTwoPass:\n    def middleNode(self, head: Optional[ListNode]) -> Optional[ListNode]:\n        n = 0\n        cur = head\n        while cur:\n            n += 1\n            cur = cur.next\n        \n        cur = head\n        for _ in range(n // 2):\n            cur = cur.next\n        return cur\n```\n\n---\n\n### \ud83d\udcca \u7b97\u6cd5\u8303\u5f0f\u6a2a\u5411\u5bf9\u6bd4\u77e9\u9635\n\n| \u7ef4\u5ea6 | \u8303\u5f0f 1\uff1a\u5feb\u6162\u53cc\u6307\u9488 (\u5f53\u524d\u89e3\u6cd5 - \u6700\u4f18) | \u8303\u5f0f 2\uff1a\u6570\u7ec4\u8f85\u52a9\u6620\u5c04 (Array Index) | \u8303\u5f0f 3\uff1a\u957f\u5ea6\u8ba1\u6570\u4e24\u8d9f\u904d\u5386 (Two-Pass) |\n| :--- | :--- | :--- | :--- |\n| **\u6838\u5fc3\u673a\u5236** | $2:1$ \u901f\u7387\u5dee\uff0c\u5355\u8d9f\u4e00\u6b21\u626b\u63cf\u5230\u8fbe\u4e2d\u70b9 | \u5b58\u5165 Python \u5217\u8868\uff0c\u76f4\u63a5\u6839\u636e\u4e0b\u6807 `len//2` \u8bbf\u95ee | \u7b2c 1 \u8d9f\u7edf\u8ba1\u603b\u957f $n$\uff0c\u7b2c 2 \u8d9f\u8d70 $n//2$ \u6b65 |\n| **\u7a7a\u95f4\u590d\u6742\u5ea6** | $\\mathcal{O}(1)$ (\u4ec5\u7528\u4e24\u4e2a\u6307\u9488) | $\\mathcal{O}(n)$ (\u9700\u8981\u989d\u5916\u6570\u7ec4\u5b58\u50a8\u5168\u90e8\u5f15\u7528) | $\\mathcal{O}(1)$ (\u4ec5\u7528\u8ba1\u6570\u5668\u53d8\u91cf) |\n| **\u65f6\u95f4\u590d\u6742\u5ea6** | $\\mathcal{O}(n)$ (\u5355\u8d9f\u626b\u63cf\uff0c\u6b65\u6570 $< n$) | $\\mathcal{O}(n)$ (\u5355\u8d9f\u626b\u63cf + \u6570\u7ec4\u6784\u5efa) | $\\mathcal{O}(n)$ (\u904d\u5386 $n + n/2 = 1.5n$ \u6b65) |\n| **\u904d\u5386\u8d9f\u6570** | **1 \u8d9f (One-Pass)** | 1 \u8d9f | 2 \u8d9f (Two-Pass) |\n| **\u9762\u8bd5\u63a8\u8350\u5ea6** | \u2b50\ufe0f\u2b50\ufe0f\u2b50\ufe0f\u2b50\ufe0f\u2b50\ufe0f (\u6807\u51c6\u6559\u79d1\u4e66\u7b54\u6848) | \u2b50\ufe0f\u2b50\ufe0f\u2b50\ufe0f (\u8fdd\u80cc\u94fe\u8868\u7a7a\u95f4\u8bbe\u8ba1\u521d\u8877) | \u2b50\ufe0f\u2b50\ufe0f\u2b50\ufe0f\u2b50\ufe0f (\u601d\u8def\u6734\u7d20\u4f46\u591a\u4e86\u4e00\u8d9f\u626b\u63cf) |\n\n---\n\n## 6. The Error Log & Dry-Run / \u9519\u9898\u6392\u67e5\u4e0e\u5b9e\u4f8b\u63a8\u6f14\n\n### \u26a0\ufe0f \u9519\u9898\u6392\u67e5\u4e0e\u53cd\u6a21\u5f0f\u8bca\u65ad (The Error Log: Anti-Patterns & Defensive Fixes)\n\n```\n\u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n\u2502 \u26a0\ufe0f \u53cd\u6a21\u5f0f 1\uff1awhile \u6761\u4ef6\u987a\u5e8f\u98a0\u5012\u5199\u6210 `while fast.next and fast:`                                              \u2502\n\u251c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2524\n\u2502 \u274c \u9519\u8bef\u5199\u6cd5:                                                                                                \u2502\n\u2502    while fast.next and fast:  # \u707e\u96be\uff1a\u5f53 fast \u4e3a None \u65f6\uff0c\u5148\u6c42 fast.next \u4f1a\u76f4\u63a5\u62a5 AttributeError\uff01            \u2502\n\u2502                                                                                                             \u2502\n\u2502 \ud83c\udfaf \u7ffb\u8f66\u673a\u7406 (Root Cause):                                                                                   \u2502\n\u2502    Python \u7684\u903b\u8f91\u8fd0\u7b97\u7b26 `and` \u5177\u5907\u77ed\u8def\u6c42\u503c\u7279\u6027\u3002\u5fc5\u987b\u5148\u6821\u9a8c `fast` \u662f\u5426\u975e\u7a7a\uff0c\u624d\u80fd\u5b89\u5168\u8bbf\u95ee `fast.next`\u3002       \u2502\n\u2502                                                                                                             \u2502\n\u2502 \ud83d\udee1\ufe0f \u9632\u5fa1\u53e3\u8bc0 (Invariant):                                                                                   \u2502\n\u2502    \u3010\u5148\u81ea\u8eab\uff0c\u540e\u540e\u7ee7\u3011\uff1a\u5fc5\u987b\u4e25\u683c\u5199\u4e3a `while fast and fast.next:`                                            \u2502\n\u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n```\n\n| \u5e38\u89c1\u6613\u9519\u53cd\u6a21\u5f0f (Buggy Anti-Pattern) | \u7ffb\u8f66\u73b0\u8c61\u4e0e\u75c7\u72b6 (Symptom) | \u6df1\u5c42\u7ffb\u8f66\u673a\u7406 (Root Cause) | \u9632\u5fa1\u6027\u4fee\u590d\u7b56\u7565 (Defensive Invariant) |\n| :--- | :--- | :--- | :--- |\n| **`while fast.next and fast:`** | `AttributeError: 'NoneType' object has no attribute 'next'` | \u77ed\u8def\u6c42\u503c\u5931\u6548\uff0c\u5bf9 `None` \u8bbf\u95ee\u4e86 `.next` | \u4e25\u683c\u4fdd\u6301\u5148\u5224\u81ea\u8eab\u540e\u5224\u5b50\u8282\u70b9\u7684\u987a\u5e8f `while fast and fast.next:` |\n| **\u6df7\u6dc6\u5de6\u4e2d\u70b9\u4e0e\u53f3\u4e2d\u70b9** | \u94fe\u8868\u6298\u534a\u65ad\u5f00\u65f6\u5bfc\u81f4\u524d\u534a\u6bb5\u591a\u51fa\u4e00\u4e2a\u8282\u70b9\u6216\u6b7b\u5faa\u73af | `while fast and fast.next` \u4f1a\u843d\u5728\u7b2c 2 \u4e2a\u4e2d\u70b9 | \u82e5\u9700\u65ad\u5f00\u524d\u622a\uff0c\u9700\u7528 `while fast.next and fast.next.next:` \u5b9a\u4f4d\u5de6\u4e2d\u70b9 |\n| **\u5feb\u6307\u9488\u6b65\u8fdb\u5199\u9519 `fast = fast.next`** | \u6162\u6307\u9488\u505c\u5728\u94fe\u8868\u672b\u5c3e | \u5feb\u6162\u6307\u9488\u901f\u7387\u76f8\u540c\uff0c\u5931\u53bb\u901f\u7387\u5dee | \u5feb\u6307\u9488\u5fc5\u987b\u524d\u8fdb 2 \u6b65 `fast = fast.next.next` |\n\n---\n\n### \u2753 \u5e38\u89c1\u7591\u96be\u4e0e\u8fb9\u754c\u6392\u67e5 (Boundary FAQs)\n\n* **Q1: \u5f53\u94fe\u8868\u53ea\u6709 1 \u4e2a\u8282\u70b9 (`[1]`) \u65f6\u4f1a\u53d1\u751f\u4ec0\u4e48\uff1f**\n  * `fast.next` \u4e3a `None`\uff0c`while` \u5faa\u73af\u4e00\u6b21\u90fd\u4e0d\u6267\u884c\uff0c\u76f4\u63a5\u8fd4\u56de `slow`\uff08\u5373\u8282\u70b9 `1`\uff09\uff0c\u7ed3\u679c\u6b63\u786e\u3002\n* **Q2: \u5f53\u94fe\u8868\u53ea\u6709 2 \u4e2a\u8282\u70b9 (`[1, 2]`) \u65f6\u4f1a\u53d1\u751f\u4ec0\u4e48\uff1f**\n  * \u521d\u59cb\uff1a`slow = 1, fast = 1`\n  * \u5faa\u73af\u7b2c 1 \u6b21\uff1a`slow = 2, fast = None`\n  * \u5faa\u73af\u7ec8\u6b62\uff0c\u8fd4\u56de `slow`\uff08\u5373\u8282\u70b9 `2`\uff0c\u7b2c 2 \u4e2a\u4e2d\u70b9\uff09\uff0c\u7ed3\u679c\u5b8c\u5168\u6b63\u786e\u3002\n* **Q3: \u4e3a\u4ec0\u4e48\u4e0d\u9700\u8981\u54e8\u5175\u54d1\u8282\u70b9 (`dummyNode`)\uff1f**\n  * \u56e0\u4e3a\u672c\u9898\u53ea\u9700\u67e5\u8be2\u4e2d\u70b9\u6307\u9488\u5e76\u8fd4\u56de\uff0c\u4e0d\u6d89\u53ca\u94fe\u8868\u5934\u90e8\u7684\u4fee\u6539\u3001\u63d2\u5165\u6216\u5220\u9664\uff0c\u56e0\u6b64\u76f4\u63a5\u4f7f\u7528 `head` \u4f5c\u4e3a\u8d77\u70b9\u6700\u4e3a\u5e72\u51c0\u3002\n\n---\n\n### \ud83c\udfa8 \u5b9e\u4f8b\u5168\u7a0b\u63a8\u6f14\u8868 (Complete Dry-Run)\n\n#### \u5b9e\u4f8b 1\uff1a\u5947\u6570\u957f\u5ea6 `head = [1, 2, 3, 4, 5]`\n| \u5faa\u73af\u8f6e\u6b21 | `slow` \u4f4d\u7f6e | `fast` \u4f4d\u7f6e | `fast.next` \u72b6\u6001 | \u5224\u5b9a\u662f\u5426\u7ee7\u7eed |\n| :---: | :---: | :---: | :---: | :---: |\n| **\u521d\u59cb** | `[1]` | `[1]` | `[2]` (\u6709\u6548) | `fast` \u4e0e `fast.next` \u5747\u5b58\u5728 $\\rightarrow$ \u6267\u884c |\n| **\u7b2c 1 \u8f6e** | `[2]` | `[3]` | `[4]` (\u6709\u6548) | `fast` \u4e0e `fast.next` \u5747\u5b58\u5728 $\\rightarrow$ \u6267\u884c |\n| **\u7b2c 2 \u8f6e** | `[3]` | `[5]` | `None` (\u4e3a\u7a7a) | `fast.next` \u4e3a `None` $\\rightarrow$ \u7ec8\u6b62\u5faa\u73af |\n| **\u8fd4\u56de\u503c** | `[3]` | \u2014 | \u2014 | \u8fd4\u56de `slow` \u5373\u8282\u70b9 `[3]` |\n\n#### \u5b9e\u4f8b 2\uff1a\u5076\u6570\u957f\u5ea6 `head = [1, 2, 3, 4, 5, 6]`\n| \u5faa\u73af\u8f6e\u6b21 | `slow` \u4f4d\u7f6e | `fast` \u4f4d\u7f6e | `fast.next` \u72b6\u6001 | \u5224\u5b9a\u662f\u5426\u7ee7\u7eed |\n| :---: | :---: | :---: | :---: | :---: |\n| **\u521d\u59cb** | `[1]` | `[1]` | `[2]` (\u6709\u6548) | `fast` \u4e0e `fast.next` \u5747\u5b58\u5728 $\\rightarrow$ \u6267\u884c |\n| **\u7b2c 1 \u8f6e** | `[2]` | `[3]` | `[4]` (\u6709\u6548) | `fast` \u4e0e `fast.next` \u5747\u5b58\u5728 $\\rightarrow$ \u6267\u884c |\n| **\u7b2c 2 \u8f6e** | `[3]` | `[5]` | `[6]` (\u6709\u6548) | `fast` \u4e0e `fast.next` \u5747\u5b58\u5728 $\\rightarrow$ \u6267\u884c |\n| **\u7b2c 3 \u8f6e** | `[4]` | `None` | \u2014 | `fast` \u4e3a `None` $\\rightarrow$ \u7ec8\u6b62\u5faa\u73af |\n| **\u8fd4\u56de\u503c** | `[4]` | \u2014 | \u2014 | \u8fd4\u56de `slow` \u5373\u8282\u70b9 `[4]` (\u7b2c 2 \u4e2a\u4e2d\u70b9) |\n\n---\n\n## 7. Complexity Analysis / \u590d
