aximum depth of binary tree", "path": "top-100/lc-0104-maximum-depth-of-binary-tree", "type": "problem", "notes": "# LeetCode 104. Maximum Depth of Binary Tree (\u4e8c\u53c9\u6811\u7684\u6700\u5927\u6df1\u5ea6)\n## Step-by-Step Code Walkthrough & Notes / \u4ee3\u7801\u9010\u884c\u8be6\u89e3\u4e0e\u77e5\u8bc6\u70b9\u603b\u7ed3\n\n- **Difficulty:** Easy (\u5206\u6cbb\u540e\u5e8f\u9012\u5f52 / \u6811\u5f62 DP \u539f\u8bed / \u5c42\u5e8f BFS / \u8fed\u4ee3\u663e\u5f0f\u6808)\n- **Tags:** Tree, Depth-First Search, Breadth-First Search, Binary Tree\n- **Corresponding Python File:** [`top-100/lc-0104-maximum-depth-of-binary-tree.py`](top-100/lc-0104-maximum-depth-of-binary-tree.py)\n\n---\n\n## 1. Problem Statement / \u9898\u76ee\u63cf\u8ff0\n\n* **[EN]** Given the `root` of a binary tree, return *its maximum depth*.\n  * A binary tree's **maximum depth** is the number of nodes along the longest path from the root node down to the farthest leaf node.\n* **[CN]** \u7ed9\u5b9a\u4e00\u4e2a\u4e8c\u53c9\u6811 `root` \uff0c\u8fd4\u56de\u5176 **\u6700\u5927\u6df1\u5ea6** \u3002\n  * \u4e8c\u53c9\u6811\u7684 **\u6700\u5927\u6df1\u5ea6** \u662f\u6307\u4ece\u6839\u8282\u70b9\u5230\u6700\u8fdc\u53f6\u5b50\u8282\u70b9\u7684\u6700\u957f\u8def\u5f84\u4e0a\u7684\u8282\u70b9\u6570\u3002\n\n### Constraints / \u7ea6\u675f\u6761\u4ef6\n* \u6811\u4e2d\u8282\u70b9\u7684\u6570\u91cf\u5728 $[0, 10^4]$ \u533a\u95f4\u5185\u3002\n* $-100 \\le \\text{Node.val} \\le 100$\n\n---\n\n## 2. Problem Blueprint & Core Invariant / \u9898\u610f\u8003\u70b9\u84dd\u56fe\u4e0e\u6838\u5fc3\u4e0d\u53d8\u91cf\n\n```\n\u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n\u2502 \ud83c\udfaf \u8003\u8bd5\u4e0e\u9762\u8bd5\u8003\u5bdf\u6838\u5fc3\u84dd\u56fe (Interview Blueprint)                             \u2502\n\u251c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2524\n\u2502 1. \u6982\u5ff5\u6f84\u6e05 (Concept Clarification):                                        \u2502\n\u2502    \u2022 \u6df1\u5ea6 (Depth): \u4ece\u6839\u8282\u70b9\u5411\u4e0b\u5230\u5f53\u524d\u8282\u70b9\u7684\u552f\u4e00\u8def\u5f84\u4e0a\u7684\u8282\u70b9\u6570 (\u81ea\u9876\u5411\u4e0b)\u3002    \u2502\n\u2502    \u2022 \u9ad8\u5ea6 (Height): \u4ece\u5f53\u524d\u8282\u70b9\u5411\u4e0b\u5230\u6700\u8fdc\u53f6\u5b50\u8282\u70b9\u7684\u6700\u957f\u8def\u5f84\u8282\u70b9\u6570 (\u81ea\u5e95\u5411\u4e0a)\u3002 \u2502\n\u2502    \u2022 \u4e8c\u53c9\u6811\u7684\u6700\u5927\u6df1\u5ea6\u4e25\u683c\u7b49\u4ef7\u4e8e\u6839\u8282\u70b9\u7684\u6700\u5927\u9ad8\u5ea6 (Max Depth == Height of Root)\u3002\u2502\n\u2502 2. \u5206\u6cbb\u4e0e\u540e\u5e8f\u904d\u5386\u4e0d\u53d8\u91cf (Divide & Conquer / Post-order Invariant):          \u2502\n\u2502    \u2022 \u5b50\u95ee\u9898\u5206\u89e3: \u5f53\u524d\u6811\u7684\u6700\u5927\u6df1\u5ea6 = 1 + max(\u5de6\u5b50\u6811\u6df1\u5ea6, \u53f3\u5b50\u6811\u6df1\u5ea6)\u3002       \u2502\n\u2502    \u2022 \u9012\u5f52\u57fa (Base Case): \u82e5\u5f53\u524d\u5b50\u6811\u4e3a\u7a7a (root is None)\uff0c\u6df1\u5ea6\u8d21\u732e\u4e3a 0\u3002      \u2502\n\u2502 3. \u6811\u5f62 DP \u5960\u57fa\u539f\u8bed: \u672c\u9898\u662f LC 110\u3001LC 543\u3001LC 124 \u7b49\u6240\u6709\u6811\u5f62 DP \u7684\u6bcd\u9898\u3002    \u2502\n\u2502 4. \u6781\u81f4\u65f6\u7a7a: \u4e25\u683c\u5355\u6b21\u904d\u5386 O(N) \u65f6\u95f4\uff0cO(H) \u9012\u5f52\u6808\u7a7a\u95f4 (H \u4e3a\u6811\u9ad8)\u3002          \u2502\n\u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n```\n\n---\n\n## 3. Core Idea, Mental Model & Pattern Lineage / \u6838\u5fc3\u601d\u8def\u4e0e\u601d\u7ef4\u8c31\u7cfb\n\n### \ud83e\udde0 \u6811\u5f62\u9012\u5f52\u4e0e\u6811\u5f62 DP \u601d\u7ef4\u8c31\u7cfb\u6f14\u5316\u6811 (Pattern Lineage)\n\n```\n\u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n\u2502 \ud83e\udde0 Binary Tree Post-order Pattern Lineage (\u4e8c\u53c9\u6811\u540e\u5e8f/\u5206\u6cbb\u601d\u7ef4\u8c31\u7cfb\u6f14\u5316\u6811)   \u2502\n\u251c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2524\n\u2502                                                                             \u2502\n\u2502  Level 1 (Foundational Primitive): LC 104 Maximum Depth of Binary Tree (\u672c\u9898\u2605)\u2502\n\u2502  \u2514\u2500 \u6838\u5fc3\u539f\u8bed: height(u) = 1 + max(height(u.left), height(u.right))          \u2502\n\u2502        \u2502                                                                    \u2502\n\u2502        \u25bc [\u6f14\u8fdb Twist: \u5f15\u5165\u5e73\u8861\u6027\u5224\u65ad\u4e0e -1 \u63d0\u524d\u526a\u679d]                         \u2502\n\u2502  Level 2 (Constraint Validation): LC 110 Balanced Binary Tree               \u2502\n\u2502  \u2514\u2500 \u4e0d\u53d8\u91cf: |height(left) - height(right)| <= 1\uff0c\u5426\u5219\u7acb\u5373\u8fd4\u56de -1 \u526a\u679d\u3002     \u2502\n\u2502        \u2502                                                                    \u2502\n\u2502        \u25bc [\u6f14\u8fdb Twist: \u5168\u5c40\u6700\u503c\u7ef4\u62a4 (\u7a7f\u8fc7\u5f53\u524d\u8282\u70b9\u7684\u6700\u957f\u8def\u5f84)]                 \u2502\n\u2502  Level 3 (Global State Aggregation): LC 543 Diameter of Binary Tree         \u2502\n\u2502  \u2514\u2500 \u4e0d\u53d8\u91cf: \u5168\u5c40\u76f4\u5f84 max_d = max(max_d, left_h + right_h)\uff0c\u5355\u4fa7\u5411\u4e0a\u8fd4 height\u2502\n\u2502        \u2502                                                                    \u2502\n\u2502        \u25bc [\u6f14\u8fdb Twist: \u7ed3\u5408\u5e26\u6743\u8def\u5f84\u6c42\u548c\u4e0e\u8d1f\u503c\u526a\u679d (Hard)]                     \u2502\n\u2502  Level 4 (Tree DP Masterpiece): LC 124 Binary Tree Maximum Path Sum         \u2502\n\u2502  \u2514\u2500 \u4e0d\u53d8\u91cf: \u8d1f\u589e\u76ca\u526a\u679d max(0, side_sum)\uff0c\u5168\u5c40\u66f4\u65b0 max_path = l + r + val\u3002 \u2502\n\u2502                                                                             \u2502\n\u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n```\n\n---\n\n### \ud83e\udde0 \u4e8c\u53c9\u6811\u4e0e\u9012\u5f52\u6838\u5fc3\u601d\u7ef4\u6a21\u578b (Recursive Mental Model & Why It Works)\n\n```\n\u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n\u2502 \ud83d\udca1 \u5982\u4f55\u7cfb\u7edf\u601d\u8003\u4e8c\u53c9\u6811\u7684\u9012\u5f52\u95ee\u9898 (How to Reason About Tree Recursion)        \u2502\n\u251c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2524\n\u2502 1. \u601d\u8003\u6574\u68f5\u6811\u4e0e\u5176\u5de6\u53f3\u5b50\u6811\u7684\u5173\u7cfb:                                            \u2502\n\u2502    \u2022 \u6574\u68f5\u6811\u7684\u6700\u5927\u6df1\u5ea6 = max(\u5de6\u5b50\u6811\u7684\u6700\u5927\u6df1\u5ea6, \u53f3\u5b50\u6811\u7684\u6700\u5927\u6df1\u5ea6) + 1         \u2502\n\u2502 2. \u539f\u95ee\u9898\u4e0e\u5b50\u95ee\u9898\u7684\u81ea\u76f8\u4f3c\u6027:                                                \u2502\n\u2502    \u2022 \u539f\u95ee\u9898: \u8ba1\u7b97\u4ee5 root \u4e3a\u6839\u7684\u6574\u68f5\u6811\u7684\u6700\u5927\u6df1\u5ea6\u3002                           \u2502\n\u2502    \u2022 \u5b50\u95ee\u9898: \u8ba1\u7b97\u4ee5 root.left \u548c root.right \u4e3a\u6839\u7684\u5b50\u6811\u7684\u6700\u5927\u6df1\u5ea6\u3002          \u2502\n\u2502    \u2022 \u5b50\u95ee\u9898\u4e0e\u539f\u95ee\u9898\u5728\u7ed3\u6784\u4e0a\u5b8c\u5168\u76f8\u540c\uff0c\u6267\u884c\u7684\u4ee3\u7801\u903b\u8f91\u4e5f\u5b8c\u5168\u4e00\u81f4\u3002             \u2502\n\u2502 3. \u4e3a\u4ec0\u4e48\u5fc5\u987b\u4f7f\u7528\u9012\u5f52\u800c\u4e0d\u662f\u7b80\u5355\u5faa\u73af?                                        \u2502\n\u2502    \u2022 \u5b50\u95ee\u9898\u7684\u8ba1\u7b97\u7ed3\u679c\u5fc5\u987b\u81ea\u5e95\u5411\u4e0a\u3010\u8fd4\u56de\u7ed9\u4e0a\u4e00\u7ea7\u95ee\u9898\u3011\uff0c\u7531\u7236\u8282\u70b9\u805a\u5408\u51b3\u7b56\u3002   \u2502\n\u2502    \u2022 \u7cfb\u7edf\u7684\u51fd\u6570\u8c03\u7528\u6808\u5929\u7136\u652f\u6301\u201c\u9012\u201d\u4e0b\u53bb\u63a2\u7d22\u3001\u201c\u5f52\u201d\u4e0a\u6765\u6c47\u603b\u7684\u751f\u547d\u5468\u671f\u3002         \u2502\n\u2502 4. \u4e3a\u4ec0\u4e48\u8fd9\u6837\u5199\u5c31\u4e00\u5b9a\u80fd\u6b63\u786e\u7ec8\u6b62? (Base Case & Invariant):                   \u2502\n\u2502    \u2022 \u6bcf\u6b21\u9012\u5f52\u8c03\u7528\u7684\u5b50\u95ee\u9898\u89c4\u6a21\u4e25\u683c\u6bd4\u7236\u95ee\u9898\u5c0f\uff08\u8282\u70b9\u6570\u51cf\u5c11\uff09\u3002                 \u2502\n\u2502    \u2022 \u4e0d\u65ad\u5411\u6df1\u5904\u201c\u9012\u201d\u4e0b\u53bb\uff0c\u7ec8\u7a76\u4f1a\u5230\u8fbe\u53f6\u5b50\u8282\u70b9\u7684\u7a7a\u6307\u9488 (root is None)\u3002         \u2502\n\u2502    \u2022 \u89e6\u53d1\u8fb9\u754c\u6761\u4ef6 (Base Case)\uff0c\u76f4\u63a5\u8fd4\u56de\u7b54\u6848 0\uff0c\u968f\u540e\u9010\u5c42\u201c\u5f52\u201d\u5e76\u6c47\u603b\u3002         \u2502\n\u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n```\n\n---\n\n### \ud83d\udca1 \u6570\u5b66\u5f52\u7eb3\u4e0e\u9012\u63a8\u673a\u5236 (Mathematical Induction)\n\n\u8bbe\u4ee5\u8282\u70b9 $u$ \u4e3a\u6839\u7684\u5b50\u6811\u6df1\u5ea6\u4e3a $D(u)$\uff1a\n\n$$D(u) = \\begin{cases} \n0, & \\text{\u82e5 } u \\text{ \u4e3a\u7a7a\u8282\u70b9 (None)} \\\\ \n1 + \\max\\big(D(u.\\text{left}), D(u.\\text{right})\\big), & \\text{\u82e5 } u \\text{ \u5b58\u5728}\n\\end{cases}$$\n\n#### \u5f52\u7eb3\u8bc1\u660e\uff1a\n1. **\u57fa\u7840\u9879**\uff1a\u5f53\u6811\u4e3a\u7a7a\uff08\u8282\u70b9\u6570\u4e3a 0\uff09\u65f6\uff0c\u53f6\u5b50\u8282\u70b9\u4e0d\u5b58\u5728\uff0c\u8fd4\u56de 0\uff0c\u7b26\u5408\u6df1\u5ea6\u5b9a\u4e49\u3002\n2. **\u5f52\u7eb3\u5047\u8bbe**\uff1a\u5047\u8bbe\u5de6\u53f3\u5b50\u6811\u7684\u9012\u5f52\u8c03\u7528\u5747\u80fd\u6b63\u786e\u8fd4\u56de\u5176\u6700\u5927\u6df1\u5ea6 $D(u.\\text{left})$ \u4e0e $D(u.\\text{right})$\u3002\n3. **\u5f52\u7eb3\u63a8\u5bfc**\uff1a\u4ece\u6839\u8282\u70b9 $u$ \u51fa\u53d1\uff0c\u4efb\u4f55\u4e00\u6761\u901a\u5411\u53f6\u5b50\u8282\u70b9\u7684\u8def\u5f84\u5fc5\u987b\u7ecf\u8fc7 $u$\uff0c\u968f\u540e\u53ea\u80fd\u9009\u62e9\u8d70\u5411\u5de6\u5b50\u6811\u6216\u53f3\u5b50\u6811\u3002\u4e3a\u4e86\u4f7f\u603b\u8def\u5f84\u6700\u957f\uff0c\u5fc5\u987b\u8d2a\u5fc3\u9009\u53d6\u6df1\u5ea6\u66f4\u5927\u7684\u90a3\u4e00\u4fa7\u5b50\u6811\uff0c\u5373 $\\max\\big(D(u.\\text{left}), D(u.\\text{right})\\big)$\uff0c\u518d\u52a0\u4e0a\u5f53\u524d\u8282\u70b9 $u$ \u672c\u8eab\u6240\u5360\u7684 1 \u5c42\uff0c\u603b\u6df1\u5ea6\u4e25\u683c\u4e3a $1 + \\max(D_{\\text{left}}, D_{\\text{right}})$\u3002\n\n---\n\n### \ud83c\udfa8 ASCII \u9012\u5f52\u5206\u6cbb\u56de\u6eaf\u56fe\u89e3\n\n\u4ee5\u4e8c\u53c9\u6811 `root = [3, 9, 20, null, null, 15, 7]` \u4e3a\u4f8b\uff1a\n\n```\n                 [3]\n               /     \\\n             [9]     [20]\n                    /    \\\n                  [15]   [7]\n\n\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n\u81ea\u5e95\u5411\u4e0a (Bottom-Up) \u9012\u5f52\u56de\u6eaf\u6c42\u9ad8\u5ea6\u63a8\u6f14:\n\nLevel 3 (\u53f6\u5b50\u8282\u70b9):\n  \u2022 [15] -> 1 + max(0, 0) = 1\n  \u2022 [7]  -> 1 + max(0, 0) = 1\n\nLevel 2:\n  \u2022 [9]  -> 1 + max(0, 0) = 1\n  \u2022 [20] -> 1 + max(height([15]), height([7])) = 1 + max(1, 1) = 2\n\nLevel 1 (\u6839\u8282\u70b9):\n  \u2022 [3]  -> 1 + max(height([9]), height([20])) = 1 + max(1, 2) = 3\n\n\u6700\u7ec8\u8f93\u51fa\u6700\u5927\u6df1\u5ea6 = 3\n```\n\n---\n\n## 4. Step-by-Step Code Walkthrough / \u4ee3\u7801\u9010\u884c\u8be6\u89e3\n\n\u57fa\u4e8e\u539f Python \u6587\u4ef6\u4e2d\u7684\u5b9e\u73b0\u8fdb\u884c\u9010\u884c\u6df1\u5165\u89e3\u6790\uff1a\n\n```python\nfrom typing import Optional\n\n# Definition for a binary tree node.\n# class TreeNode:\n#     def __init__(self, val=0, left=None, right=None):\n#         self.val = val\n#         self.left = left\n#         self.right = right\n\nclass Solution:\n    def maxDepth(self, root: Optional[TreeNode]) -> int:\n        # 1. \u9012\u5f52\u57fa (Base Case): \u82e5\u5f53\u524d\u5b50\u6811\u4e3a\u7a7a\u8282\u70b9 (root is None)\uff0c\u6df1\u5ea6\u8d21\u732e\u4e3a 0\uff0c\u89e6\u5e95\u5f00\u59cb\u201c\u5f52\u201d\n        if not root:\n            return 0\n        \n        # 2. \u9012\u5f52\u6df1\u5165\u5de6\u5b50\u6811\uff0c\u6c42\u89e3\u5de6\u5b50\u6811\u7684\u6700\u5927\u6df1\u5ea6 (Left Subtree Max Depth)\n        left_depth = self.maxDepth(root.left)\n        \n        # 3. \u9012\u5f52\u6df1\u5165\u53f3\u5b50\u6811\uff0c\u6c42\u89e3\u53f3\u5b50\u6811\u7684\u6700\u5927\u6df1\u5ea6 (Right Subtree Max Depth)\n        right_depth = self.maxDepth(root.right)\n        \n        # 4. \u540e\u5e8f\u6c47\u603b (Post-order Conquer): \n        #    \u5f53\u524d\u6811\u7684\u6700\u5927\u6df1\u5ea6 = max(\u5de6\u5b50\u6811\u6df1\u5ea6, \u53f3\u5b50\u6811\u6df1\u5ea6) + 1 (\u5f53\u524d\u6839\u8282\u70b9\u6240\u8d21\u732e\u7684 1 \u5c42\u9ad8\u5ea6)\n        return max(left_depth, right_depth) + 1\n```\n\n---\n\n## 5. Interview Simulation: Alternative Paradigms & Follow-up Pivots / \u9762\u8bd5\u5b98\u8ffd\u95ee\u6f14\u7ec3\n\n### \u8ffd\u95ee 1: \u5982\u679c\u9012\u5f52\u8c03\u7528\u6808\u53ef\u80fd\u5bfc\u81f4\u6808\u6ea2\u51fa (Stack Overflow)\uff0c\u5982\u4f55\u7528\u5c42\u5e8f\u904d\u5386 (BFS) \u6c42\u89e3\uff1f\n\n* **\u9762\u8bd5\u5b98**\uff1a\u5728\u6781\u7aef\u503e\u659c\u6811\uff08\u4f8b\u5982\u94fe\u72b6\u9000\u5316\u6811\uff0c\u6df1\u5ea6\u8fbe $10^4$\uff09\u6216\u5185\u5b58\u53d7\u9650\u73af\u5883\u4e2d\uff0c\u9012\u5f52\u53ef\u80fd\u5bfc\u81f4 RecursionError\u3002\u4f60\u80fd\u5199\u51fa\u8fed\u4ee3\u5c42\u5e8f\u904d\u5386\uff08BFS\uff09\u89e3\u6cd5\u5417\uff1f\n* **\u5019\u9009\u4eba\u89e3\u6790**\uff1a\n  * \u4f7f\u7528\u53cc\u7aef\u961f\u5217 `collections.deque` \u5b9e\u73b0\u6807\u51c6 BFS\u3002\n  * \u6bcf\u6b21\u5faa\u73af\u6309\u6279\u6b21\u5f39\u51fa\u5f53\u524d\u6574\u5c42\u7684\u8282\u70b9\u6570 `len(queue)`\uff0c\u6bcf\u6d88\u5316\u5b8c\u6574\u6574\u4e00\u5c42\uff0c\u6df1\u5ea6\u8ba1\u6570\u5668 `depth += 1`\u3002\n  * \u961f\u5217\u6392\u7a7a\u65f6\uff0c`depth` \u5373\u4e3a\u4e8c\u53c9\u6811\u6700\u5927\u6df1\u5ea6\u3002\n\n```python\n# \u9644: \u5c42\u5e8f\u904d\u5386 BFS \u6a21\u677f (Level-Order BFS)\nfrom collections import deque\n\nclass SolutionBFS:\n    def maxDepth(self, root: Optional[TreeNode]) -> int:\n        if not root:\n            return 0\n        \n        queue = deque([root])\n        depth = 0\n        \n        while queue:\n            # \u4e25\u683c\u9501\u5b9a\u5f53\u524d\u5c42\u7684\u8282\u70b9\u6570\u91cf\uff0c\u6279\u91cf\u51fa\u961f\n            level_size = len(queue)\n            for _ in range(level_size):\n                node = queue.popleft()\n                if node.left:\n                    queue.append(node.left)\n                if node.right:\n                    queue.append(node.right)\n            depth += 1\n            \n        return depth\n```\n\n---\n\n### \u8ffd\u95ee 2: \u80fd\u5426\u4f7f\u7528\u663e\u5f0f\u6808 (Explicit DFS Stack) \u5b9e\u73b0\u524d\u5e8f\u6a21\u62df\uff1f\n\n* **\u9762\u8bd5\u5b98**\uff1a\u5982\u679c\u8981\u6c42\u5fc5\u987b\u7528\u6df1\u5ea6\u4f18\u5148\u641c\u7d22\uff08DFS\uff09\uff0c\u4f46\u7981\u6b62\u4f7f\u7528\u9690\u5f0f\u7cfb\u7edf\u9012\u5f52\uff0c\u5982\u4f55\u7528\u663e\u5f0f\u6808\u6a21\u62df\uff1f\n* **\u5019\u9009\u4eba\u89e3\u6790**\uff1a\n  * \u6808\u4e2d\u5b58\u50a8\u4e8c\u5143\u7ec4 `(node, current_depth)`\u3002\n  * \u904d\u5386\u8fc7\u7a0b\u4e2d\u7ef4\u62a4\u5168\u5c40\u6700\u5927\u6df1\u5ea6 `max_d = max(max_d, current_depth)`\u3002\n\n```python\n# \u9644: \u663e\u5f0f\u6808 DFS \u6a21\u62df (Iterative DFS with Stack)\nclass SolutionIterativeDFS:\n    def maxDepth(self, root: Optional[TreeNode]) -> int:\n        if not root:\n            return 0\n        \n        stack = [(root, 1)]\n        max_depth = 0\n        \n        while stack:\n            node, cur_depth = stack.pop()\n            max_depth = max(max_depth, cur_depth)\n            if node.right:\n                stack.append((node.right, cur_depth + 1))\n            if node.left:\n                stack.append((node.left, cur_depth + 1))\n                \n        return max_depth\n```\n\n---\n\n## 6. The Error Log & Complete Dry-Run / \u9519\u9898\u6392\u67e5\u4e0e\u5b9e\u4f8b\u63a8\u6f14\n\n### \u26a0\ufe0f The Error Log: Anti-Patterns & Defensive Fixes (\u53cd\u6a21\u5f0f\u8bca\u65ad\u8868)\n\n| \u5178\u578b\u9519\u8bef\u6a21\u5f0f (Buggy Pattern) | \u89e6\u53d1\u573a\u666f & \u5f02\u5e38\u8868\u73b0 (Symptom) | \u6839\u56e0\u5206\u6790 (Root Cause) | \u9632\u5fa1\u6027\u4fee\u590d\u4e0e\u4e0d\u53d8\u91cf (Defensive Fix) |\n| :--- | :--- | :--- | :--- |\n| **\u9057\u6f0f\u7a7a\u6811\u5224\u7a7a (`if not root`)** | \u8f93\u5165 `root = []` \u65f6\u629b\u51fa `AttributeError: 'NoneType' has no attribute 'left'` | \u672a\u8bbe\u7f6e\u9012\u5f52\u7ec8\u6b62\u8fb9\u754c\u6761\u4ef6\uff0c\u5bf9 `None` \u8bbf\u95ee\u5b50\u8282\u70b9 | \u9012\u5f52\u9996\u884c\u4e25\u683c\u4fdd\u8bc1 `if not root: return 0` |\n| **\u8bef\u5c06 `+ 1` \u5199\u5728 `max` \u5185\u90e8** | \u4ee3\u7801\u5199\u4e3a `max(left + 1, right)` \u5bfc\u81f4\u8ba1\u7b97\u7ed3\u679c\u504f\u5c0f | \u6bcf\u4e00\u5c42\u8282\u70b9\u81ea\u8eab\u7684\u6df1\u5ea6\u8d21\u732e\u5e94\u5f53\u7edf\u4e00\u52a0\u5728\u5de6\u53f3\u5b50\u6811\u6700\u5927\u503c\u4e4b\u5916 | \u4e25\u683c\u4f7f\u7528 `1 + max(left_depth, right_depth)` |\n| **\u5168\u5c40\u53d8\u91cf\u7d2f\u52a0\u88ab\u810f\u6570\u636e\u6c61\u67d3** | \u5728\u5168\u5c40\u53d8\u91cf `self.depth` \u4e0a\u7d2f\u52a0\u4f46\u672a\u5728\u591a\u7528\u4f8b\u95f4\u91cd\u7f6e | \u529b\u6263\u5224\u9898\u673a\u5236\u590d\u7528\u540c\u4e00\u4e2a `Solution` \u7c7b\u5b9e\u4f8b\uff0c\u5168\u5c40\u72b6\u6001\u8de8\u7528\u4f8b\u6b8b\u7559 | \u4f18\u5148\u91c7\u7528\u51fd\u6570\u7eaf\u8fd4\u56de\u503c\u4f20\u9012\u5206\u6cbb\u7ed3\u679c\uff0c\u907f\u514d\u975e\u5fc5\u8981\u7c7b\u5c5e\u6027\u5168\u5c40\u72b6\u6001 |\n| **\u6781\u5ea6\u9000\u5316\u94fe\u72b6\u6811\u9012\u5f52\u6808\u6ea2\u51fa** | \u8282\u70b9\u6570\u8fbe\u5230 $10^5$ \u4e14\u5448\u5355\u94fe\u5f62\u72b6\u65f6\u629b\u51fa `RecursionError: maximum recursion depth exceeded` | Python \u9ed8\u8ba4\u9012\u5f52\u6df1\u5ea6\u4e0a\u9650\u4e3a 1000 | \u5de5\u4e1a\u7ea7/\u8d85\u5927\u89c4\u6a21\u573a\u666f\u91c7\u7528 BFS \u961f\u5217\u6216\u8bbe\u7f6e `sys.setrecursionlimit` |\n\n---\n\n### \ud83d\udd0d \u6781\u7aef\u8fb9\u754c\u7528\u4f8b\u63a8\u6f14 (Dry-Run Matrix)\n\n| \u8f93\u5165\u7528\u4f8b (Input Case) | \u6811\u62d3\u6251\u5f62\u6001 (Tree Shape) | \u9012\u5f52\u8c03\u7528\u6811\u4e0e\u8fd4\u56de\u503c (Call Tree & Return) | \u6700\u7ec8\u8fd4\u56de\u503c (Return Value) |\n| :--- | :--- | :--- | :--- |\n| **\u7a7a\u6811 `root = []`** | \u7a7a\u6307\u9488 `None` | `if not root: return 0` | `0` (\u901a\u8fc7) |\n| **\u5355\u8282\u70b9\u6811 `[1]`** | \u4ec5\u6839\u8282\u70b9 `[1]` | `left=0, right=0` $\\rightarrow$ `1 + max(0, 0) = 1` | `1` (\u901a\u8fc7) |\n| **\u5b8c\u5168\u5355\u659c\u6811 `[1, 2, null, 3]`** | \u5411\u5de6\u9000\u5316\u4e3a\u94fe\u6761 | `[3]->1` $\\rightarrow$ `[2]->2` $\\rightarrow$ `[1]->3` | `3` (\u901a\u8fc7) |\n| **\u6ee1\u4e8c\u53c9\u6811 `[1, 2, 3, 4, 5, 6, 7]`** | \u6df1\u5ea6\u4e3a 3 \u7684\u5e73\u8861\u6ee1\u4e8c\u53c9\u6811 | \u5de6\u53f3\u5b50\u6811\u9ad8\u5ea6\u5747\u4e3a 2 $\\rightarrow$ `1 + max(2, 2) = 3` | `3` (\u901a\u8fc7) |\n\n---\n\n## 7. Complexity Analysis / \u590d\u6742\u5ea6\u5206\u6790\n\n| \u7ef4\u5ea6 (Dimension) | \u590d\u6742\u5ea6 (Complexity) | \u6570\u5b66\u8bc1\u660e\u4e0e\u6838\u5fc3\u539f\u7531 (Mathematical Rationale) |\n| :--- | :---: | :--- |\n| **\u65f6\u95f4\u590d\u6742\u5ea6 (Time Complexity)** | $\\mathcal{O}(N)$ | $N$ \u4e3a\u4e8c\u53c9\u6811\u7684\u8282\u70b9\u603b\u6570\u3002\u6bcf\u4e2a\u8282\u70b9\u6070\u597d\u88ab\u9012\u5f52\u8bbf\u95ee\u4e00\u6b21\uff08\u5e38\u6570\u6b21\u5165\u6808\u548c\u51fa\u6808\u64cd\u4f5c\uff09\uff0c\u65e0\u5197\u4f59\u91cd\u53e0\u5b50\u95ee\u9898\uff0c\u6545\u65f6\u95f4\u590d\u6742\u5ea6\u4e25\u683c\u4e3a $\\mathcal{O}(N)$\u3002 |\n| **\u7a7a\u95f4\u590d\u6742\u5ea6 (Space Complexity)** | $\\mathcal{O}(H)$ | $H$ \u4e3a\u4e8c\u53c9\u6811\u7684\u9ad8\u5ea6\u3002\u7a7a\u95f4\u6d88\u8017\u4e3b\u8981\u53d6\u51b3\u4e8e\u9012\u5f52\u8c03\u7528\u6808\u7684\u6df1\u5ea6\uff1a<br>\u2022 **\u6700\u4f73/\u5e73\u5747\u60c5\u51b5 (\u5e73\u8861\u4e8c\u53c9\u6811)**: $H = \\mathcal{O}(\\log N)$\uff1b<br>\u2022 **\u6700\u5dee\u60c5\u51b5 (\u9000\u5316\u4e3a\u5355\u94fe\u8868)**: $H = \\mathcal{O}(N)$\u3002 |\n", "code": "from typing import Optional\n\n# Definition for a binary tree node.\nclass TreeNode:\n    def __init__(self, val=0, left=None, right=None):\n        self.val = val\n        self.left = left\n        self.right = right\n\nclass Solution:\n    def maxDepth(self, root: Optional[TreeNode]) -> int:\n\n        if not root: #if root is None\n            return 0\n        left_depth = self.maxDepth(root.left)\n        right_depth = self.maxDepth(root.right)\n        return max(left_depth, right_depth) + 1\n\n\n#\u4e8c\u53c9\u6811\u4e0e\u9012\u5f52\n#\u5982\u4f55\u601d\u8003\u4e8c\u53c9\u6811\u76f8\u5173\u95ee\u9898\n#\u4e3a\u4ec0\u4e48\u9700\u8981\u4f7f\u7528\u9012\u5f52\n#\u4e3a\u4ec0\u4e48\u8fd9\u6837\u5199\u5c31\u4e00\u5b9a\u80fd\u6b63\u786e\n#\u8ba1\u7b97\u673a\u662f\u5982\u4f55\u6267\u884c\u9012\u5f52\u7684\n#\u53e6\u4e00\u79cd\u9012\u5f52\u601d\u8def\n\n# \u601d\u8003\u6574\u68f5\u6811\u4e0e\u5176\u5de6\u53f3\u5b50\u6811\u7684\u5173\u7cfb\n# \u6574\u68f5\u6811\u7684\u6700\u5927\u6df1\u5ea6\u4e3a = max(\u5de6\u5b50\u6811\u7684\u6700\u5927\u6df1\u5ea6\uff0c\u53f3\u5b50\u6811\u7684\u6700\u5927\u6df1\u5ea6) + 1\n\n\n# \u539f\u95ee\u9898\uff1a\u8ba1\u7b97\u51fa\u6574\u68f5\u6811\u7684\u6700\u5927\u6df1\u5ea6\n# \u5b50\u95ee\u9898\uff1a\u8ba1\u7b97\u51fa \u5de6/\u53f3\u5b50\u6811\u7684\u6700\u5927\u6df1\u5ea6\n# \u56e0\u6b64 \u5b50\u95ee\u9898\u4e0e\u539f\u95ee\u9898\u662f\u76f8\u4f3c\u7684\n\n# \u7c7b\u6bd4\u5faa\u73af\uff0c\u6267\u884c\u7684\u4ee3\u7 fbe\uff0c\u5219\u94fe\u8868\u4e2d\u5b58\u5728\u73af\u3002\n  * \u4e3a\u4e86\u8868\u793a\u7ed9\u5b9a\u94fe\u8868\u4e2d\u7684\u73af\uff0c\u8bc4\u6d4b\u7cfb\u7edf\u5185\u90e8\u4f7f\u7528\u6574\u6570 `pos` \u6765\u8868\u793a\u94fe\u8868\u5c3e\u8fde\u63a5\u5230\u94fe\u8868\u4e2d\u7684\u4f4d\u7f6e\uff08\u7d22\u5f15\u4ece 0 \u5f00\u59cb\uff09\u3002**\u6ce8\u610f\uff1a`pos` \u4e0d\u4f5c\u4e3a\u53c2\u6570\u8fdb\u884c\u4f20\u9012**\u3002\u4ec5\u4ec5\u662f\u4e3a\u4e86\u6807\u8bc6\u94fe\u8868\u7684\u5b9e\u9645\u60c5\u51b5\u3002\n  * \u5982\u679c\u94fe\u8868\u4e2d\u5b58\u5728\u73af\uff0c\u5219\u8fd4\u56de `true` \uff1b\u5426\u5219\uff0c\u8fd4\u56de `false` \u3002\n\n### Constraints / \u7ea6\u675f\u6761\u4ef6\n* \u94fe\u8868\u4e2d\u8282\u70b9\u7684\u6570\u76ee\u8303\u56f4\u662f $[0, 10^4]$\n* $-10^5 \\le \\text{Node.val} \\le 10^5$\n* `pos` \u4e3a `-1` \u6216\u8005\u94fe\u8868\u4e2d\u7684\u4e00\u4e2a **\u6709\u6548\u7d22\u5f15**\u3002\n* **\u8fdb\u9636 (Follow-up)**\uff1a\u4f60\u80fd\u5426\u4f7f\u7528 $\\mathcal{O}(1)$\uff08\u5373\uff0c\u5e38\u91cf\uff09\u5185\u5b58\u89e3\u51b3\u6b64\u95ee\u9898\uff1f\n\n---\n\n## 2. Problem Blueprint & Core Invariant / \u9898\u610f\u8003\u70b9\u84dd\u56fe\u4e0e\u6838\u5fc3\u4e0d\u53d8\u91cf\n\n```\n\u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n\u2502 \ud83c\udfaf \u8003\u8bd5\u4e0e\u9762\u8bd5\u8003\u5bdf\u6838\u5fc3\u84dd\u56fe (Interview Blueprint)                             \u2502\n\u251c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2524\n\u2502 1. \u76f8\u5bf9\u8fd0\u52a8\u4e0e\u901f\u7387\u5dee\u6a21\u578b: slow \u6b65\u957f\u4e3a 1\uff0cfast \u6b65\u957f\u4e3a 2\u3002                      \u2502\n\u2502 2. \u95ed\u73af\u5fc5\u9047\u6570\u5b66\u5b9a\u7406: fast \u76f8\u5bf9 slow \u7684\u76f8\u5bf9\u8ffd\u53ca\u901f\u5ea6\u6052\u4e3a 2 - 1 = 1 \u8282\u70b9/\u6b65\u3002  \u2502\n\u2502    \u5728\u5468\u957f\u4e3a C \u7684\u73af\u5185\uff0c\u4e24\u8005\u76f8\u5bf9\u8ddd\u79bb\u6bcf\u6b65\u4e25\u683c\u9012\u51cf 1\uff0c\u7edd\u4e0d\u4f1a\u51fa\u73b0\u201c\u8de8\u8d8a\u9519\u8fc7\u201d\u3002    \u2502\n\u2502 3. \u5bf9\u8c61\u540c\u4e00\u6027\u5224\u65ad (Object Identity): \u5fc5\u987b\u4f7f\u7528 is \u6216 id() \u6bd4\u5bf9\u5185\u5b58\u5730\u5740\uff0c    \u2502\n\u2502    \u7edd\u4e0d\u80fd\u4ec5\u6bd4\u5bf9\u8282\u70b9\u6570\u503c (.val)\uff0c\u9632\u6b62\u4e0d\u540c\u8282\u70b9\u7684\u6570\u503c\u91cd\u590d\u5f15\u53d1\u8bef\u5224\u3002            \u2502\n\u2502 4. \u53cc\u91cd\u9632\u8d8a\u754c\u5b88\u536b: while fast and fast.next\uff08\u9632 None.next \u5f02\u5e38\uff09\u3002         \u2502\n\u2502 5. \u7a7a\u95f4\u6781\u81f4\u7ea6\u675f: \u6452\u5f03\u54c8\u5e0c\u8868\u989d\u5916 O(n) \u5f00\u9500\uff0c\u8fbe\u6210\u8fdb\u9636\u4e25\u683c O(1) \u5e38\u6570\u5185\u5b58\u3002     \u2502\n\u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n```\n\n---\n\n## 3. Core Idea, Mental Model & Pattern Lineage / \u6838\u5fc3\u601d\u8def\u4e0e\u601d\u7ef4\u8c31\u7cfb\n\n### \ud83e\udde0 \u5feb\u6162\u53cc\u6307\u9488\u7b97\u6cd5\u601d\u7ef4\u8c31\u7cfb\u6f14\u5316\u6811 (Pattern Lineage)\n\n```\n\u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n\u2502 \ud83e\udde0 Fast-Slow Two Pointer Pattern Lineage (\u5feb\u6162\u53cc\u6307\u9488\u601d\u7ef4\u8c31\u7cfb\u6f14\u5316\u6811)          \u2502\n\u251c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2524\n\u2502                                                                             \u2502\n\u2502  Level 1 (Primitive): LC 876 Middle of the Linked List                      \u2502\n\u2502  \u2514\u2500 \u4e0d\u53d8\u91cf (Invariant): 2:1 \u901f\u5ea6\u5dee\u5b9a\u4f4d\u65e0\u73af\u94fe\u8868\u4e2d\u70b9\u3002                         \u2502\n\u2502        \u2502                                                                    \u2502\n\u2502        \u25bc [\u6f14\u8fdb Twist: \u94fe\u8868\u5c3e\u90e8\u6210\u73af\uff0c\u5feb\u6162\u6307\u9488\u8fdb\u51 =[ -4 ] \u2500\u2500\u25ba fast is slow \u4e3a True\uff01\n\ud83c\udf89 \u5224\u5b9a\u6210\u529f\uff0c\u8fd4\u56de True\uff01\n```\n\n---\n\n## 4. Step-by-Step Code Walkthrough / \u4ee3\u7801\u9010\u884c\u8be6\u89e3\n\n\u57fa\u4e8e\u4f60\u5728 `top-100/lc-0141-linked-list-cycle.py` \u4e2d\u7684\u6807\u51c6\u5b9e\u73b0\uff1a\n\n```python\nfrom typing import Optional\n\n# Definition for singly-linked list.\nclass ListNode:\n    def __init__(self, x):\n        self.val = x\n        self.next = None\n\nclass Solution:\n    def hasCycle(self, head: Optional[ListNode]) -> bool:\n```\n\n---\n\n```python\n        slow = head\n        fast = head\n```\n\n* **[EN] Action:** Initializes both `slow` and `fast` pointers at `head`.\n  * **Role:** `slow` advances 1 step per cycle; `fast` advances 2 steps per cycle.\n* **[CN] \u52a8\u4f5c**\uff1a\u5c06\u5feb\u6162\u4e24\u6307\u9488\u540c\u65f6\u521d\u59cb\u5316\u5728\u94fe\u8868\u5934\u8282\u70b9 `head`\u3002\n  * **\u4f5c\u7528**\uff1a`slow` \u4e3a\u6162\u901f\u5de1\u68c0\u6307\u9488\uff08\u6bcf\u6b21 1 \u6b65\uff09\uff1b`fast` \u4e3a\u500d\u901f\u63a2\u9488\uff08\u6bcf\u6b21 2 \u6b65\uff09\u3002\n\n---\n\n```python\n        while fast and fast.next:\n            slow = slow.next\n            fast = fast.next.next\n\n            if fast is slow:\n                return True\n```\n\n* **[EN] Action:** Traverses the linked list while guarding against null-pointer errors:\n  1. `while fast and fast.next:`: Ensures both `fast` and `fast.next` exist so `fast.next.next` is safe.\n  2. `slow = slow.next`: Slow moves 1 node forward.\n  3. `fast = fast.next.next`: Fast moves 2 nodes forward.\n  4. `if fast is slow:`: Checks reference identity (points to the exact same memory address). If true, a cycle is detected immediately.\n* **[CN] \u52a8\u4f5c**\uff1a\u5faa\u73af\u63a8\u8fdb\u53cc\u6307\u9488\u5e76\u8fdb\u884c\u78b0\u649e\u68c0\u6d4b\uff1a\n  1. `while fast and fast.next:`\uff1a\u9632\u8d8a\u754c\u5b88\u536b\u3002\u786e\u4fdd `fast` \u53ca\u5176\u540e\u7ee7\u8282\u70b9\u5747\u5b58\u5728\uff0c\u907f\u514d\u8bbf\u95ee `fast.next.next` \u65f6\u629b\u51fa\u7a7a\u6307\u9488\u5f02\u5e38\u3002\n  2. `slow = slow.next`\uff1a\u6162\u6307\u9488\u5355\u6b65\u6b65\u8fdb\u3002\n  3. `fast = fast.next.next`\uff1a\u5feb\u6307\u9488\u53cc\u6b65\u6b65\u8fdb\u3002\n  4. `if fast is slow:`\uff1a\u5185\u5b58\u5730\u5740\u540c\u4e00\u6027\u6821\u9a8c\u3002\u82e5\u4e24\u6307\u9488\u6307\u5411\u540c\u4e00\u4e2a\u8282\u70b9\u5bf9\u8c61\uff0c\u5219\u8bc1\u5b9e\u5b58\u5728\u73af\uff0c\u7acb\u5373\u8fd4\u56de `True`\u3002\n\n---\n\n```python\n        return False\n```\n\n* **[EN] Action:** If `fast` or `fast.next` becomes `None`, the list has reached an end (linear structure with no cycle), so return `False`.\n* **[CN] \u52a8\u4f5c**\uff1a\u5982\u679c `while` \u5faa\u73af\u6b63\u5e38\u7ed3\u675f\uff08\u5373\u5feb\u6307\u9488\u89e6\u5e95\u5230\u8fbe `None`\uff09\uff0c\u8bf4\u660e\u94fe\u8868\u662f\u6709\u5c3d\u5934\u7684\u7ebf\u6027\u65e0\u73af\u7ed3\u6784\uff0c\u8fd4\u56de `False`\u3002\n\n---\n\n## 5. Interview Simulation & Follow-Up Pivots / \u9762\u8bd5\u5b98\u73b0\u573a\u8ffd\u95ee\u6f14\u7ec3\n\n### \ud83c\udfa4 \u8ffd\u95ee 1\uff1a\u5982\u679c\u4e0d\u7528\u5feb\u6162\u53cc\u6307\u9488\uff0c\u6700\u76f4\u89c2\u7684\u54c8\u5e0c\u8868\u89e3\u6cd5\u5982\u4f55\u5199\uff1f\u4e24\u79cd\u89e3\u6cd5\u5982\u4f55\u505a\u67b6\u6784\u6743\u8861\uff1f\n\n* **\u9762\u8bd5\u5b98\u610f\u56fe**\uff1a\u8003\u5bdf\u5019\u9009\u4eba\u5bf9\u65f6\u7a7a\u6743\u8861\uff08Time-Space Trade-off\uff09\u7684\u7406\u89e3\u3002\n* **\u54c8\u5e0c\u8868\u89e3\u6cd5\u5b9e\u73b0**\uff1a\n  ```python\n  # \u8303\u5f0f 2: \u54c8\u5e0c\u8868\u8bb0\u5f55\u5df2\u8bbf\u95ee\u8282\u70b9\u96c6\u5408 (Hash Set)\n  class SolutionHashSet:\n      def hasCycle(self, head: Optional[ListNode]) -> bool:\n          visited = set()\n          cur = head\n          while cur:\n              if cur in visited:\n                  return True\n              visited.add(cur)\n              cur = cur.next\n          return False\n  ```\n* **\u67b6\u6784\u6743\u8861\u5bf9\u6bd4**\uff1a\n  * \u54c8\u5e0c\u8868\u6cd5\u903b\u8f91\u6781\u4e3a\u76f4\u89c2\uff0c\u4f46\u9700\u8981 $\\mathcal{O}(n)$ \u8f85\u52a9\u5185\u5b58\uff0c\u8fdd\u80cc\u8fdb\u9636 $\\mathcal{O}(1)$ \u5e38\u6570\u7a7a\u95f4\u7ea6\u675f\u3002\n  * \u5feb\u6162\u6307\u9488\u6cd5\u5c06\u7a7a\u95f4\u590d\u6742\u5ea6\u4ece $\\mathcal{O}(n)$ \u964d\u4e3a\u4e25\u683c\u7684 $\\mathcal{O}(1)$\uff0c\u4e14\u5355\u8d9f\u904d\u5386\u6027\u80fd\u66f4\u4f18\u3002\n\n---\n\n### \ud83c\udfa4 \u8ffd\u95ee 2\uff1a\u4e3a\u4ec0\u4e48\u5224\u65ad\u76f8\u9047\u5fc5\u987b\u7528 `fast is slow`\uff0c\u800c\u4e0d\u80fd\u5199 `fast.val == slow.val`\uff1f\n\n* **\u9762\u8bd5\u5b98\u610f\u56fe**\uff1a\u8003\u5bdf\u5bf9 Python \u5f15\u7528\u673a\u5236\u4e0e\u6570\u636e\u7ed3\u6784\u672c\u8d28\u7684\u7406\u89e3\uff08Identity vs. Equality\uff09\u3002\n* **\u6838\u5fc3\u89e3\u6790**\uff1a\n  * \u94fe\u8868\u4e2d\u5b8c\u5168\u53ef\u4ee5\u5b58\u5728**\u6570\u503c\u76f8\u540c\u4f46\u5904\u4e8e\u4e0d\u540c\u4f4d\u7f6e\u7684\u4e24\u4e2a\u72ec\u7acb\u8282\u70b9**\uff08\u4f8b\u5982 `1 -> 1 -> 1 -> None`\uff09\u3002\n  * \u82e5\u5199 `fast.val == slow.val`\uff0c\u5f53\u5feb\u6307\u9488\u8d70\u5230\u7b2c 3 \u4e2a\u8282\u70b9\uff08\u503c\u4e3a 1\uff09\u3001\u6162\u6307\u9488\u8d70\u5230\u7b2c 2 \u4e2a\u8282\u70b9\uff08\u503c\u4e3a 1\uff09\u65f6\uff0c\u4f1a\u89e6\u53d1**\u9519\u8bef\u5224\u5b9a\u4e3a\u6709\u73af\uff08False Positive\uff09**\uff01\n  * `is` \u64cd\u4f5c\u7b26\u6bd4\u5bf9\u7684\u662f**\u5e95\u5c42\u5185\u5b58\u5730\u5740 `id(fast) == id(slow)`**\uff0c\u53ea\u6709\u6307\u9488\u771f\u6b63\u6307\u5728\u540c\u4e00\u4e2a\u7269\u7406\u8282\u70b9\u4e0a\u65f6\u624d\u6210\u7acb\u3002\n\n---\n\n### \ud83c\udfa4 \u8ffd\u95ee 3\uff1a\u5982\u679c\u9762\u8bd5\u5b98\u8fdb\u4e00\u6b65\u8981\u6c42\u201c\u627e\u51fa\u73af\u7684\u5165\u53e3\u8282\u70b9 (LC 142)\u201d\uff0c\u4f60\u5982\u4f55\u62d3\u5c55\uff1f\n\n* **\u9762\u8bd5\u5b98\u610f\u56fe**\uff1a\u8003\u5bdf\u77e5\u8bc6\u4f53\u7cfb\u7684\u6a2a\u5411\u8fc1\u79fb\u80fd\u529b\u3002\n* **\u7834\u5c40\u63a8\u5bfc**\uff1a\n  * \u8bbe\u5934\u5230\u5165\u73af\u70b9\u8ddd\u79bb\u4e3a $a$\uff0c\u5165\u73af\u70b9\u5230\u521d\u6b21\u76f8\u9047\u70b9\u8ddd\u79bb\u4e3a $b$\uff0c\u73af\u5269\u4f59\u957f\u5ea6\u4e3a $c$\uff08\u73af\u957f\u4e3a $b + c$\uff09\u3002\n  * \u76f8\u9047\u65f6\uff1a$s = a + b$\uff0c$f = 2(a + b) = a + k(b + c) + b$\u3002\n  * \u5316\u7b80\u5f97\uff1a$a = (k - 1)(b + c) + c$\u3002\n  * **\u7ed3\u8bba**\uff1a\u76f8\u9047\u540e\uff0c\u5c06\u4e00\u4e2a\u6307\u9488\u91cd\u7f6e\u56de `head`\uff0c\u53e6\u4e00\u4e2a\u6307\u9488\u4fdd\u6301\u5728\u76f8\u9047\u70b9\uff0c\u4e24\u6307\u9488\u6bcf\u6b21\u540c\u901f\u8d70 1 \u6b65\uff0c**\u518d\u6b21\u76f8\u9047\u5904\u5fc5\u4e3a\u5165\u73af\u70b9**\uff01\n\n---\n\n## 6. The Error Log & Dry-Run / \u9519\u9898\u6392\u67e5\u4e0e\u5b9e\u4f8b\u63a8\u6f14\n\n### \u26a0\ufe0f \u9519\u9898\u6392\u67e5\u4e0e\u53cd\u6a21\u5f0f\u8bca\u65ad (The Error Log: Anti-Patterns & Defensive Fixes)\n\n```\n\u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n\u2502 \u26a0\ufe0f \u53cd\u6a21\u5f0f 1\uff1a\u503c\u6bd4\u5bf9 (Value Equality) \u8bef\u66ff \u5185\u5b58\u5730\u5740\u540c\u4e00\u6027\u6bd4\u5bf9 (Object Identity)                             \u2502\n\u251c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2524\n\u2502 \u274c \u9519\u8bef\u5199\u6cd5:                                                                                                \u2502\n\u2502    if fast.val == slow.val:  # \u81f4\u547d\uff1a\u5bf9\u4e8e\u65e0\u73af\u4f46\u5b58\u5728\u91cd\u590d\u6570\u503c\u7684\u94fe\u8868 [1, 1, 1] \u4f1a\u8bef\u5224\u4e3a\u6709\u73af\uff01                 \u2502\n\u2502        return True                                                                                          \u2502\n\u2502                                                                                                             \u2502\n\u2502 \ud83c\udfaf \u7ffb\u8f66\u673a\u7406 (Root Cause):                                                                                   \u2502\n\u2502    \u8282\u70b9\u503c\u76f8\u540c\u5e76\u4e0d\u4ee3\u8868\u662f\u540c\u4e00\u4e2a\u8282\u70b9\u3002\u53ea\u6709\u6307\u9488\u5728\u5185\u5b58\u5806\u7a7a\u95f4\u4e2d\u6307\u5411\u540c\u4e00\u7269\u7406\u5730\u5740\u65f6\uff0c\u624d\u662f\u62d3\u6251\u4e0a\u7684\u540c\u4e00\u4e2a\u8282\u70b9\u3002       \u2502\n\u2502                                                                                                             \u2502\n\u2502 \ud83d\udee1\ufe0f \u9632\u5fa1\u53e3\u8bc0 (Invariant):                                                                                   \u2502\n\u2502    \u3010\u5224\u73af\u6bd4\u5730\u5740\uff0c\u7edd\u4e0d\u6bd4\u6570\u503c\u3011\uff1a\u4e25\u683c\u4f7f\u7528 `if fast is slow:` \u6216 `if id(fast) == id(slow):`                   \u2502\n\u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n```\n\n| \u5e38\u89c1\u6613\u9519\u53cd\u6a21\u5f0f (Buggy Anti-Pattern) | \u7ffb\u8f66\u73b0\u8c61\u4e0e\u75c7\u72b6 (Symptom) | \u6df1\u5c42\u7ffb\u8f66\u673a\u7406 (Root Cause) | \u9632\u5fa1\u6027\u4fee\u590d\u7b56\u7565 (Defensive Invariant) |\n| :--- | :--- | :--- | :--- |\n| **`if fast.val == slow.val:`** | \u91cd\u590d\u503c\u65e0\u73af\u94fe\u8868\u62a5\u51fa\u9519\u8bef\u7684 `True` | \u8bef\u5c06\u201c\u8282\u70b9\u503c\u76f8\u7b49\u201d\u5f53\u4f5c\u201c\u62d3\u6251\u8282\u70b9\u91cd\u5408\u201d | \u5fc5\u987b\u4f7f\u7528\u5bf9\u8c61\u540c\u4e00\u6027\u5224\u65ad `if fast is slow:` |\n| **`while fast.next and fast:`** | `AttributeError: 'NoneType' object has no attribute 'next'` | \u77ed\u8def\u6c42\u503c\u987a\u5e8f\u9519\u8bef\uff0c\u5bf9 `None` \u8bbf\u95ee\u4e86 `.next` | \u4e25\u683c\u4fdd\u6301\u5148\u5224\u81ea\u8eab\u540e\u5224\u5b50\u8282\u70b9\u7684\u987a\u5e8f `while fast and fast.next:` |\n| **\u5feb\u6162\u6307\u9488\u521d\u59cb\u9519\u4f4d\u672a\u8c03\u7ec8\u6b62\u6761\u4ef6** | \u521d\u59cb\u65f6\u82e5 `fast = head.next` \u4f1a\u6f0f\u6389\u5355\u8282\u70b9\u81ea\u73af | \u521d\u59cb\u6307\u9488\u72b6\u6001\u4e0e\u5faa\u73af\u5b88\u536b\u4e0d\u5339\u914d | \u63a8\u8350\u521d\u59cb\u4e24\u6307\u9488\u90fd\u5728 `head`\uff0c\u5728\u5faa\u73af\u4f53\u5185\u505a `if fast is slow:` |\n\n---\n\n### \u2753 \u5e38\u89c1\u7591\u96be\u4e0e\u8fb9\u754c\u6392\u67e5 (Boundary FAQs)\n\n* **Q1: \u94fe\u8868\u4e3a\u7a7a (`head = None`) \u65f6\u4f1a\u53d1\u751f\u4ec0\u4e48\uff1f**\n  * `slow = None, fast = None`\uff0c`while fast and fast.next:` \u76f4\u63a5\u5224\u5b9a\u4e3a False\uff0c\u8df3\u51fa\u5faa\u73af\u8fd4\u56de `False`\uff0c\u5b8c\u5168\u6b63\u786e\u3002\n* **Q2: \u94fe\u8868\u4ec5\u6709 1 \u4e2a\u65e0\u73af\u8282\u70b9 (`[1]`) \u65f6\u4f1a\u53d1\u751f\u4ec0\u4e48\uff1f**\n  * `fast.next` \u4e3a `None`\uff0c`while` \u5faa\u73af\u4e0d\u6267\u884c\uff0c\u76f4\u63a5\u8fd4\u56de `False`\uff0c\u5b8c\u5168\u6b63\u786e\u3002\n* **Q3: \u94fe\u8868\u4ec5\u6709 1 \u4e2a\u81ea\u73af\u8282\u70b9 (`[1] -> [1]`) \u65f6\u4f1a\u53d1\u751f\u4ec0\u4e48\uff1f**\n  * \u6b65 1\uff1a`slow` \u524d\u8fdb\u4e00\u6b65\u4ecd\u5728\u8282\u70b9 1\uff0c`fast` \u524d\u8fdb\u4e24\u6b65\u4e5f\u4ecd\u5728\u8282\u70b9 1\uff0c`fast is slow` \u6210\u7acb\uff0c\u8fd4\u56de `True`\uff0c\u5b8c\u5168\u6b63\u786e\u3002\n\n---\n\n### \ud83c\udfa8 \u5b9e\u4f8b\u5168\u7a0b\u63a8\u6f14\u8868 (Complete Dry-Run)\n\n**\u8f93\u5165**\uff1a`head = [3, 2, 0, -4]`, `pos = 1`\uff08\u8282\u70b9 `-4` \u8fde\u5411\u8282\u70b9 `2`\uff09\n\n| \u8f6e\u6b21 | `slow` \u4f4d\u7f6e | `fast` \u4f4d\u7f6e | `fast.next` \u5b58\u5728? | `fast is slow` \u5224\u5b9a | \u52a8\u4f5c\u8bf4\u660e |\n| :---: | :---: | :---: | :---: | :---: | :--- |\n| **\u521d\u59cb** | `[3]` | `[3]` | `[2]` (\u5b58\u5728) | \u2014 | \u53cc\u6307\u9488\u5728\u8d77\u70b9\u5c31\u4f4d |\n| **\u7b2c 1 \u8f6e** | `[2]` | `[0]` | `[-4]` (\u5b58\u5728) | False (`[0] != [2]`) | `slow` \u8d70 1 \u6b65\u8fdb\u73af\uff0c`fast` \u8d70 2 \u6b65\u8fdb\u73af |\n| **\u7b2c 2 \u8f6e** | `[0]` | `[2]` | `[0]` (\u5b58\u5728) | False (`[2] != [0]`) | `fast` \u5728\u73af\u5185\u8ffd\u5     return False\n    \n", "diff": "Easy", "py_file": "top-100/lc-0141-linked-list-cycle.py", "md_file": "top-100/lc-0141-linked-list-cycle.md"}, "top-100/lc-0142-linked-list-cycle-ii": {"key": "top-100/lc-0142-linked-list-cycle-ii", "category": "Top 100 Liked Track", "title": "Top 100 Liked Track: LC 0142 linked list cycle ii", "short": "LC 0142 linked list cycle ii", "path": "top-100/lc-0142-linked-list-cycle-ii", "type": "problem", "notes": "# LeetCode 142. Linked List Cycle II (\u73af\u5f62\u94fe\u8868 II)\n## Step-by-Step Code Walkthrough & Notes / \u4ee3\u7801\u9010\u884c\u8be6\u89e3\u4e0e\u77e5\u8bc6\u70b9\u603b\u7ed3\n\n- **Difficulty:** Medium (\u5feb\u6162\u53cc\u6307\u9488\u7ecf\u5178\u9898 / \u6570\u5b66\u8ffd\u53ca\u76f8\u9047\u4e0e\u5165\u73af\u70b9\u5b9a\u4f4d)\n- **Tags:** Linked List, Two Pointers, Math, Hash Table\n- **Corresponding Python File:** [`top-100/lc-0142-linked-list-cycle-ii.py`](top-100/lc-0142-linked-list-cycle-ii.py)\n\n---\n\n## 1. Problem Statement / \u9898\u76ee\u63cf\u8ff0\n\n* **[EN]** Given the `head` of a linked list, return the **node where the cycle begins**. If there is no cycle, return `null`.\n  * There is a cycle in a linked list if there is some node in the list that can be reached again by continuously following the `next` pointer.\n  * Internally, `pos` is used to denote the index of the node that tail's `next` pointer is connected to (**0-indexed**). It is `-1` if there is no cycle. **Note that `pos` is not passed as a parameter**.\n  * **Do not modify** the linked list.\n* **[CN]** \u7ed9\u5b9a\u4e00\u4e2a\u94fe\u8868\u7684\u5934\u8282\u70b9  `head` \uff0c\u8fd4\u56de\u94fe\u8868\u5f00\u59cb **\u5165\u73af\u7684\u7b2c\u4e00\u4e2a\u8282\u70b9**\u3002 \u5982\u679c\u94fe\u8868\u65e0\u73af\uff0c\u5219\u8fd4\u56de `null`\u3002\n  * \u5982\u679c\u94fe\u8868\u4e2d\u6709\u67d0\u4e2a\u8282\u70b9\uff0c\u53ef\u4ee5\u901a\u8fc7\u8fde\u7eed\u8ddf\u8e2a `next` \u6307\u9488\u518d\u6b21\u5230\u8fbe\uff0c\u5219\u94fe\u8868\u4e2d\u5b58\u5728\u73af\u3002\n  * \u4e3a\u4e86\u8868\u793a\u7ed9\u5b9a\u94fe\u8868\u4e2d\u7684\u73af\uff0c\u8bc4\u6d4b\u7cfb\u7edf\u5185\u90e8\u4f7f\u7528\u6574\u6570 `pos` \u6765\u8868\u793a\u94fe\u8868\u5c3e\u8fde\u63a5\u5230\u94fe\u8868\u4e2d\u7684\u4f4d\u7f6e\uff08\u7d22\u5f15\u4ece 0 \u5f00\u59cb\uff09\u3002\u5982\u679c `pos` \u662f `-1`\uff0c\u5219\u5728\u8be5\u94fe\u8868\u4e2d\u6ca1\u6709\u73af\u3002**\u6ce8\u610f\uff1a`pos` \u4e0d\u4f5c\u4e3a\u53c2\u6570\u8fdb\u884c\u4f20\u9012**\uff0c\u4ec5\u4ec5\u662f\u4e3a\u4e86\u6807\u8bc6\u94fe\u8868\u7684\u5b9e\u9645\u60c5\u51b5\u3002\n  * **\u4e0d\u5141\u8bb8\u4fee\u6539** \u94fe\u8868\u3002\n\n### Constraints / \u7ea6\u675f\u6761\u4ef6\n* \u94fe\u8868\u4e2d\u8282\u70b9\u7684\u6570\u76ee\u8303\u56f4\u5728\u8303\u56f4 $[0, 10^4]$ \u5185\n* $-10^5 \\le \\text{Node.val} \\le 10^5$\n* `pos` \u7684\u503c\u4e3a `-1` \u6216\u8005\u94fe\u8868\u4e2d\u7684\u4e00\u4e2a\u6709\u6548\u7d22\u5f15\n* **\u8fdb\u9636 (Follow-up)**\uff1a\u4f60\u80fd\u5426\u4f7f\u7528 $\\mathcal{O}(1)$\uff08\u5373\uff0c\u5e38\u91cf\uff09\u5185\u5b58\u89e3\u51b3\u6b64\u95ee\u9898\uff1f\n\n---\n\n## 2. Problem Blueprint & Core Invariant / \u9898\u610f\u8003\u70b9\u84dd\u56fe\u4e0e\u6838\u5fc3\u4e0d\u53d8\u91cf\n\n```\n\u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n\u2502 \ud83c\udfaf \u8003\u8bd5\u4e0e\u9762\u8bd5\u8003\u5bdf\u6838\u5fc3\u84dd\u56fe (Interview Blueprint)                             \u2502\n\u251c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2524\n\u2502 1. \u4e24\u9636\u6bb5\u5224\u5b9a\u6cd5\u5219 (Two-Phase Algorithm):                                     \u2502\n\u2502    \u2022 \u9636\u6bb5 1: \u5feb\u6162\u53cc\u6307\u9488\u68c0\u6d4b\u662f\u5426\u5b58\u5728\u78b0\u649e\u70b9 (fast is slow)\u3002                   \u2502\n\u2502    \u2022 \u9636\u6bb5 2: \u5355\u6b65\u540c\u901f\u6307\u9488\u8ffd\u53ca\u5b9a\u4f4d\u5165\u73af\u70b9 (head \u4e0e slow \u540c\u6b65\u8d70 a \u6b65\u76f8\u9047)\u3002     \u2502\n\u2502 2. \u6838\u5fc3\u6570\u5b66\u6052\u7b49\u5f0f: a = (k - 1)(b + c) + c  ==>  \u5f53 k=1 \u65f6, a = c\u3002          \u2502\n\u2502 3. \u5185\u5b58\u5730\u5740\u540c\u4e00\u6027\u7ea6\u675f: \u6821\u9a8c\u4f7f\u7528 is / is not\uff0c\u4e25\u7981\u4f7f\u7528\u6570\u503c == \u6bd4\u8f83\u3002          \u2502\n\u2502 4. \u7a7a\u95f4\u4e0e\u7ed3\u6784\u7ea6\u675f: \u4e25\u7981\u4fee\u6539\u94fe\u8868\u7ed3\u6784\uff0c\u7a7a\u95f4\u4e25\u683c\u5e38\u6570 O(1)\u3002                    \u2502\n\u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n```\n\n---\n\n## 3. Core Idea, Mental Model & Pattern Lineage / \u6838\u5fc3\u601d\u8def\u4e0e\u601d\u7ef4\u8c31\u7cfb\n\n### \ud83e\udde0 \u5feb\u6162\u53cc\u6307\u9488\u7b97\u6cd5\u601d\u7ef4\u8c31\u7cfb\u6f14\u5316\u6811 (Pattern Lineage)\n\n```\n\u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n\u2502 \ud83e\udde0 Fast-Slow Two Pointer Pattern Lineage (\u5feb\u6162\u53cc\u6307\u9488\u601d\u7ef4\u8c31\u7cfb\u6f14\u5316\u6811)          \u2502\n\u251c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2524\n\u2502                                                                             \u2502\n\u2502  Level 1 (Primitive): LC 876 Middle of the Linked List                      \u2502\n\u2502  \u2514\u2500 \u4e0d\u53d8\u91cf (Invariant): 2:1 \u901f\u5ea6\u5dee\u5b9a\u4f4d\u65e0\u73af\u94fe\u8868\u4e2d\u70b9\u3002                         \u2502\n\u2502        \u2502                                                                    \u2502\n\u2502        \u25bc [\u6f14\u8fdb Twist: \u95ed\u73af\u8ffd\u53ca\u76f8\u9047\u68c0\u6d4b]                                      \u2502\n\u2502  Level 2 (Collision): LC 141 Linked List Cycle                              \u2502\n\u2502  \u2514\u2500 \u4e0d\u53d8\u91cf (Invariant): \u76f8\u5bf9\u901f\u5ea6\u4e3a 1\uff0c\u73af\u5185\u6709\u9650\u6b65\u5185\u5fc5\u5728\u540c\u4e00\u8282\u70b9\u53d1\u751f\u7269\u7406\u78b0\u649e\u3002 \u2502\n\u2502        \u2502                                                                    \u2502\n\u2502        \u25bc [\u6f14\u8fdb Twist: \u78b0\u649e\u540e\u901a\u8fc7\u6570\u5b66\u7b49\u5f0f\u5b9a\u4f4d\u3010\u5165\u73af\u7b2c\u4e00\u4e2a\u8282\u70b9\u3011(\u672c\u9898 \u2605)]      \u2502\n\u2502  Level 3 (Math Loc):  LC 142 Linked List Cycle II                           \u2502\n\u2502  \u2514\u2500 \u4e0d\u53d8\u91cf (Invariant): a = (k-1)(b+c) + c\uff0chead \u4e0e slow \u540c\u901f\u76f8\u9047\u4e8e\u5165\u73af\u70b9\u3002 \u2502\n\u2502        \u2502                                                                    \u2502\n\u2502        \u25bc [\u6f14\u8fdb Twist: \u5c06\u9690\u5f0f\u6570\u7ec4\u6620\u5c04\u4e3a\u94fe\u8868\u56fe\uff0c\u5229\u7528\u5224\u73af\u5bfb\u627e\u6570\u7ec4\u91cd\u590d\u6570]        \u2502\n\u2502  Level 4 (Array Graph): LC 287 Find the Duplicate Number                    \u2502\n\u2502  \u2514\u2500 \u4e0d\u53d8\u91cf (Invariant): \u5c06 nums[i] \u89c6\u4f5c next \u6307\u9488\uff0c\u5728\u503c\u57df\u56fe\u4e2d\u5bfb\u627e\u73af\u5165\u53e3\u3002     \u2502\n\u2502                                                                             \u2502\n\u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n```\n\n---\n\n### \ud83d\udca1 \u6838\u5fc3\u6570\u5b66\u539f\u7406\u63a8\u5bfc\uff1a\u4e3a\u4ec0\u4e48\u76f8\u9047\u540e\u540c\u6b65\u8d70\u5fc5\u5728\u5165\u53e3\u76f8\u9047\uff1f\n\n\u8fd9\u662f\u9762\u8bd5\u4e2d**\u88ab\u63d0\u95ee\u9891\u7387\u6781\u9ad8\u7684\u7ecf\u5178\u6570\u5b66\u63a8\u5bfc\u9898**\uff1a\n\n```\n\u94fe\u8868\u7ed3\u6784\u62d3\u6251\u4e0e\u8ddd\u79bb\u5b9a\u4e49:\n\n      head (\u8d77\u70b9)\n        \u2502\n      a \u2502 (\u975e\u73af\u90e8\u5206\u957f\u5ea6)\n        \u25bc\n     [\u5165\u73af\u70b9] \u25c4\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n        \u2502                    \u2502\n      b \u2502 (\u5165\u73af\u70b9\u5230\u76f8\u9047\u70b9)    \u2502 c (\u76f8\u9047\u70b9\u56de\u73af\u5230\u5165\u73af\u70b9)\n        \u25bc                    \u2502\n     [\u76f8\u9047\u70b9] \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n     (slow, fast \u91cd\u5408\u5904)\n     \n\u73af\u5468\u957f = b + c\n```\n\n#### \ud83d\udcd0 \u4e25\u5bc6\u4ee3\u6570\u63a8\u5bfc\u8fc7\u7a0b (Mathematical Proof)\n1. **\u8bbe\u5404\u4e2a\u8def\u6bb5\u957f\u5ea6**\uff1a\n   * \u94fe\u8868\u5934 `head` \u5230\u5165\u73af\u70b9\u7684\u8ddd\u79bb\u4e3a $a$\u3002\n   * \u5165\u73af\u70b9\u987a\u65f6\u9488\u8d70\u5230\u4e24\u6307\u9488\u521d\u6b21\u76f8\u9047\u70b9\u7684\u8ddd\u79bb\u4e3a $b$\u3002\n   * \u76f8\u9047\u70b9\u7ee7\u7eed\u987a\u65f6\u9488\u8d70\u5230\u5165\u73af\u70b9\u7684\u5269\u4f59\u8ddd\u79bb\u4e3a $c$\u3002\n   * \u663e\u7136\uff0c\u6574\u4e2a\u73af\u7684\u5468\u957f\u4e3a $L = b + c$\u3002\n\n2. **\u5217\u51fa\u521d\u6b21\u76f8\u9047\u65f6\u7684\u8def\u7a0b\u65b9\u7a0b**\uff1a\n   * \u6162\u6307\u9488 `slow` \u8d70\u7684\u8ddd\u79bb\uff1a$d_{\\text{slow}} = a + b$\uff08\u6162\u6307\u9488\u5728\u8fdb\u73af\u540e\u8d70\u7684\u7b2c\u4e00\u5708\u5185\u5fc5\u5b9a\u88ab\u5feb\u6307\u9488\u8ffd\u4e0a\uff0c\u56e0\u6b64\u6162\u6307\u9488\u5728\u73af\u5185\u8d70\u8fc7\u7684\u8ddd\u79bb\u6070\u4e3a $b$\uff09\u3002\n   * \u5feb\u6307\u9488 `fast` \u8d70\u7684\u8ddd\u79bb\uff1a$d_{\\text{fast}} = a + k(b + c) + b$\uff08\u5176\u4e2d $k \\ge 1$ \u8868\u793a\u5feb\u6307\u9488\u5728\u73af\u5185\u8f6c\u4e86 $k$ \u5708\uff09\u3002\n\n3. **\u5229\u7528\u5feb\u6307\u9488\u901f\u5ea6\u662f\u6162\u6307\u9488 2 \u500d\u5217\u7b49\u5f0f**\uff1a\n   $$d_{\\text{fast}} = 2 \\cdot d_{\\text{slow}}$$\n   $$a + k(b + c) + b = 2(a + b)$$\n   $$a + k(b + c) + b = 2a + 2b$$\n   $$a + b = k(b + c)$$\n   $$a = k(b + c) - b$$\n   $$a = (k - 1)(b + c) + (b + c) - b$$\n   $$a = (k - 1)(b + c) + c$$\n\n4. **\u6570\u5b66\u7ed3\u8bba\u4e0e\u7269\u7406\u610f\u4e49**\uff1a\n   * \u516c\u5f0f $a = (k - 1)(b + c) + c$ \u7684\u7269\u7406\u542b\u4e49\u975e\u5e38\u76f4\u89c2\uff1a\n     * \u4ece\u94fe\u8868\u5934 `head` \u8d70 $a$ \u6b65\u5230\u8fbe\u5165\u73af\u70b9\uff1b\n     * \u4ece\u76f8\u9047\u70b9\u51fa\u53d1\u8d70 $c$ \u6b65\uff08\u52a0\u4e0a\u53ef\u80fd\u5728\u73af\u5185\u591a\u8f6c\u7684 $k - 1$ \u6574\u5708\uff09\uff0c\u4e5f**\u521a\u597d\u5230\u8fbe\u5165\u73af\u70b9**\uff01\n   * **\u7834\u5c40\u52a8\u4f5c**\uff1a\u76f8\u9047\u540e\uff0c\u5c06\u6307\u9488 `head` \u548c\u76f8\u9047\u70b9\u7684\u6307\u9488 `slow` **\u4ee5\u76f8\u540c\u7684\u901f\u5ea6\uff08\u6bcf\u6b21 1 \u6b65\uff09\u5411\u524d\u63a8\u8fdb**\uff0c\u4e24\u6307\u9488\u6700\u7ec8**\u5fc5\u5b9a\u5728\u5165\u73af\u70b9\u53d1\u751f\u4e8c\u6b21\u76f8\u9047**\uff01\n\n---\n\n## 4. Step-by-Step Code Walkthrough / \u4ee3\u7801\u9010\u884c\u8be6\u89e3\n\n\u57fa\u4e8e\u4f60\u5728 `top-100/lc-0142-linked-list-cycle-ii.py` \u4e2d\u7684\u6807\u51c6\u5b9e\u73b0\uff1a\n\n```python\nfrom typing import List, Optional\n\n# Definition for singly-linked list.\nclass ListNode:\n    def __init__(self, x):\n        self.val = x\n        self.next = None\n\nclass Solution:\n    def detectCycle(self, head: Optional[ListNode]) -> Optional[ListNode]:\n```\n\n---\n\n```python\n        slow = head\n        fast = head\n\n        while fast and fast.next:\n            slow = slow.next\n            fast = fast.next.next\n\n            if fast is slow:\n```\n\n* **[EN] Action (Phase 1):** Detects if a cycle exists using Floyd's Tortoise and Hare algorithm.\n  * `slow` moves 1 step, `fast` moves 2 steps.\n  * When `fast is slow`, collision occurs inside the cycle.\n* **[CN] \u52a8\u4f5c (\u9636\u6bb5 1)**\uff1a\u4f7f\u7528 Floyd \u5feb\u6162\u53cc\u6307\u9488\u8fdb\u884c\u78b0\u649e\u68c0\u6d4b\u3002\n  * `slow` \u6b65\u957f\u4e3a 1\uff0c`fast` \u6b65\u957f\u4e3a 2\u3002\n  * \u5f53 `fast is slow` \u6210\u7acb\u65f6\uff0c\u8bf4\u660e\u5feb\u6162\u6307\u9488\u5728\u73af\u5185\u53d1\u751f\u7269\u7406\u78b0\u649e\uff0c\u6210\u529f\u8bc1\u5b9e\u73af\u7684\u5b58\u5728\u3002\n\n---\n\n```python\n                while slow is not head:\n                    slow = slow.next\n                    head = head.next\n                return slow\n```\n\n* **[EN] Action (Phase 2):** Locates the entry node of the cycle based on $a = (k-1)(b+c) + c$.\n  * Advances `head` and `slow` concurrently at speed 1 step per iteration.\n  * When `slow is head`, both pointers have met exactly at the cycle entry node.\n  * Returns `slow` (the entry node).\n* **[CN] \u52a8\u4f5c (\u9636\u6bb5 2)**\uff1a\u6839\u636e\u6570\u5b66\u5b9a\u7406 $a = c$ \u540c\u6b65\u5b9a\u4f4d\u5165\u73af\u70b9\u3002\n  * \u4fdd\u6301 `slow` \u505c\u5728\u76f8\u9047\u70b9\uff0c\u5c06 `head` \u4f5c\u4e3a\u53e6\u4e00\u4e2a\u8d77\u70b9\u63a2\u9488\u3002\n  * \u4e24\u8005\u540c\u65f6\u4ee5\u6bcf\u6b21 1 \u6b65\u7684\u6052\u5b9a\u901f\u5ea6\u5411\u524d\u8d70\u3002\n  * \u5f53 `slow is head` \u65f6\uff0c\u4e24\u6307\u9488\u5728\u5165\u73af\u70b9\u76f8\u9047\uff0c\u8fd4\u56de\u8be5\u8282\u70b9\u3002\n\n---\n\n```python\n        return None\n```\n\n* **[EN] Action:** If `fast` or `fast.next` reaches `None`, the list is acyclic, so returns `None`.\n* **[CN] \u52a8\u4f5c**\uff1a\u5982\u679c\u5feb\u6307\u9488\u89e6\u5e95\u5230\u8fbe\u94fe\u8868\u672b\u5c3e\uff0c\u8bf4\u660e\u65e0\u73af\uff0c\u76f4\u63a5\u8fd4\u56de `None`\u3002\n\n---\n\n## 5. Interview Simulation & Follow-Up Pivots / \u9762\u8bd5\u5b98\u73b0\u573a\u8ffd\u95ee\u6f14\u7ec3\n\n### \ud83c\udfa4 \u8ffd\u95ee 1\uff1a\u5982\u679c\u9762\u8bd5\u5b98\u8981\u6c42\u7528\u54c8\u5e0c\u8868\u5b9e\u73b0\uff0c\u4ee3\u7801\u5982\u4f55\u5199\uff1f\u4e3a\u4ec0\u4e48\u5feb\u6162\u6307\u9488\u66f4\u53d7\u5927\u5382\u9752\u7750\uff1f\n\n* **\u54c8\u5e0c\u8868\u5b9e\u73b0\u4ee3\u7801**\uff1a\n  ```python\n  # \u8303\u5f0f 2: \u54c8\u5e0c\u96c6\u5408\u8bb0\u5f55\u8282\u70b9\u5f15\u7528 (Hash Set - O(n) Space)\n  class SolutionHashSet:\n      def detectCycle(self, head: Optional[ListNode]) -> Optional[ListNode]:\n          visited = set()\n          cur = head\n          while cur:\n              if cur in visited:\n                  return cur  # \u9996\u6b21\u91cd\u590d\u8bbf\u95ee\u7684\u8282\u70b9\u5373\u4e3a\u5165\u73af\u70b9\n              visited.add(cur)\n              cur = cur.next\n          return None\n  ```\n* **\u67b6\u6784\u6743\u8861\u89e3\u6790**\uff1a\n  * \u54c8\u5e0c\u8868\u6cd5\u9700\u8981\u7ef4\u62a4\u4e00\u4e2a\u96c6\u5408\u4fdd\u5b58\u6240\u6709\u8282\u70b9\u5f15\u7528\uff0c\u7a7a\u95f4\u590d\u6742\u5ea6\u4e3a $\\mathcal{O}(n)$\u3002\u5728\u5305\u542b\u4e0a\u4e07\u4e2a\u8282\u70b9\u7684\u5de5\u4e1a\u7ea7\u94fe\u8868\u4e0a\u4f1a\u4ea7\u751f\u53ef\u89c2\u7684\u5185\u5b58\u5206\u914d\u4e0e\u54c8\u5e0c\u78b0\u649e\u5f00\u9500\u3002\n  * \u5feb\u6162\u6307\u9488\u6cd5\u5c06\u7a7a\u95f4\u590d\u6742\u5ea6\u538b\u7f29\u81f3\u4e25\u683c\u7684\u5e38\u6570 $\\mathcal{O}(1)$\uff0c\u4e14\u65e0\u9700\u4efb\u4f55\u5185\u5b58\u5206\u914d\uff0c\u4f53\u73b0\u4e86\u6781\u81f4\u7684\u7b97\u6cd5\u5de5\u7a0b\u7d20\u517b\u3002\n\n---\n\n### \ud83c\udfa4 \u8ffd\u95ee 2\uff1a\u4e3a\u4ec0\u4e48\u6162\u6307\u9488 `slow` \u8fdb\u73af\u4e4b\u540e\uff0c\u5728\u8d70\u5b8c\u7b2c\u4e00\u5708\u4e4b\u5185\u5c31\u5fc5\u7136\u4e0e\u5feb\u6307\u9488\u76f8\u9047\uff1f\n\n* **\u9762\u8bd5\u5b98\u610f\u56fe**\uff1a\u8003\u5bdf\u5bf9\u73af\u5185\u8ffd\u53ca\u7ec6\u8282\u4e0e\u4e25\u683c\u4e0a\u754c\u7684\u638c\u63e1\u3002\n* **\u4e25\u683c\u8bc1\u660e**\uff1a\n  * \u5f53 `slow` \u521a\u5230\u8fbe\u5165\u73af\u70b9\u65f6\uff0c`fast` \u5df2\u7ecf\u5728\u73af\u5185\u7684\u67d0\u4e2a\u4f4d\u7f6e\uff0c\u4e24\u8005\u5728\u73af\u5185\u7684\u8ffd\u53ca\u8ddd\u79bb $d < b+c$\uff08\u5c0f\u4e8e 1 \u5708\u5468\u957f\uff09\u3002\n  * \u76f8\u5bf9\u901f\u5ea6\u4e3a $1$ \u8282\u70b9/\u6b65\uff0c\u56e0\u6b64\u6700\u591a\u53ea\u9700\u8981 $d$ \u6b65\uff08\u5373\u5c0f\u4e8e 1 \u5708\uff09\u5feb\u6307\u9488\u5c31\u80fd\u8ffd\u4e0a\u6162\u6307\u9488\u3002\n  * \u6162\u6307\u9488\u6bcf\u6b65\u53ea\u8d70 1 \u4e2a\u8282\u70b9\uff0c\u56e0\u6b64\u5728\u8d70\u5b8c\u7b2c\u4e00\u5708\u4e4b\u524d\uff08\u5373\u8d70\u8fc7\u8ddd\u79bb $< b+c$\uff09\u5fc5\u5b9a\u4e0e\u5feb\u6307\u9488\u76f8\u9047\uff01\n\n---\n\n### \ud83c\udfa4 \u8ffd\u95ee 3\uff1a\u8fd9\u5957\u53cc\u6307\u9488\u6570\u5b66\u6a21\u578b\u5982\u4f55\u65e0\u7f1d\u8fc1\u79fb\u89e3\u51b3 LeetCode 287 (\u5bfb\u627e\u91cd\u590d\u6570)\uff1f\n\n* **\u9762\u8bd5\u5b98\u610f\u56fe**\uff1a\u8003\u5bdf\u7b97\u6cd5\u6a21\u578b\u7684\u62bd\u8c61\u4e0e\u6a2a\u5411\u8fc1\u79fb\u80fd\u529b\u3002\n* **\u7834\u5c40\u601d\u8def**\uff1a\n  * \u5728\u6570\u7ec4 `nums` \u4e2d\uff0c\u5c06\u7d22\u5f15 $i$ \u89c6\u4f5c\u8282\u70b9\uff0c\u5c06\u6570\u503c `nums[i]` \u89c6\u4f5c\u6307\u5411\u4e0b\u4e00\u4e2a\u8282\u70b9\u7684\u6307\u9488 `node.next`\u3002\n  * \u56e0\u4e3a\u5b58\u5728\u91cd\u590d\u6570\uff0c\u5fc5\u7136\u6709\u4e24\u4e2a\u4e0d\u540c\u7684\u4e0b\u6807\u6307\u5411\u540c\u4e00\u4e2a\u6570\u503c\u8282\u70b9\uff0c\u4ece\u800c\u5728\u503c\u57df\u56fe\u4e2d**\u6784\u6210\u95ed\u73af**\uff01\n  * \u91cd\u590d\u6570\u6070\u597d\u5c31\u662f\u503c\u57df\u56fe\u7684**\u73af\u5165\u53e3\u70b9**\uff01\u76f4\u63a5\u5957\u7528\u672c\u9898\u7684\u53cc\u6307\u9488\u6a21\u7248\uff0c\u5373\u53ef\u5728 $\\mathcal{O}(1)$ \u7a7a\u95f4\u4e14\u4e0d\u4fee\u6539\u539f\u6570\u7ec4\u7684\u524d\u63d0\u4e0b\u627e\u5230\u91cd\u590d\u6570\u3002\n\n---\n\n## 6. The Error Log & Dry-Run / \u9519\u9898\u6392\u67e5\u4e0e\u5b9e\u4f8b\u63a8\u6f14\n\n### \u26a0\ufe0f \u9519\u9898\u6392\u67e5\u4e0e\u53cd\u6a21\u5f0f\u8bca\u65ad (The Error Log: ow.next                                                                                     \u2502\n\u2502        head = head.next                                                                                     \u2502\n\u2502                                                                                                             \u2502\n\u2502 \ud83c\udfaf \u7ffb\u8f66\u673a\u7406 (Root Cause):                                                                                   \u2502\n\u2502    \u5355\u94fe\u8868\u4e2d\u591a\u4e2a\u8282\u70b9\u53ef\u4ee5\u62e5\u6709\u5b8c\u5168\u76f8\u540c\u7684\u6570\u503c\u3002\u53ea\u6709\u5185\u5b58\u5730\u5740 `is / is not` \u624d\u80fd\u4ee3\u8868\u94fe\u8868\u62d3\u6251\u4e0a\u7684\u540c\u4e00\u7269\u7406\u8282\u70b9\u3002   \u2502\n\u2502                                                                                                             \u2502\n\u2502 \ud83d\udee1\ufe0f \u9632\u5fa1\u53e3\u8bc0 (Invariant):                                                                                   \u2502\n\u2502    \u3010\u5bfb\u5165\u53e3\u6bd4\u5bf9\u8c61\u540c\u4e00\u6027\uff0c\u7edd\u4e0d\u6bd4\u503c\u3011\uff1a\u4e25\u683c\u4f7f\u7528 `while slow is not head:`                                     \u2502\n\u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n```\n\n| \u5e38\u89c1\u6613\u9519\u53cd\u6a21\u5f0f (Buggy Anti-Pattern) | \u7ffb\u8f66\u73b0\u8c61\u4e0e\u75c7\u72b6 (Symptom) | \u6df1\u5c42\u7ffb\u8f66\u673a\u7406 (Root Cause) | \u9632\u5fa1\u6027\u4fee\u590d\u7b56\u7565 (Defensive Invariant) |\n| :--- | :--- | :--- | :--- |\n| **`while slow.val != head.val:`** | \u91cd\u590d\u503c\u94fe\u8868\u5728\u5165\u73af\u524d\u63d0\u524d\u8bef\u8fd4\u56de | \u6df7\u6dc6\u4e86\u6570\u503c\u76f8\u7b49\u4e0e\u8282\u70b9\u540c\u4e00\u6027 | \u4e25\u683c\u4f7f\u7528\u5bf9\u8c61\u540c\u4e00\u6027\u5224\u65ad `while slow is not head:` |\n| **\u9636\u6bb5 2 \u5feb\u6307\u9488\u4ecd\u4ee5 2 \u6b65\u901f\u5ea6\u8d70** | \u4e24\u6307\u9488\u4e0d\u65ad\u5728\u73af\u5185\u9519\u5f00\uff0c\u65e0\u6cd5\u5728\u5165\u73af\u70b9\u76f8\u9047 | \u8fdd\u80cc\u4e86 $a = c$ \u7684\u5355\u6b65\u540c\u901f\u6570\u5b66\u524d\u63d0 | \u9636\u6bb5 2 \u4e24\u6307\u9488\u901f\u5ea6\u5fc5\u987b**\u4e25\u683c\u5747\u4e3a 1 \u6b65** |\n| **\u672a\u5224\u7a7a\u76f4\u63a5\u8bbf\u95ee `head.next`** | `AttributeError: 'NoneType' object has no attribute 'next'` | \u7a7a\u94fe\u8868\u6216\u5355\u8282\u70b9\u65e0\u73af\u9632\u5fa1\u4e0d\u8db3 | \u4f9d\u8d56 `while fast and fast.next:` \u4f5c\u4e3a\u5b88\u536b\u6761\u4ef6 |\n\n---\n\n### \u2753 \u5e38\u89c1\u7591\u96be\u4e0e\u8fb9\u754c\u6392\u67e5 (Boundary FAQs)\n\n* **Q1: \u82e5\u6574\u4e2a\u94fe\u8868\u5c31\u662f\u4e00\u4e2a\u5b8c\u6574\u7684\u7eaf\u5927\u73af\uff08$a = 0$\uff0c\u5373 `pos = 0`\uff09\u4f1a\u600e\u6837\uff1f**\n  * \u76f8\u9047\u540e\uff0c`head` \u5c31\u5728\u5165\u73af\u70b9\uff0c`slow` \u8d70 $c = 0$ \u6b65\u540e\u4e24\u8005\u7acb\u5373\u91cd\u5408\uff0c`while slow is not head:` \u4e00\u6b21\u90fd\u4e0d\u6267\u884c\uff0c\u76f4\u63a5\u8fd4\u56de `head`\uff0c\u5b8c\u5168\u6b63\u786e\u3002\n* **Q2: \u94fe\u8868\u4ec5\u6709 1 \u4e2a\u81ea\u73af\u8282\u70b9 (`[1] -> [1]`, `pos = 0`) \u4f1a\u600e\u6837\uff1f**\n  * \u9636\u6bb5 1\uff1a`slow` \u548c `fast` \u8d70 1 \u6b65\u540e\u5747\u505c\u5728\u8282\u70b9 1\uff0c\u5224\u5b9a\u76f8\u9047\u3002\n  * \u9636\u6bb5 2\uff1a`slow` \u4e0e `head` \u5747\u5728\u8282\u70b9 1\uff0c\u76f4\u63a5\u8fd4\u56de\u8282\u70b9 1\uff0c\u5b8c\u5168\u6b63\u786e\u3002\n* **Q3: \u65e0\u73af\u94fe\u8868 (`pos = -1`) \u4f1a\u600e\u6837\uff1f**\n  * \u5feb\u6307\u9488 `fast` \u9047\u5230 `None`\uff0c\u8df3\u51fa `while` \u5faa\u73af\u8fd4\u56de `None`\uff0c\u5b8c\u5168\u6b63\u786e\u3002\n\n---\n\n### \ud83c\udfa8 \u5b9e\u4f8b\u5168\u7a0b\u63a8\u6f14\u8868 (Complete Dry-Run)\n\n**\u8f93\u5165**\uff1a`head = [3, 2, 0, -4]`, `pos = 1`\uff08\u5c3e\u8282\u70b9 `-4` \u8fde\u5411\u7d22\u5f15 1 \u7684\u8282\u70b9 `2`\uff1b$a = 1, b = 2, c = 1$\uff09\n\n| \u9636\u6bb5 | \u6b65\u9aa4 | `slow` \u4f4d\u7f6e | `fast` / `head` \u4f4d\u7f6e | \u8bf4\u660e |\n| :---: | :---: | :---: | :---: | :--- |\n| **\u9636\u6bb5 1\uff1a\u78b0\u649e\u68c0\u6d4b** | \u521d\u59cb | `[3]` | `fast = [3]` | \u5feb\u6162\u53cc\u6307\u9488\u5728\u8d77\u70b9\u5c31\u4f4d |\n| | \u6b65 1 | `[2]` | `fast = [0]` | `slow` \u8fdb\u73af\uff0c`fast` \u8de8 2 \u6b65 |\n| | \u6b65 2 | `[0]` | `fast = [2]` | `fast` \u73af\u5185\u8ffd\u53ca |\n| | \u6b65 3 | `[-4]` | `fast = [-4]` | **`fast is slow` \u6210\u7acb\uff01\u5728\u8282\u70b9 `[-4]` \u78b0\u649e\uff01** |\n| **\u9636\u6bb5 2\uff1a\u5b9a\u4f4d\u5165\u73af\u70b9** | \u521d\u59cb | `[-4]` (\u76f8\u9047\u70b9) | `head = [3]` (\u8d77\u70b9) | \u542f\u52a8\u5355\u6b65\u540c\u6b65\u8ffd\u53ca |\n| | \u6b65 1 | `[2]` | `head = [2]` | `slow` \u8d70 $c=1$ \u6b65\u5230\u8fbe `[2]`\uff0c`head` \u8d70 $a=1$ \u6b65\u5230\u8fbe `[2]` |\n| | \u5224\u5b9a | `[2]` | `[2]` | **`slow is head` \u6210\u7acb\uff01\u5728\u5165\u73af\u70b9 `[2]` \u76f8\u9047\uff01** |\n| **\u6700\u7ec8\u8fd4\u56de** | \u2014 | \u2014 | \u2014 | \u8fd4\u56de\u8282\u70b9 `[2]` (\u503c\u4e3a 2\uff0c\u6b63\u786e) |\n\n---\n\n## 7. Complexity Analysis / \u590d\u6742\u5ea6\u5206\u6790\n\n| \u7ef4\u5ea6 | \u590d\u6742\u5ea6 | \u8bf4\u660e\u4e0e\u7406\u8bba\u652f\u6491 |\n| :--- | :---: | :--- |\n| **\u65f6\u95f4\u590d\u6742\u5ea6 (Time Complexity)** | $\\mathcal{O}(n)$ | 1. **\u9636\u6bb5 1**\uff1a\u6162\u6307\u9488\u5728\u73af\u5185\u8d70\u4e0d\u8d85\u8fc7 1 \u5708\uff08$< n$ \u6b65\uff09\u5373\u4e0e\u5feb\u6307\u9488\u76f8\u9047\uff0c\u8017\u65f6 $\\le 2n$ \u6b65\u3002<br>2. **\u9636\u6bb5 2**\uff1a\u4e24\u6307\u9488\u5404\u8d70 $a \\le n$ \u6b65\u5728\u5165\u73af\u70b9\u76f8\u9047\uff0c\u8017\u65f6 $\\le n$ \u6b65\u3002<br>\u603b\u6b65\u6570\u4e0d\u8d85\u8fc7 $3n$\uff0c\u4e25\u683c\u7ebf\u6027\u65f6\u95f4 $\\mathcal{O}(n)$\u3002 |\n| **\u7a7a\u95f4\u590d\u6742\u5ea6 (Space Complexity)** | $\\mathcal{O}(1)$ | \u4ec5\u4f7f\u7528\u4e86 `slow` \u548c `fast` \u8f85\u52a9\u6307\u9488\u53d8\u91cf\uff0c\u65e0\u4efb\u4f55\u54c8\u5e0c\u8868\u6216\u52a8\u6001\u6570\u7ec4\u5f00\u9500\uff0c\u6ee1\u8db3\u8fdb\u9636\u4e25\u683c\u5e38\u6570\u7a7a\u95f4\u8981\u6c42\u3002 |\n", "code": "from typing import List, Optional\n\n# Definition for singly-linked list.\nclass ListNode:\n    def __init__(self, x):\n        self.val = x\n        self.next = None\n\n\nclass Solution:\n    def detectCycle(self, head: Optional[ListNode]) -> Optional[ListNode]:\n        slow = head\n        fast = head\n\n        while fast and fast.next:\n            slow = slow.next\n            fast = fast.next.next\n\n            if fast is slow:\n                while slow is not head:\n                    slow = slow.next\n                    head = head.next\n                return slow\n\n        return None\n\n# O(n)\n\n\n\n", "diff": "Medium", "py_file": "top-100/lc-0142-linked-list-cycle-ii.py", "md_file": "top-100/lc-0142-linked-list-cycle-ii.md"}, "top-100/lc-0146-lru-cache": {"key": "top-100/lc-0146-lru-cache", "category": "Top 100 Liked Track", "title": "Top 100 Liked Track: LC 0146 lru cache", "short": "LC 0146 lru cache", "path": "top-100/lc-0146-lru-cache", "type": "problem", "notes": "", "code": "from typing import List, Optional\n\nclass Solution:\n    pass\n", "diff": "Medium", "py_file": "top-100/lc-0146-lru-cache.
