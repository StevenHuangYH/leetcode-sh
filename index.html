f38\u7f29\uff1b\u800c\u672c\u9898\u662f**\u5b9a\u957f\u6ed1\u52a8\u7a97\u53e3**\uff0c\u7a97\u53e3\u957f\u5ea6\u59cb\u7ec8\u4e3a $k$\u3002\n\n---\n\n```python\n            # Use set() so that duplicate numbers inside the SAME window are only counted once\n            for num in set(current_window):\n                window_counts[num] = window_counts.get(num, 0) + 1\n```\n\n* **[EN] Action:** Converts the current window into a `set()` and increments the count for each unique number.\n  * **What is `set()` used for?** `set()` automatically **removes duplicates** within the current window. If a window is `[7, 2, 1, 7]`, `set` reduces it to `{1, 2, 7}` so that the number `7` is counted as appearing in this window only **once**.\n  * **What does `.get(num, 0)` do?** Returns the existing count if `num` is already in the dictionary; otherwise returns `0`.\n* **[CN] \u52a8\u4f5c**\uff1a\u5c06\u5f53\u524d\u7a97\u53e3\u8f6c\u4e3a\u96c6\u5408 `set()`\uff0c\u5e76\u8ba9\u5176\u4e2d\u6bcf\u4e2a\u4e0d\u540c\u5143\u7d20\u7684\u8ba1\u6570\u52a0 1\u3002\n  * **`set()` \u7684\u4f5c\u7528**\uff1a**\u81ea\u52a8\u53bb\u91cd**\u3002\u5982\u679c\u4e00\u4e2a\u7a97\u53e3\u662f `[7, 2, 1, 7]`\uff0c\u8f6c\u6210 `set` \u540e\u53d8\u6210 `{1, 2, 7}`\uff0c\u786e\u4fdd\u6570\u5b57 `7` \u5728\u8fd9\u4e00\u4e2a\u7a97\u53e3\u4e2d\u53ea\u88ab\u8ba1\u5165 1 \u6b21\u3002\n  * **`.get(num, 0)` \u7684\u4f5c\u7528**\uff1a\u5982\u679c `num` \u5df2\u7ecf\u5728\u5b57\u5178\u91cc\uff0c\u53d6\u5176\u65e7\u503c\uff1b\u5982\u679c\u4e0d\u5728\uff0c\u7ed9\u9ed8\u8ba4\u503c `0`\u3002\n\n---\n\n```python\n        # Find the largest number that appeared in EXACTLY 1 window\n        max_val = -1\n        for num, count in window_counts.items():\n            if count == 1:\n                max_val = max(max_val, num)\n                \n        return max_val\n```\n\n* **[EN] Action:** Scans the dictionary to find all numbers where `count == 1`, returning the maximum value. If no number has `count == 1`, returns the default `-1`.\n* **[CN] \u52a8\u4f5c**\uff1a\u904d\u5386\u5b57\u5178\u4e2d\u6240\u6709 `count == 1` \u7684\u5019\u9009\u6570\u5b57\uff0c\u53d6\u6700\u5927\u503c `max_val` \u8fd4\u56de\uff1b\u82e5\u6ca1\u6709\u4efb\u4f55\u6570\u5b57\u6ee1\u8db3\u6761\u4ef6\uff0c\u76f4\u63a5\u8fd4\u56de\u521d\u59cb\u503c `-1`\u3002\n\n---\n\n## 3. Key FAQs & Concept Clarifications / \u6838\u5fc3\u7b54\u7591\n\n### Q1: \u793a\u4f8b 1 \u4e2d `nums = [3, 9, 2, 1, 7], k = 3`\uff0c\u4e3a\u4ec0\u4e48\u7b54\u6848\u662f 7 \u800c\u4e0d\u662f 9\uff1f\n* **\u6240\u6709\u957f\u5ea6\u4e3a 3 \u7684\u7a97\u53e3\uff1a**\n  1. `[3, 9, 2]`\n  2. `[9, 2, 1]`\n  3. `[2, 1, 7]`\n* **\u7edf\u8ba1\u51fa\u73b0\u7a97\u53e3\u6570\uff1a**\n  * `9` \u51fa\u73b0\u5728\u4e86\u7a97\u53e3 1 \u548c\u7a97\u53e3 2 $\\rightarrow$ **\u51fa\u73b0 2 \u6b21** \u274c\uff08\u88ab\u6dd8\u6c70\uff0c\u4e0d\u7b26\u5408\u201c\u6070\u597d 1 \u6b21\u201d\uff09\n  * `3` \u51fa\u73b0\u5728\u7a97\u53e3 1 $\\rightarrow$ **\u51fa\u73b0 1 \u6b21** \u2705\n  * `7` \u51fa\u73b0\u5728\u7a97\u53e3 3 $\\rightarrow$ **\u51fa\u73b0 1 \u6b21** \u2705\n* \u5728\u7b26\u5408\u6761\u4ef6\u7684 `{3, 7}` \u4e2d\uff0c\u6700\u5927\u7684\u662f **`7`** ($\\max(3, 7) = 7$)\u3002\n\n---\n\n### Q2: \u4ec0\u4e48\u65f6\u5019\u4f1a\u8fd4\u56de `-1`\uff1f\n* \u5f53\u6570\u7ec4\u4e2d\u7684**\u6bcf\u4e00\u4e2a\u6570\u5b57**\u90fd\u51fa\u73b0\u5728 0 \u4e2a\u6216 $\\ge 2$ \u4e2a\u957f\u5ea6\u4e3a $k$ \u7684\u5b50\u6570\u7ec4\u4e2d\u65f6\u3002\n* **\u4f8b\u5982 `nums = [0, 0], k = 1`\uff1a** \u4e24\u4e2a\u957f\u5ea6\u4e3a 1 \u7684\u7a97\u53e3 `[0]` \u548c `[0]` \u90fd\u5305\u542b 0\uff0c\u6240\u4ee5 0 \u51fa\u73b0\u4e86 2 \u6b21\uff0c\u6ca1\u6709\u7b26\u5408\u201c\u6070\u597d 1 \u6b21\u201d\u7684\u6570\u5b57\uff0c\u8fd4\u56de **`-1`**\u3002\n\n---\n\n### Q3: \u53d8\u957f\u6ed1\u52a8\u7a97\u53e3 (`lc4`, `lc6`) vs \u5b9a\u957f\u6ed1\u52a8\u7a97\u53e3 (\u672c\u9898) \u7684\u5bf9\u6bd4\n\n| \u7ef4\u5ea6 | `lc4` (LC 3) / `lc6` (LC 209) | `lc3471` (Almost Missing) |\n| :--- | :--- | :--- |\n| **\u7a97\u53e3\u5927\u5c0f** | **\u53d8\u957f**\uff1a\u7a97\u53e3\u5927\u5c0f\u52a8\u6001\u6539\u53d8 | **\u5b9a\u957f**\uff1a\u56fa\u5b9a\u4e3a $k$ |\n| **\u6c42\u89e3\u76ee\u6807** | \u6c42\u89e3\u6700\u957f/\u6700\u77ed\u7684**\u7a97\u53e3\u957f\u5ea6**\uff08`max_len` / `min_len`\uff09 | \u7edf\u8ba1\u843d\u5728\u7a97\u53e3\u5185\u7684**\u6570\u5b57\u9891\u6570** |\n| **\u6307\u9488\u79fb\u52a8** | `left` \u548c `right` \u6839\u636e\u6761\u4ef6\u52a8\u6001\u4f38\u7f29 | \u6bcf\u6b21\u6574\u4f53\u5e73\u79fb $k$ \u957f\u5ea6\u7684\u5207\u7247 |\n\n---\n\n## 4. \u65b9\u6848 2\uff1a$\\mathcal{O}(n)$ \u6700\u4f18\u6570\u5b66\u5206\u7c7b\u8ba8\u8bba (Optimal Math Approach)\n\n\u901a\u8fc7\u6570\u5b66\u63a8\u5bfc\uff0c\u4efb\u4f55\u5185\u90e8\u5143\u7d20\uff08$0 < i < n - 1$\uff09\u5728 $1 < k < n$ \u65f6\u5fc5\u7136\u88ab\u81f3\u5c11 2 \u4e2a\u7a97\u53e3\u8986\u76d6\u3002\u56e0\u6b64\u53ea\u6709\u4e24\u7aef\u5143\u7d20\u624d\u53ef\u80fd\u662f\u7b54\u6848\uff1a\n\n```python\nclass SolutionOptimal:\n    def largestInteger(self, nums: List[int], k: int) -> int:\n        n = len(nums)\n        freq = Counter(nums)\n        \n        # Case 1: k == 1 -> \u8fd4\u56de\u5168\u5c40\u53ea\u51fa\u73b0 1 \u6b21\u7684\u6700\u5927\u5143\u7d20\n        if k == 1:\n            unique_nums = [x for x, c in freq.items() if c == 1]\n            return max(unique_nums) if unique_nums else -1\n        \n        # Case 2: k == n -> \u6574\u4e2a\u6570\u7ec4\u5c31\u662f\u552f\u4e00\u7684\u7a97\u53e3\uff0c\u8fd4\u56de\u6700\u5927\u5143\u7d20\n        if k == n:\n            return max(nums)\n        \n        # Case 3: 1 < k < n -> \u53ea\u6709 nums[0] \u548c nums[-1] \u53ef\u80fd\u662f\u5019\u9009\n        candidates = []\n        if freq[nums[0]] == 1:\n            candidates.append(nums[0])\n        if freq[nums[-1]] == 1:\n            candidates.append(nums[-1])\n            \n        return max(candidates) if candidates else -1\n```\n\n---\n\n## 5. Complexity Analysis / \u590d\u6742\u5ea6\u5206\u6790\n\n* **\u5b9a\u957f\u6ed1\u52a8\u7a97\u53e3\u6cd5 (Method 1):**\n  * **\u65f6\u95f4\u590d\u6742\u5ea6 (Time):** $\\mathcal{O}(n \\times k)$ \u2014 \u904d\u5386 $n - k + 1$ \u4e2a\u7a97\u53e3\uff0c\u6bcf\u4e2a\u7a97\u53e3\u5207\u7247\u53ca\u8f6c set \u9700\u8981 $\\mathcal{O}(k)$\u3002\n  * **\u7a7a\u95f4\u590d\u6742\u5ea6 (Space):** $\\mathcal{O}(n)$ \u2014 \u54c8\u5e0c\u8868\u5b58\u50a8\u4e0d\u540c\u5143\u7d20\u9891\u6570\u3002\n* **\u6570\u5b66\u5206\u7c7b\u8ba8\u8bba\u6cd5 (Method 2):**\n  * **\u65f6\u95f4\u590d\u6742\u5ea6 (Time):** $\\mathcal{O}(n)$ \u2014 \u4ec5\u9700\u4e00\u6b21\u7ebf\u6027\u626b\u63cf\u7edf\u8ba1\u9891\u6570\u3002\n  * **\u7a7a\u95f4\u590d\u6742\u5ea6 (Space):** $\\mathcal{O}(n)$ \u2014 \u5b58\u50a8\u9891\u6570\u54c8\u5e0c\u8868\u3002\n"}, "daily-practice/s-lc-3471.py": {"category": "\ud83d\udcc5 Daily Practice Track", "title": "Daily Practice: s-lc-3471.py", "short": "LC 3471", "path": "daily-practice/s-lc-3471.py", "type": "py", "content": "# Python Solution: `s-lc-3471.py`\n\n```python\nfrom typing import List\nfrom collections import Counter\n\n# 3471. Find the Largest Almost Missing Integer\n# https://leetcode.com/problems/find-the-largest-almost-missing-integer/\n\n# ==============================================================================\n# Method 1: Fixed-Size Sliding Window (\u5b9a\u957f\u6ed1\u52a8\u7a97\u53e3 + Set \u53bb\u91cd + Dict \u9891\u6570\u7edf\u8ba1)\n# Intuitive approach using sliding window pattern\n# ==============================================================================\nclass Solution:\n    def largestInteger(self, nums: List[int], k: int) -> int:\n        window_counts = {}\n        \n        # Slide a fixed window of size k across nums\n        for i in range(len(nums) - k + 1):\n            current_window = nums[i : i + k]\n            \n            # Use set() so that duplicate numbers inside the SAME window are only counted once\n            for num in set(current_window):\n                window_counts[num] = window_counts.get(num, 0) + 1\n        \n        # Find the largest number that appeared in EXACTLY 1 window\n        max_val = -1\n        for num, count in window_counts.items():\n            if count == 1:\n                max_val = max(max_val, num)\n                \n        return max_val\n\n\n# ==============================================================================\n# Method 2: Mathematical Case Analysis (O(n) \u6700\u4f18\u6570\u5b66\u5206\u7c7b\u8ba8\u8bba)\n# ==============================================================================\nclass SolutionOptimal:\n    def largestInteger(self, nums: List[int], k: int) -> int:\n        n = len(nums)\n        freq = Counter(nums)\n        \n        # Case 1: k == 1 (Every element is its own window -> max unique element)\n        if k == 1:\n            unique_nums = [x for x, c in freq.items() if c == 1]\n            return max(unique_nums) if unique_nums else -1\n        \n        # Case 2: k == n (Only 1 window containing all elements -> max element)\n        if k == n:\n            return max(nums)\n        \n        # Case 3: 1 < k < n (Only boundary elements nums[0] and nums[-1] can appear once)\n        candidates = []\n        if freq[nums[0]] == 1:\n            candidates.append(nums[0])\n        if freq[nums[-1]] == 1:\n            candidates.append(nums[-1])\n            \n        return max(candidates) if candidates else -1\n```"}, "luffy/01-___BASICS___.txt": {"category": "\ud83d\udcda Luffy Curriculum (01-42)", "title": "Luffy Curriculum: 01-___BASICS___.txt", "short": "01-BASICS.txt", "path": "luffy/01-___BASICS___.txt", "type": "txt", "content": "# Curriculum Topic Divider: `01-___BASICS___.txt`\n\n```text\nSeparator file\n\n```"}, "luffy/02-___ARRAYS_AND_STRINGS___.txt": {"category": "\ud83d\udcda Luffy Curriculum (01-42)", "title": "Luffy Curriculum: 02-___ARRAYS_AND_STRINGS___.txt", "short": "02-ARRAYS AND STRINGS.txt", "path": "luffy/02-___ARRAY __(self, nums: List[int]):\n        self.nums = nums\n\n\n        \n\n    def sumRange(self, left: int, right: int) -> int: #general way\n        my_sum = 0\n        for i in range(left, right+1):\n            my_sum +=self.nums[i]\n        return my_sum\n            \n\n\nif __name__ == '__main__':\n    a=NumArray([0,1,2,3,4,5,6])\n    a.sumRange(0,2)\n\n\n        \n\n\n# Your NumArray object will be instantiated and called as such:\n# obj = NumArray(nums)\n# param_1 = obj.sumRange(left,right)\n```"}, "luffy/10-lc-303-new.py": {"category": "\ud83d\udcda Luffy Curriculum (01-42)", "title": "Luffy Curriculum: 10-lc-303-new.py", "short": "10 LC 303-new", "path": "luffy/10-lc-303-new.py", "type": "py", "content": "# Python Solution: `10-lc-303-new.py`\n\n```python\nfrom typing import List\nclass NumArray: #new\n\n    def __init__(self, nums: List[int]):\n        self.preSum = [0] * (len(nums) + 1) #\u7b2ci\u4e2aelement\u7684\u4f4d\u7f6e\u50a8\u5b58\u5217\u8868\u524di\u4e2a\u5143\u7d20\u7684\u548c\n        for i in range((len(nums))):\n            self.preSum[i+1] = self.preSum[i] + nums[i]\n\n\n\n    def sumRange(self, left: int, right: int) -> int: #new\n        return self.preSum[right+1] - self.preSum[left]\n        \n\n# Your NumArray object will be instantiated and called as such:\n# obj = NumArray(nums)\n# param_1 = obj.sumRange(left,right)\n      \n            \n\n\nif __name__ == '__main__':\n    a=NumArray([0,1,2,3,4,5,6])\n    a.sumRange(0,2)\n\n\n        \n\n\n```"}, "luffy/10-pre-lc-303-practices.py": {"category": "\ud83d\udcda Luffy Curriculum (01-42)", "title": "Luffy Curriculum: 10-pre-lc-303-practices.py", "short": "10-pre LC 303-practices", "path": "luffy/10-pre-lc-303-practices.py", "type": "py", "content": "# Python Solution: `10-pre-lc-303-practices.py`\n\n```python\nclass Employee:\n    empCount = 0\n\n\n\n    def __init__(self, name, salary):\n        self.name = name\n        self.salary = salary\n        Employee.empCount += 1\n    \n\n    def displayCount(self):\n        print(\"Total Employee %d\" % Employee.empCount)\n    \n    def displayEmployee(self):\n        print(\"Name : \", self.name,  \", Salary: \", self.salary)\n\n\n        \n```"}, "luffy/10-pre-main.py": {"category": "\ud83d\udcda Luffy Curriculum (01-42)", "title": "Luffy Curriculum: 10-pre-main.py", "short": "10-pre-main", "path": "luffy/10-pre-main.py", "type": "py", "content": "# Python Solution: `10-pre-main.py`\n\n```python\nfrom  car import Car\n\n\ncar_1 = Car(\"Toyota\", \"Camry\", 2020, \"Blue\")\n\nprint(car_1.make)\nprint(car_1.model)\nprint(car_1.year)\nprint(car_1.color)\n\n\ncar_1.drive()\ncar_1.stop()\n\n```"}, "luffy/11-lc-560-Subarray-Sum-equals-k": {"category": "\ud83d\udcda Luffy Curriculum (01-42)", "title": "Luffy Curriculum: 11-lc-560-Subarray-Sum-equals-k", "short": "11 LC 560-Subarray-Sum-equals-k", "path": "luffy/11-lc-560-Subarray-Sum-equals-k", "type": "other", "content": "from typing import List\n\n#can not use sliding window\n#sliding window is only applicable when the elements are all positive numbers or negative numbers, but not both\n\n\n#use prefix sum and hashtable to store the prefix sum and its frequency\nclass Solution:\n    def subarraySum(self, nums: List[int], k: int) -> int:\n        preSum = [0] * (len(nums) + 1)\n        for i in range(len(nums)):\n            preSum[i+1]= preSum[i]+nums[i]\n\n        \n        cache={}\n        count=0\n        for i, item in enumerate(preSum):\n            other = item - k\n            if other in cache:\n                count+=cache[other]\n            cache[item]=cache.get(item,0)+1\n\n        return count\n    \n#O(n)\n\n    \n\n"}, "luffy/11-prefixSum-example.py": {"category": "\ud83d\udcda Luffy Curriculum (01-42)", "title": "Luffy Curriculum: 11-prefixSum-example.py", "short": "11-prefixSum-example", "path": "luffy/11-prefixSum-example.py", "type": "py", "content": "# Python Solution: `11-prefixSum-example.py`\n\n```python\n\n# function to find the prefix sum array\ndef prefSum(arr):\n    n = len(arr)\n    \n    # to store the prefix sum\n    prefixSum = [0] * n\n\n    # initialize the first element\n    prefixSum[0] = arr[0]\n\n    # Adding present element with previous element\n    for i in range(1, n):\n        prefixSum[i] = prefixSum[i - 1] + arr[i]\n    \n    return prefixSum\n\nif __name__ == \"__main__\":\n    arr = [10, 20, 10, 5, 15]\n    prefixSum = prefSum(arr)\n    for i in prefixSum:\n        print(i, end=\" \")\n```"}, "luffy/12-lc-1109.py": {"category": "\ud83d\udcda Luffy Curriculum (01-42)", "title": "Luffy Curriculum: 12-lc-1109.py", "short": "12 LC 1109", "path": "luffy/12-lc-1109.py", "type": "py", "content": "# Python Solution: `12-lc-1109.py`\n\n```python\n#lc-1109\n#corporate flight bookings\n\nfrom typing import List\n\n#[0]*n -> create a list with n elements, each element is 0\n\nclass Solution: #general way: worst case\n    def corpFlightBookings(self, bookings: List[List[int]], n: int) -> List[int]:\n        answer = [0] * n\n        for first, last, seats in bookings:\n            for i in range(first-1, last):\n                answer[i] += seats\n\n        return answer\n\n#large range modify \n#use difference array\n\nclass Solution2:  #difference array\n    def corpFlightBookings(self, bookings: List[List[int]], n: int) -> List[int]:\n        diff = [0]*(n+1)\n        for first, last, seats in bookings:\n            diff[first-1]+=seats\n            diff[last]-=seats\n        \n        answer =[0]*n\n        last_Seats = 0 \n        for i in range(n):\n            answer[i]=last_Seats + diff[i]\n            last_Seats = answer[i]\n        return answer\n\n\n        \n\n\n\n\n\n\n\n        \n\n\n```"}, "luffy/13-___INTERVALS_AND_ARRAYS___.txt": {"category": "\ud83d\udcda Luffy Curriculum (01-42)", "title": "Luffy Curriculum: 13-___INTERVALS_AND_ARRAYS___.txt", "short": "13-INTERVALS AND ARRAYS.txt", "path": "luffy/13-___INTERVALS_AND_ARRAYS___.txt", "type": "txt", "content": "# Curriculum Topic Divider: `13-___INTERVALS_AND_ARRAYS___.txt`\n\n```text\nSeparator file\n\n```"}, "luffy/13-lc-56-merge.py": {"category": "\ud83d\udcda Luffy Curriculum (01-42)", "title": "Luffy Curriculum: 13-lc-56-merge.py", "short": "13 LC 56-merge", "path": "luffy/13-lc-56-merge.py", "type": "py", "content": "# Python Solution: `13-lc-56-merge.py`\n\n```python\n#lc-56\n#Merge Intervals\nfrom typing import List\n\nclass Solution:\n    def merge(self, intervals: List[List[int]]) -> List[List[int]]:\n\n      #need to be sorted first\n        # def get_start_num(nums):\n        #     return nums[0]\n        # intervals.sort(get_start_num)\n\n        #or use lambda [input : return] simplify funtion express\n        intervals.sort(key=lambda x:x[0])\n\n\n        #merge\n        res = []\n        i=0\n        cur = intervals[0]\n\n        while i+1<len(intervals):\n            next=intervals[i+1]\n            if cur[1]>=next[0]:  #overlapped\n                cur[1]=max(cur[1],next[1])\n            else: #if not overlapped\n                res.append(cur)\n                cur=next\n            i=i+1\n        res.append(cur)\n            \n        return res\n\n\n\n        \n\n\n\n\n\n\n\n\n```"}, "luffy/14-lc-41.py": {"category": "\ud83d\udcda Luffy Curriculum (01-42)", "title": "Luffy Curriculum: 14-lc-41.py", "short": "14 LC 41", "path": "luffy/14-lc-41.py", "type": "py", "content": "# Python Solution: `14-lc-41.py`\n\n```python\n#lc-41-missing-postive\n\nfrom typing import List\n#make array as your hash table\n\n#auxiliary space required\n# class Solution:\n#     def firstMissingPositive(self, nums: List[int]) -> int:\n#         i=1\n#         while True:\n#             if i in nums:\n#                 i=i+1\n#             else:\n#                 return i\n#         #o(n)\n            \n\n\n# class Solution:\n#     def firstMissingPositive(self, nums: List[int]) -> int:\n#         num_sets = set(nums) #O(n) space-> wrong\n#         i=1\n#         while True:\n#             if i in num_sets:\n#                 i=i+1\n#             else:\n#                 return i\n\n\n\nclass Solution: #partition \u5f52\u4f4d\n    def firstMissingPositive(self, nums: List[int]) -> int:\n        i=0\n        while i<len(nums):\n            num=nums[i]\n            if i==num-1: #partition\n                i=i+1\n            else: # not on the right postiton\n                if 1<=num<=len(nums) and nums[nums[i]-1] !=nums[i]: # 1 to n, should be in num-1\n                    # target=nums[num-1]\n                    # nums[num-1]=num\n                    # nums[i]=target\n                    nums[i], nums[num-1]=nums[num-1], nums[i] #\u4ea4\u6362\u5199\u6cd5\n                    #right side becomes a tuple\n                else: #number that is not qualify for partition\n                    i=i+1\n\n        #traversal for the num again\n        for i in range(len(nums)):\n            if i ==nums[i]-1:\n                pass\n            else:\n                return i+1\n        \n        return len(nums)+1\n    \n    \n    \n\n                \n\n\n\n\n\n\n\n\n\n\n        \n        \n```"}, "luffy/15-___LINKED_LIST___.txt": {"category": "\ud83d\udcda Luffy Curriculum (01-42)", "title": "Luffy Curriculum: 15-___LINKED_LIST___.txt", "short": "15-LINKED LIST.txt", "path": "luffy/15-___LINKED_LIST___.txt", "type": "txt", "content": "# Curriculum Topic Divider: `15-___LINKED_LIST___.txt`\n\n```text\nSeparator file\n\n```"}, "luffy/15-lc-206.py": {"category": "\ud83d\udcda Luffy Curriculum (01-42)", "title": "Luffy Curriculum: 15-lc-206.py", "short": "15 LC 206", "path": "luffy/15-lc-206.py", "type": "py", "content": "# Python Solution: `15-lc-206.py`\n\n```python\n# Definition for singly-linked list.\nclass ListNode:\n    def __init__(self, val=0, next=None):\n        self.val = val\n        self.next = next\n\nfrom typing import Optional\n\n\n# class Solution:\n#     def reverseList(self, head: Optional[ListNode]) -> Optional[ListNode]:\n#         cur=None \n#         while head!=None:\n#             cur =ListNode(head.val,cur)\n#             head=head.next\n\n#         return cur\n\n\n\nclass Solution:\n    def reverseList(self, head: Optional[ListNode]) -> Optional[ListNode]:\n        pre=None\n        \n        while head!=None:\n            next_node=head.next\n            head.next=pre\n            pre=head\n            head=next_node\n        return pre\n        \n\n\n\n         \n\n\n\n```"}, "luffy/16-lc-21.py": {"category": "\ud83d\udcda Luffy Curriculum (01-42)", "title": "Luffy Curriculum: 16-lc-21.py", "short": "16 LC 21", "path": "luffy/16-lc-21.py", "type": "py", "content": "# Python Solution: `16-lc-21.py`\n\n```python\n#lc-21\n#merge two sorted lists\nfrom typing import Optional\n\n# Definition for singly-linked list.\nclass ListNode:\n    def __init__(self, val=0, next=None):\n        self.val = val\n        self.next = next\n\n        \nclass Solution:\n    def mergeTwoLists(self, list1: Optional[ListNode], list2: Optional[ListNode]) -> Optional[ListNode]:\n        #dummy-\u865a\u62df\u5934\u8282\u70b9\n        dummy=ListNode()\n        current=dummy\n        while list1!=None and list2!=None:\n            if list1.val <=list2.val:\n                current.next=list1\n                list1=list1.next\n            else:\n                current.next=list2\n                list2=list2.next\n            current=current.next\n        if list1 == None:\n            current.next=list2\n        else:\n            current.next=list1\n\n        return dummy.next\n\n\n\n```"}, "luffy/17-lc-141.py": {"category": "\ud83d\udcda Luffy Curriculum (01-42)", "title": "Luffy Curriculum: 17-lc-141.py", "short": "17 LC 141", "path": "luffy/17-lc-141.py", "type": "py", "content": "# Python Solution: `17-lc-141.py`\n\n```python\n#lc-141\n#listed list cycle\n\nfrom typing import Optional\n\n# Definition for singly-linked list.\nclass ListNode:\n    def __init__(self, x):\n        self.val = x\n        self.next = None\n#floyd-warshall\n\n\n\nclass Solution:\n    def hasCycle(self, head: Optional[ListNode]) -> bool:\n\n        slow=head\n        fast=head\n        while fast!=None and fast.next!=None:\n            slow=slow.next\n            fast=fast.next.next\n\n            if slow==fast:\n                return True\n        return False\n            \n\n\n\n        \n```"}, "luffy/18-lc-142.py": {"category": "\ud83d\udcda Luffy Curriculum (01-42)", "title": "Luffy Curriculum: 18-lc-142.py", "short": "18 LC 142", "path": "luffy/18-lc-142.py", "type": "py", "content": "# Python Solution: `18-lc-142.py`\n\n```python\n#lc-142\n#listed-list-cycle\nfrom typing import Optional\n\n# Definition for singly-linked list.\nclass ListNode:\n    def __init__(self, x):\n        self.val = x\n        self.next = None\n\nclass Solution:\n    def detectCycle(self, head: Optional[ListNode]) -> Optional[ListNode]:\n        # 1. Initialize Pointers / \u521d\u59cb\u5316\u6307\u9488\n        # Both slow and fast pointers start at the head of the linked list.\n        # \u6162\u6307\u9488\u548c\u5feb\u6307\u9488\u90fd\u4ece\u94fe\u8868\u5934\u8282\u70b9\u5f00\u59cb\u3002\n        slow = head\n        fast = head\n        \n        # 2. Detect the Cycle / \u68c0\u6d4b\u73af\u7684\u5b58\u5728\n        # Move slow by 1 step and fast by 2 steps.\n        # \u6bcf\u6b21\u8ba9\u6162\u6307\u9488\u8d701\u6b65\uff0c\u5feb\u6307\u9488\u8d702\u6b65\u3002\n        while fast != None and fast.next != None:\n            slow = slow.next\n            fast = fast.next.next\n            \n            # If they meet, a cycle exists.\n            # \u5982\u679c\u5feb\u6162\u6307\u9488\u76f8\u9047\uff0c\u8bf4\u660e\u94fe\u8868\u4e2d\u5b58\u5728\u73af\u3002\n            if slow == fast:\n                \n                # 3. Find the Cycle Entrance / \u5bfb\u627e\u73af\u7684\u5165\u53e3\n                # The distance from the head to the cycle's entrance equals \n                # the distance from the meeting point to the entrance.\n                # \u4ece\u94fe\u8868\u5934\u90e8\u5230\u73af\u5165\u53e3\u7684\u8ddd\u79bb\uff0c\u6b63\u597d\u7b49\u4e8e\u4ece\u76f8\u9047\u70b9\u5230\u73af\u5165\u53e3\u7684\u8ddd\u79bb\u3002\n                point1 = head\n                point2 = slow\n                \n                # Move both pointers 1 step at a time until they meet.\n                # \u4e24\u4e2a\u65b0\u6307\u9488\u6bcf\u6b21\u5404\u8d701\u6b65\uff0c\u76f4\u5230\u5b83\u4eec\u518d\u6b21\u76f8\u9047\u3002\n                while point1 != point2:\n                    point1 = point1.next\n                    point2 = point2.next\n                    \n                # 4. Return Result / \u8fd4\u56de\u7ed3\u679c\n                # The node where they meet is the start of the cycle.\n                # \u5b83\u4eec\u76f8\u9047\u7684\u8282\u70b9\u5c31\u662f\u73af\u7684\u8d77\u59cb\u5165\u53e3\u8282\u70b9\u3002\n                return point1\n                \n        # If the loop finishes without returning, it means we reached the end of the list (no cycle).\n        # \u5982\u679c\u5faa\u73af\u7ed3\u675f\u90fd\u6ca1\u6709\u76f8\u9047\uff08\u9047\u5230\u4e86 None\uff09\uff0c\u8bf4\u660e\u8d70\u5230\u4e86\u94fe\u8868\u5c3d\u5934\uff0c\u4e0d\u5b58\u5728\u73af\u3002\n        return None\n\n\n            \n\n\n        \n        \n```"}, "luffy/19-___STACK_AND_QUEUE___.txt": {"category": "\ud83d\udcda Luffy Curriculum (01-42)", "title": "Luffy Curriculum: 19-___STACK_AND_QUEUE___.txt", "short": "19-STACK AND QUEUE.txt", "path": "luffy/19-___STACK_AND_QUEUE___.txt", "type": "txt", "content": "# Curriculum Topic Divider: `19-___STACK_AND_QUEUE___.txt`\n\n```text\nSeparator file\n\n```"}, "luffy/19-lc-stack-1-brackets.py": {"category": "\ud83d\udcda Luffy Curriculum (01-42)", "title": "Luffy Curriculum: 19-lc-stack-1-brackets.py", "short": "19 LC stack-1-brackets", "path": "luffy/19-lc-stack-1-brackets.py", "type": "py", "content": "# Python Solution: `19-lc-stack-1-brackets.py`\n\n```python\n#lc-20-valid0-parentheses\n\nclass Solution:\n    def isValid(self, s: str) -> bool:\n        stack=[]\n        mapping={\")\":\"(\",\"]\":\"[\",\"}\":\"{\"}\n        for char in s:\n            if char in {\"(\",\"[\",\"{\"}:\n                stack.append(char)\n            else:\n                if stack==[]: #if not stack:\n                    return False\n\n\n                top_ele=stack.pop()\n                if mapping[char]!=top_ele:\n                    return False\n\n\n        if stack:\n            return False\n        else:\n            return True\n\n\n\n\n        \n\n\n```"}, "luffy/2-lc-1-two-sum-lc.py": {"category": "\ud83d\udcda Luffy Curriculum (01-42)", "title": "Luffy Curriculum: 2-lc-1-two-sum-lc.py", "short": "2 LC 1-two-sum-lc", "path": "luffy/2-lc-1-two-sum-lc.py", "type": "py", "content": "# Python Solution: `2-lc-1-two-sum-lc.py`\n\n```python\nfrom typing import List\n\nclass Solution3: #even better hash table\n    def twoSum(self, nums: List[int], target: int) -> List[int]:\n        cache={}\n        for i,item in enumerate(nums):\n            other = target - item\n            if other in cache:\n                return [i, cache[other]]\n            cache[item] = i\n        return []\n\n\n#when you need to find two numbers in a list that add up to a specific target, \n# you can use a hash table (dictionary) to store the numbers you've seen so far and their indices. This allows you to check in constant time if the complement (the number needed to reach the target) exists in the hash table. The provided code implements this approach efficiently.\n```"}, "luffy/20-lc-stack2.py": {"category": "\ud83d\udcda Luffy Curriculum (01-42)", "title": "Luffy Curriculum: 20-lc-stack2.py", "short": "20 LC stack2", "path": "luffy/20-lc-stack2.py", "type": "py", "content": "# Python Solution: `20-lc-stack2.py`\n\n```python\n\n#  lc-739-daily temperature\n\nfrom typing import List\n\nclass Solution:\n    def dailyTemperatures(self, temperatures: List[int]) -> List[int]: \n        stack=[]\n        n = len(temperatures)\n        answer = [0]*n\n\n        for i in range(n):\n            cur_temperature = temperatures[i]\n\n            while True:\n                # comparing the current temperature with the past temp\n                if stack!=[] and cur_temperature > temperatures[stack[-1]]:\n                    pre_index=stack.pop()\n                    answer[pre_index]=i-pre_index \n                else:\n                    break\n\n            stack.append(i)\n\n        return answer\n\n\nif __name__ == '__main__':\n    s=Solution()\n    s.dailyTemperatures([73,74,75,71,69,72,76,73])\n\n\n                    \n\n\n        \n```"}, "luffy/21-lc-stack3-min-stack.py": {"category": "\ud83d\udcda Luffy Curriculum (01-42)", "title": "Luffy Curriculum: 21-lc-stack3-min-stack.py", "short": "21 LC stack3-min-stack", "path": "luffy/21-lc-stack3-min-stack.py", "type": "py", "content": "# Python Solution: `21-lc-stack3-min-stack.py`\n\n```python\n#lc-155-min-stack\n\n\nclass MinStack:\n\n    def __init__(self):\n        self.data_stack=[]\n        self.min_stack=[]\n\n    def push(self, value: int) -> None:\n        self.data_stack.append(value)\n        if self.min_stack:\n            top=self.min_stack[-1]\n            min_value=min(value,top)\n            self.min_stack.append(min_value)\n        else:\n            self.min_stack.append(value)\n\n    def pop(self) -> None:\n        self.data_stack.pop()\n        self.min_stack.pop()\n        \n\n    def top(self) -> int:\n        return self.data_stack[-1]\n        \n\n    def getMin(self) -> int:\n        return self.min_stack[-1]\n        \n\n\n# Your MinStack object will be instantiated and called as such:\n# obj = MinStack()\n# obj.push(value)\n# obj.pop()\n# param_3 = obj.top()\n# param_4 = obj.getMin()\n```"}, "luffy/22-lc-227.py": {"category": "\ud83d\udcda Luffy Curriculum (01-42)", "title": "Luffy Curriculum: 22-lc-227.py", "short": "22 LC 227", "path": "luffy/22-lc-227.py", "type": "py", "content": "# Python Solution: `22-lc-227.py`\n\n```python\n#lc-227-basic calculator\n\nclass Solution:\n    def calculate(self, s: str) -> int:\n\n        s=s.replace(\" \", \"\")\n        stack=[]\n        num=0\n        pre_sign=\"+\"\n        n=len(s)\n\n        for i in range(n):\n            char=s[i]\n            #if char is a number\n            if char.isdigit():\n                num=num*10 + int(char)\n            #if char is sign\n            if not char.isdigit() or i==n-1: #n-1 --> last one\n                if pre_sign==\"+\":\n                    stack.append(num)\n                elif pre_sign==\"-\":\n                    stack.append(-num)\n                elif pre_sign==\"*\":\n                    top=stack.pop()\n                    multi=top*num\n                    stack.append(multi)\n                elif pre_sign==\"/\":\n                    top=stack.pop()\n                    divide=int(top/num) \n                    stack.append(divide)\n\n                pre_sign=char\n                num=0\n\n        return sum(stack)\n\n    \n\n\n\n                \n\n\n\n\n\n\n\n\n\n```"}, "luffy/23-lc-394.py": {"category": "\ud83d\udcda Luffy Curriculum (01-42)", "title": "Luffy Curriculum: 23-lc-394.py", "short": "23 LC 394", "path": "luffy/23-lc-394.py", "type": "py", "content": "# Python Solution: `23-lc-394.py`\n\n```python\n#lc-394-decode-string\nclass Solution:\n    def decodeString(self, s: str) -> str:\n        # \u521d\u59cb\u5316\u4e00\u4e2a\u6808\u6765\u4fdd\u5b58\u4e4b\u524d\u8bfb\u53d6\u7684\u5b57\u7b26\u548c\u91cd\u590d\u6b21\u6570\uff0ccur_num\u7528\u6765\u7d2f\u79ef\u5f53\u524d\u6570\u5b57\n        stack = []\n        cur_num = 0\n        \n        for char in s:\n            if char.isdigit():\n                # \u5982\u679c\u662f\u6570\u5b57\uff0c\u7d2f\u52a0\u8ba1\u7b97\u591a\u4f4d\u6570\u503c\uff08\u4f8b\u5982\uff0c\u8fde\u7eed\u8bfb\u5230'1'\u548c'2'\u4f1a\u53d8\u621012\uff09\n                cur_num = cur_num * 10 + int(char)\n                \n            elif char == \"[\":\n                # \u9047\u5230 '[' \u4ee3\u8868\u524d\u9762\u7684\u6570\u5b57\u5df2\u7ecf\u5b8c\u6574\uff0c\u628a\u6570\u5b57\u548c '[' \u538b\u5165\u6808\u4e2d\u4fdd\u5b58\u72b6\u6001\n                stack.append(cur_num)\n                cur_num = 0       # \u91cd\u7f6e cur_num\uff0c\u4ee5\u4fbf\u8bb0\u5f55\u5d4c\u5957\u5728\u91cc\u9762\u7684\u4e0b\u4e00\u4e2a\u6570\u5b57\n                stack.append(\"[\")\n                \n            elif char == \"]\":\n                # \u9047\u5230 ']' \u4ee3\u8868\u5f53\u524d\u62ec\u53f7\u5185\u7684\u5b50\u4e32\u7ed3\u675f\uff0c\u5f00\u59cb\u5904\u7406\n                sub_strs = []\n                # \u4e00\u76f4\u51fa\u6808\uff0c\u76f4\u5230\u9047\u5230\u4e0e\u4e4b\u5339\u914d\u7684 '[' \u4e3a\u6b62\n                while stack[-1] != \"[\":\n                    sub_strs.append(stack.pop())\n                \n                # \u56e0\u4e3a\u6808\u662f\u540e\u8fdb\u5148\u51fa\uff0c\u6240\u4ee5\u53d6\u51fa\u6765\u7684\u5b57\u7b26\u987a\u5e8f\u662f\u53cd\u7684\uff0c\u9700\u8981\u53cd\u8f6c\u4e00\u4e0b\n                sub_strs.reverse()\n                inner_strs = \"\".join(sub_strs) # \u7ec4\u5408\u6210\u6b63\u786e\u7684\u62ec\u53f7\u5185\u5b57\u7b26\u4e32\n                \n                stack.pop() # \u5f39\u51fa\u6808\u9876\u7684 '['\n                \n                # \u5f39\u51fa\u5bf9\u5e94\u7684\u91cd\u590d\u6b21\u6570\uff08\u5728\u538b\u5165 '[' \u524d\u538b\u5165\u7684\u90a3\u4e2a\u6570\u5b57\uff09\n                repeat_time = stack.pop()\n                \n                # \u5c06\u62ec\u53f7\u5185\u7684\u5b57\u7b26\u4e32\u590d\u5236\u5bf9\u5e94\u7684\u6b21\u6570\uff0c\u5e76\u4f5c\u4e3a\u4e00\u4e2a\u6574\u4f53\u91cd\u65b0\u538b\u5165\u6808\u4e2d\n                stack.append(inner_strs * repeat_time)\n                \n            else: \n                # \u5982\u679c\u662f\u666e\u901a\u7684\u82f1\u6587\u5b57\u6bcd\uff0c\u76f4\u63a5\u538b\u5165\u6808\u4e2d\n                stack.append(char)\n                \n        # \u904d\u5386\u7ed3\u675f\u540e\uff0c\u6808\u4e2d\u53ea\u5269\u4e0b\u89e3\u7801\u540e\u7684\u5b57\u7b26\u4e32\u7247\u6bb5\uff0c\u5c06\u5b83\u4eec\u62fc\u63a5\u6210\u6700\u7ec8\u7ed3\u679c\u8fd4\u56de\n        return \"\".join(stack)\n\n\n#  O(n)\n\n\n        \n\n\n```"}, "luffy/24-lc-232.py": {"category": "\ud83d\udcda Luffy Curriculum (01-42)", "title": "Luffy Curriculum: 24-lc-232.py", "short": "24 LC 232", "path": "luffy/24-lc-232.py", "type": "py", "content": "# Python Solution: `24-lc-232.py`\n\n```python\n#lc-232:\n#implement queue using stacks\n\n\nclass MyQueue:\n\n    def __init__(self):\n        self.input_stack=[]\n        self.out_stack=[]\n        \n\n    def push(self, x: int) -> None:\n        self.input_stack.append(x)\n        \n        \n\n    def pop(self) -> int:\n        if self.out_stack:\n            return self.out_stack.pop()\n        else:\n            while self.input_stack:\n                self.out_stack.append(self.input_stack.pop())\n\n            return self.out_stack.pop()\n        \n\n    \n    def peek(self) -> int:\n        if self.out_stack:\n            return self.out_stack[-1]\n        while self.input_stack:\n            self.out_stack.append(self.input_stack.pop())\n        return self.out_stack[-1]\n        \n\n    def empty(self) -> bool:\n        if self.input_stack or self.out_stack:\n            return False\n        else:\n            return True\n\n        \n\n\n# Your MyQueue object will be instantiated and called as such:\n# obj = MyQueue()\n# obj.push(x)\n# param_2 = obj.pop()\n# param_3 = obj.peek()\n# param_4 = obj.empty()\n```"}, "luffy/25-___TREES___.txt": {"category": "\ud83d\udcda Luffy Curriculum (01-42)", "title": "Luffy Curriculum: 25-___TREES___.txt", "short": "25-TREES.txt", "path": "luffy/25-___TREES___.txt", "type": "txt", "content": "# Curriculum Topic Divider: `25-___TREES___.txt`\n\n```text\nSeparator fil
