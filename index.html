868\u524di\u4e2a\u5143\u7d20\u7684\u548c\n        for i in range((len(nums))):\n            self.preSum[i+1] = self.preSum[i] + nums[i]\n\n\n\n    def sumRange(self, left: int, right: int) -> int: #new\n        return self.preSum[right+1] - self.preSum[left]\n        \n\n# Your NumArray object will be instantiated and called as such:\n# obj = NumArray(nums)\n# param_1 = obj.sumRange(left,right)\n      \n            \n\n\nif __name__ == '__main__':\n    a=NumArray([0,1,2,3,4,5,6])\n    a.sumRange(0,2)\n\n\n        \n\n", "diff": "Easy", "py_file": "luffy/10-lc-0303-range-sum-query-immutable-alt.py", "md_file": "luffy/10-lc-0303-range-sum-query-immutable-alt.md"}, "luffy/10-lc-0303-range-sum-query-immutable": {"key": "luffy/10-lc-0303-range-sum-query-immutable", "category": "Luffy Curriculum (01-42)", "title": "Luffy Curriculum (01-42): 10 LC 0303 range sum query immutable", "short": "10 LC 0303 range sum query immutable", "path": "luffy/10-lc-0303-range-sum-query-immutable", "type": "problem", "notes": "# 303. Range Sum Query - Immutable\n## Problem Walkthrough & Solution Notes\n\n- **Difficulty:** Easy\n- **Category:** Luffy Structured Curriculum\n- **Core Technique:** Prefix Sum Array\n- **LeetCode Link:** [303. Range Sum Query - Immutable](https://leetcode.com/problems/range-sum-query-immutable/)\n- **Corresponding Python File:** [`luffy/10-lc-0303-range-sum-query-immutable.py`](file:///mnt/c/Users/steve/iCloudDrive/desktop/leetcode-sh/luffy/10-lc-0303-range-sum-query-immutable.py)\n\n---\n\n## 1. Problem Overview & Core Strategy\n\nPrecompute prefix sums: query(i, j) = prefix[j+1] - prefix[i] in O(1).\n\n---\n\n## 2. Key Algorithmic Steps\n\n1. **Initialization**: Set up required variables, pointers, hash maps, or queues.\n2. **State Transition / Traversal**: Process elements iteratively or recursively while maintaining invariant states.\n3. **Result Calculation & Return**: Return optimal answer.\n\n---\n\n## 3. Complexity Analysis\n\n- **Time Complexity:** Optimal based on algorithm constraint.\n- **Space Complexity:** Controlled within minimal required auxiliary space.\n", "code": "from typing import List\nclass NumArray:\n\n    def __init__(self, nums: List[int]):\n        self.nums = nums\n\n\n        \n\n    def sumRange(self, left: int, right: int) -> int: #general way\n        my_sum = 0\n        for i in range(left, right+1):\n            my_sum +=self.nums[i]\n        return my_sum\n            \n\n\nif __name__ == '__main__':\n    a=NumArray([0,1,2,3,4,5,6])\n    a.sumRange(0,2)\n\n\n        \n\n\n# Your NumArray object will be instantiated and called as such:\n# obj = NumArray(nums)\n# param_1 = obj.sumRange(left,right)", "diff": "Easy", "py_file": "luffy/10-lc-0303-range-sum-query-immutable.py", "md_file": "luffy/10-lc-0303-range-sum-query-immutable.md"}, "luffy/10-oop-pre-main-practice": {"key": "luffy/10-oop-pre-main-practice", "category": "Luffy Curriculum (01-42)", "title": "Luffy Curriculum (01-42): 10 oop pre main practice", "short": "10 oop pre main practice", "path": "luffy/10-oop-pre-main-practice", "type": "problem", "notes": "# OOP Foundations Practice\n## Problem Walkthrough & Solution Notes\n\n- **Difficulty:** Easy\n- **Category:** Luffy Structured Curriculum\n- **Core Technique:** Object-Oriented Programming\n- **Corresponding Python File:** [`luffy/10-oop-pre-main-practice.py`](file:///mnt/c/Users/steve/iCloudDrive/desktop/leetcode-sh/luffy/10-oop-pre-main-practice.py)\n\n---\n\n## 1. Problem Overview & Core Strategy\n\nClasses, methods, and instance state management.\n\n---\n\n## 2. Key Algorithmic Steps\n\n1. **Initialization**: Set up required variables, pointers, hash maps, or queues.\n2. **State Transition / Traversal**: Process elements iteratively or recursively while maintaining invariant states.\n3. **Result Calculation & Return**: Return optimal answer.\n\n---\n\n## 3. Complexity Analysis\n\n- **Time Complexity:** Optimal based on algorithm constraint.\n- **Space Complexity:** Controlled within minimal required auxiliary space.\n", "code": "from  car import Car\n\n\ncar_1 = Car(\"Toyota\", \"Camry\", 2020, \"Blue\")\n\nprint(car_1.make)\nprint(car_1.model)\nprint(car_1.year)\nprint(car_1.color)\n\n\ncar_1.drive()\ncar_1.stop()\n", "diff": "Easy", "py_file": "luffy/10-oop-pre-main-practice.py", "md_file": "luffy/10-oop-pre-main-practice.md"}, "luffy/11-lc-0560-subarray-sum-equals-k": {"key": "luffy/11-lc-0560-subarray-sum-equals-k", "category": "Luffy Curriculum (01-42)", "title": "Luffy Curriculum (01-42): 11 LC 0560 subarray sum equals k", "short": "11 LC 0560 subarray sum equals k", "path": "luffy/11-lc-0560-subarray-sum-equals-k", "type": "problem", "notes": "# 560. Subarray Sum Equals K\n## Problem Walkthrough & Solution Notes\n\n- **Difficulty:** Medium\n- **Category:** Luffy Structured Curriculum\n- **Core Technique:** Prefix Sum + Hash Map\n- **LeetCode Link:** [560. Subarray Sum Equals K](https://leetcode.com/problems/subarray-sum-equals-k/)\n- **Corresponding Python File:** [`luffy/11-lc-0560-subarray-sum-equals-k.py`](file:///mnt/c/Users/steve/iCloudDrive/desktop/leetcode-sh/luffy/11-lc-0560-subarray-sum-equals-k.py)\n\n---\n\n## 1. Problem Overview & Core Strategy\n\nMaintain running prefix sum and hash map of prefix sum frequencies.\n\n---\n\n## 2. Key Algorithmic Steps\n\n1. **Initialization**: Set up required variables, pointers, hash maps, or queues.\n2. **State Transition / Traversal**: Process elements iteratively or recursively while maintaining invariant states.\n3. **Result Calculation & Return**: Return optimal answer.\n\n---\n\n## 3. Complexity Analysis\n\n- **Time Complexity:** Optimal based on algorithm constraint.\n- **Space Complexity:** Controlled within minimal required auxiliary space.\n", "code": "from typing import List\n\n#can not use sliding window\n#sliding window is only applicable when the elements are all positive numbers or negative numbers, but not both\n\n\n#use prefix sum and hashtable to store the prefix sum and its frequency\nclass Solution:\n    def subarraySum(self, nums: List[int], k: int) -> int:\n        preSum = [0] * (len(nums) + 1)\n        for i in range(len(nums)):\n            preSum[i+1]= preSum[i]+nums[i]\n\n        \n        cache={}\n        count=0\n        for i, item in enumerate(preSum):\n            other = item - k\n            if other in cache:\n                count+=cache[other]\n            cache[item]=cache.get(item,0)+1\n\n        return count\n    \n#O(n)\n\n    \n\n", "diff": "Medium", "py_file": "luffy/11-lc-0560-subarray-sum-equals-k.py", "md_file": "luffy/11-lc-0560-subarray-sum-equals-k.md"}, "luffy/11-prefix-sum-basic-example": {"key": "luffy/11-prefix-sum-basic-example", "category": "Luffy Curriculum (01-42)", "title": "Luffy Curriculum (01-42): 11 prefix sum basic example", "short": "11 prefix sum basic example", "path": "luffy/11-prefix-sum-basic-example", "type": "problem", "notes": "# Prefix Sum Concept Example\n## Problem Walkthrough & Solution Notes\n\n- **Difficulty:** Easy\n- **Category:** Luffy Structured Curriculum\n- **Core Technique:** Prefix Sum Demo\n- **Corresponding Python File:** [`luffy/11-prefix-sum-basic-example.py`](file:///mnt/c/Users/steve/iCloudDrive/desktop/leetcode-sh/luffy/11-prefix-sum-basic-example.py)\n\n---\n\n## 1. Problem Overview & Core Strategy\n\nStep-by-step trace of prefix sum construction.\n\n---\n\n## 2. Key Algorithmic Steps\n\n1. **Initialization**: Set up required variables, pointers, hash maps, or queues.\n2. **State Transition / Traversal**: Process elements iteratively or recursively while maintaining invariant states.\n3. **Result Calculation & Return**: Return optimal answer.\n\n---\n\n## 3. Complexity Analysis\n\n- **Time Complexity:** Optimal based on algorithm constraint.\n- **Space Complexity:** Controlled within minimal required auxiliary space.\n", "code": "\n# function to find the prefix sum array\ndef prefSum(arr):\n    n = len(arr)\n    \n    # to store the prefix sum\n    prefixSum = [0] * n\n\n    # initialize the first element\n    prefixSum[0] = arr[0]\n\n    # Adding present element with previous element\n    for i in range(1, n):\n        prefixSum[i] = prefixSum[i - 1] + arr[i]\n    \n    return prefixSum\n\nif __name__ == \"__main__\":\n    arr = [10, 20, 10, 5, 15]\n    prefixSum = prefSum(arr)\n    for i in prefixSum:\n        print(i, end=\" \")", "diff": "Easy", "py_file": "luffy/11-prefix-sum-basic-example.py", "md_file": "luffy/11-prefix-sum-basic-example.md"}, "luffy/12-lc-1109-corporate-flight-bookings": {"key": "luffy/12-lc-1109-corporate-flight-bookings", "category": "Luffy Curriculum (01-42)", "title": "Luffy Curriculum (01-42): 12 LC 1109 corporate flight bookings", "short": "12 LC 1109 corporate flight bookings", "path": "luffy/12-lc-1109-corporate-flight-bookings", "type": "problem", "notes": "# 1109. Corporate Flight Bookings\n## Problem Walkthrough & Solution Notes\n\n- **Difficulty:** Medium\n- **Category:** Luffy Structured Curriculum\n- **Core Technique:** Difference Array\n- **LeetCode Link:** [1109. Corporate Flight Bookings](https://leetcode.com/problems/corporate-flight-bookings/)\n- **Corresponding Python File:** [`luffy/12-lc-1109-corporate-flight-bookings.py`](file:///mnt/c/Users/steve/iCloudDrive/desktop/leetcode-sh/luffy/12-lc-1109-corporate-flight-bookings.py)\n\n---\n\n## 1. Problem Overview & Core Strategy\n\nRange updates using diff[l] += val, diff[r+1] -= val, followed by prefix sum accumulation.\n\n---\n\n## 2. Key Algorithmic Steps\n\n1. **Initialization**: Set up required variables, pointers, hash maps, or queues.\n2. **State Transition / Traversal**: Process elements iteratively or recursively while maintaining invariant states.\n3. **Result Calculation & Return**: Return optimal answer.\n\n---\n\n## 3. Complexity Analysis\n\n- **Time Complexity:** Optimal based on algorithm constraint.\n- **Space Complexity:** Controlled within minimal required auxiliary space.\n", "code": "#lc-1109\n#corporate flight bookings\n\nfrom typing import List\n\n#[0]*n -> create a list with n elements, each element is 0\n\nclass Solution: #general way: worst case\n    def corpFlightBookings(self, bookings: List[List[int]], n: int) -> List[int]:\n        answer = [0] * n\n        for first, last, seats in bookings:\n            for i in range(first-1, last):\n                answer[i] += seats\n\n        return answer\n\n#large range modify \n#use difference array\n\nclass Solution2:  #difference array\n    def corpFlightBookings(self, bookings: List[List[int]], n: int) -> List[int]:\n        diff = [0]*(n+1)\n        for first, last, seats in bookings:\n            diff[first-1]+=seats\n            diff[last]-=seats\n        \n        answer =[0]*n\n        last_Seats = 0 \n        for i in range(n):\n            answer[i]=last_Seats + diff[i]\n            last_Seats = answer[i]\n        return answer\n\n\n        \n\n\n\n\n\n\n\n        \n\n", "diff": "Medium", "py_file": "luffy/12-lc-1109-corporate-flight-bookings.py", "md_file": "luffy/12-lc-1109-corporate-flight-bookings.md"}, "luffy/13-lc-0056-merge-intervals": {"key": "luffy/13-lc-0056-merge-intervals", "category": "Luffy Curriculum (01-42)", "title": "Luffy Curriculum (01-42): 13 LC 0056 merge intervals", "short": "13 LC 0056 merge intervals", "path": "luffy/13-lc-0056-merge-intervals", "type": "problem", "notes": "# 56. Merge Intervals\n## Problem Walkthrough & Solution Notes\n\n- **Difficulty:** Medium\n- **Category:** Luffy Structured Curriculum\n- **Core Technique:** Interval Sorting & Sweep\n- **LeetCode Link:** [56. Merge Intervals](https://leetcode.com/problems/merge-intervals/)\n- **Corresponding Python File:** [`luffy/13-lc-0056-merge-intervals.py`](file:///mnt/c/Users/steve/iCloudDrive/desktop/leetcode-sh/luffy/13-lc-0056-merge-intervals.py)\n\n---\n\n## 1. Problem Overview & Core Strategy\n\nSort intervals by start time and merge overlapping adjacent intervals.\n\n---\n\n## 2. Key Algorithmic Steps\n\n1. **Initialization**: Set up required variables, pointers, hash maps, or queues.\n2. **State Transition / Traversal**: Process elements iteratively or recursively while maintaining invariant states.\n3. **Result Calculation & Return**: Return optimal answer.\n\n---\n\n## 3. Complexity Analysis\n\n- **Time Complexity:** Optimal based on algorithm constraint.\n- **Space Complexity:** Controlled within minimal required auxiliary space.\n", "code": "#lc-56\n#Merge Intervals\nfrom typing import List\n\nclass Solution:\n    def merge(self, intervals: List[List[int]]) -> List[List[int]]:\n\n      #need to be sorted first\n        # def get_start_num(nums):\n        #     return nums[0]\n        # intervals.sort(get_start_num)\n\n        #or use lambda [input : return] simplify funtion express\n        intervals.sort(key=lambda x:x[0])\n\n\n        #merge\n        res = []\n        i=0\n        cur = intervals[0]\n\n        while i+1<len(intervals):\n            next=intervals[i+1]\n            if cur[1]>=next[0]:  #overlapped\n                cur[1]=max(cur[1],next[1])\n            else: #if not overlapped\n                res.append(cur)\n                cur=next\n            i=i+1\n        res.append(cur)\n            \n        return res\n\n\n\n        \n\n\n\n\n\n\n\n", "diff": "Medium", "py_file": "luffy/13-lc-0056-merge-intervals.py", "md_file": "luffy/13-lc-0056-merge-intervals.md"}, "luffy/14-lc-0041-first-missing-positive": {"key": "luffy/14-lc-0041-first-missing-positive", "category": "Luffy Curriculum (01-42)", "title": "Luffy Curriculum (01-42): 14 LC 0041 first missing positive", "short": "14 LC 0041 first missing positive", "path": "luffy/14-lc-0041-first-missing-positive", "type": "problem", "notes": "# 41. First Missing Positive\n## Problem Walkthrough & Solution Notes\n\n- **Difficulty:** Hard\n- **Category:** Luffy Structured Curriculum\n- **Core Technique:** Cyclic Sort / In-Place Hashing\n- **LeetCode Link:** [41. First Missing Positive](https://leetcode.com/problems/first-missing-positive/)\n- **Corresponding Python File:** [`luffy/14-lc-0041-first-missing-positive.py`](file:///mnt/c/Users/steve/iCloudDrive/desktop/leetcode-sh/luffy/14-lc-0041-first-missing-positive.py)\n\n---\n\n## 1. Problem Overview & Core Strategy\n\nPlace number x at index x - 1 to achieve O(n) time and O(1) space.\n\n---\n\n## 2. Key Algorithmic Steps\n\n1. **Initialization**: Set up required variables, pointers, hash maps, or queues.\n2. **State Transition / Traversal**: Process elements iteratively or recursively while maintaining invariant states.\n3. **Result Calculation & Return**: Return optimal answer.\n\n---\n\n## 3. Complexity Analysis\n\n- **Time Complexity:** Optimal based on algorithm constraint.\n- **Space Complexity:** Controlled within minimal required auxiliary space.\n", "code": "#lc-41-missing-postive\n\nfrom typing import List\n#make array as your hash table\n\n#auxiliary space required\n# class Solution:\n#     def firstMissingPositive(self, nums: List[int]) -> int:\n#         i=1\n#         while True:\n#             if i in nums:\n#                 i=i+1\n#             else:\n#                 return i\n#         #o(n)\n            \n\n\n# class Solution:\n#     def firstMissingPositive(self, nums: List[int]) -> int:\n#         num_sets = set(nums) #O(n) space-> wrong\n#         i=1\n#         while True:\n#             if i in num_sets:\n#                 i=i+1\n#             else:\n#                 return i\n\n\n\nclass Solution: #partition \u5f52\u4f4d\n    def firstMissingPositive(self, nums: List[int]) -> int:\n        i=0\n        while i<len(nums):\n            num=nums[i]\n            if i==num-1: #partition\n                i=i+1\n            else: # not on the right postiton\n                if 1<=num<=len(nums) and nums[nums[i]-1] !=nums[i]: # 1 to n, should be in num-1\n                    # target=nums[num-1]\n                    # nums[num-1]=num\n                    # nums[i]=target\n                    nums[i], nums[num-1]=nums[num-1], nums[i] #\u4ea4\u6362\u5199\u6cd5\n                    #right side becomes a tuple\n                else: #number that is not qualify for partition\n                    i=i+1\n\n        #traversal for the num again\n        for i in range(len(nums)):\n            if i ==nums[i]-1:\n                pass\n            else:\n                return i+1\n        \n        return len(nums)+1\n    \n    \n    \n\n                \n\n\n\n\n\n\n\n\n\n\n        \n        ", "diff": "Hard", "py_file": "luffy/14-lc-0041-first-missing-positive.py", "md_file": "luffy/14-lc-0041-first-missing-positive.md"}, "luffy/15-lc-0206-reverse-linked-list": {"key": "luffy/15-lc-0206-reverse-linked-list", "category": "Luffy Curriculum (01-42)", "title": "Luffy Curriculum (01-42): 15 LC 0206 reverse linked list", "short": "15 LC 0206 reverse linked list", "path": "luffy/15-lc-0206-reverse-linked-list", "type": "problem", "notes": "# 206. Reverse Linked List\n## Problem Walkthrough & Solution Notes\n\n- **Difficulty:** Easy\n- **Category:** Luffy Structured Curriculum\n- **Core Technique:** 3-Pointer Iteration\n- **LeetCode Link:** [206. Reverse Linked List](https://leetcode.com/problems/reverse-linked-list/)\n- **Corresponding Python File:** [`luffy/15-lc-0206-reverse-linked-list.py`](file:///mnt/c/Users/steve/iCloudDrive/desktop/leetcode-sh/luffy/15-lc-0206-reverse-linked-list.py)\n\n---\n\n## 1. Problem Overview & Core Strategy\n\nIteratively reverse next pointers using prev, curr, and next.\n\n---\n\n## 2. Key Algorithmic Steps\n\n1. **Initialization**: Set up required variables, pointers, hash maps, or queues.\n2. **State Transition / Traversal**: Process elements iteratively or recursively while maintaining invariant states.\n3. **Result Calculation & Return**: Return optimal answer.\n\n---\n\n## 3. Complexity Analysis\n\n- **Time Complexity:** Optimal based on algorithm constraint.\n- **Space Complexity:** Controlled within minimal required auxiliary space.\n", "code": "# Definition for singly-linked list.\nclass ListNode:\n    def __init__(self, val=0, next=None):\n        self.val = val\n        self.next = next\n\nfrom typing import Optional\n\n\n# class Solution:\n#     def reverseList(self, head: Optional[ListNode]) -> Optional[ListNode]:\n#         cur=None \n#         while head!=None:\n#             cur =ListNode(head.val,cur)\n#             head=head.next\n\n#         return cur\n\n\n\nclass Solution:\n    def reverseList(self, head: Optional[ListNode]) -> Optional[ListNode]:\n        pre=None\n        \n        while head!=None:\n            next_node=head.next\n            head.next=pre\n            pre=head\n            head=next_node\n        return pre\n        \n\n\n\n         \n\n\n", "diff": "Easy", "py_file": "luffy/15-lc-0206-reverse-linked-list.py", "md_file": "luffy/15-lc-0206-reverse-linked-list.md"}, "luffy/16-lc-0021-merge-two-sorted-lists": {"key": "luffy/16-lc-0021-merge-two-sorted-lists", "category": "Luffy Curriculum (01-42)", "title": "Luffy Curriculum (01-42): 16 LC 0021 merge two sorted lists", "short": "16 LC 0021 merge two sorted lists", "path": "luffy/16-lc-0021-merge-two-sorted-lists", "type": "problem", "notes": "# 21. Merge Two Sorted Lists\n## Problem Walkthrough & Solution Notes\n\n- **Difficulty:** Easy\n- **Category:** Luffy Structured Curriculum\n- **Core Technique:** Dummy Head + Two Pointers\n- **LeetCode Link:** [21. Merge Two Sorted Lists](https://leetcode.com/problems/merge-two-sorted-lists/)\n- **Corresponding Python File:** [`luffy/16-lc-0021-merge-two-sorted-lists.py`](file:///mnt/c/Users/steve/iCloudDrive/desktop/leetcode-sh/luffy/16-lc-0021-merge-two-sorted-lists.py)\n\n---\n\n## 1. Problem Overview & Core Strategy\n\nMerge two sorted linked lists node-by-node using a dummy head.\n\n---\n\n## 2. Key Algorithmic Steps\n\n1. **Initialization**: Set up required variables, pointers, hash maps, or queues.\n2. **State Transition / Traversal**: Process elements iteratively or recursively while maintaining invariant states.\n3. **Result Calculation & Return**: Return optimal answer.\n\n---\n\n## 3. Complexity Analysis\n\n- **Time Complexity:** Optimal based on algorithm constraint.\n- **Space Complexity:** Controlled within minimal required auxiliary space.\n", "code": "#lc-21\n#merge two sorted lists\nfrom typing import Optional\n\n# Definition for singly-linked list.\nclass ListNode:\n    def __init__(self, val=0, next=None):\n        self.val = val\n        self.next = next\n\n        \nclass Solution:\n    def mergeTwoLists(self, list1: Optional[ListNode], list2: Optional[ListNode]) -> Optional[ListNode]:\n        #dummy-\u865a\u62df\u5934\u8282\u70b9\n        dummy=ListNode()\n        current=dummy\n        while list1!=None and list2!=None:\n            if list1.val <=list2.val:\n                current.next=list1\n                list1=list1.next\n            else:\n                current.next=list2\n                list2=list2.next\n            current=current.next\n        if list1 == None:\n            current.next=list2\n        else:\n            current.next=list1\n\n        return dummy.next\n\n\n", "diff": "Easy", "py_file": "luffy/16-lc-0021-merge-two-sorted-lists.py", "md_file": "luffy/16-lc-0021-merge-two-sorted-lists.md"}, "luffy/17-lc-0141-linked-list-cycle": {"key": "luffy/17-lc-0141-linked-list-cycle", "category": "Luffy Curriculum (01-42)", "title": "Luffy Curriculum (01-42): 17 LC 0141 linked list cycle", "short": "17 LC 0141 linked list cycle", "path": "luffy/17-lc-0141-linked-list-cycle", "type": "problem", "notes": "# 141. Linked List Cycle\n## Problem Walkthrough & Solution Notes\n\n- **Difficulty:** Easy\n- **Category:** Luffy Structured Curriculum\n- **Core Technique:** Floyd's Fast & Slow Pointers\n- **LeetCode Link:** [141. Linked List Cycle](https://leetcode.com/problems/linked-list-cycle/)\n- **Corresponding Python File:** [`luffy/17-lc-0141-linked-list-cycle.py`](file:///mnt/c/Users/steve/iCloudDrive/desktop/leetcode-sh/luffy/17-lc-0141-linked-list-cycle.py)\n\n---\n\n## 1. Problem Overview & Core Strategy\n\nFast pointer advances 2 steps, slow 1 step; collision detects cycle.\n\n---\n\n## 2. Key Algorithmic Steps\n\n1. **Initialization**: Set up required variables, pointers, hash maps, or queues.\n2. **State Transition / Traversal**: Process elements iteratively or recursively while maintaining invariant states.\n3. **Result Calculation & Return**: Return optimal answer.\n\n---\n\n## 3. Complexity Analysis\n\n- **Time Complexity:** Optimal based on algorithm constraint.\n- **Space Complexity:** Controlled within minimal required auxiliary space.\n", "code": "#lc-141\n#listed list cycle\n\nfrom typing import Optional\n\n# Definition for singly-linked list.\nclass ListNode:\n    def __init__(self, x):\n        self.val = x\n        self.next = None\n#floyd-warshall\n\n\n\nclass Solution:\n    def hasCycle(self, head: Optional[ListNode]) -> bool:\n\n        slow=head\n        fast=head\n        while fast!=None and fast.next!=None:\n            slow=slow.next\n            fast=fast.next.next\n\n            if slow==fast:\n                return True\n        return False\n            \n\n\n\n        ", "diff": "Easy", "py_file": "luffy/17-lc-0141-linked-list-cycle.py", "md_file": "luffy/17-lc-0141-linked-list-cycle.md"}, "luffy/18-lc-0142-linked-list-cycle-ii": {"key": "luffy/18-lc-0142-linked-list-cycle-ii", "category": "Luffy Curriculum (01-42)", "title": "Luffy Curriculum (01-42): 18 LC 0142 linked list cycle ii", "short": "18 LC 0142 linked list cycle ii", "path": "luffy/18-lc-0142-linked-list-cycle-ii", "type": "problem", "notes": "# 142. Linked List Cycle II\n## Problem Walkthrough & Solution Notes\n\n- **Difficulty:** Medium\n- **Category:** Luffy Structured Curriculum\n- **Core Technique:** Cycle Detection + Mathematical Entry\n- **LeetCode Link:** [142. Linked List Cycle II](https://leetcode.com/problems/linked-list-cycle-ii/)\n- **Corresponding Python File:** [`luffy/18-lc-0142-linked-list-cycle-ii.py`](file:///mnt/c/Users/steve/iCloudDrive/desktop/leetcode-sh/luffy/18-lc-0142-linked-list-cycle-ii.py)\n\n---\n\n## 1. Problem Overview & Core Strategy\n\nAfter fast/slow meet, reset one pointer to head; move both 1 step to meet at cycle entry.\n\n---\n\n## 2. Key Algorithmic Steps\n\n1. **Initialization**: Set up required variables, pointers, hash maps, or queues.\n2. **State Transition / Traversal**: Process elements iteratively or recursively while maintaining invariant states.\n3. **Result Calculation & Return**: Return optimal answer.\n\n---\n\n## 3. Complexity Analysis\n\n- **Time Complexity:** Optimal based on algorithm constraint.\n- **Space Complexity:** Controlled within minimal required auxiliary space.\n", "code": "#lc-142\n#listed-list-cycle\nfrom typing import Optional\n\n# Definition for singly-linked list.\nclass ListNode:\n    def __init__(self, x):\n        self.val = x\n        self.next = None\n\nclass Solution:\n    def detectCycle(self, head: Optional[ListNode]) -> Optional[ListNode]:\n        # 1. Initialize Pointers / \u521d\u59cb\u5316\u6307\u9488\n        # Both slow and fast pointers start at the head of the linked list.\n        # \u6162\u6307\u9488\u548c\u5feb\u6307\u9488\u90fd\u4ece\u94fe\u8868\u5934\u8282\u70b9\u5f00\u59cb\u3002\n        slow = head\n        fast = head\n        \n        # 2. Detect the Cycle / \u68c0\u6d4b\u73af\u7684\u5b58\u5728\n        # Move slow by 1 step and fast by 2 steps.\n        # \u6bcf\u6b21\u8ba9\u6162\u6307\u9488\u8d701\u6b65\uff0c\u5feb\u6307\u9488\u8d702\u6b65\u3002\n        while fast != None and fast.next != None:\n            slow = slow.next\n            fast = fast.next.next\n            \n            # If they meet, a cycle exists.\n            # \u5982\u679c\u5feb\u6162\u6307\u9488\u76f8\u9047\uff0c\u8bf4\u660e\u94fe\u8868\u4e2d\u5b58\u5728\u73af\u3002\n            if slow == fast:\n                \n                # 3. Find the Cycle Entrance / \u5bfb\u627e\u73af\u7684\u5165\u53e3\n                # The distance from the head to the cycle's entrance equals \n                # the distance from the meeting point to the entrance.\n                # \u4ece\u94fe\u8868\u5934\u90e8\u5230\u73af\u5165\u53e3\u7684\u8ddd\u79bb\uff0c\u6b63\u597d\u7b49\u4e8e\u4ece\u76f8\u9047\u70b9\u5230\u73af\u5165\u53e3\u7684\u8ddd\u79bb\u3002\n                point1 = head\n                point2 = slow\n                \n                # Move both pointers 1 step at a time until they meet.\n                # \u4e24\u4e2a\u65b0\u6307\u9488\u6bcf\u6b21\u5404\u8d701\u6b65\uff0c\u76f4\u5230\u5b83\u4eec\u518d\u6b21\u76f8\u9047\u3002\n                while point1 != point2:\n                    point1 = point1.next\n                    point2 = point2.next\n                    \n                # 4. Return Result / \u8fd4\u56de\u7ed3\u679c\n                # The node where they meet is the start of the cycle.\n                # \u5b83\u4eec\u76f8\u9047\u7684\u8282\u70b9\u5c31\u662f\u73af\u7684\u8d77\u59cb\u5165\u53e3\u8282\u70b9\u3002\n                return point1\n                \n        # If the loop finishes without returning, it means we reached the end of the list (no cycle).\n        # \u5982\u679c\u5faa\u73af\u7ed3\u675f\u90fd\u6ca1\u6709\u76f8\u9047\uff08\u9047\u5230\u4e86 None\uff09\uff0c\u8bf4\u660e\u8d70\u5230\u4e86\u94fe\u8868\u5c3d\u5934\uff0c\u4e0d\u5b58\u5728\u73af\u3002\n        return None\n\n\n            \n\n\n        \n        ", "diff": "Medium", "py_file": "luffy/18-lc-0142-linked-list-cycle-ii.py", "md_file": "luffy/18-lc-0142-linked-list-cycle-ii.md"}, "luffy/19-lc-0020-valid-parentheses": {"key": "luffy/19-lc-0020-valid-parentheses", "category": "Luffy Curriculum (01-42)", "title": "Luffy Curriculum (01-42): 19 LC 0020 valid parentheses", "short": "19 LC 0020 valid parentheses", "path": "luffy/19-lc-0020-valid-parentheses", "type": "problem", "notes": "# 20. Valid Parentheses\n## Problem Walkthrough & Solution Notes\n\n- **Difficulty:** Easy\n- **Category:** Luffy Structured Curriculum\n- **Core Technique:** Stack Matching\n- **LeetCode Link:** [20. Valid Parentheses](https://leetcode.com/problems/valid-parentheses/)\n- **Corresponding Python File:** [`luffy/19-lc-0020-valid-parentheses.py`](file:///mnt/c/Users/steve/iCloudDrive/desktop/leetcode-sh/luffy/19-lc-0020-valid-parentheses.py)\n\n---\n\n## 1. Problem Overview & Core Strategy\n\nPush opening brackets to stack; pop and verify match upon encountering closing bracket.\n\n---\n\n## 2. Key Algorithmic Steps\n\n1. **Initialization**: Set up required variables, pointers, hash maps, or queues.\n2. **State Transition / Traversal**: Process elements iteratively or recursively while maintaining invariant states.\n3. **Result Calculation & Return**: Return optimal answer.\n\n---\n\n## 3. Complexity Analysis\n\n- **Time Complexity:** Optimal based on algorithm constraint.\n- **Space Complexity:** Controlled within minimal required auxiliary space.\n", "code": "#lc-20-valid0-parentheses\n\nclass Solution:\n    def isValid(self, s: str) -> bool:\n        stack=[]\n        mapping={\")\":\"(\",\"]\":\"[\",\"}\":\"{\"}\n        for char in s:\n            if char in {\"(\",\"[\",\"{\"}:\n                stack.append(char)\n            else:\n                if stack==[]: #if not stack:\n                    return False\n\n\n                top_ele=stack.pop()\n                if mapping[char]!=top_ele:\n                    return False\n\n\n        if stack:\n            return False\n        else:\n            return True\n\n\n\n\n        \n\n", "diff": "Easy", "py_file": "luffy/19-lc-0020-valid-parentheses.py", "md_file": "luffy/19-lc-0020-valid-parentheses.md"}, "luffy/20-lc-0020-valid-parentheses-dict": {"key": "luffy/20-lc-0020-valid-parentheses-dict", "category": "Luffy Curriculum (01-42)", "title": "Luffy Curriculum (01-42): 20 LC 0020 valid parentheses dict", "short": "20 LC 0020 valid parentheses dict", "path": "luffy/20-lc-0020-valid-parentheses-dict", "type": "problem", "notes": "# 20. Valid Parentheses (Dict Mapping)\n## Problem Walkthrough & Solution Notes\n\n- **Difficulty:** Easy\n- **Category:** Luffy Structured Curriculum\n- **Core Technique:** Stack + Hash Map\n- **LeetCode Link:** [20. Valid Parentheses (Dict Mapping)](https://leetcode.com/problems/valid-parentheses/)\n- **Corresponding Python File:** [`luffy/20-lc-0020-valid-parentheses-dict.py`](file:///mnt/c/Users/steve/iCloudDrive/desktop/leetcode-sh/luffy/20-lc-0020-valid-parentheses-dict.py)\n\n---\n\n## 1. Problem Overview & Core Strategy\n\nClean dictionary mapping between closing and opening brackets.\n\n---\n\n## 2. Key Algorithmic Steps\n\n1. **Initialization**: Set up required variables, pointers, hash maps, or queues.\n2. **State Transition / Traversal**: Process elements iteratively or recursively while maintaining invariant states.\n3. **Result Calculation & Return**: Return optimal answer.\n\n---\n\n## 3. Complexity Analysis\n\n- **Time Complexity:** Optimal based on algorithm constraint.\n- **Space Complexity:** Controlled within minimal required auxiliary space.\n", "code": "\n#  lc-739-daily temperature\n\nfrom typing import List\n\nclass Solution:\n    def dailyTemperatures(self, temperatures: List[int]) -> List[int]: \n        stack=[]\n        n = len(temperatures)\n        answer = [0]*n\n\n        for i in range(n):\n            cur_temperature = temperatures[i]\n\n            while True:\n                # comparing the current temperature with the past temp\n                if stack!=[] and cur_temperature > temperatures[stack[-1]]:\n                    pre_index=stack.pop()\n                    answer[pre_index]=i-pre_index \n                else:\n                    break\n\n            stack.append(i)\n\n        return answer\n\n\nif __name__ == '__main__':\n    s=Solution()\n    s.dailyTemperatures([73,74,75,71,69,72,76,73])\n\n\n                    \n\n\n        ", "diff": "Easy", "py_file": "luffy/20-lc-0020-valid-parentheses-dict.py", "md_file": "luffy/20-lc-0020-valid-parentheses-dict.md"}, "luffy/21-lc-0155-min-stack": {"key": "luffy/21-lc-0155-min-stack", "category": "Luffy Curriculum (01-42)", "title": "Luffy Curriculum (01-42): 21 LC 0155 min stack", "short": "21 LC 0155 min stack", "path": "luffy/21-lc-0155-min-stack", "type": "problem", "notes": "# 155. Min Stack\n## Problem Walkthrough & Solution Notes\n\n- **Difficulty:** Medium\n- **Category:** Luffy Structured Curriculum\n- **Core Technique:** Auxiliary Min Stack\n- **LeetCode Link:** [155. Min Stack](https://leetcode.com/problems/min-stack/)\n- **Corresponding Python File:** [`luffy/21-lc-0155-min-stack.py`](file:///mnt/c/Users/steve/iCloudDrive/desktop/leetcode-sh/luffy/21-lc-0155-min-stack.py)\n\n---\n\n## 1. Problem Overview & Core Strategy\n\nMaintain paired minimum value or separate min_stack for O(1) getMin retrieval.\n\n---\n\n## 2. Key Algorithmic Steps\n\n1. **Initialization**: Set up required variables, pointers, hash maps, or queues.\n2. **State Transition / Traversal**: Process elements iteratively or recursively while maintaining invariant states.\n3. **Result Calculation & Return**: Return optimal answer.\n\n---\n\n## 3. Complexity Analysis\n\n- **Time Complexity:** Optimal based on algorithm constraint.\n- **Space Complexity:** Controlled within minimal required auxiliary space.\n", "code": "#lc-155-min-stack\n\n\nclass MinStack:\n\n    def __init__(self):\n        self.data_stack=[]\n        self.min_stack=[]\n\n    def push(self, value: int) -> None:\n        self.data_stack.append(value)\n        if self.min_stack:\n            top=self.min_stack[-1]\n            min_value=min(value,top)\n            self.min_stack.append(min_value)\n        else:\n            self.min_stack.append(value)\n\n    def pop(self) -> None:\n        self.data_stack.pop()\n        self.min_stack.pop()\n        \n\n    def top(self) -> int:\n        return self.data_stack[-1]\n        \n\n    def getMin(self) -> int:\n        return self.min_stack[-1]\n        \n\n\n# Your MinStack object will be instantiated and called as such:\n# obj = MinStack()\n# obj.push(value)\n# obj.pop()\n# param_3 = obj.top()\n# param_4 = obj.getMin()", "diff": "Medium", "py_file": "luffy/21-lc-0155-min-stack.py", "md_file": "luffy/21-lc-0155-min-stack.md"}, "luffy/22-lc-0227-basic-calculator-ii": {"key": "luffy/22-lc-0227-basic-calculator-ii", "category": "Luffy Curriculum (01-42)", "title": "Luffy Curriculum (01-42): 22 LC 0227 basic calculator ii", "short": "22 LC 0227 basic calculator ii", "path": "luffy/22-lc-0227-basic-calculator-ii", "type": "problem", "notes": "# 227. Basic Calculator II\n## Problem Walkthrough & Solution Notes\n\n- **Difficulty:** Medium\n- **Category:** Luffy Structured Curriculum\n- **Core Technique:** Stack & Operator Precedence\n- **LeetCode Link:** [227. Basic Calculator II](https://leetcode.com/problems/basic-calculator-ii/)\n- **Corresponding Python File:** [`luffy/22-lc-0227-basic-calculator-ii.py`](file:///mnt/c/Users/steve/iCloudDrive/desktop/leetcode-sh/luffy/22-lc-0227-basic-calculator-ii.py)\n\n---\n\n## 1. Problem Overview & Core Strategy\n\nProcess * and / immediately with stack top; sum stack values for + and -.\n\n---\n\n## 2. Key Algorithmic Steps\n\n1. **Initialization**: Set up required variables, pointers, hash maps, or queues.\n2. **State Transition / Traversal**: Process elements iteratively or recursively while maintaining invariant states.\n3. **Result Calculation & Return**: Return optimal answer.\n\n---\n\n## 3. Complexity Analysis\n\n- **Time Complexity:** Optimal based on algorithm constraint.\n- **Space Complexity:** Controlled within minimal required auxiliary space.\n", "code": "#lc-227-basic calculator\n\nclass Solution:\n    def calculate(self, s: str) -> int:\n\n        s=s.replace(\" \", \"\")\n        stack=[]\n        num=0\n        pre_sign=\"+\"\n        n=len(s)\n\n        for i in range(n):\n            char=s[i]\n            #if char is a number\n            if char.isdigit():\n                num=num*10 + int(char)\n            #if char is sign\n            if not char.isdigit() or i==n-1: #n-1 --> last one\n                if pre_sign==\"+\":\n                    stack.append(num)\n                elif pre_sign==\"-\":\n                    stack.append(-num)\n                elif pre_sign==\"*\":\n                    top=stack.pop()\n                    multi=top*num\n                    stack.append(multi)\n                elif pre_sign==\"/\":\n                    top=stack.pop()\n                    divide=int(top/num) \n                    stack.append(divide)\n\n                pre_sign=char\n                num=0\n\n        return sum(stack)\n\n    \n\n\n\n                \n\n\n\n\n\n\n\n\n", "diff": "Medium", "py_file": "luffy/22-lc-0227-basic-calculator-ii.py", "md_file": "luffy/22-lc-0227-basic-calculator-ii.md"}, "luffy/23-lc-0394-decode-string": {"key": "luffy/23-lc-0394-decode-string", "category": "Luffy Curriculum (01-42)", "title": "Luffy Curriculum (01-42): 23 LC 0394 decode string", "short": "23 LC 0394 decode string", "path": "luffy/23-lc-0394-decode-string", "type": "problem", "notes": "# 394. Decode String\n## Problem Walkthrough & Solution Notes\n\n- **Difficulty:** Medium\n- **Category:** Luffy Structured Curriculum\n- **Core Technique:** Dual Stack (Counts & Strings)\n- **LeetCode Link:** [394. Decode String](https://leetcode.com/problems/decode-string/)\n- **Corresponding Python File:** [`luffy/23-lc-0394-decode-string.py`](file:///mnt/c/Users/steve/iCloudDrive/desktop/leetcode-sh/luffy/23-lc-0394-decode-string.py)\n\n---\n\n## 1. Problem Overview & Core Strategy\n\nPush state upon [, pop and repeat substring upon ].\n\n---\n\n## 2. Key Algorithmic Steps\n\n1. **Initialization**: Set up required variables, pointers, hash maps, or queues.\n2. **State Transition / Traversal**: Process elements iteratively or recursively while maintaining invariant states.\n3. **Result Calculation & Return**: Return optimal answer.\n\n---\n\n## 3. Complexity Analysis\n\n- **Time Complexity:** Optimal based on algorithm constraint.\n- **Space Complexity:** Controlled within minimal required auxiliary space.\n", "code": "#lc-394-decode-string\nclass Solution:\n    def decodeString(self, s: str) -> str:\n        # \u521d\u59cb\u5316\u4e00\u4e2a\u6808\u6765\u4fdd\u5b58\u4e4b\u524d\u8bfb\u53d6\u7684\u5b57\u7b26\u548c\u91cd\u590d\u6b21\u6570\uff0ccur_num\u7528\u6765\u7d2f\u79ef\u5f53\u524d\u6570\u5b57\n        stack = []\n        cur_num = 0\n        \n        for char in s:\n            if char.isdigit():\n                # \u5982\u679c\u662f\u6570\u5b57\uff0c\u7d2f\u52a0\u8ba1\u7b97\u591a\u4f4d\u6570\u503c\uff08\u4f8b\u5982\uff0c\u8fde\u7eed\u8bfb\u5230'1'\u548c'2'\u4f1a\u53d8\u621012\uff09\n                cur_num = cur_num * 10 + int(char)\n                \n            elif char == \"[\":\n                # \u9047\u5230 '[' \u4ee3\u8868\u524d\u9762\u7684\u6570\u5b57\u5df2\u7ecf\u5b8c\u6574\uff0c\u628a\u6570\u5b57\u548c '[' \u538b\u5165\u6808\u4e2d\u4fdd\u5b58\u72b6\u6001\n                stack.append(cur_num)\n                cur_num = 0       # \u91cd\u7f6e cur_num\uff0c\u4ee5\u4fbf\u8bb0\u5f55\u5d4c\u5957\u5728\u91cc\u9762\u7684\u4e0b\u4e00\u4e2a\u6570\u5b57\n                stack.append(\"[\")\n                \n            elif char == \"]\":\n                # \u9047\u5230 ']' \u4ee3\u8868\u5f53\u524d\u62ec\u53f7\u5185\u7684\u5b50\u4e32\u7ed3\u675f\uff0c\u5f00\u59cb\u5904\u7406\n                sub_strs = []\n                # \u4e00\u76f4\u51fa\u6808\uff0c\u76f4\u5230\u9047\u5230\u4e0e\u4e4b\u5339\u914d\u7684 '[' \u4e3a\u6b62\n                while stack[-1] != \"[\":\n                    sub_strs.append(stack.pop())\n                \n                # \u56e0\u4e3a\u6808\u662f\u540e\u8fdb\u5148\u51fa\uff0c\u6240\u4ee5\u53d6\u51fa\u6765\u7684\u5b57\u7b26\u987a\u5e8f\u662f\u53cd\u7684\uff0c\u9700\u8981\u53cd\u8f6c\u4e00\u4e0b\n                sub_strs.reverse()\n                inner_strs = \"\".join(sub_strs) # \u7ec4\u5408\u6210\u6b63\u786e\u7684\u62ec\u53f7\u5185\u5b57\u7b26\u4e32\n                \n                stack.pop() # \u5f39\u51fa\u6808\u9876\u7684 '['\n                \n                # \u5f39\u51fa\u5bf9\u5e94\u7684\u91cd\u590d\u6b21\u6570\uff08\u5728\u538b\u5165 '[' \u524d\u538b\u5165\u7684\u90a3\u4e2a\u6570\u5b57\uff09\n                repeat_time = stack.pop()\n                \n                # \u5c06\u62ec\u53f7\u5185\u7684\u5b57\u7b26\u4e32\u590d\u5236\u5bf9\u5e94\u7684\u6b21\u6570\uff0c\u5e76\u4f5c\u4e3a\u4e00\u4e2a\u6574\u4f53\u91cd\u65b0\u538b\u5165\u6808\u4e2d\n                stack.append(inner_strs * repeat_time)\n                \n            else: \n                # \u5982\u679c\u662f\u666e\u901a\u7684\u82f1\u6587\u5b57\u6bcd\uff0c\u76f4\u63a5\u538b\u5165\u6808\u4e2d\n                stack.append(char)\n                \n        # \u904d\u5386\u7ed3\u675f\u540e\uff0c\u6808\u4e2d\u53ea\u5269\u4e0b\u89e3\u7801\u540e\u7684\u5b57\u7b26\u4e32\u7247\u6bb5\uff0c\u5c06\u5b83\u4eec\u62fc\u63a5\u6210\u6700\u7ec8\u7ed3\u679c\u8fd4\u56de\n        return \"\".join(stack)\n\n\n#  O(n)\n\n\n        \n\n", "diff": "Medium", "py_file": "luffy/23-lc-0394-decode-string.py", "md_file": "luffy/23-lc-0394-decode-string.md"}, "luffy/24-lc-0232-implement-queue-using-stacks": {"key": "luffy/24-lc-0232-implement-queue-using-stacks", "category": "Luffy Curriculum (01-42)", "title": "Luffy Curriculum (01-42): 24 LC 0232 implement queue using stacks", "short": "24 LC 0232 implement queue using stacks", "path": "luffy/24-lc-0232-implement-queue-using-stacks", "type": "problem", "notes": "# 232. Implement Queue using Stacks\n## Problem Walkthrough & Solution Notes\n\n- **Difficulty:** Easy\n- **Category:** Luffy Structured Curriculum\n- **Core Technique:** Two Stacks (In/Out)\n- **LeetCode Link:** [232. Implement Queue using Stacks](https://leetcode.com/problems/implement-queue-using-stacks/)\n- **Corresponding Python File:** [`luffy/24-lc-0232-implement-queue-using-stacks.py`](file:///mnt/c/Users/steve/iCloudDrive/desktop/leetcode-sh/luffy/24-lc-0232-implement-queue-using-stacks.py)\n\n---\n\n## 1. Problem Overview & Core Strategy\n\nAmortized O(1) operations by pouring in_stack into out_stack when out_stack is empty.\n\n---\n\n## 2. Key Algorithmic Steps\n\n1. **Initialization**: Set up required variables, pointers, hash maps, or queues.\n2. **State Transition / Traversal**: Process elements iteratively or recursively while maintaining invariant states.\n3. **Result Calculation & Return**: Return optimal answer.\n\n---\n\n## 3. Complexity Analysis\n\n- **Time Complexity:** Optimal based on algorithm constraint.\n- **Space Complexity:** Controlled within minimal required auxiliary space.\n", "code": "#lc-232:\n#implement queue using stacks\n\n\nclass MyQueue:\n\n    def __init__(self):\n        self.input_stack=[]\n        self.out_stack=[]\n        \n\n    def push(self, x: int) -> None:\n        self.input_stack.append(x)\n        \n        \n\n    def pop(self) -> int:\n        if self.out_stack:\n            return self.out_stack.pop()\n        else:\n            while self.input_stack:\n                self.out_stack.append(self.input_stack.pop())\n\n            return self.out_stack.pop()\n        \n\n    \n    def peek(self) -> int:\n        if self.out_stack:\n            return self.out_stack[-1]\n        while self.input_stack:\n            self.out_stack.append(self.input_stack.pop())\n        return self.out_stack[-1]\n        \n\n    def empty(self) -> bool:\n        if self.input_stack or self.out_stack:\n            return False\n        else:\n            return True\n\n        \n\n\n# Your MyQueue object will be instantiated and called as such:\n# obj = MyQueue()\n# obj.push(x)\n# param_2 = obj.pop()\n# param_3 = obj.peek()\n# param_4 = obj.empty()", "diff": "Easy", "py_file": "luffy/24-lc-0232-implement-queue-using-stacks.py", "md_file": "luffy/24-lc-0232-implement-queue-using-stacks.md"}, "luffy/25-lc-0094-binary-tree-inorder-traversal": {"key": "luffy/25-lc-0094-binary-tree-inorder-traversal", "category": "Luffy Curriculum (01-42)", "title": "Luffy Curriculum (01-42): 25 LC 0094 binary tree inorder traversal", "short": "25 LC 0094 binary tree inorder traversal", "path": "luffy/25-lc-0094-binary-tree-inorder-traversal", "type": "problem", "notes": "# 94. Binary Tree Inorder Traversal\n## Problem Walkthrough & Solution Notes\n\n- **Difficulty:** Easy\n- **Category:** Luffy Structured Curriculum\n- **Core Technique:** DFS Inorder (L-Root-R)\n- **LeetCode Link:** [94. Binary Tree Inorder Traversal](https://leetcode.com/problems/binary-tree-inorder-traversal/)\n- **Corresponding Python File:** [`luffy/25-lc-0094-binary-tree-inorder-traversal.py`](file:///mnt/c/Users/steve/iCloudDrive/desktop/leetcode-sh/luffy/25-lc-0094-binary-tree-inorder-traversal.py)\n\n---\n\n## 1. Problem Overview & Core Strategy\n\nLeft -> Root -> Right traversal yields sorted order for BST.\n\n---\n\n## 2. Key Algorithmic Steps\n\n1. **Initialization**: Set up required variables, pointers, hash maps, or queues.\n2. **State Transition / Traversal**: Process elements iteratively or recursively while maintaining invariant states.\n3. **Result Calculation & Return**: Return optimal answer.\n\n---\n\n## 3. Complexity Analysis\n\n- **Time Complexity:** Optimal based on algorithm constraint.\n- **Space Complexity:** Controlled within minimal required auxiliary space.\n", "code": "#inordertraversal\n#lc-94\n\nfrom typing import List, Optional\n\n# Definition for a binary tree node.\nclass TreeNode:\n    def __init__(self, val=0, left=None, right=None):\n        self.val = val\n        self.left = left\n        self.right = right\n        \nclass Solution:\n    def inorderTraversal(self, root: Optional[TreeNode]) -> List[int]:\n        res=[]\n\n        def f(node: Optional[TreeNode]): #pre-order traversal\n\n           #base case\n            if node is None:\n                return\n\n\n            f(node.left)\n\n\n            \n            res.append(node.val)\n\n\n            \n            f(node.right)\n            return\n        \n        f(root)\n        return res", "diff": "Easy", "py_file": "luffy/25-lc-0094-binary-tree-inorder-traversal.py", "md_file": "luffy/25-lc-0094-binary-tree-inorder-traversal.md"}, "luffy/25-lc-0144-binary-tree-preorder-traversal": {"key": "luffy/25-lc-0144-binary-tree-preorder-traversal", "category": "Luffy Curriculum (01-42)", "title": "Luffy Curriculum (01-42): 25 LC 0144 binary tree preorder traversal", "short": "25 LC 0144 binary tree preorder traversal", "path": "luffy/25-lc-0144-binary-tree-preorder-traversal", "type": "problem", "notes": "# 144. Binary Tree Preorder Traversal\n## Problem Walkthrough & Solution Notes\n\n- **Difficulty:** Easy\n- **Category:** Luffy Structured Curriculum\n- **Core Technique:** DFS Preorder (Root-L-R)\n- **LeetCode Link:** [144. Binary Tree Preorder Traversal](https://leetcode.com/problems/binary-tree-preorder-traversal/)\n- **Corresponding Python File:** [`luffy/25-lc-0144-binary-tree-preorder-traversal.py`](file:///mnt/c/Users/steve/iCloudDrive/desktop/leetcode-sh/luffy/25-lc-0144-binary-tree-preorder-traversal.py)\n\n---\n\n## 1. Problem Overview & Core Strategy\n\nRoot -> Left -> Right traversal.\n\n---\n\n## 2. Key Algorithmic Steps\n\n1. **Initialization**: Set up required variables, pointers, hash maps, or queues.\n2. **State Transition / Traversal**: Process elements iteratively or recursively while maintaining invariant states.\n3. **Result Calculation & Return**: Return optimal answer.\n\n---\n\n## 3. Complexity Analysis\n\n- **Time Complexity:** Optimal based on algorithm constraint.\n- **Space Complexity:** Controlled within minimal required auxiliary space.\n", "code": "#lc-144\n#binary tree preorder traversal\n\nfrom typing import List, Optional\n\n# Definition for a binary tree node.\nclass TreeNode:\n    def __init__(self, val=0, left=None, right=None):\n        self.val = val\n        self.left = left\n        self.right = right\n\n# pre-order: root-left-right\n#in-order: left-root-right\n#posterorder: left-right-root\nclass Solution:\n    def preorderTraversal(self, root: Optional[TreeNode]) -> List[int]:\n        res=[]\n\n        def f(node: Optional[TreeNode]): #pre-order traversal\n\n           #base case\n            if node is None:\n                return\n\n            #center:\n            res.append(node.val)\n\n            #left\n            f(node.left)\n\n            #right\n            f(node.right)\n            return\n        \n        f(root)\n        return res\n\n\n        \n\n        ", "diff": "Easy", "py_file": "luffy/25-lc-0144-binary-tree-preorder-traversal.py", "md_file": "luffy/25-lc-0144-binary-tree-preorder-traversal.md"}, "luffy/25-lc-0145-binary-tree-postorder-traversal": {"key": "luffy/25-lc-0145-binary-tree-postorder-traversal", "category": "Luffy Curriculum (01-42)", "title": "Luffy Curriculum (01-42): 25 LC 0145 binary tree postorder traversal", "short": "25 LC 0145 binary tree postorder traversal", "path": "luffy/25-lc-0145-binary-tree-postorder-traversal", "type": "problem", "notes": "# 145. Binary Tree Postorder Traversal\n## Problem Walkthrough & Solution Notes\n\n- **Difficulty:** Easy\n- **Category:** Luffy Structured Curriculum\n- **Core Technique:** DFS Postorder (L-R-Root)\n- **LeetCode Link:** [145. Binary Tree Postorder Traversal](https://leetcode.com/problems/binary-tree-postorder-traversal/)\n- **Corresponding Python File:** [`luffy/25-lc-0145-binary-tree-postorder-traversal.py`](file:///mnt/c/Users/steve/iCloudDrive/desktop/leetcode-sh/luffy/25-lc-0145-binary-tree-postorder-traversal.py)\n\n---\n\n## 1. Problem Overview & Core Strategy\n\nLeft -> Right -> Root bottom-up traversal.\n\n---\n\n## 2. Key Algorithmic Steps\n\n1. **Initialization**: Set up required variables, pointers, hash maps, or queue s.\n\n---\n\n## 2. Key Algorithmic Steps\n\n1. **Initialization**: Set up required variables, pointers, hash maps, or queues.\n2. **State Transition / Traversal**: Process elements iteratively or recursively while maintaining invariant states.\n3. **Result Calculation & Return**: Return optimal answer.\n\n---\n\n## 3. Complexity Analysis\n\n- **Time Complexity:** Optimal based on algorithm constraint.\n- **Space Complexity:** Controlled within minimal required auxiliary space.\n", "code": "from typing import List,Optional\n\n\n\n# Definition for a binary tree node.\nclass TreeNode:\n    def __init__(self, val=0, left=None, right=None):\n        self.val = val\n        self.left = left\n        self.right = right\n\n#use stack\n#iterative method\nclass Solution:\n    def preorderTraversal(self, root: Optional[TreeNode]) -> List[int]:\n        if not root:\n            return []\n\n        res=[]\n        stack=[root]\n\n        while stack:\n            node=stack.pop()\n            res.append(node.val)\n\n            #pushing logic\n            if node.right:\n                stack.append(node.right)\n            if node.left:\n                stack.append(node.left)\n\n        return res", "diff": "Medium", "py_file": "luffy/25-tree-traversal-advanced-patterns.py", "md_file": "luffy/25-tree-traversal-advanced-patterns.md"}, "luffy/26-lc-0104-maximum-depth-of-binary-tree": {"key": "luffy/26-lc-0104-maximum-depth-of-binary-tree", "category": "Luffy Curriculum (01-42)", "title": "Luffy Curriculum (01-42): 26 LC 0104 maximum depth of binary tree", "short": "26 LC 0104 maximum depth of binary tree", "path": "luffy/26-lc-0104-maximum-depth-of-binary-tree", "type": "problem", "notes": "# 104. Maximum Depth of Binary Tree\n## Problem Walkthrough & Solution Notes\n\n- **Difficulty:** Easy\n- **Category:** Luffy Structured Curriculum\n- **Core Technique:** DFS / Divide & Conquer\n- **LeetCode Link:** [104. Maximum Depth of Binary Tree](https://leetcode.com/problems/maximum-depth-of-binary-tree/)\n- **Corresponding Python File:** [`luffy/26-lc-0104-maximum-depth-of-binary-tree.py`](file:///mnt/c/Users/steve/iCloudDrive/desktop/leetcode-sh/luffy/26-lc-0104-maximum-depth-of-binary-tree.py)\n\n---\n\n## 1. Problem Overview & Core Strategy\n\nDepth = 1 + max(left_depth, right_depth).\n\n---\n\n## 2. Key Algorithmic Steps\n\n1. **Initialization**: Set up required variables, pointers, hash maps, or queues.\n2. **State Transition / Traversal**: Process elements iteratively or recursively while maintaining invariant states.\n3. **Result Calculation & Return**: Return optimal answer.\n\n---\n\n## 3. Complexity Analysis\n\n- **Time Complexity:** Optimal based on algorithm constraint.\n- **Space Complexity:** Controlled within minimal required auxiliary space.\n", "code": "#lc-104\n#maximum depth of binary tree\n\nfrom typing import  Optional\n\n# Definition for a binary tree node.\nclass TreeNode:\n    def __init__(self, val=0, left=None, right=None):\n        self.val = val\n        self.left = left\n        self.right = right\n\n#use poster-order\n# left-right-center\n#        \nclass Solution:\n    def maxDepth(self, root: Optional[TreeNode]) -> int:\n        #base case \u8fb9\u754c\u6761\u4ef6\n        if root is None:\n            return 0 #int, need to return a real value\n\n        #iteration\n        left=self.maxDepth(root.left) #return the max depth of the left side\n        right=self.maxDepth(root.right)\n\n        \n\n        #return\n        return max(left,right)+1\n\n\n#DFS\n\n", "diff": "Easy", "py_file": "luffy/26-lc-0104-maximum-depth-of-binary-tree.py", "md_file": "luffy/26-lc-0104-maximum-depth-of-binary-tree.md"}, "luffy/27-lc-0236-lowest-common-ancestor-of-a-binary-tree": {"key": "luffy/27-lc-0236-lowest-common-ancestor-of-a-binary-tree", "category": "Luffy Curriculum (01-42)", "title": "Luffy Curriculum (01-42): 27 LC 0236 lowest common ancestor of a binary tree", "short": "27 LC 0236 lowest common ancestor of a binary tree", "path": "luffy/27-lc-0236-lowest-common-ancestor-of-a-binary-tree", "type": "problem", "notes": "# 236. Lowest Common Ancestor of a Binary Tree\n## Problem Walkthrough & Solution Notes\n\n- **Difficulty:** Medium\n- **Category:** Luffy Structured Curriculum\n- **Core Technique:** Postorder DFS\n- **LeetCode Link:** [236. Lowest Common Ancestor of a Binary Tree](https://leetcode.com/problems/lowest-common-ancestor-of-a-binary-tree/)\n- **Corresponding Python File:** [`luffy/27-lc-0236-lowest-common-ancestor-of-a-binary-tree.py`](file:///mnt/c/Users/steve/iCloudDrive/desktop/leetcode-sh/luffy/27-lc-0236-lowest-common-ancestor-of-a-binary-tree.py)\n\n---\n\n## 1. Problem Overview & Core Strategy\n\nIf both left and right return non-null, root is LCA.\n\n---\n\n## 2. Key Algorithmic Steps\n\n1. **Initialization**: Set up required variables, pointers, hash maps, or queues.\n2. **State Transition / Traversal**: Process elements iteratively or recursively while maintaining invariant states.\n3. **Result Calculation & Return**: Return optimal answer.\n\n---\n\n## 3. Complexity Analysis\n\n- **Time Complexity:** Optimal based on algorithm constraint.\n- **Space Complexity:** Controlled within minimal required auxiliary space.\n", "code": "#lc-236\n#the lowest common ancestor of a binary tree\n\n\n# Definition for a binary tree node.\nclass TreeNode:\n    def __init__(self, x):\n        self.val = x\n        self.left = None\n        self.right = None\n\n#DFS\n#Poster-order: left-right-root\n\nclass Solution:\n    #retrun the completed information\n    def lowestCommonAncestor(self, root: 'TreeNode', p: 'TreeNode', q: 'TreeNode') -> 'TreeNode | None':\n        #defind return values:\n        #whetrher the current node's subtree contains p / whether the current node is the ancestor of p \n        #whether the current node's subtree contains q \n        #and the address of the lowest common ancestor x\n\n\n        def dfs(node):\n            #base case\n            if node is None:\n                return False, False, None\n\n            left_has_p, left_has_q, left_x = dfs(node.left)\n            right_has_p, right_has_q, right_x = dfs(node.right)\n\n            cur_has_p=left_has_p or right_has_p or node == p\n            cur_has_q=left_has_q or right_has_q or node == q\n\n            cur_x = None\n\n            if left_x:\n                cur_x=left_x\n            elif right_x:\n                cur_x=right_x\n            elif cur_has_p and cur_has_q:\n                cur_x=node\n\n            return cur_has_p, cur_has_q, cur_x\n\n        _,_,x=dfs(root)\n        return x\n        \n            \n\n\n\n\n\n            \n            \n            \n\n        ", "diff": "Medium", "py_file": "luffy/27-lc-0236-lowest-common-ancestor-of-a-binary-tree.py", "md_file": "luffy/27-lc-0236-lowest-common-ancestor-of-a-binary-tree.md"}, "luffy/28-lc-0102-binary-tree-level-order-traversal": {"key": "luffy/28-lc-0102-binary-tree-level-order-traversal", "category": "Luffy Curriculum (01-42)", "title": "Luffy Curriculum (01-42): 28 LC 0102 binary tree level order traversal", "short": "28 LC 0102 binary tree level order traversal", "path": "luffy/28-lc-0102-binary-tree-level-order-traversal", "type": "problem", "notes": "# 102. Binary Tree Level Order Traversal\n## Problem Walkthrough & Solution Notes\n\n- **Difficulty:** Medium\n- **Category:** Luffy Structured Curriculum\n- **Core Technique:** BFS Queue (Level-by-Level)\n- **LeetCode Link:** [102. Binary Tree Level Order Traversal](https://leetcode.com/problems/binary-tree-level-order-traversal/)\n- **Corresponding Python File:** [`luffy/28-lc-0102-binary-tree-level-order-traversal.py`](file:///mnt/c/Users/steve/iCloudDrive/desktop/leetcode-sh/luffy/28-lc-0102-binary-tree-level-order-traversal.py)\n\n---\n\n## 1. Problem Overview & Core Strategy\n\nUse queue and take snapshots of len(queue) for each depth level.\n\n---\n\n## 2. Key Algorithmic Steps\n\n1. **Initialization**: Set up required variables, pointers, hash maps, or queues.\n2. **State Transition / Traversal**: Process elements iteratively or recursively while maintaining invariant states.\n3. **Result Calculation & Return**: Return optimal answer.\n\n---\n\n## 3. Complexity Analysis\n\n- **Time Complexity:** Optimal based on algorithm constraint.\n- **Space Complexity:** Controlled within minimal required auxiliary space.\n", "code": "#lc-102\n\n#Binary Tree level order traversal\n\nfrom collections import deque #\u5e95\u5c42\u662fdouble linked list\nfrom typing import Optional, List\n\n#bfs\n#breadth-first search bfs\n\n# Definition for a binary tree node.\nclass TreeNode:\n    def __init__(self, val=0, left=None, right=None):\n        self.val = val\n        self.left = left\n        self.right = right\n\n\nclass Solution:\n    def levelOrder(self, root: Optional[TreeNode]) -> List[List[int]]:\n        if root is None:\n            return []\n        queue=deque()\n        queue.append(root)\n        res=[]\n\n        while queue:\n            n=len(queue)\n            cur_level=[]\n            for i in range(n):\n                node=queue.popleft()\n                cur_level.append(node.val)\n                if node.left:\n                    queue.append(node.left)\n                if node.right:\n                    queue.append(node.right)\n\n            res.append(cur_level)\n\n        return res\n\n\n            \n\n\n\n\n", "diff": "Medium", "py_file": "luffy/28-lc-0102-binary-tree-level-order-traversal.py", "md_file": "luffy/28-lc-0102-binary-tree-level-order-traversal.md"}, "luffy/29-lc-0098-validate-binary-search-tree-bounds": {"key": "luffy/29-lc-0098-validate-binary-search-tree-bounds", "category": "Luffy Curriculum (01-42)", "title": "Luffy Curriculum (01-42): 29 LC 0098 validate binary search tree bounds", "short": "29 LC 0098 validate binary search tree bounds", "path": "luffy/29-lc-0098-validate-binary-search-tree-bounds", "type": "problem", "notes": "# 98. Validate Binary Search
