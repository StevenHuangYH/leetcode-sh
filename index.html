` \u4ece `dummy` (\u7d22\u5f15 0) \u5148\u8d70 $n$ \u6b65\uff0c\u5230\u8fbe\u7d22\u5f15 $n$\u3002\n   * \u6b64\u65f6 `left` \u505c\u5728 `dummy` (\u7d22\u5f15 0)\uff0c\u4e24\u6307\u9488\u7684\u7d22\u5f15\u5dee\u6052\u4e3a $n$\uff08\u5373 $\\\\text{index}(right) - \\\\text{index}(left) = n$\uff09\u3002\n   * \u5f53 `while right.next:` \u7ec8\u6b62\u65f6\uff0c`right` \u6070\u597d\u505c\u5728\u6700\u540e\u4e00\u4e2a\u8282\u70b9\uff08\u7d22\u5f15 $L$\uff09\u3002\n   * \u4ee3\u5165\u4e0d\u53d8\u91cf\u516c\u5f0f\uff1a\n     $$\\\\text{index}(left) = \\\\text{index}(right) - n = L - n$$\n   * \u7d22\u5f15 $L - n$ \u5bf9\u5e94\u7684\u6b63\u662f **\u5f85\u5220\u9664\u8282\u70b9\u7684\u524d\u9a71\u8282\u70b9**\uff01\n   * \u76f4\u63a5\u6267\u884c `left.next = left.next.next` \u5373\u53ef\u5b89\u5168\u67b6\u7a7a\u5e76\u5254\u9664\u76ee\u6807\u8282\u70b9\u3002\n\n---\n\n### \ud83c\udfa8 ASCII \u52a8\u6001\u63a8\u6f14\u8fc7\u7a0b\u56fe\u89e3\n\n\u4ee5 `head = [1, 2, 3, 4, 5]`, $n = 2$ \u4e3a\u4f8b\uff08\u5220\u9664\u5012\u6570\u7b2c 2 \u4e2a\u8282\u70b9 `4`\uff09\uff1a\n\n```\nStep 0: \u6784\u5efa dummy \u54e8\u5175\u8282\u70b9\uff0cleft \u4e0e right \u5747\u521d\u59cb\u5316\u5728 dummy\n    dummy \u2500\u2500\u25ba [1] \u2500\u2500\u25ba [2] \u2500\u2500\u25ba [3] \u2500\u2500\u25ba [4] \u2500\u2500\u25ba [5] \u2500\u2500\u25ba None\n      \u25b2\n  left, right\n\n\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\nStep 1: right \u5148\u5411\u524d\u79fb\u52a8 n = 2 \u6b65\uff0c\u62c9\u5f00\u95f4\u8ddd\n    dummy \u2500\u2500\u25ba [1] \u2500\u2500\u25ba [2] \u2500\u2500\u25ba [3] \u2500\u2500\u25ba [4] \u2500\u2500\u25ba [5] \u2500\u2500\u25ba None\n      \u25b2                 \u25b2\n    left              right (\u5148\u884c 2 \u6b65\uff0c\u505c\u5728 [2])\n\n\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\nStep 2: left \u4e0e right \u540c\u65f6\u5411\u540e\u5e73\u79fb\uff0c\u76f4\u5230 right.next \u4e3a None\n    \u5e73\u79fb 1 \u6b65: left -> [1], right -> [3]\n    \u5e73\u79fb 2 \u6b65: left -> [2], right -> [4]\n    \u5e73\u79fb 3 \u6b65: left -> [3], right -> [5] (\u6b64\u65f6 right.next is None\uff0c\u5faa\u73af\u7ed3\u675f)\n\n    dummy \u2500\u2500\u25ba [1] \u2500\u2500\u25ba [2] \u2500\u2500\u25ba [3] \u2500\u2500\u25ba [4] \u2500\u2500\u25ba [5] \u2500\u2500\u25ba None\n                                \u25b2                 \u25b2\n                              left              right (\u5230\u8fbe\u672b\u5c3e)\n\n\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\nStep 3: \u67b6\u7a7a\u5220\u9664 left.next (\u8282\u70b9 [4])\n    left.next = left.next.next\n\n    dummy \u2500\u2500\u25ba [1] \u2500\u2500\u25ba [2] \u2500\u2500\u25ba [3] \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n                                         \u2502  (\u8282\u70b9 4 \u88ab\u8de8\u8fc7\u67b6\u7a7a)\n                                         \u25bc\n                                        [5] \u2500\u2500\u25ba None\n\nStep 4: \u8fd4\u56de dummy.next (\u5373\u65b0\u7684\u5934\u8282\u70b9 [1])\n```\n\n---\n\n## 4. Step-by-Step Code Walkthrough / \u4ee3\u7801\u9010\u884c\u8be6\u89e3\n\n\u57fa\u4e8e\u539f Python \u6587\u4ef6\u4e2d\u7684\u5b9e\u73b0\u8fdb\u884c\u9010\u884c\u6df1\u5165\u89e3\u6790\uff1a\n\n```python\n# Definition for singly-linked list.\n# class ListNode:\n#     def __init__(self, val=0, next=None):\n#         self.val = val\n#         self.next = next\n\nclass Solution:\n    def removeNthFromEnd(self, head: Optional[ListNode], n: int) -> Optional[ListNode]:\n        # 1. \u521b\u5efa\u54e8\u5175\u54d1\u8282\u70b9\uff0c\u5176 next \u6307\u5411\u94fe\u8868\u5934\u8282\u70b9\n        #    \u4f5c\u7528: \u6d88\u9664\u201c\u5220\u9664\u5934\u8282\u70b9\u201d\u4e0e\u201c\u5220\u9664\u4e2d\u95f4/\u5c3e\u8282\u70b9\u201d\u7684\u7279\u5224\u903b\u8f91\n        dummy = ListNode(next=head)\n        \n        # 2. \u521d\u59cb\u5316\u5148\u884c\u5feb\u6307\u9488 right\uff0c\u4ece dummy \u51fa\u53d1\n        right = dummy\n        \n        # 3. \u5feb\u6307\u9488\u5148\u884c n \u6b65\n        #    \u6267\u884c\u5b8c\u6bd5\u540e\uff0cright \u4e0e left \u4e4b\u95f4\u5728\u62d3\u6251\u903b\u8f91\u4e0a\u62c9\u5f00\u4e25\u683c\u4e3a n \u4e2a\u8282\u70b9\u7684\u95f4\u8ddd\n        for _ in range(n):\n            right = right.next\n\n        # 4. \u521d\u59cb\u5316\u6162\u6307\u9488 left\uff0c\u4ece dummy \u51fa\u53d1\n        left = dummy\n        \n        # 5. \u53cc\u6307\u9488\u540c\u6b65\u5411\u540e\u904d\u5386\uff0c\u5faa\u73af\u6761\u4ef6\u4e3a right.next \u4e0d\u4e3a\u7a7a\n        #    \u5f53 right.next \u4e3a None \u65f6\uff0cright \u6070\u597d\u505c\u5728\u672b\u5c3e\u8282\u70b9 (\u7d22\u5f15 L)\n        #    \u6839\u636e\u95f4\u8ddd\u4e0d\u53d8\u91cf\uff0cleft \u6b64\u65f6\u5fc5\u7136\u505c\u5728\u6b63\u6570\u7b2c L - n \u4e2a\u8282\u70b9 (\u5f85\u5220\u8282\u70b9\u7684\u524d\u9a71)\n        while right.next:\n            left = left.next\n            right = right.next\n            \n        # 6. \u6267\u884c\u6838\u5fc3\u8df3\u8fc7\u4e0e\u5220\u9664\u64cd\u4f5c: \u5c06\u524d\u9a71\u7684 next \u6307\u9488\u6307\u5411\u5f85\u5220\u8282\u70b9\u7684\u540e\u7ee7\n        left.next = left.next.next\n\n        # 7. \u8fd4\u56de\u54e8\u5175\u7684 next (\u5373\u5220\u9664\u64cd\u4f5c\u540e\u7684\u5b9e\u9645\u94fe\u8868\u5934\u8282\u70b9)\n        return dummy.next\n```\n\n---\n\n## 5. Interview Simulation: Alternative Paradigms & Follow-up Pivots / \u9762\u8bd5\u5b98\u8ffd\u95ee\u6f14\u7ec3\n\n### \u8ffd\u95ee 1: \u53cc\u6307\u9488\u4e00\u8d9f\u626b\u63cf\u6cd5 vs \u4e24\u6b21\u904d\u5386\u8ba1\u6570\u6cd5\uff0c\u4f18\u52a3\u52bf\u662f\u4ec0\u4e48\uff1f\n\n* **\u9762\u8bd5\u5b98**\uff1a\u5982\u679c\u8ba9\u4f60\u7528\u6700\u6734\u7d20\u7684\u4e24\u8d9f\u626b\u63cf\uff08\u5148\u7b97\u603b\u957f\u5ea6 $L$\uff0c\u518d\u627e\u7b2c $L-n$ \u4e2a\u8282\u70b9\uff09\u6765\u5199\uff0c\u548c\u53cc\u6307\u9488\u76f8\u6bd4\u6709\u4ec0\u4e48\u5dee\u5f02\uff1f\n* **\u5019\u9009\u4eba\u89e3\u6790**\uff1a\n  * **\u65f6\u95f4\u590d\u6742\u5ea6**\uff1a\u4e24\u8005\u7406\u8bba\u4e0a\u90fd\u662f $O(L)$\u3002\u4e24\u6b21\u904d\u5386\u603b\u5171\u8bbf\u95ee $L + (L - n)$ \u4e2a\u8282\u70b9\uff0c\u5927\u7ea6 $2L$ \u6b21\u8bbf\u95ee\uff1b\u53cc\u6307\u9488\u4e00\u8d9f\u626b\u63cf\u603b\u5171\u904d\u5386 $n + (L - n) = L$ \u6b21\u53f3\u6307\u9488\u8bbf\u95ee\u4e0e $L - n$ \u6b21\u5de6\u6307\u9488\u8bbf\u95ee\uff0c\u603b\u8bbf\u95ee\u6b21\u6570\u5b8c\u5168\u76f8\u5f53\u3002\n  * **\u5b9e\u9645\u6027\u80fd\u4e0e\u5de5\u7a0b\u8003\u91cf**\uff1a\u5355\u8d9f\u626b\u63cf\u6700\u5927\u7684\u4f18\u52bf\u5728\u4e8e**\u786c\u4ef6 CPU \u7f13\u5b58\u53cb\u597d\uff08Cache Locality\uff09**\u4e0e**\u6d41\u5f0f\u5904\u7406\uff08Stream Processing\uff09**\u3002\u5982\u679c\u94fe\u8868\u975e\u5e38\u5de8\u5927\u6216\u6765\u81ea\u7f51\u7edc\u6d41/\u78c1\u76d8\u8bfb\u53d6\u65e0\u6cd5\u91cd\u5934\u518d\u8bfb\uff0c\u4e00\u8d9f\u53cc\u6307\u9488\u7a97\u53e3\u6ed1\u884c\u53ef\u4ee5\u5728\u4e0d\u91cd\u8bfb\u6570\u636e\u7684\u60c5\u51b5\u4e0b\u76f4\u63a5\u5b8c\u6210\u5904\u7406\u3002\n\n```python\n# \u9644: \u4e24\u6b21\u904d\u5386\u89e3\u6cd5 (Two-Pass Baseline)\nclass SolutionTwoPass:\n    def removeNthFromEnd(self, head: Optional[ListNode], n: int) -> Optional[ListNode]:\n        # 1. \u7edf\u8ba1\u957f\u5ea6\n        length = 0\n        cur = head\n        while cur:\n            length += 1\n            cur = cur.next\n            \n        # 2. \u627e\u5230\u5012\u6570\u7b2c n \u4e2a\u7684\u524d\u9a71 (\u5373\u6b63\u6570\u7b2c length - n \u4e2a)\n        dummy = ListNode(next=head)\n        cur = dummy\n        for _ in range(length - n):\n            cur = cur.next\n            \n        cur.next = cur.next.next\n        return dummy.next\n```\n\n---\n\n### \u8ffd\u95ee 2: \u80fd\u5426\u4f7f\u7528\u7eaf\u9012\u5f52\uff08\u5012\u5e8f\u56de\u6eaf\u8ba1\u6570\uff09\u6765\u89e3\u51b3\uff1f\n\n* **\u9762\u8bd5\u5b98**\uff1a\u9664\u4e86\u53cc\u6307\u9488\u548c\u957f\u5ea6\u904d\u5386\uff0c\u5355\u94fe\u8868\u7684\u5929\u7136\u9012\u5f52\u540e\u5e8f\u904d\u5386\u5177\u6709\u201c\u5012\u5e8f\u51fa\u6808\u201d\u7684\u6027\u8d28\uff0c\u4f60\u80fd\u5199\u51fa\u9012\u5f52\u89e3\u6cd5\u5417\uff1f\n* **\u5019\u9009\u4eba\u89e3\u6790**\uff1a\n  * \u9012\u5f52\u5230\u5e95\u5c42\u9047\u5230 `None` \u65f6\u8fd4\u56de\u8ba1\u6570\u5668 `0`\u3002\n  * \u5f52\u7a0b\u4e2d\u6bcf\u6b21\u56de\u6eaf\u8ba1\u6570\u5668 `+ 1`\u3002\n  * \u5f53\u8ba1\u6570\u5668\u6070\u597d\u7b49\u4e8e $n$ \u65f6\uff0c\u8bf4\u660e\u5f53\u524d\u9012\u5f52\u5c42\u8fd4\u56de\u7684\u8282\u70b9\u5373\u4e3a\u5f85\u5220\u9664\u8282\u70b9\uff0c\u5176\u7236\u5c42\u5c06\u5176\u8df3\u8fc7\u3002\n\n```python\n# \u9644: \u9012\u5f52\u540e\u5e8f\u56de\u6eaf\u6cd5 (Recursive Post-order)\nclass SolutionRecursion:\n    def removeNthFromEnd(self, head: Optional[ListNode], n: int) -> Optional[ListNode]:\n        dummy = ListNode(next=head)\n        \n        def helper(node: Optional[ListNode]) -> int:\n            if not node:\n                return 0\n            # \u9012\u5f52\u6df1\u5165\u5230\u94fe\u8868\u672b\u5c3e\n            cnt = helper(node.next) + 1\n            if cnt == n + 1:\n                # node \u662f\u5f85\u5220\u9664\u8282\u70b9\u7684\u524d\u9a71\n                node.next = node.next.next\n            return cnt\n\n        helper(dummy)\n        return dummy.next\n```\n* **\u590d\u6742\u5ea6\u6743\u8861**\uff1a\u9012\u5f52\u6cd5\u7a7a\u95f4\u590d\u6742\u5ea6\u4e3a $O(L)$\uff08\u7cfb\u7edf\u8c03\u7528\u6808\u5f00\u9500\uff09\uff0c\u800c\u53cc\u6307\u9488\u8fed\u4ee3\u7a7a\u95f4\u4e3a $O(1)$\uff0c\u56e0\u6b64\u5728\u9762\u8bd5\u4e2d\u4f18\u5148\u63a8\u5d07\u8fed\u4ee3\u53cc\u6307\u9488\u3002\n\n---\n\n## 6. The Error Log & Complete Dry-Run / \u9519\u9898\u6392\u67e5\u4e0e\u5b9e\u4f8b\u63a8\u6f14\n\n### \u26a0\ufe0f The Error Log: Anti-Patterns & Defensive Fixes (\u53cd\u6a21\u5f0f\u8bca\u65ad\u8868)\n\n| \u5178\u578b\u9519\u8bef\u6a21\u5f0f (Buggy Pattern) | \u89e6\u53d1\u573a\u666f & \u5f02\u5e38\u8868\u73b0 (Symptom) | \u6839\u56e0\u5206\u6790 (Root Cause) | \u9632\u5fa1\u6027\u4fee\u590d\u4e0e\u4e0d\u53d8\u91cf (Defensive Fix) |\n| :--- | :--- | :--- | :--- |\n| **\u672a\u5f15\u5165 `dummy` \u54e8\u5175** | \u94fe\u8868\u957f\u5ea6\u4e3a 1 \u6216\u5220\u9664\u5934\u8282\u70b9\u65f6 (`n == sz`)\uff0c\u62a5\u9519 `AttributeError` \u6216\u8fd4\u56de\u9519\u8bef\u5934\u8282\u70b9 | \u5220\u9664\u5934\u8282\u70b9\u9700\u8981\u4fee\u6539 `head` \u672c\u8eab\u7684\u6307\u5411\uff0c\u7f3a\u5c11\u524d\u9a71\u8282\u70b9\u5bfc\u81f4\u65e0\u6cd5\u6267\u884c `pre.next = cur.next` | \u7edf\u4e00\u5f15\u5165 `dummy = ListNode(next=head)`\uff0c\u65e0\u8bba\u5220\u8c01\u90fd\u5177\u5907\u7edf\u4e00\u7684\u524d\u9a71 |\n| **\u5faa\u73af\u7ec8\u6b62\u6761\u4ef6\u6df7\u6dc6 (`while right:` vs `while right.next:`)** | \u5220\u9664\u4e86\u5f85\u5220\u9664\u8282\u70b9\u7684\u4e0b\u4e00\u4e2a\u8282\u70b9\uff0c\u6216\u8005\u8d8a\u754c\u62a5 `NoneType.next` | \u82e5\u6761\u4ef6\u5199\u4e3a `while right:`\uff0c\u5f53 `right` \u4e3a `None` \u65f6\uff0c`left` \u505c\u5728\u5f85\u5220\u9664\u8282\u70b9\u672c\u8eab\u800c\u975e\u524d\u9a71 | \u7262\u8bb0\u4e0d\u53d8\u91cf\uff1a\u82e5\u8981\u4fee\u6539 `target`\uff0c\u5fc5\u987b\u505c\u5728 `target` \u7684**\u524d\u9a71**\uff0c\u56e0\u6b64\u4ee5 `right.next` \u4e3a\u7ec8\u6b62\u6761\u4ef6 |\n| **\u5148\u884c\u6b65\u6570\u8d8a\u754c\u672a\u505a\u6821\u9a8c** | \u5f53\u9898\u76ee\u7ed9\u5b9a $n > sz$ \u65f6\uff0c`right = right.next` \u5728 for \u5faa\u73af\u4e2d\u629b\u51fa `AttributeError` | \u5047\u8bbe\u4e86 $n \\le sz$\uff1b\u82e5\u5728\u5de5\u4e1a\u7ea7\u4ee3\u7801\u4e2d\u9700\u8981\u9632\u5fa1\u6027\u4fdd\u62a4 | \u5728 for \u5faa\u73af\u4e2d\u589e\u52a0 `if not right: return head` \u9632\u5fa1\u5206\u652f |\n| **C/C++ \u5185\u5b58\u6cc4\u6f0f (Memory Leak)** | \u5185\u5b58\u6301\u7eed\u5360\u7528\uff08\u529b\u6263/\u751f\u4ea7\u73af\u5883\uff09 | \u4ec5\u65ad\u5f00\u4e86\u6307\u9488\u5f15\u7528\uff0c\u672a `delete` \u91ca\u653e\u88ab\u5254\u9664\u8282\u70b9\u7684\u5806\u5185\u5b58 | \u5148\u6682\u5b58 `ListNode* delNode = left->next; left->next = delNode->next; delete delNode;` |\n\n---\n\n### \ud83d\udd0d \u6781\u7aef\u8fb9\u754c\u7528\u4f8b\u63a8\u6f14 (Dry-Run Matrix)\n\n#### \u7528\u4f8b 1: \u94fe\u8868\u4ec5 1 \u4e2a\u8282\u70b9\uff0c\u5220\u9664\u5934\u8282\u70b9 (`head = [1]`, $n = 1$)\n\n1. \u521d\u59cb\u5316\uff1a`dummy -> [1] -> None`, `left = dummy`, `right = dummy`\n2. \u5148\u884c 1 \u6b65\uff1a`right = right.next` $\\\\rightarrow$ `right` \u6307\u5411 `[1]`\n3. `while right.next:`: `right.next` \u4e3a `None`\uff0c\u5faa\u73af\u4e0d\u6267\u884c\uff01\n4. \u5220\u9664\u64cd\u4f5c\uff1a`left.next = left.next.next` $\\\\rightarrow$ `dummy.next = None`\uff08\u8282\u70b9 `[1]` \u88ab\u67b6\u7a7a\uff09\n5. \u8fd4\u56de\uff1a`dummy.next` \u5373 `None`\uff08\u6b63\u786e\uff01\uff09\n\n#### \u7528\u4f8b 2: \u94fe\u8868\u591a\u8282\u70b9\uff0c\u5220\u9664\u5934\u8282\u70b9 (`head = [1, 2]`, $n = 2$)\n\n1. \u521d\u59cb\u5316\uff1a`dummy -> [1] -> [2] -> None`, `left = dummy`, `right = dummy`\n2. \u5148\u884c 2 \u6b65\uff1a`right` \u4f9d\u6b21\u79fb\u52a8\u5230 `[1]` \u518d\u5230 `[2]`\n3. `while right.next:`: `right.next` \u4e3a `None`\uff0c\u5faa\u73af\u4e0d\u6267\u884c\uff01\n4. \u5220\u9664\u64cd\u4f5c\uff1a`left.next = left.next.next` $\\\\rightarrow$ `dummy.next = dummy.next.next = [2]`\uff08\u5934\u8282\u70b9 `[1]` \u88ab\u5220\u9664\uff09\n5. \u8fd4\u56de\uff1a`dummy.next` \u5373 `[2]`\uff08\u6b63\u786e\uff01\uff09\n\n---\n\n## 7. Complexity Analysis / \u590d\u6742\u5ea6\u5206\u6790\n\n| \u7ef4\u5ea6 (Dimension) | \u590d\u6742\u5ea6 (Complexity) | \u6570\u5b66\u8bc1\u660e\u4e0e\u6838\u5fc3\u539f\u7531 (Mathematical Rationale) |\n| :--- | :---: | :--- |\n| **\u65f6\u95f4\u590d\u6742\u5ea6 (Time Complexity)** | $\\\\mathcal{O}(L)$ | $L$ \u4e3a\u94fe\u8868\u957f\u5ea6\u3002\u5148\u884c\u5feb\u6307\u9488\u79fb\u52a8 $n$ \u6b65\uff0c\u968f\u540e\u5feb\u6162\u6307\u9488\u5171\u540c\u79fb\u52a8 $L - n$ \u6b65\u3002\u5feb\u6307\u9488\u521a\u597d\u5b8c\u6574\u904d\u5386\u6574\u4e2a\u94fe\u8868\u4e00\u6b21\uff0c\u603b\u64cd\u4f5c\u6b65\u6570\u4e25\u683c\u4e3a $L$\uff0c\u65f6\u95f4\u4e3a\u7ebf\u6027 $\\\\mathcal{O}(L)$\u3002 |\n| **\u7a7a\u95f4\u590d\u6742\u5ea6 (Space Complexity)** | $\\\\mathcal{O}(1)$ | \u7b97\u6cd5\u4ec5\u521b\u5efa\u4e86\u4e00\u4e2a\u54e8\u5175 `dummy` \u8282\u70b9\u4e0e\u4e24\u4e2a\u6307\u9488\u53d8\u91cf\uff08`left`, `right`\uff09\uff0c\u672a\u7533\u8bf7\u4efb\u4f55\u4f9d\u8d56\u8f93\u5165\u89c4\u6a21\u7684\u8f85\u52a9\u6570\u636e\u7ed3\u6784\uff0c\u8f85\u52a9\u7a7a\u95f4\u590d\u6742\u5ea6\u4e25\u683c\u4e3a $\\\\mathcal{O}(1)$\u3002 |\n", "code": "from typing import List, Optional\n\n# Definition for singly-linked list.\nclass ListNode:\n    def __init__(self, val=0, next=None):\n        self.val = val\n        self.next = next\n\nclass Solution:\n    def removeNthFromEnd(self, head: Optional[ListNode], n: int) -> Optional[ListNode]:\n        dummy = ListNode(next=head)\n        right = dummy\n        for _ in range(n):\n            right = right.next\n\n        left = dummy\n        while right.next:\n            left = left.next\n            right = right.next\n        left.next = left.next.next\n\n        return dummy.next\n    ", "diff": "Medium", "py_file": "top-100/lc-0019-remove-nth-node-from-end-of-list.py", "md_file": "top-100/lc-0019-remove-nth-node-from-end-of-list.md"}, "top-100/lc-0020-valid-parentheses": {"key": "top-100/lc-0020-valid-parentheses", "category": "Top 100 Liked Track", "title": "Top 100 Liked Track: LC 0020 valid parentheses", "short": "LC 0020 valid parentheses", "path": "top-100/lc-0020-valid-parentheses", "type": "problem", "notes": "", "code": "from typing import List, Optional\n\nclass Solution:\n    pass\n", "diff": "Easy", "py_file": "top-100/lc-0020-valid-parentheses.py", "md_file": ""}, "top-100/lc-0021-merge-two-sorted-lists": {"key": "top-100/lc-0021-merge-two-sorted-lists", "category": "Top 100 Liked Track", "title": "Top 100 Liked Track: LC 0021 merge two sorted lists", "short": "LC 0021 merge two sorted lists", "path": "top-100/lc-0021-merge-two-sorted-lists", "type": "problem", "notes": "", "code": "from typing import List, Optional\n\nclass Solution:\n    pass\n", "diff": "Easy", "py_file": "top-100/lc-0021-merge-two-sorted-lists.py", "md_file": ""}, "top-100/lc-0022-generate-parentheses": {"key": "top-100/lc-0022-generate-parentheses", "category": "Top 100 Liked Track", "title": "Top 100 Liked Track: LC 0022 generate parentheses", "short": "LC 0022 generate parentheses", "path": "top-100/lc-0022-generate-parentheses", "type": "problem", "notes": "", "code": "from typing import List, Optional\n\nclass Solution:\n    pass\n", "diff": "Medium", "py_file": "top-100/lc-0022-generate-parentheses.py", "md_file": ""}, "top-100/lc-0023-merge-k-sorted-lists": {"key": "top-100/lc-0023-merge-k-sorted-lists 503c\u4e0e\u5206\u7c7b\u8ba8\u8bba)\n- **Tags:** Array, Binary Search\n- **Corresponding Python File:** [`top-100/lc-0033-search-in-rotated-sorted-array.py`](top-100/lc-0033-search-in-rotated-sorted-array.py)\n\n---\n\n## 1. Problem Statement / \u9898\u76ee\u63cf\u8ff0\n\n* **[EN]** There is an integer array `nums` sorted in ascending order (with **distinct** values).\n  * Prior to being passed to your function, `nums` is **possibly rotated** at an unknown pivot index `k` (`1 <= k < nums.length`) such that the resulting array is `[nums[k], nums[k+1], ..., nums[n-1], nums[0], nums[1], ..., nums[k-1]]` (0-indexed).\n  * Given the array `nums` after the possible rotation and an integer `target`, return the **index of `target`** if it is in `nums`, or `-1` if it is not in `nums`.\n  * **Requirement:** You must write an algorithm with $\\mathcal{O}(\\log n)$ runtime complexity.\n* **[CN]** \u6574\u6570\u6570\u7ec4 `nums` \u6309\u5347\u5e8f\u6392\u5217\uff0c\u6570\u7ec4\u4e2d\u7684\u503c **\u4e92\u4e0d\u76f8\u540c** \u3002\n  * \u5728\u4f20\u9012\u7ed9\u51fd\u6570\u4e4b\u524d\uff0c`nums` \u5728\u9884\u5148\u672a\u77e5\u7684\u67d0\u4e2a\u4e0b\u6807 `k`\uff08`1 <= k < nums.length`\uff09\u4e0a\u8fdb\u884c\u4e86 **\u65cb\u8f6c**\uff0c\u4f7f\u6570\u7ec4\u53d8\u4e3a `[nums[k], nums[k+1], ..., nums[n-1], nums[0], nums[1], ..., nums[k-1]]`\uff08\u4e0b\u6807\u4ece 0 \u5f00\u59cb\u8ba1\u6570\uff09\u3002\n  * \u7ed9\u4f60 **\u65cb\u8f6c\u540e** \u7684\u6570\u7ec4 `nums` \u548c\u4e00\u4e2a\u6574\u6570 `target` \uff0c\u5982\u679c `nums` \u4e2d\u5b58\u5728\u8fd9\u4e2a\u76ee\u6807\u503c `target` \uff0c\u5219\u8fd4\u56de\u5b83\u7684\u4e0b\u6807\uff0c\u5426\u5219\u8fd4\u56de `-1` \u3002\n  * **\u8981\u6c42**\uff1a\u4f60\u5fc5\u987b\u8bbe\u8ba1\u4e00\u4e2a\u65f6\u95f4\u590d\u6742\u5ea6\u4e3a $\\mathcal{O}(\\log n)$ \u7684\u7b97\u6cd5\u89e3\u51b3\u6b64\u95ee\u9898\u3002\n\n### Constraints / \u7ea6\u675f\u6761\u4ef6\n* $1 \\le \\text{nums.length} \\le 5000$\n* $-10^4 \\le \\text{nums}[i] \\le 10^4$\n* `nums` \u4e2d\u7684\u6bcf\u4e2a\u503c\u90fd **\u72ec\u4e00\u65e0\u4e8c**\n* \u9898\u76ee\u6570\u636e\u4fdd\u8bc1 `nums` \u5728\u9884\u5148\u672a\u77e5\u7684\u67d0\u4e2a\u4e0b\u6807\u4e0a\u8fdb\u884c\u4e86\u65cb\u8f6c\n* $-10^4 \\le \\text{target} \\le 10^4$\n\n---\n\n## 2. Core Idea: Red-Blue Binary Search with `nums[-1]` Reference / \u6838\u5fc3\u89e3\u6cd5\uff1a\u57fa\u4e8e `nums[-1]` \u57fa\u51c6\u7684\u7ea2\u84dd\u4e8c\u5206\u6cd5\n\n### \ud83d\udca1 \u6838\u5fc3\u51e0\u4f55\u7ed3\u6784\u4e0e\u4e24\u6bb5\u6027\n\u5347\u5e8f\u6570\u7ec4\u65cb\u8f6c\u540e\u5448\u73b0\u51fa\u65ad\u5d16\u5f0f\u53cc\u5347\u5e8f\u7ed3\u6784\uff1a\n\n```\n \u6570\u503c (Value)\n   ^\n   |        \u5de6\u534a\u6bb5 (Left Segment: nums[i] > nums[-1])\n   |           /|\n   |          / |\n   |         /  |\n   |        /   |   \u53f3\u534a\u6bb5 (Right Segment: nums[i] <= nums[-1])\n   |       /    |          /\n   |      /     |         /\n   |     /      |        /\n   |    /       |       /   <--- end = nums[-1] (\u57fa\u51c6\u53c2\u8003\u951a\u70b9 Anchor)\n   |            |      /\n   |            |     /\n   |            |    /\n   |            |   * <--- \u65cb\u8f6c\u65ad\u5d16\u4ea4\u754c\u70b9\n   +----------------------------------------------------> \u4e0b\u6807 (Index)\n```\n\n---\n\n### \ud83c\udfa8 \u7ea2\u84dd\u4e8c\u5206\u67d3\u8272\u903b\u8f91 (`is_blue(i)`)\n\n\u5728\u6807\u51c6\u7684\u4e8c\u5206\u67e5\u627e\u4e2d\uff0c\u6211\u4eec\u5e0c\u671b\u627e\u5230\u76ee\u6807\u503c $target$ \u7b2c\u4e00\u6b21\u51fa\u73b0\uff08$\\ge target$\uff09\u7684\u4f4d\u7f6e\u3002\n\u6211\u4eec\u5c06\u6574\u4e2a\u6570\u7ec4\u5206\u6210\u4e24\u4e2a\u90e8\u5206\uff1a\n* **\u7ea2\u8272\u533a\u57df (Red / False)**\uff1a\u4f4d\u4e8e $target$ **\u4e25\u683c\u5de6\u4fa7** \u7684\u5143\u7d20\u3002\n* **\u84dd\u8272\u533a\u57df (Blue / True)**\uff1a$target$ \u672c\u8eab\u4ee5\u53ca\u4f4d\u4e8e $target$ **\u53f3\u4fa7** \u7684\u5143\u7d20\u3002\n\n\u901a\u8fc7\u4e0e\u672b\u5c3e\u5143\u7d20 `end = nums[-1]` \u7684\u6bd4\u8f83\uff0c\u6211\u4eec\u53ef\u4ee5\u51c6\u786e\u65ad\u5b9a\u5f53\u524d\u5143\u7d20 $nums[i]$ \u548c\u76ee\u6807\u503c $target$ \u5206\u522b\u5904\u4e8e **\u5de6\u534a\u6bb5** \u8fd8\u662f **\u53f3\u534a\u6bb5**\uff1a\n\n#### \u5206\u7c7b\u8ba8\u8bba\u5224\u5b9a\u8868 (Decision Matrix)\uff1a\n\n| \u5f53\u524d $nums[i]$ \u4f4d\u7f6e | \u76ee\u6807 $target$ \u4f4d\u7f6e | $nums[i]$ \u662f\u5426\u5728 $target$ \u7684\u53f3\u4fa7\uff08\u5373\u662f\u5426\u67d3\u4e3a\u84dd\u8272 `is_blue`\uff09\uff1f |\n| :--- | :--- | :--- |\n| **\u5de6\u534a\u6bb5** ($nums[i] > end$) | **\u5de6\u534a\u6bb5** ($target > end$) | \u540c\u5728\u5de6\u534a\u6bb5\uff0c\u7531\u4e8e\u5de6\u534a\u6bb5\u5355\u8c03\u9012\u589e\uff0c\u5f53\u4e14\u4ec5\u5f53 $nums[i] \\ge target$ \u65f6\u4e3a\u84dd\u8272\u3002<br>$\\implies$ `target > end and nums[i] >= target` |\n| **\u5de6\u534a\u6bb5** ($nums[i] > end$) | **\u53f3\u534a\u6bb5** ($target \\le end$) | $nums[i]$ \u5728\u5de6\u534a\u6bb5\uff0c$target$ \u5728\u53f3\u534a\u6bb5\uff0c\u6545 $nums[i]$ \u5fc5\u7136\u5728 $target$ \u7684\u4e25\u683c\u5de6\u4fa7\uff0c\u6052\u4e3a\u7ea2\u8272 (False)\u3002 |\n| **\u53f3\u534a\u6bb5** ($nums[i] \\le end$) | **\u5de6\u534a\u6bb5** ($target > end$) | $nums[i]$ \u5728\u53f3\u534a\u6bb5\uff0c$target$ \u5728\u5de6\u534a\u6bb5\uff0c\u6545 $nums[i]$ \u5fc5\u7136\u5728 $target$ \u7684\u4e25\u683c\u53f3\u4fa7\uff0c\u6052\u4e3a\u84dd\u8272 (True)\u3002 |\n| **\u53f3\u534a\u6bb5** ($nums[i] \\le end$) | **\u53f3\u534a\u6bb5** ($target \\le end$) | \u540c\u5728\u53f3\u534a\u6bb5\uff0c\u7531\u4e8e\u53f3\u534a\u6bb5\u5355\u8c03\u9012\u589e\uff0c\u5f53\u4e14\u4ec5\u5f53 $nums[i] \\ge target$ \u65f6\u4e3a\u84dd\u8272\u3002<br>$\\implies$ `nums[i] >= target` |\n\n#### \u6574\u5408\u540e\u7684\u6781\u7b80\u903b\u8f91 (`is_blue`)\uff1a\n```python\ndef is_blue(i: int) -> bool:\n    end = nums[-1]\n    if nums[i] > end:\n        # nums[i] \u5728\u5de6\u534a\u6bb5\uff1a\u53ea\u6709 target \u4e5f\u5728\u5de6\u534a\u6bb5\u4e14 nums[i] >= target \u65f6\u624d\u662f\u84dd\u8272\n        return target > end and nums[i] >= target\n    else:\n        # nums[i] \u5728\u53f3\u534a\u6bb5\uff1a\u82e5 target \u5728\u5de6\u534a\u6bb5\u5219\u5fc5\u4e3a\u84dd\u8272\uff0c\u82e5 target \u4e5f\u5728\u53f3\u534a\u6bb5\u5219 nums[i] >= target \u4e3a\u84dd\u8272\n        return target > end or nums[i] >= target\n```\n\n---\n\n## 3. Step-by-Step Code Walkthrough / \u4ee3\u7801\u9010\u884c\u8be6\u89e3\n\n\u57fa\u4e8e\u4f60\u5b9e\u73b0\u7684\u5f00\u533a\u95f4 `(-1, n - 1)` \u7ea2\u84dd\u4e8c\u5206\u4ee3\u7801\uff1a\n\n```python\nfrom typing import List, Optional\n\nclass Solution:\n    def search(self, nums: List[int], target: int) -> int:\n        def is_blue(i: int) -> bool:\n            end = nums[-1]\n            if nums[i] > end:\n                return target > end and nums[i] >= target\n            else:\n                return target > end or nums[i] >= target\n```\n\n* **[EN] Action:** Defines the predicate helper `is_blue(i)`. It compares $nums[i]$ and $target$ against $end = nums[-1]$ to determine if $nums[i]$ is at or to the right of $target$.\n* **[CN] \u52a8\u4f5c**\uff1a\u5b9a\u4e49\u4e8c\u5206\u67d3\u8272\u5224\u5b9a\u51fd\u6570 `is_blue(i)`\u3002\u901a\u8fc7\u4e0e $end = nums[-1]$ \u6bd4\u8f83\uff0c\u7cbe\u51c6\u5224\u5b9a $nums[i]$ \u662f\u5426\u843d\u5728\u5305\u542b $target$ \u53ca\u5176\u53f3\u4fa7\u7684\u84dd\u8272\u533a\u95f4\u3002\n\n---\n\n```python\n        left = -1\n        right = len(nums) - 1\n        while left + 1 < right:\n            mid = (left + right) // 2\n            if is_blue(mid):\n                right = mid\n            else:\n                left = mid\n```\n\n* **[EN] Action:** Initializes open interval `(left, right) = (-1, len(nums) - 1)`. Continuously bisects the search space while `left + 1 < right`:\n  * If `is_blue(mid)` is True: Shrinks the right boundary `right = mid`.\n  * If `is_blue(mid)` is False: Shrinks the left boundary `left = mid`.\n* **[CN] \u52a8\u4f5c**\uff1a\u521d\u59cb\u5316\u5f00\u533a\u95f4 `(-1, len(nums) - 1)`\uff0c\u8fdb\u5165\u6807\u51c6\u5f00\u533a\u95f4\u4e8c\u5206\u5faa\u73af\uff1a\n  * \u82e5 `is_blue(mid)` \u4e3a True\uff1a\u8bf4\u660e `mid` \u5df2\u8fdb\u5165\u84dd\u8272\u533a\u57df\uff0c\u5411\u5de6\u6536\u7f29\u53f3\u8fb9\u754c `right = mid`\u3002\n  * \u5426\u5219\uff1a\u8bf4\u660e `mid` \u4ecd\u5728\u7ea2\u8272\u533a\u57df\uff0c\u5411\u53f3\u6536\u7f29\u5de6\u8fb9\u754c `left = mid`\u3002\n\n---\n\n```python\n        if right == len(nums) or nums[right] != target:\n            return -1\n\n        return right\n```\n\n* **[EN] Action:** Loop terminates with `left + 1 == right`. `right` points to the first blue element.\n  * We check if `nums[right] == target`. If `target` does not exist in `nums` (or `nums[right] != target`), return `-1`. Otherwise, return the index `right`.\n* **[CN] \u52a8\u4f5c**\uff1a\u5faa\u73af\u7ec8\u6b62\u65f6 `left + 1 == right`\uff0c`right` \u7cbe\u786e\u505c\u5728\u7b2c\u4e00\u4e2a\u84dd\u8272\u4f4d\u7f6e\u3002\n  * \u68c0\u67e5\u8be5\u4f4d\u7f6e\u662f\u5426\u771f\u7684\u7b49\u4e8e $target$\u3002\u82e5\u4e0d\u7b49\u4e8e\uff08\u8bf4\u660e\u6570\u7ec4\u4e2d\u4e0d\u5b58\u5728 $target$\uff09\uff0c\u8fd4\u56de `-1`\uff1b\u5426\u5219\u8fd4\u56de\u4e0b\u6807 `right`\u3002\n\n---\n\n## 4. Alternative Paradigms & Comparison / \u591a\u79cd\u89e3\u6cd5\u5bf9\u6bd4\n\n### \u65b9\u6848 1\uff1a\u4e00\u6b21\u4e8c\u5206\u6cd5\uff08\u7ea2\u84dd\u67d3\u8272 / \u63a8\u8350\uff0c\u4ee3\u7801\u6700\u51dd\u7ec3\uff09\n\u5373\u5f53\u524d\u4ee3\u7801\uff0c\u901a\u8fc7 `is_blue(i)` \u4e00\u6b21\u4e8c\u5206\u76f4\u63a5\u5728 $\\mathcal{O}(\\log n)$ \u5185\u5b9a\u4f4d `target`\u3002\n\n### \u65b9\u6848 2\uff1a\u4e24\u6b21\u4e8c\u5206\u6cd5\uff08\u5148\u627e\u6700\u5c0f\u503c\u65ad\u5d16\uff0c\u518d\u5355\u6bb5\u4e8c\u5206\uff09\n1. **\u7b2c\u4e00\u6b65\uff08LC 153\uff09**\uff1a\u4e8c\u5206\u67e5\u627e\u65cb\u8f6c\u6570\u7ec4\u7684\u6700\u5c0f\u503c\u4e0b\u6807 $pivot$\uff08\u65ad\u5d16\u5206\u5272\u70b9\uff09\u3002\n2. **\u7b2c\u4e8c\u6b65**\uff1a\u6839\u636e $target$ \u4e0e $nums[-1]$ \u7684\u5927\u5c0f\u5173\u7cfb\uff0c\u786e\u5b9a $target$ \u843d\u5728\u5de6\u534a\u6bb5 $[0, pivot - 1]$ \u8fd8\u662f\u53f3\u534a\u6bb5 $[pivot, n - 1]$\u3002\n3. **\u7b2c\u4e09\u6b65**\uff1a\u5728\u5bf9\u5e94\u7684\u4e25\u683c\u5355\u8c03\u5347\u5e8f\u5b50\u533a\u95f4\u5185\u8c03\u7528\u6807\u51c6 `lower_bound` \u4e8c\u5206\u67e5\u627e\u3002\n\n```python\n# \u4e24\u6b21\u4e8c\u5206\u5b9e\u73b0\u793a\u4f8b\nclass SolutionTwoPass:\n    def search(self, nums: List[int], target: int) -> int:\n        # 1. \u4e8c\u5206\u5bfb\u627e\u6700\u5c0f\u503c pivot (\u65ad\u5d16\u8d77\u70b9)\n        left, right = -1, len(nums) - 1\n        while left + 1 < right:\n            mid = (left + right) // 2\n            if nums[mid] <= nums[-1]:\n                right = mid\n            else:\n                left = mid\n        pivot = right\n        \n        # 2. \u5212\u5206\u76ee\u6807\u6240\u5728\u7684\u5355\u8c03\u533a\u95f4\n        if target > nums[-1]:\n            left, right = -1, pivot  # \u5728\u5de6\u534a\u6bb5 [0, pivot - 1]\n        else:\n            left, right = pivot - 1, len(nums)  # \u5728\u53f3\u534a\u6bb5 [pivot, n - 1]\n            \n        # 3. \u6807\u51c6\u4e8c\u5206\u67e5\u627e target\n        while left + 1 < right:\n            mid = (left + right) // 2\n            if nums[mid] >= target:\n                right = mid\n            else:\n                left = mid\n                \n        return right if right < len(nums) and nums[right] == target else -1\n```\n\n---\n\n## 5. Step-by-Step Walkthrough with Examples / \u6837\u4f8b\u56fe\u89e3\u5206\u6790\n\n### \u6837\u4f8b 1: `nums = [4, 5, 6, 7, 0, 1, 2]`, `target = 0` ($n = 7$)\n\u57fa\u51c6\u951a\u70b9\uff1a`end = nums[-1] = 2`\n$target = 0 \\le 2$\uff08$target$ \u5904\u4e8e\u53f3\u534a\u6bb5\uff09\n\n* **\u521d\u59cb\u5316**\uff1a`left = -1`, `right = 6` (\u641c\u7d22\u5f00\u533a\u95f4 `(-1, 6)`)\n* **\u7b2c 1 \u8f6e**\uff1a\n  * `mid = (-1 + 6) // 2 = 2` $\\to$ `nums[2] = 6 > 2`\uff08\u5de6\u534a\u6bb5\uff09\n  * `is_blue(2)`: $nums[2]$ \u5728\u5de6\u534a\u6bb5\u800c $target$ \u5728\u53f3\u534a\u6bb5 $\\to$ False (\u7ea2\u8272)\n  * `left = mid = 2`\uff0c\u533a\u95f4\u7f29\u5c0f\u4e3a `(2, 6)`\u3002\n* **\u7b2c 2 \u8f6e**\uff1a\n  * `mid = (2 + 6) // 2 = 4` $\\to$ `nums[4] = 0 <= 2`\uff08\u53f3\u534a\u6bb5\uff09\n  * `is_blue(4)`: $target \\le 2$ \u4e14 `nums[4] = 0 >= 0` $\\to$ True (\u84dd\u8272)\n  * `right = mid = 4`\uff0c\u533a\u95f4\u7f29\u5c0f\u4e3a `(2, 4)`\u3002\n* **\u7b2c 3 \u8f6e**\uff1a\n  * `mid = (2 + 4) // 2 = 3` $\\to$ `nums[3] = 7 > 2`\uff08\u5de6\u534a\u6bb5\uff09\n  * `is_blue(3)`: False (\u7ea2\u8272)\n  * `left = mid = 3`\uff0c\u533a\u95f4\u7f29\u5c0f\u4e3a `(3, 4)`\u3002\n* **\u7ec8\u6b62**\uff1a`left + 1 == 3 + 1 == 4 == right`\uff0c\u5faa\u73af\u7ed3\u675f\u3002\n* **\u6821\u9a8c\u4e0e\u8fd4\u56de**\uff1a`nums[right] = nums[4] = 0 == target`\uff0c\u8fd4\u56de\u4e0b\u6807 `4`\uff0c\u5b8c\u5168\u6b63\u786e\uff01\n\n---\n\n### \u6837\u4f8b 2: `nums = [4, 5, 6, 7, 0, 1, 2]`, `target = 3` (\u4e0d\u5b58\u5728\u4e8e\u6570\u7ec4\u4e2d)\n* \u7ecf\u8fc7\u4e8c\u5206\u6700\u7ec8\u505c\u5728\u7b2c\u4e00\u4e2a\u84dd\u8272\u4f4d\u7f6e `right = 4` (`nums[4] = 0`)\u3002\n* \u68c0\u67e5 `nums[4] != 3`\uff0c\u8fd4\u56de `-1`\uff0c\u6210\u529f\u68c0\u6d4b\u51fa\u5143\u7d20\u7f3a\u5931\u3002\n\n---\n\n## 6. Key FAQs & Edge Cases / \u6838\u5fc3\u7b54\u7591\u4e0e\u8fb9\u754c\u5206\u6790\n\n### Q1: \u4e3a\u4ec0\u4e48\u4f7f\u7528 `nums[-1]` \u4f5c\u4e3a\u951a\u70b9\u6bd4\u4f7f\u7528 `nums[0]` \u66f4\u7edf\u4e00\uff1f\n* \u6bd4\u8f83 `nums[-1]` \u80fd\u591f\u5b8c\u7f8e\u517c\u987e**\u672a\u53d1\u751f\u65cb\u8f6c\u7684\u539f\u5347\u5e8f\u6570\u7ec4**\uff08\u5982 `[1, 2, 3, 4, 5]`\uff09\u3002\u5728\u672a\u65cb\u8f6c\u6570\u7ec4\u4e2d\uff0c\u6240\u6709\u5143\u7d20\u5747 $\\le nums[-1]$\uff0c\u6574\u4e2a\u6570\u7ec4\u88ab\u81ea\u7136\u8 1\n        while left + 1 < right:\n            mid = (left + right) // 2\n            if is_blue(mid):\n                right = mid\n            else:\n                left = mid\n\n        if right == len(nums) or nums[right] != target:\n            return -1\n\n        return right\n\n\n        ", "diff": "Medium", "py_file": "top-100/lc-0033-search-in-rotated-sorted-array.py", "md_file": "top-100/lc-0033-search-in-rotated-sorted-array.md"}, "top-100/lc-0034-find-first-and-last-position-of-element-in-sorted-array": {"key": "top-100/lc-0034-find-first-and-last-position-of-element-in-sorted-array", "category": "Top 100 Liked Track", "title": "Top 100 Liked Track: LC 0034 find first and last position of element in sorted array", "short": "LC 0034 find first and last position of element in sorted array", "path": "top-100/lc-0034-find-first-and-last-position-of-element-in-sorted-array", "type": "problem", "notes": "# LeetCode 34. Find First and Last Position of Element in Sorted Array (\u5728\u6392\u5e8f\u6570\u7ec4\u4e2d\u67e5\u627e\u5143\u7d20\u7684\u7b2c\u4e00\u4e2a\u548c\u6700\u540e\u4e00\u4e2a\u4f4d\u7f6e)\n## Step-by-Step Code Walkthrough & Notes / \u4ee3\u7801\u9010\u884c\u8be6\u89e3\u4e0e\u77e5\u8bc6\u70b9\u603b\u7ed3\n\n- **Difficulty:** Medium (\u9ad8\u9891\u9762\u8bd5\u7ecf\u5178\u9898 / \u4e8c\u5206\u67e5\u627e\u6a21\u7248\u9898)\n- **Tags:** Array, Binary Search\n- **Corresponding Python File:** [`top-100/lc-0034-find-first-and-last-position-of-element-in-sorted-array.py`](file:///Users/stevenhuang/Desktop/leetcode-sh/top-100/lc-0034-find-first-and-last-position-of-element-in-sorted-array.py)\n\n---\n\n## 1. Problem Statement / \u9898\u76ee\u63cf\u8ff0\n\n* **[EN]** Given an array of integers `nums` sorted in non-decreasing order, find the starting and ending position of a given `target` value.\n  * If `target` is not found in the array, return `[-1, -1]`.\n  * **Requirement:** You must write an algorithm with $\\mathcal{O}(\\log n)$ runtime complexity.\n* **[CN]** \u7ed9\u4f60\u4e00\u4e2a\u6309\u7167\u975e\u9012\u51cf\u987a\u5e8f\u6392\u5217\u7684\u6574\u6570\u6570\u7ec4 `nums` \uff0c\u548c\u4e00\u4e2a\u76ee\u6807\u503c `target` \u3002\u8bf7\u4f60\u627e\u51fa\u7ed9\u5b9a\u76ee\u6807\u503c\u5728\u6570\u7ec4\u4e2d\u7684\u5f00\u59cb\u4f4d\u7f6e\u548c\u7ed3\u675f\u4f4d\u7f6e\u3002\n  * \u5982\u679c\u6570\u7ec4\u4e2d\u4e0d\u5b58\u5728\u76ee\u6807\u503c `target` \uff0c\u8fd4\u56de `[-1, -1]` \u3002\n  * **\u8981\u6c42**\uff1a\u4f60\u5fc5\u987b\u8bbe\u8ba1\u5e76\u5b9e\u73b0\u65f6\u95f4\u590d\u6742\u5ea6\u4e3a $\\mathcal{O}(\\log n)$ \u7684\u7b97\u6cd5\u89e3\u51b3\u6b64\u95ee\u9898\u3002\n\n---\n\n## 2. Core Idea: The Universal `lower_bound` Framework / \u6838\u5fc3\u89e3\u6cd5\uff1a\u4e07\u80fd `lower_bound` \u4f53\u7cfb\n\n\u5728\u6709\u5e8f\u6570\u7ec4\u4e2d\uff0c\u6240\u6709\u56db\u79cd\u5e38\u89c1\u7684\u4e8c\u5206\u67e5\u627e\u9700\u6c42\uff0c\u5747\u53ef\u8f6c\u5316\u4e3a\u6c42 **\u5927\u4e8e\u7b49\u4e8e\u67d0\u4e2a\u503c\u7684\u7b2c\u4e00\u4e2a\u4e0b\u6807**\uff08\u5373 `lower_bound`\uff09\uff1a\n\n| \u67e5\u8be2\u9700\u6c42 | \u542b\u4e49\u63cf\u8ff0 | \u8f6c\u5316\u4e3a `lower_bound` \u7684\u7b49\u4ef7\u5199\u6cd5 | \u5907\u6ce8\u8bf4\u660e |\n| :--- | :--- | :--- | :--- |\n| **$\\ge x$** | \u7b2c\u4e00\u4e2a $\\ge x$ \u7684\u4f4d\u7f6e | `lower_bound(nums, x)` | \u57fa\u7840\u539f\u578b |\n| **$> x$** | \u7b2c\u4e00\u4e2a $> x$ \u7684\u4f4d\u7f6e | `lower_bound(nums, x + 1)` | \u7b49\u4ef7\u4e8e $\\ge (x + 1)$\uff08\u6574\u6570\u8303\u56f4\u5185\uff09 |\n| **$< x$** | \u6700\u540e\u4e00\u4e2a $< x$ \u7684\u4f4d\u7f6e | `lower_bound(nums, x) - 1` | \u7b2c\u4e00\u4e2a $\\ge x$ \u7684\u524d\u4e00\u4e2a\u4f4d\u7f6e |\n| **$\\le x$** | \u6700\u540e\u4e00\u4e2a $\\le x$ \u7684\u4f4d\u7f6e | `lower_bound(nums, x + 1) - 1` | \u7b2c\u4e00\u4e2a $> x$ \u7684\u524d\u4e00\u4e2a\u4f4d\u7f6e |\n\n### \u672c\u9898\u5e94\u7528\uff1a\n1. **\u5bfb\u627e\u8d77\u59cb\u4f4d\u7f6e (Start Index)**\uff1a\u5373\u5bfb\u627e\u6570\u7ec4\u4e2d\u7b2c\u4e00\u4e2a $\\ge target$ \u7684\u4f4d\u7f6e\uff1a\n   $$\\text{start} = \\text{lower\\_bound}(nums, target)$$\n   * **\u7279\u5224**\uff1a\u82e5 $\\text{start} == len(nums)$\uff08\u6240\u6709\u6570\u90fd\u6bd4 $target$ \u5c0f\uff09\u6216 $nums[\\text{start}] \\neq target$\uff08\u6570\u7ec4\u4e2d\u65e0 $target$\uff09\uff0c\u8bf4\u660e $target$ \u4e0d\u5b58\u5728\uff0c\u76f4\u63a5\u8fd4\u56de `[-1, -1]`\u3002\n2. **\u5bfb\u627e\u7ed3\u675f\u4f4d\u7f6e (End Index)**\uff1a\u5373\u5bfb\u627e\u6570\u7ec4\u4e2d\u6700\u540e\u4e00\u4e2a $\\le target$ \u7684\u4f4d\u7f6e\uff0c\u7b49\u4ef7\u4e8e **\u7b2c\u4e00\u4e2a $> target$\uff08\u5373 $\\ge target + 1$\uff09\u7684\u524d\u4e00\u4e2a\u4f4d\u7f6e**\uff1a\n   $$\\text{end} = \\text{lower\\_bound}(nums, target + 1) - 1$$\n3. \u8fd4\u56de `[start, end]`\u3002\n\n---\n\n## 3. Code Implementation / \u4ee3\u7801\u5b9e\u73b0\n\n```python\nfrom typing import List\n\n# \u95ed\u533a\u95f4\u5199\u6cd5 [left, right]\ndef lower_bound(nums: List[int], target: int) -> int:\n    \"\"\"\n    \u8fd4\u56de\u6700\u5c0f\u7684\u6ee1\u8db3 nums[i] >= target \u7684\u4e0b\u6807 i\u3002\n    \u82e5\u4e0d\u5b58\u5728\uff08\u5373\u6240\u6709\u5143\u7d20\u5747 < target\uff09\uff0c\u8fd4\u56de len(nums)\u3002\n    \"\"\"\n    left = 0\n    right = len(nums) - 1  # \u95ed\u533a\u95f4 [left, right]\n    \n    while left <= right:   # \u5f53\u533a\u95f4\u4e0d\u4e3a\u7a7a\u65f6\u5faa\u73af\n        mid = left + (right - left) // 2\n        if nums[mid] < target:\n            left = mid + 1  # \u76ee\u6807\u5728\u53f3\u534a\u90e8\u5206\uff0c\u8303\u56f4\u7f29\u5c0f\u4e3a [mid + 1, right]\n        else:\n            right = mid - 1 # \u76ee\u6807\u5728\u5de6\u534a\u90e8\u5206\u6216\u5f53\u524d mid\uff0c\u8303\u56f4\u7f29\u5c0f\u4e3a [left, mid - 1]\n            \n    return left  # \u5faa\u73af\u7ed3\u675f\u65f6 right + 1 == left\uff0cleft \u5373\u4e3a\u7b2c\u4e00\u4e2a >= target \u7684\u4f4d\u7f6e\n\n\nclass Solution:\n    def searchRange(self, nums: List[int], target: int) -> List[int]:\n        # 1. \u67e5\u627e\u7b2c\u4e00\u4e2a >= target \u7684\u4f4d\u7f6e\n        start = lower_bound(nums, target)\n        \n        # 2. \u5224\u65ad target \u662f\u5426\u5728\u6570\u7ec4\u4e2d\u5b58\u5728\n        if start == len(nums) or nums[start] != target:\n            return [-1, -1]\n            \n        # 3. \u67e5\u627e\u6700\u540e\u4e00\u4e2a <= target \u7684\u4f4d\u7f6e\uff08\u5373\u7b2c\u4e00\u4e2a >= target + 1 \u7684\u4f4d\u7f6e\u51cf 1\uff09\n        end = lower_bound(nums, target + 1) - 1\n        \n        return [start, end]\n```\n\n---\n\n## 4. The Three Interval Paradigms / \u4e8c\u5206\u67e5\u627e\u7684\u4e09\u79cd\u533a\u95f4\u6a21\u7248\u6df1\u5ea6\u5bf9\u6bd4\n\n\u4e8c\u5206\u67e5\u627e\u7684\u6838\u5fc3\u5728\u4e8e**\u533a\u95f4\u5b9a\u4e49\uff08\u5faa\u73af\u4e0d\u53d8\u91cf\uff09**\uff0c\u4e0d\u540c\u533a\u95f4\u7684\u5b9a\u4e49\u51b3\u5b9a\u4e86\u8fb9\u754c\u66f4\u65b0\u548c\u7ec8\u6b62\u6761\u4ef6\uff1a\n\n```\n\u95ed\u533a\u95f4 [left, right]       \u5de6\u95ed\u53f3\u5f00 [left, right)      \u5f00\u533a\u95f4 (left, right)\n  left       right            left         right          left       right\n   \u2193           \u2193               \u2193             \u2193             \u2193           \u2193\n[  .   .   .   .  ]         [  .   .   .   .  )         (  .   .   .   .  )\n```\n\n| \u7ef4\u5ea6 | 1. \u95ed\u533a\u95f4 `[left, right]` | 2. \u5de6\u95ed\u53f3\u5f00 `[left, right)` | 3. \u5f00\u533a\u95f4 `(left, right)` |\n| :--- | :--- | :--- | :--- |\n| **\u521d\u59cb\u5316** | `left = 0, right = n - 1` | `left = 0, right = n` | `left = -1, right = n` |\n| **\u5faa\u73af\u6761\u4ef6** | `while left <= right:` | `while left < right:` | `while left + 1 < right:` |\n| **\u82e5 $nums[mid] < target$** | `left = mid + 1` | `left = mid + 1` | `left = mid` |\n| **\u82e5 $nums[mid] \\ge target$** | `right = mid - 1` | `right = mid` | `right = mid` |\n| **\u5faa\u73af\u7ed3\u675f\u72b6\u6001** | `right + 1 == left` | `left == right` | `left + 1 == right` |\n| **\u8fd4\u56de\u503c** | `return left` (\u6216 `right + 1`) | `return left` (\u6216 `right`) | `return right` (\u6216 `left + 1`) |\n\n### \u4e09\u79cd\u6a21\u7248\u7684\u5b8c\u6574\u4ee3\u7801\u5bf9\u6bd4\uff1a\n\n```python\n# 1. \u95ed\u533a\u95f4\u6a21\u7248 [left, right]\ndef lower_bound_closed(nums: List[int], target: int) -> int:\n    left, right = 0, len(nums) - 1\n    while left <= right:\n        mid = (left + right) // 2\n        if nums[mid] < target:\n            left = mid + 1\n        else:\n            right = mid - 1\n    return left\n\n# 2. \u5de6\u95ed\u53f3\u5f00\u6a21\u7248 [left, right)\ndef lower_bound_half_open(nums: List[int], target: int) -> int:\n    left, right = 0, len(nums)\n    while left < right:\n        mid = (left + right) // 2\n        if nums[mid] < target:\n            left = mid + 1\n        else:\n            right = mid\n    return left\n\n# 3. \u5f00\u533a\u95f4\u6a21\u7248 (left, right)\ndef lower_bound_open(nums: List[int], target: int) -> int:\n    left, right = -1, len(nums)\n    while left + 1 < right:\n        mid = (left + right) // 2\n        if nums[mid] < target:\n            left = mid\n        else:\n            right = mid\n    return right\n```\n\n---\n\n## 5. Step-by-Step Walkthrough with Example / \u6837\u4f8b\u56fe\u89e3\u5206\u6790\n\n\u5047\u8bbe `nums = [5, 7, 7, 8, 8, 10]`, `target = 8`\n\n### \u7b2c\u4e00\u6b65\uff1a\u67e5\u627e\u8d77\u59cb\u70b9 `start = lower_bound(nums, 8)`\n* \u521d\u59cb\uff1a`left = 0`, `right = 5` (\u533a\u95f4 `[0, 5]`)\n  * `mid = (0 + 5) // 2 = 2`\uff0c`nums[2] = 7 < 8` $\\to$ `left = mid + 1 = 3`\n  * `mid = (3 + 5) // 2 = 4`\uff0c`nums[4] = 8 >= 8` $\\to$ `right = mid - 1 = 3`\n  * `mid = (3 + 3) // 2 = 3`\uff0c`nums[3] = 8 >= 8` $\\to$ `right = mid - 1 = 2`\n* \u5faa\u73af\u7ed3\u675f\uff08`left = 3 > right = 2`\uff09\uff0c\u8fd4\u56de `left = 3`\u3002\n* \u68c0\u67e5\uff1a`start = 3 < 6` \u4e14 `nums[3] == 8`\uff0c\u6709\u6548\u3002\n\n### \u7b2c\u4e8c\u6b65\uff1a\u67e5\u627e\u7ed3\u675f\u70b9 `end = lower_bound(nums, 9) - 1`\n* \u67e5\u627e\u7b2c\u4e00\u4e2a $\\ge 9$ \u7684\u4f4d\u7f6e\uff1a\n  * \u521d\u59cb\uff1a`left = 0`, `right = 5`\n  * \u7ecf\u8fc7\u4e8c\u5206\u5b9a\u4f4d\u5230 `nums[5] = 10 >= 9`\uff0c\u6700\u7ec8 `lower_bound(nums, 9)` \u8fd4\u56de\u4e0b\u6807 `5`\u3002\n* `end = 5 - 1 = 4`\u3002\n* \u6700\u7ec8\u8fd4\u56de `[start, end] = [3, 4]`\u3002\n\n---\n\n## 6. Key FAQs & Edge Cases / \u6838\u5fc3\u7b54\u7591\u4e0e\u8fb9\u754c\u5206\u6790\n\n### Q1: \u4e3a\u4ec0\u4e48\u8981\u5bf9 `start` \u505a\u53cc\u91cd\u68c0\u67e5 (`start == len(nums)` \u6216 `nums[start] != target`)\uff1f\n* **\u60c5\u51b5 1\uff08`start == len(nums)`\uff09**\uff1a\u5f53 `target` \u6bd4\u6570\u7ec4\u4e2d\u6240\u6709\u5143\u7d20\u90fd\u5927\u65f6\uff08\u5982\u5728 `[5, 7, 7]` \u4e2d\u641c `8`\uff09\uff0c\u4e8c\u5206\u67e5\u627e\u4f1a\u4e00\u76f4\u5411\u53f3\u79fb\u52a8 `left`\uff0c\u6700\u7ec8 `left = len(nums)`\u3002\u6b64\u65f6\u5982\u679c\u76f4\u63a5\u8bbf\u95ee `nums[start]` \u4f1a\u5f15\u53d1 **IndexError (\u6570\u7ec4\u8d8a\u754c)**\u3002\n* **\u60c5\u51b5 2\uff08`nums[start] != target`\uff09**\uff1a\u5f53 `target` \u4e0d\u5728\u6570\u7ec4\u4e2d\uff0c\u4f46\u5904\u4e8e\u6570\u7ec4\u6570\u503c\u8303\u56f4\u5185\u65f6\uff08\u5982\u5728 `[5, 7, 7, 10]` \u4e2d\u641c `8`\uff09\uff0c`lower_bound` \u4f1a\u8fd4\u56de\u7b2c\u4e00\u4e2a\u5927\u4e8e `8` \u7684\u5143\u7d20\u4e0b\u6807\uff08\u5373 `10` \u5bf9\u5e94\u7684\u4e0b\u6807 `3`\uff09\u3002\u6b64\u65f6 `nums[start] == 10 != 8`\uff0c\u8bf4\u660e `8` \u4e0d\u5b58\u5728\u3002\n\n### Q2: \u4e3a\u4ec0\u4e48 `end` \u8ba1\u7b97\u65f6\u4e0d\u9700\u8981\u518d\u989d\u5916\u7279\u5224\u662f\u5426\u5b58\u5728\uff1f\n* \u5982\u679c `start` \u7684\u7279\u5224\u901a\u8fc7\u4e86\uff0c\u8bf4\u660e\u6570\u7ec4\u4e2d**\u81f3\u5c11\u5b58\u5728\u4e00\u4e2a**\u7b49\u4e8e `target` \u7684\u5143\u7d20\u3002\n* \u56e0\u6b64 `target + 1` \u7684 `lower_bound` \u51cf 1 \u5fc5\u7136\u843d\u5728\u6709\u6548\u7684\u5408\u6cd5\u4e0b\u6807\u4e0a\uff0c\u4e14 `nums[end]` \u5fc5\u7136\u7b49\u4e8e `target`\u3002\n\n### Q3: \u4e3a\u4ec0\u4e48 `mid` \u7684\u8ba1\u7b97\u63a8\u8350\u5199\u6210 `left + (right - left) // 2`\uff1f\n* \u5728 Python \u4e2d\u6574\u6570\u4e0d\u4f1a\u6ea2\u51fa\uff0c\u4f46\u5bf9\u4e8e C++ / Java \u7b49\u5f3a\u7c7b\u578b\u8bed\u8a00\uff0c\u5982\u679c `left` \u548c `right` \u5f88\u5927\uff0c`left + right` \u53ef\u80fd\u4f1a\u8d85\u8fc7 32 \u4f4d\u6574\u578b\u4e0a\u9650\u5bfc\u81f4**\u6574\u578b\u6ea2\u51fa (Integer Overflow)**\u3002\u517b\u6210 `left + (right - left) // 2` \u7684\u4e60\u60ef\u662f\u7b97\u6cd5\u5de5\u7a0b\u7684\u6700\u4f73\u5b9e\u8df5\u3002\n\n---\n\n## 7. Complexity Analysis / \u590d\u6742\u5ea6\u5206\u6790\n\n| \u6307\u6807 | \u590d\u6742\u5ea6 | \u8be6\u89e3 |\n| :--- | :--- | :--- |\n| **\u65f6\u95f4\u590d\u6742\u5ea6 (Time)** | $\\mathcal{O}(\\log n)$ | \u8c03\u7528\u4e86\u4e24\u6b21\u6807\u51c6\u7684\u4e8c\u5206\u67e5\u627e\uff0c\u6bcf\u6b21\u8017\u65f6 $\\mathcal{O}(\\log n)$\uff0c\u6574\u4f53\u4ecd\u4e3a\u5bf9\u6570\u65f6\u95f4\u590d\u6742\u5ea6\u3002 |\n| **\u7a7a\u95f4\u590d\u6742\u5ea6 (Space)** | $\\mathcal{O}(1)$ | \u4ec5\u4f7f\u7528\u5e38\u6570\u4e2a\u8f85\u52a9\u53d8\u91cf\uff08`left`, `right`, `mid`, `start`, `end`\uff09\uff0c\u65e0\u4efb\u4f55\u989d\u5916\u5185\u5b58\u5f00\u9500\u3002 |\n", "code": "from typing import List\n# \u8981\u6c42nums\u662f\u975e\u9012\u51cf\u7684\uff0c\u5373nums[i] <= nums[i+1]\n# \u8fd4\u56de\u6700\u5c0f\u7684\u6ee1\u8db3 nums[i] >= target\u7684i\n# \u5982\u679c\u4e0d\u5b58\u5728\uff0c\u5219return len(nums)\ndef lower_bound (nums: List[int], target: int) -> int:\n    left = 0\n    n=len(nums)\n    right = n - 1 #\u95ed\u533a\u95f4\uff1a[left , right]\n    while left <= right: #range is not empty\n        #left + (right - left) // 2\n        mid = (left+right) // 2\n        if nums[mid] < target:\n            left = mid + 1 # [mid+1, right]\n        else:\n            right = mid - 1 # [left, mid - 1]\n    return left\n\ndef lower_bound2 ( nums: List[int], target: int) -> int:\n    left = 0\n    n=len(nums) \n    right = n - 1 #\u5de6\u95ed\u53f3\u5f00\u533a\u95f4 [left, right)\n    while left < right: #range is not empty\n        mid = (left+right)//2 \n        if nums[mid] < target:\n            left = mid + 1 # [left , right)\n        else:\n            right = mid # [left ,mid)\n    return left #right\n\ndef lower_bound3 (nums: List[int], target: int) -> int:\n    left = 0\n    n=len(nums) \n    right = n - 1 #\u5f00\u533a\u95f4 (left, right)\n    while left < right: #range is not empty\n        mid = (left+right)//2 \n        if nums[mid] < target:\n            left = mid  # (mid , right)\n        else:\n            right = mid # (left ,mid)\n    return left #right\n\n\nclass Solution:\n    def searchRange(self, nums: List[int], target: int) -> List[int]:\n        start = lower_bound(nums, target)\n        if start == len(nums) or nums[start] != target:\n            return [-1,-1]\n\n        end = lower_bound(nums, target + 1)-1\n        return [start, end]\n\n        \n", "diff": "Medium", "py_file": "top-100/lc-0034-find-first-and-last-position-of-element-in-sorted-array.py", "md_file": "top-100/lc-0034-find-first-and-last-position-of-element-in-sorted-array.md"}, "top-100/lc-0039-combination-sum": {"key": "top-100/lc-0039-combination-sum", "category": "Top 100 Liked Track", "title": "Top 100 Liked Track: LC 0039 combination sum", "short": "LC 0039 combination sum", "path": "top-100/lc-0039-combination-sum", "type": "problem", "notes": "", "code": "from typing import List, Optional\n\nclass Solution:\n    pass\n", "diff": "Medium", "py_file": "top-100/lc-0039-combination-sum.py", "md_file": ""}, "top-100/lc-0042-trapping-rain-water": {"key": "top-100/lc-0042-trapping-rain-water", "category": "Top 100 Liked Track", "title": "Top 100 Liked Track: LC 0042 trapping rain water", "short": "LC 0042 trapping rain water", "path": "top-100/lc-0042-trapping-rain-water", "type": "problem", "notes": "# LeetCode 42. Trapping Rain Water (\u63a5\u96e8\u6c34)\n## Step-by-Step Code Walkthrough & Notes / \u4ee3\u7801\u9010\u884c\u8be6\u89e3\u4e0e\u77e5\u8bc6\u70b9\u603b\u7ed3\n\n- **Difficulty:** Hard (\u9ad8\u9891\u9762\u8bd5\u7ecf\u5178\u9898 / \u524d\u540e\u7f00\u6700\u5927\u503c & \u53cc\u6307\u9488)\n- **Tags:** Array, Two Pointers, Dynamic Programming, Stack\n- **Corresponding Python File:** [`top-100/lc-0042-trapping-rain-water.py`](file:///mnt/c/Users/steve/iCloudDrive/desktop/leetcode-sh/top-100/lc-0042-trapping-rain-water.py)\n\n---\n\n## 1. Problem Statement / \u9898\u76ee\u63cf\u8ff0\n\n* **[EN]** Given `n` non-negative integers representing an elevation map where the width of each bar is 1, compute how much water it can trap after raining.\n* **[CN]** \u7ed9\u5b9a `n` \u4e2a\u975e\u8d1f\u6574\u6570\u8868\u793a\u6bcf\u4e2a\u5bbd\u5ea6\u4e3a 1 \u7684\u67f1\u5b50\u7684\u9ad8\u5ea6\u56fe\uff0c\u8ba1\u7b97\u6309\u6b64\u6392\u5217\u7684\u67f1\u5b50\uff0c\u4e0b\u96e8\u4e4b\u540e\u80fd\u63a5\u591a\u5c11\u96e8\u6c34\u3002\n\n---\n\n## 2. Core Principle / \u6838\u5fc3\u539f\u7406\n\n\u6bcf\u4e2a\u4f4d\u7f6e $i$ \u80fd\u63a5\u7684\u96e8\u6c34\u91cf\u53d6\u51b3\u4e8e\u5176**\u5de6\u4fa7\u6700\u9ad8\u67f1\u5b50**\u548c**\u53f3\u4fa7\u6700\u9ad8\u67f1\u5b50**\u7684\u8f83\u5c0f\u503c\uff1a\n$$\\text{water}[i] = \\max(0, \\min(\\text{pre\\_max}[i], \\text{suf\\_max}[i]) - \\text{height}[i])$$\n\n---\n\n## 3. Code Implementations / \u4ee3\u7801\u5b9e\u73b0\n\n### \u65b9\u6848 1\uff1a\u524d\u540e\u7f00\u6700\u5927\u503c\u6570\u7ec4 (Prefix & Suffix Max - DP)\n\n```python\nfrom typing import List\n\nclass Solution:\n    def trap(self, height: List[int]) -> int:\n        n = len(height)\n        pre_max = [0] * n\n        pre_max[0] = height[0]\n        for i in range(1, n):\n            pre_max[i] = max(pre_max[i - 1], height[i])\n\n        suf_max = [0] * n\n        suf_max[-1] = height[-1]\n        for i in range(n - 2, -1, -1):\n            suf_max[i] = max(suf_max[i + 1], height[i])\n\n        result = 0\n        for h, pre, suf in zip(height, pre_max, suf_max):\n            result += min(pre, suf) - h\n\n        return result\n```\n\n* **\u65f6\u95f4\u590d\u6742\u5ea6:** $\\mathcal{O}(n)$ | **\u7a7a\u95f4\u590d\u6742\u5ea6:** $\\mathcal{O}(n)$\n\n---\n\n### \u65b9\u6848 2\uff1a\u5bf9\u649e\u53cc\u6307\u9488\u7a7a\u95f4\u4f18\u5316 (Two Pointers - Optimal $\\mathcal{O}(1)$ Space)\n\n```python\nclass Solution2:\n    def trap(self, height: List[int]) -> int:\n        n = len(height)\n        result = 0\n        left = 0\n        right = n - 1\n        pre_max = 0\n        suf_max = 0\n        \n        while left <= right:\n            pre_max = max(pre_max, height[left])\n            suf_max = max(suf_max, height[right])\n            \n            # \u82e5\u5de6\u4fa7\u5386\u53f2\u6700\u9ad8 < \u53f3\u4fa7\u5386\u53f2\u6700\u9ad8\uff0c\u5219\u5f53\u524d left \u5904\u7684\u63a5\u6c34\u91cf\u7531 pre_max \u51b3\u5b9a\n            if pre_max < suf_max:\n                result += pre_max - height[left]\n                left += 1\n            else:\n                result += suf_max - height[right]\n                right -= 1\n                \n        return result\n```\n\n* **\u65f6\u95f4\u590d\u6742\u5ea6:** $\\mathcal{O}(n)$ | **\u7a7a\u95f4\u590d\u6742\u5ea6:** $\\mathcal{O}(1)$\n", "code": "from typing import List\n# two pointer \nclass Solution:\n    def trap(self, height: List[int]) -> int:\n        n =  len(height)\n        pre_max = [0] * n\n        pre_max[0] = height[0]\n\n        for i in range(1,n):\n            pre_max[i] = max(pre_max[i-1], height[i])\n\n        suf_max = [0] * n\n        suf_max[-1] =  height[-1]\n\n        for i in range(n-2, -1 ,-1):\n            suf_max[i] =  max(suf_max[i+1], height[i])\n\n        result = 0\n        for h, pre, suf in zip(height, pre_max, suf_max):\n            result += min(pre, suf) - h\n\n\n        return result\n\n    #time complexity: O(n)\n    #space complexity: O(n)\n\n# better two pointer\nclass Solution2:\n    def trap(self, height: List[int]) -> int:\n        n = len(height)\n        result = 0\n        left = 0\n        right = n-1\n        pre_max = 0\n        suf_max = 0\n        while left <= right:\n            pre_max = max(pre_max, height[left])\n            suf_max= max(suf_max, height[right])\n            if pre_max < suf_max:\n                result += pre_max - height[left]\n                left += 1\n            else:\n                result += suf_max - height[right]\n                right -= 1\n                \n        return result\n            \n\n\n\n\n\n    \n\n\n\n\n        ", "diff": "Hard", "py_file": "top-100/lc-0042-trapping-rain-water.py", "md_file": "top-100/lc-0042-trapping-rain-water.md"}, "top-100/lc-0046-permutations": {"key": "top-100/lc-0046-permutations", "category": "Top 100 Liked Track", "title": "Top 100 Liked Track: LC 0046 permutations", "short": "LC 0046 permutations", "path": "top-100/lc-0046-permutations", "type": "problem", "notes": "", "code": "from typing import List, Optional\n\nclass Solution:\n    pass\n", "diff": "Medium", "py_file": "top-100/lc-0046-permutations.py", "md_file": ""}, "top-100/lc-0048-rotate-image": {"key": "top-100/lc-0048-rotate-image", "category": "Top 100 Liked Track", "title": "Top 100 Liked Track: LC 0048 rotate image", "short": "LC 0048 rotate image", "path": "top-100/lc-0048-rotate-image", "type": "problem", "notes": "", "code": "from typing import List, Optional\n\nclass Solution:\n    pass\n", "diff": "Medium", "py_file": "top-100/lc-0048-rotate-image.py", "md_file": ""}, "top-100/lc-0049-group-anagrams": {"key": "top-100/lc-0049-group-anagrams", "category": "Top 100 Liked Track", "title": "Top 100 Liked Track: LC 0049 group anagrams", "short": "LC 0049 group anagrams", "path": "top-100/lc-0049-group-anagrams", "type": "problem", "notes": "", "code": "from typing import List, Optional\n\nclass Solution:\n    pass\n", "diff": "Medium", "py_file": "top-100/lc-0049-group-anagrams.py", "md_file": ""}, "top-100/lc-0053-maximum-subarray": {"key": "top-100/lc-0053-maximum-subarray", "category": "Top 100 Liked Track", "title": "Top 100 Liked Track: LC 0053 maximum subarray", "short": "LC 0053 maximum subarray", "path": "top-100/lc-0053-maximum-subarray", "type": "problem", "notes": "# LeetCode 53. Maximum Subarray (\u6700\u5927\u5b50\u6570\u7ec4\u548c)\n## Step-by-Step Code Walkthrough & Notes / \u4ee3\u7801\u9010\u884c\u8be6\u89e3\u4e0e\u77e5\u8bc6\u70b9\u603b\u7ed3\n\n- **Difficulty:** Medium (\u7ecf\u5178\u52a8\u6001\u89c4\u5212 / Kadane \u7b97\u6cd5)\n- **Tags:** Array, Dynamic Programming, Divide and Conquer\n- **Corresponding Python File:** [`top-100/lc-0053-maximum-subarray.py`](file:///mnt/c/Users/steve/iCloudDrive/desktop/leetcode-sh/top-100/lc-0053-maximum-subarray.py)\n\n---\n\n## 1. Problem Statement / \u9898\u76ee\u63cf\u8ff0\n\n* **[EN]** Given an integer array `nums`, find the subarray with the largest sum, and return its sum.\n* **[CN]** \u7ed9\u4f60\u4e00\u4e2a\u6574\u6570\u6570\u7ec4 `nums` \uff0c\u8bf7\u4f60\u627e\u51fa\u4e00\u4e2a\u5177\u6709\u6700\u5927\u548c\u7684\u8fde\u7eed\u5b50\u6570\u7ec4\uff08\u5b50\u6570\u7ec4\u6700\u5c11\u5305\u542b\u4e00\u4e2a\u5143\u7d20\uff09\uff0c\u8fd4\u56de\u5176\u6700\u5927\u548c\u3002\n\n---\n\n## 2. Code Implementation / \u4ee3\u7801\u5b9e\u73b0\n\n```python\nfrom typing import List\n\nclass Solution:\n    def maxSubArray(self, nums: List[int]) -> int:\n        current_sum = 0\n        max_sum = float(\"-inf\")\n\n        for num in nums:\n            # \u72b6\u6001\u8f6c\u79fb\uff1a\u82e5\u524d\u9762\u7d2f\u52a0\u548c\u4e3a\u8d1f\u6570\uff0c\u5219\u820d\u5f03\u5e76\u4ece\u5f53\u524d\u5143\u7d20\u91cd\u65b0\u5f00\u59cb\n            current_sum = max(num, current_sum + num)\n            max_sum = max(max_sum, current_sum)\n            \n        return max_sum\n```\n\n---\n\n## 3. Kadane's Algorithm Intuition / \u7b97\u6cd5\u539f\u7406\u89e3\u6790\n\n1. **\u6838\u5fc3\u72b6\u6001\u8f6c\u79fb\u65b9\u7a0b**\uff1a\n   $$dp[i] = \\max(nums[i], dp[i-1] + nums[i])$$\n2. **\u8d2a\u5fc3/\u52a8\u6001\u89c4\u5212\u76f4\u89c9**\uff1a\n   * \u5982\u679c\u524d\u9762\u7684\u5b50\u6570\u7ec4\u548c `current_sum` \u53d8\u6210\u4e86\u8d1f\u6570\uff0c\u5b83\u5bf9\u540e\u7eed\u4efb\u4f55\u5143\u7d20\u7684\u7d2f\u52a0\u53ea\u4f1a\u8d77\u5230\u201c\u526f\u4f5c\u7528\u201d\uff08\u62d6\u540e\u817f\uff09\u3002\n   * \u56e0\u6b64\uff0c\u5f53 `current_sum + num < num`\uff08\u5373 `current_sum < 0`\uff09\u65f6\uff0c\u6211\u4eec\u5e94\u8be5\u76f4\u63a5\u679c\u65ad\u820d\u5f03\u524d\u9762\u7684\u7d2f\u52a0\uff0c\u5c06\u5f53\u524d\u5143\u7d20 `num` \u4f5c\u4e3a\u5168\u65b0\u5b50\u6570\u7ec4\u7684\u8d77\u70b9\u3002\n3. **\u5168\u5c40\u7ef4\u62a4\u6700\u5927\u503c**\uff1a\n   * \u6bcf\u6b21\u66f4\u65b0 `current_sum` \u540e\uff0c\u4f7f\u7528 `max_sum = max(max_sum, current_sum)` \u8bb0\u5f55\u5168\u5c40\u5386\u53f2\u6700\u9ad8\u503c\u3002\n\n---\n\n## 4. Complexity Analysis / \u590d\u6742\u5ea6\u5206\u6790\n\n* **\u65f6\u95f4\u590d\u6742\u5ea6 (Time):** $\\mathcal{O}(n)$ \u2014\u2014 \u4ec5\u9700\u5355\u6b21\u7ebf\u6027\u626b\u63cf\u3002\n* **\u7a7a\u95f4\u590d\u6742\u5ea6 (Space):** $\\mathcal{O}(1)$ \u2014\u2014 \u4ec5\u7ef4\u62a4\u4e24\u4e2a\u6d6e\u70b9/\u6574\u578b\u72b6\u6001\u53d8\u91cf\u3002\n", "code": "#maximum subarry\n\n#kadene\n#current_max=max(today, current_sum + today)\n#max_sum = max(max_sum. current_sum)\n\nfrom typing import List\n\nclass Solution:\n    def maxSubArray(self, nums: List[int]) -> int:\n        current_sum=0\n        max_sum = float(\"-inf\")\n\n        \n        for num in nums:\n            current_sum=max(num, current_sum + num)\n            max_sum=max(max_sum, current_sum)\n        return max_sum\n\n    \n\n        ", "diff": "Medium", "py_file": "top-100/lc-0053-maximum-subarray.py", "md_file": "top-100/lc-0053-maximum-subarray.md"}, "top-100/lc-0055-j
