    @media (max-width:768px){#sidebar{position:fixed;left:0;top:0;bottom:0;width:min(85vw,340px) !important;min-width:unset !important;max-width:unset !important;z-index:1000;transform:translateX(-100%);transition:transform 0.25s ease;box-shadow:none;}#sidebar.mobile-open{transform:translateX(0);box-shadow:4px 0 30px rgba(0,0,0,0.7);}#sidebar.collapsed{transform:translateX(-100%);width:min(85vw,340px) !important;}.resizer,.workspace-resizer{display:none !important;}.nav-item{min-height:38px;padding:8px 12px 8px 28px;font-size:13.5px;}.tree-folder-header{min-height:40px;padding:8px 12px;font-size:13px;}.folder-arrow{width:18px;height:18px;}.top-toolbar{padding:0 10px;gap:8px;}.mode-nav-btn span{display:none;}.mode-nav-btn{padding:5px 8px;}.breadcrumb{font-size:11.5px;max-width:130px;}.breadcrumb-folder,.breadcrumb-sep{display:none;}.segmented-control{display:none !important;}#copyBtnLabel{display:none;}.action-btn{padding:5px 8px;}#roadmap-view{padding:16px 14px 40px;}.roadmap-hero{margin-bottom:20px;}.roadmap-hero h1{font-size:20px;}.roadmap-hero p{font-size:12.5px;margin-bottom:12px;}.phase-filter-bar{flex-wrap:nowrap;justify-content:flex-start;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding:4px 2px 8px;margin:8px -14px 0;padding-left:14px;padding-right:14px;}.phase-filter-bar::-webkit-scrollbar{display:none;}.phase-filter-btn{flex-shrink:0;white-space:nowrap;font-size:11.5px;padding:4px 11px;}.phase-section{padding:16px 14px;}.phase-header{flex-direction:column;align-items:flex-start;gap:6px;}.phase-topics-grid{grid-template-columns:1fr !important;gap:12px;}.topic-card{padding:12px;}#workspace{flex-direction:column;height:calc(100% - 46px - 48px - env(safe-area-inset-bottom,0px));}.pane{padding:16px 16px 30px;}#left-pane{border-right:none;border-bottom:none;}#right-pane{padding:16px 16px 30px;}.markdown-body{font-size:14px;}#workspace.tab-notes #left-pane{display:flex;width:100% !important;flex:1 !important;}#workspace.tab-notes #right-pane,#workspace.tab-notes #workspace-resizer{display:none !important;}#workspace.tab-code #right-pane{display:flex;width:100% !important;flex:1 !important;}#workspace.tab-code #left-pane,#workspace.tab-code #workspace-resizer{display:none !important;}.mobile-bottom-nav{display:flex;position:fixed;bottom:0;left:0;right:0;height:calc(48px + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);background-color:rgba(22,27,34,0.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--border-color);z-index:50;align-items:center;justify-content:space-around;padding-left:12px;padding-right:12px;gap:8px;}.mobile-bottom-nav.hidden{display:none !important;}.mobile-tab-btn{flex:1;height:34px;display:flex;align-items:center;justify-content:center;gap:6px;background:transparent;border:none;color:var(--text-muted);font-size:12.5px;font-weight:500;border-radius:6px;cursor:pointer;transition:all 0.15s ease;}.mobile-tab-btn.active{color:var(--accent);background-color:rgba(88,166,255,0.14);font-weight:600;}}
  </style>
</head>
<body>

  <!-- Mobile Backdrop -->
  <div id="sidebar-backdrop" onclick="toggleSidebar(false)"></div>

  <!-- Left Sidebar Navigation (Tree Explorer) -->
  <aside id="sidebar">
    <div class="sidebar-header">
      <div class="header-brand">
        <div class="brand-title">
          <svg class="brand-svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 17 10 11 4 5"></polyline><line x1="12" y1="19" x2="20" y2="19"></line></svg>
          <span>LeetCode-SH</span>
        </div>
        <span class="progress-badge" id="progressStats" title="Total Indexed Problems">0 Problems</span>
      </div>
      <div class="search-box-wrapper">
        <span class="search-icon"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg></span>
        <input type="text" id="search" class="search-box" placeholder="Search problems, patterns... (/)" oninput="handleSearch(this.value)">
        <button id="searchClear" class="search-clear-btn" onclick="clearSearch()" title="Clear search (Esc)"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>
      </div>
    </div>

    <div class="explorer-bar">
      <span>EXPLORER</span>
      <div class="explorer-actions">
        <button class="icon-btn" onclick="setAllFoldersCollapsed(false)" title="Expand All Folders">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="7 13 12 18 17 13"></polyline><polyline points="7 6 12 11 17 6"></polyline></svg>
        </button>
        <button class="icon-btn" onclick="setAllFoldersCollapsed(true)" title="Collapse All Folders">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 11 12 6 7 11"></polyline><polyline points="17 18 12 13 7 18"></polyline></svg>
        </button>
      </div>
    </div>

    <div class="tree-container" id="treeRoot">
      <!-- Injected dynamically by JavaScript -->
    </div>

    <!-- Draggable Resize Splitter Handle -->
    <div id="resizer" class="resizer" title="Drag to resize sidebar"></div>
  </aside>

  <!-- Main Content Workspace -->
  <main id="main-container">
    <header class="top-toolbar">
      <div class="toolbar-left">
        <button class="toggle-sidebar-btn" id="sidebarToggle" onclick="toggleSidebar()" title="Toggle Sidebar (Cmd+B / Ctrl+B)">
          <svg width="15" height="15" viewBox="0 0 16 16" fill="currentColor">
            <path fill-rule="evenodd" d="M1 2.75A.75.75 0 011.75 2h12.5a.75.75 0 010 1.5H1.75A.75.75 0 011 2.75zm0 5A.75.75 0 011.75 7h12.5a.75.75 0 010 1.5H1.75A.75.75 0 011 7.75zM1.75 12a.75.75 0 000 1.5h12.5a.75.75 0 000-1.5H1.75z"></path>
          </svg>
        </button>

        <!-- Main Mode Switcher: Roadmap vs Workspace -->
        <div class="main-mode-switcher">
          <button class="mode-nav-btn active" id="btnModeRoadmap" onclick="setMainMode('roadmap')" title="Interactive Visual Roadmap">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21"></polygon><line x1="9" y1="3" x2="9" y2="18"></line><line x1="15" y1="6" x2="15" y2="21"></line></svg>
            <span>Roadmap</span>
          </button>
          <button class="mode-nav-btn" id="btnModeWorkspace" onclick="setMainMode('workspace')" title="Dual-Split Problem Workspace">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg>
            <span>Workspace</span>
          </button>
        </div>

        <div class="breadcrumb" id="itemBreadcrumb">Loading...</div>
      </div>

      <div class="toolbar-right">
        <div class="segmented-control" id="viewSwitcher" style="display: none;">
          <button class="seg-btn" id="btnDual" onclick="setViewMode('dual')" title="Split Dual View">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="12" y1="3" x2="12" y2="21"></line></svg>
            <span class="seg-label">Split</span>
          </button>
          <button class="seg-btn active" id="btnNotes" onclick="setViewMode('notes')" title="Notes Only">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg>
            <span class="seg-label">Notes</span>
          </button>
          <button class="seg-btn" id="btnCode" onclick="setViewMode('code')" title="Code Only">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline></svg>
            <span class="seg-label">Code</span>
          </button>
        </div>

        <button class="action-btn" id="copyBtn" onclick="copyActiveCode()" title="Copy Python Solution" style="display: none;">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
          <span id="copyBtnLabel">Copy Code</span>
        </button>
      </div>
    </header>

    <!-- Roadmap Interactive View -->
    <div id="roadmap-view" class="roadmap-container active">
      <!-- Minimalist Graph Canvas -->
      <div id="cy-roadmap" class="cy-viewport"></div>

      <!-- Floating Minimal HUD Toolbar -->
      <div class="graph-floating-hud">
        <div class="hud-legend">
          <span class="hud-item"><span class="hud-dot dot-mastered"></span> Mastered</span>
          <span class="hud-item"><span class="hud-dot dot-learning"></span> In Progress</span>
          <span class="hud-item"><span class="hud-dot dot-unvisited"></span> Unvisited</span>
        </div>
        <div class="hud-divider"></div>
        <div class="hud-actions">
          <button class="hud-btn" onclick="roadmapGraphInstance && roadmapGraphInstance.fitView()" title="Fit View">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg>
          </button>
          <button class="hud-btn" onclick="roadmapGraphInstance && roadmapGraphInstance.zoomIn()" title="Zoom In">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          </button>
          <button class="hud-btn" onclick="roadmapGraphInstance && roadmapGraphInstance.zoomOut()" title="Zoom Out">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          </button>
        </div>
      </div>

      <!-- Node Hover/Click Popover Card -->
      <div id="cy-node-popover" class="cy-node-popover" style="display: none;"></div>
    </div>

    <!-- Workspace Dual Split View -->
    <div id="workspace" class="hidden-view mode-notes tab-notes">
      <!-- Left Pane: Notes & Walkthrough -->
      <section class="pane" id="left-pane">
        <div class="markdown-body" id="notesViewer">
          <!-- Markdown Rendered Here -->
        </div>
      </section>

      <!-- Draggable Splitter between Notes & Code -->
      <div id="workspace-resizer" class="workspace-resizer" title="Drag to adjust split (Double-click to reset 50/50)"></div>

      <!-- Right Pane: Syntax-Highlighted Code -->
      <section class="pane" id="right-pane">
        <div class="pane-header">
          <span class="pane-title"><svg class="pane-svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline></svg>Solution Source Code</span>
          <button class="action-btn" onclick="copyActiveCode()">Copy Python</button>
        </div>
        <div class="code-viewer">
          <pre><code class="language-python" id="codeViewer"># Solution code</code></pre>
        </div>
      </section>
    </div>
    <!-- Mobile Bottom Navigation Bar (Workspace Mode Only) -->
    <nav class="mobile-bottom-nav hidden" id="mobileBottomNav">
      <button class="mobile-tab-btn active" id="mobileTabNotes" onclick="setMobileTab('notes')">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg>
        <span>Problem Notes</span>
      </button>
      <button class="mobile-tab-btn" id="mobileTabCode" onclick="setMobileTab('code')">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline></svg>
        <span>Python Code</span>
      </button>
    </nav>
  </main>

  <script>
    const items = {items_json};
    const roadmapData = {roadmap_json};
    let mainMode = localStorage.getItem("mainMode") || "roadmap";
    let currentRoadmapSubview = localStorage.getItem("roadmapSubview") || "graph";
    let roadmapGraphInstance = null;
    let currentKey = "README.md";
    let viewMode = "notes"; // 'notes', 'dual', 'code'
    let mobileTab = "notes"; // 'notes', 'code'
    let workspaceSplitRatio = parseFloat(localStorage.getItem("workspaceSplitRatio") || "50");
    const collapsedFolders = JSON.parse(localStorage.getItem("treeCollapsedFolders") || "{}");
    if (window.location.hash && window.location.hash.length > 1) {
      const hashKey = decodeURIComponent(window.location.hash.substring(1));
      if (hashKey === "roadmap") {
        mainMode = "roadmap";
      } else if (items[hashKey]) {
        currentKey = hashKey;
        mainMode = "workspace";
      }
    }
    const treeStructure = [
      {
        id: "overview",
        name: "README.md",
        label: "Overview",
        isLeaf: true,
        filter: k => k === "README.md"
      },
      {
        id: "problem-index",
        name: "problem-index/",
        label: "Curriculum Index",
        filter: k => k.startsWith("topic-")
      },
      {
        id: "top-100",
        name: "top-100/",
        label: "Top 100 Liked",
        filter: k => k.startsWith("top-100/")
      },
      {
        id: "daily-practice",
        name: "daily-practice/",
        label: "Daily Practice",
        filter: k => k.startsWith("daily-practice/")
      },
      {
        id: "luffy",
        name: "luffy/",
        label: "Curriculum (01-42)",
        filter: k => k.startsWith("luffy/")
      }
    ];
    function updateProgressBadge() {
      const problemKeys = Object.keys(items).filter(k => items[k].type === "problem");
      document.getElementById("progressStats").innerText = `${problemKeys.length} Problems`;
    }
    function applyWorkspaceSplit(ratio) {
      const leftPane = document.getElementById("left-pane");
      const rightPane = document.getElementById("right-pane");
      if (!leftPane || !rightPane) return;
      if (viewMode === "dual" && window.innerWidth > 768) {
        const clamped = Math.max(15, Math.min(85, ratio));
        leftPane.style.width = `calc(${clamped}% - 2.5px)`;
        leftPane.style.flex = "none";
        rightPane.style.width = `calc(${100 - clamped}% - 2.5px)`;
        rightPane.style.flex = "none";
      } else {
        leftPane.style.width = "";
        leftPane.style.flex = "";
        rightPane.style.width = "";
        rightPane.style.flex = "";
      }
    }
    function setMobileTab(tab) {
      mobileTab = tab;
      applyWorkspaceSplit(50);
      const tabNotes = document.getElementById("mobileTabNotes");
      const tabCode = document.getElementById("mobileTabCode");
      if (tabNotes) tabNotes.classList.toggle("active", tab === "notes");
      if (tabCode) tabCode.classList.toggle("active", tab === "code");
      const workspace = document.getElementById("workspace");
      if (workspace) {
        workspace.classList.toggle("tab-notes", tab === "notes");
        workspace.classList.toggle("tab-code", tab === "code");
      }
    }
    function setViewMode(mode) {
      viewMode = mode;
      const workspace = document.getElementById("workspace");
      document.getElementById("btnDual").classList.toggle("active", mode === "dual");
      document.getElementById("btnNotes").classList.toggle("active", mode === "notes");
      document.getElementById("btnCode").classList.toggle("active", mode === "code");
      if (window.innerWidth <= 768) {
        setMobileTab(mode === "code" ? "code" : "notes");
        return;
      }
      if (workspace) {
        workspace.classList.remove("mode-dual", "mode-notes", "mode-code");
        workspace.classList.add(`mode-${mode}`);
      }
      if (mode === "dual") {
        applyWorkspaceSplit(workspaceSplitRatio);
      } else {
        applyWorkspaceSplit(50);
      }
    }
    function syncResponsiveLayout() {
      if (window.innerWidth <= 768) {
        setMobileTab(mobileTab);
      } else {
        setViewMode(viewMode);
      }
    }
    function setMainMode(mode, triggerSwitch = true) {
      mainMode = mode;
      localStorage.setItem("mainMode", mode);
      const btnRoadmap = document.getElementById("btnModeRoadmap");
      const btnWorkspace = document.getElementById("btnModeWorkspace");
      const roadmapView = document.getElementById("roadmap-view");
      const workspaceView = document.getElementById("workspace");
      const viewSwitcher = document.getElementById("viewSwitcher");
      const copyBtn = document.getElementById("copyBtn");
      const breadcrumb = document.getElementById("itemBreadcrumb");
      const mobileNav = document.getElementById("mobileBottomNav");
      if (mode === "roadmap") {
        if (btnRoadmap) btnRoadmap.classList.add("active");
        if (btnWorkspace) btnWorkspace.classList.remove("active");
        if (roadmapView) roadmapView.classList.add("active");
        if (workspaceView) workspaceView.classList.add("hidden-view");
        if (viewSwitcher) viewSwitcher.style.display = "none";
        if (copyBtn) copyBtn.style.display = "none";
        if (mobileNav) mobileNav.classList.add("hidden");
        if (breadcrumb) {
          breadcrumb.innerHTML = `
            <span class="breadcrumb-folder">Curriculum</span>
            <span class="breadcrumb-sep">/</span>
            <span class="breadcrumb-file" title="Interactive Topology Graph">Interactive Topology Graph</span>
          `;
        }
        if (history.replaceState) {
          history.replaceState(null, null, "#roadmap");
        }
        setTimeout(() => {
          if (!roadmapGraphInstance) {
            initRoadmapGraph();
          } else if (roadmapGraphInstance.cy) {
            roadmapGraphInstance.cy.resize();
            roadmapGraphInstance.cy.fit(undefined, 35);
          }
        }, 50);
      } else {
        if (btnRoadmap) btnRoadmap.classList.remove("active");
        if (btnWorkspace) btnWorkspace.classList.add("active");
        if (roadmapView) roadmapView.classList.remove("active");
        if (workspaceView) workspaceView.classList.remove("hidden-view");
        if (viewSwitcher) viewSwitcher.style.display = window.innerWidth <= 768 ? "none" : "inline-flex";
        if (copyBtn) copyBtn.style.display = items[currentKey]?.code ? "inline-flex" : "none";
        if (mobileNav) mobileNav.classList.remove("hidden");
        syncResponsiveLayout();
        if (triggerSwitch) {
          switchItem(currentKey, false);
        }
      }
    }
    const ROADMAP_GRAPH_DATA = {roadmap_graph_json};
    function loadNoteByTopicId(topicId) {
      hideNodePopover();
      if (!topicId) return;
      if (items[topicId]) {
        setMainMode("workspace");
        switchItem(topicId);
        return;
      }
      const match = Object.keys(items).find(k => k === topicId || k.startsWith(topicId) || k.includes(topicId));
      if (match) {
        setMainMode("workspace");
        switchItem(match);
      } else {
        setMainMode("workspace");
        switchItem("README.md");
      }
    }

    function renderProtectedMarkdown(markdownText) {
      if (!markdownText) return "";
      const mathBlocks = [];
      let text = markdownText.replace(/\$\$([\s\S]*?)\$\$/g, (match, formula) => {
        const token = `@@MATH_BLOCK_${mathBlocks.length}@@`;
        mathBlocks.push({ token, formula, display: true });
        return token;
      });
      text = text.replace(/\$([^$\n]+?)\$/g, (match, formula) => {
        const token = `@@MATH_INLINE_${mathBlocks.length}@@`;
        mathBlocks.push({ token, formula, display: false });
        return token;
      });
      let html = marked.parse(text);
      mathBlocks.forEach(({ token, formula, display }) => {
        const rawMath = display ? `$$${formula}$$` : `$${formula}$`;
        html = html.split(token).join(rawMath);
      });
      return html;
    }

      isResizingSidebar = true;
      resizer.classList.add("dragging");
      document.body.style.cursor = "col-resize";
      document.body.style.userSelect = "none";
    });
    const workspaceResizer = document.getElementById("workspace-resizer");
    let isResizingWorkspace = false;
    workspaceResizer.addEventListener("mousedown", (e) => {
      isResizingWorkspace = true;
      workspaceResizer.classList.add("dragging");
      document.body.style.cursor = "col-resize";
      document.body.style.userSelect = "none";
    });
    workspaceResizer.addEventListener("dblclick", () => {
      workspaceSplitRatio = 50;
      localStorage.setItem("workspaceSplitRatio", "50");
      applyWorkspaceSplit(50);
    });
    window.addEventListener("mousemove", (e) => {
      if (isResizingSidebar) {
        const newWidth = Math.max(220, Math.min(650, e.clientX));
        sidebar.style.width = `${newWidth}px`;
        document.documentElement.style.setProperty("--sidebar-width", `${newWidth}px`);
      } else if (isResizingWorkspace) {
        const workspace = document.getElementById("workspace");
        const rect = workspace.getBoundingClientRect();
        const offsetX = e.clientX - rect.left;
        const totalWidth = rect.width;
        const ratio = (offsetX / totalWidth) * 100;
        workspaceSplitRatio = Math.max(15, Math.min(85, ratio));
        applyWorkspaceSplit(workspaceSplitRatio);
      }
    });
    window.addEventListener("mouseup", () => {
      if (isResizingSidebar) {
        isResizingSidebar = false;
        resizer.classList.remove("dragging");
        document.body.style.cursor = "";
        document.body.style.userSelect = "";
      }
      if (isResizingWorkspace) {
        isResizingWorkspace = false;
        workspaceResizer.classList.remove("dragging");
        document.body.style.cursor = "";
        document.body.style.userSelect = "";
        localStorage.setItem("workspaceSplitRatio", workspaceSplitRatio.toString());
      }
    });
    window.addEventListener("resize", () => {
      if (mainMode === "workspace") {
        syncResponsiveLayout();
      }
    });
    window.addEventListener("keydown", (e) => {
      if (e.key === "/" && document.activeElement.tagName !== "INPUT" && document.activeElement.tagName !== "TEXTAREA") {
        e.preventDefault();
        const searchInput = document.getElementById("search");
        if (sidebar.classList.contains("collapsed")) {
          toggleSidebar(true);
        }
        searchInput.focus();
        searchInput.select();
      } else if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "b") {
        e.preventDefault();
        toggleSidebar();
      } else if (e.key === "Escape") {
        const searchInput = document.getElementById("search");
        if (document.activeElement === searchInput) {
          clearSearch();
          searchInput.blur();
        }
      }
    });
    renderTree();
    updateProgressBadge();
    if (mainMode === "roadmap") {
      setMainMode("roadmap");
    } else {
      setMainMode("workspace", false);
      switchItem(currentKey);
    }
  </script>
</body>
</html>
