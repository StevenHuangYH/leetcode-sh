d problems.\n   - `daily-practice/` for daily challenges and contest problems.\n   - `luffy/` for curriculum progression tracks.\n2. Follow the naming convention: `<index>-lc-<problem_number>-<title>.py` or `s-lc-<problem_number>.py`.\n3. Update the corresponding topic table in [README.md](README.md).\n\n"}, "top-100/s-lc-713.md": {"title": "\ud83d\udd25 Top 100: Subarray Product Less Than K", "short": "LC 713", "path": "top-100/s-lc-713.md", "content": "# LeetCode 713. Subarray Product Less Than K (\u4e58\u79ef\u5c0f\u4e8e K \u7684\u5b50\u6570\u7ec4)\n## Step-by-Step Code Walkthrough & Notes / \u4ee3\u7801\u9010\u884c\u8be6\u89e3\u4e0e\u77e5\u8bc6\u70b9\u603b\u7ed3\n\n- **Difficulty:** Medium (\u6ed1\u52a8\u7a97\u53e3\u7ecf\u5178\u9898 / \u533a\u95f4\u8ba1\u6570)\n- **Tags:** Array, Sliding Window\n- **Corresponding Python File:** [`top-100/s-lc-713.py`](file:///mnt/c/Users/steve/iCloudDrive/desktop/leetcode-sh/top-100/s-lc-713.py)\n\n---\n\n## 1. Problem Statement / \u9898\u76ee\u63cf\u8ff0\n\n* **[EN]** Given an array of integers `nums` and an integer `k`, return the number of contiguous subarrays where the product of all the elements in the subarray is strictly less than `k`.\n* **[CN]** \u7ed9\u4f60\u4e00\u4e2a\u6574\u6570\u6570\u7ec4 `nums` \u548c\u4e00\u4e2a\u6574\u6570 `k` \uff0c\u8bf7\u4f60\u8fd4\u56de\u5b50\u6570\u7ec4\u5185\u6240\u6709\u5143\u7d20\u7684\u4e58\u79ef\u4e25\u683c\u5c0f\u4e8e `k` \u7684\u8fde\u7eed\u5b50\u6570\u7ec4\u7684\u6570\u76ee\u3002\n\n---\n\n## 2. Code Implementation / \u4ee3\u7801\u5b9e\u73b0\n\n```python\nfrom typing import List\n\nclass Solution:\n    def numSubarrayProductLessThanK(self, nums: List[int], k: int) -> int:\n        if k <= 1:\n            return 0\n\n        ans = 0\n        prod = 1\n        left = 0\n\n        for right, x in enumerate(nums):\n            prod *= x\n            while prod >= k:\n                prod //= nums[left]\n                left += 1\n            ans += right - left + 1\n\n        return ans\n```\n\n---\n\n## 3. Step-by-Step Code Walkthrough / \u9010\u884c\u903b\u8f91\u5256\u6790\n\n### Step 1: \u8fb9\u754c\u7279\u5224 (`if k <= 1: return 0`)\n* **[EN] Why `k <= 1` returns 0?**\n  * Per problem constraints, all elements in `nums` are positive integers ($\\ge 1$).\n  * The minimum possible product of any non-empty subarray is $1$.\n  * If $k = 0$ or $k = 1$, no subarray can have a product **strictly less than** $k$. We can immediately return $0$.\n* **[CN] \u4e3a\u4ec0\u4e48 `k <= 1` \u76f4\u63a5\u8fd4\u56de 0\uff1f**\n  * \u9898\u76ee\u89c4\u5b9a\u6570\u7ec4\u4e2d\u6240\u6709\u5143\u7d20\u90fd\u662f\u6b63\u6574\u6570\uff08$\\ge 1$\uff09\u3002\n  * \u4efb\u610f\u975e\u7a7a\u5b50\u6570\u7ec4\u7684\u4e58\u79ef\u81f3\u5c11\u4e3a 1\u3002\n  * \u82e5 $k = 0$ \u6216 $k = 1$\uff0c\u4e0d\u53ef\u80fd\u5b58\u5728\u4e58\u79ef**\u4e25\u683c\u5c0f\u4e8e** $k$ \u7684\u5b50\u6570\u7ec4\uff0c\u56e0\u6b64\u76f4\u63a5\u8fd4\u56de 0\u3002\u540c\u65f6\u8fd9\u4e5f\u907f\u514d\u4e86\u540e\u7eed `left` \u6307\u9488\u8d8a\u754c\u7684\u95ee\u9898\u3002\n\n---\n\n### Step 2: \u6269\u5f20\u7a97\u53e3 (`prod *= x`)\n* **[EN] Action:** For each element $x$ at index `right`, multiply `prod` by $x$ to expand the current window `nums[left..right]`.\n* **[CN] \u52a8\u4f5c**\uff1a\u53f3\u6307\u9488 `right` \u9010\u4e2a\u679a\u4e3e\u5143\u7d20 $x$\uff0c\u5c06 $x$ \u4e58\u5165\u5f53\u524d\u7a97\u53e3\u603b\u4e58\u79ef `prod` \u4e2d\u3002\n\n---\n\n### Step 3: \u6536\u7f29\u7a97\u53e3 (`while prod >= k: prod //= nums[left]; left += 1`)\n* **[EN] Action:** If `prod >= k`, the current window's product is too large. Shrink the window from the left by dividing out `nums[left]` and moving `left` forward until `prod < k`.\n* **[CN] \u52a8\u4f5c**\uff1a\u82e5\u4e58\u79ef `prod >= k` \u8d85\u51fa\u4e0a\u9650\uff0c\u5219\u4e0d\u65ad\u901a\u8fc7\u9664\u4ee5\u5de6\u7aef\u70b9 `nums[left]` \u5e76\u53f3\u79fb `left += 1` \u6765\u6536\u7f29\u7a97\u53e3\uff0c\u76f4\u5230\u7a97\u53e3\u5185\u4e58\u79ef\u91cd\u65b0\u6ee1\u8db3 `prod < k`\u3002\n\n---\n\n### Step 4: \u6838\u5fc3\u8ba1\u6570\u516c\u5f0f (`ans += right - left + 1`) \u2b50\n* **[EN] Why `right - left + 1`?**\n  * When `nums[left..right]` has a product $< k$, **every contiguous subarray ending at `right`** starting from index $i$ ($left \\le i \\le right$) is guaranteed to have a product $< k$ (because all numbers $\\ge 1$, shorter subarrays have $\\le$ products).\n  * The number of valid subarrays ending at index `right` is exactly `right - left + 1`.\n  * For example, with window `[10, 5, 2]` (`left = 0, right = 2`), valid subarrays ending at `2` are:\n    1. `[2]` (length 1)\n    2. `[5, 2]` (length 2)\n    3. `[10, 5, 2]` (length 3)\n    Total = $2 - 0 + 1 = 3$.\n* **[CN] \u4e3a\u4ec0\u4e48\u7d2f\u52a0\u7684\u662f `right - left + 1`\uff1f**\n  * \u5f53\u533a\u95f4 `nums[left..right]` \u7684\u4e58\u79ef $< k$ \u65f6\uff0c\u7531\u4e8e\u6240\u6709\u6570\u5747\u4e3a\u6b63\u6574\u6570\uff0c\u4ee5 `right` \u7ed3\u5c3e\u3001\u8d77\u70b9\u5728 $[left, right]$ \u8303\u56f4\u5185\u7684**\u6240\u6709\u8fde\u7eed\u5b50\u6570\u7ec4**\u4e58\u79ef\u5fc5\u7136\u4e5f\u90fd $< k$\u3002\n  * \u4ee5\u5f53\u524d `right` \u4e3a**\u53f3\u7aef\u70b9**\u7684\u5408\u6cd5\u5b50\u6570\u7ec4\u4e2a\u6570\uff0c\u521a\u597d\u7b49\u4e8e\u5f53\u524d\u7a97\u53e3\u7684\u957f\u5ea6\uff1a`right - left + 1`\u3002\n  * \u4f8b\u5982\u5f53\u524d\u7a97\u53e3\u662f `[10, 5, 2]`\uff08`left=0, right=2`\uff09\uff0c\u4ee5\u672b\u5c3e `2` \u7ed3\u5c3e\u7684\u5408\u6cd5\u5b50\u6570\u7ec4\u4e3a\uff1a\n    1. `[2]`\n    2. `[5, 2]`\n    3. `[10, 5, 2]`\n    \u521a\u597d\u662f $2 - 0 + 1 = 3$ \u4e2a\uff01\u6bcf\u6b21\u679a\u4e3e `right` \u65f6\u7d2f\u52a0\u65b0\u589e\u7684\u8fd9\u6279\u5b50\u6570\u7ec4\uff0c\u4e0d\u91cd\u4e0d\u6f0f\u3002\n\n---\n\n## 4. Execution Trace Example / \u6a21\u62df\u8fd0\u884c\u5168\u8fc7\u7a0b\n\n\u4ee5 `nums = [10, 5, 2, 6], k = 100` \u4e3a\u4f8b\uff1a\n\n| `right` | `x` | `prod` (\u4e58\u5165\u540e) | `while prod >= 100` (\u6536\u7f29) | \u6700\u7ec8 `left` | \u6700\u7ec8\u7a97\u53e3 `nums[left..right]` | \u65b0\u589e\u5408\u6cd5\u5b50\u6570\u7ec4 (\u4ee5 `right` \u7ed3\u5c3e) | `ans += right - left + 1` | \u5f53\u524d `ans` |\n| :---: | :---: | :---: | :---: | :---: | :---: | :---: | :---: | :---: |\n| 0 | 10 | 10 | \u4e0d\u89e6\u53d1 (10 < 100) | 0 | `[10]` | `[10]` | $0 - 0 + 1 = 1$ | **1** |\n| 1 | 5 | 50 | \u4e0d\u89e6\u53d1 (50 < 100) | 0 | `[10, 5]` | `[5]`, `[10, 5]` | $1 - 0 + 1 = 2$ | **3** |\n| 2 | 2 | 100 | **\u89e6\u53d1**\uff1a`prod //= 10` $\\rightarrow$ 10, `left` = 1 | 1 | `[5, 2]` | `[2]`, `[5, 2]` | $2 - 1 + 1 = 2$ | **5** |\n| 3 | 6 | 60 | \u4e0d\u89e6\u53d1 (60 < 100) | 1 | `[5, 2, 6]` | `[6]`, `[2, 6]`, `[5, 2, 6]` | $3 - 1 + 1 = 3$ | **8** |\n\n* \u6700\u7ec8\u603b\u5408\u6cd5\u5b50\u6570\u7ec4\u6570\u76ee\u4e3a\uff1a**`8`**\u3002\n\n---\n\n## 5. Complexity Analysis / \u590d\u6742\u5ea6\u5206\u6790\n\n| \u7ef4\u5ea6 | \u590d\u6742\u5ea6 | \u6838\u5fc3\u89e3\u6790 |\n| :--- | :--- | :--- |\n| **\u65f6\u95f4\u590d\u6742\u5ea6 (Time)** | $\\mathcal{O}(n)$ | \u6bcf\u4e2a\u5143\u7d20\u6700\u591a\u88ab `right` \u4e58\u5165 1 \u6b21\uff0c\u88ab `left` \u9664\u51fa 1 \u6b21\uff0c\u4e24\u6307\u9488\u5747\u5355\u8c03\u9012\u589e\uff0c\u603b\u8fd0\u7b97\u6b21\u6570 $\\le 2n$\u3002 |\n| **\u7a7a\u95f4\u590d\u6742\u5ea6 (Space)** | $\\mathcal{O}(1)$ | \u4ec5\u4f7f\u7528 `ans`, `prod`, `left`, `right` \u56db\u4e2a\u53d8\u91cf\uff0c\u7a7a\u95f4\u5e38\u6570\u7ea7\u3002 |\n"}, "top-100/s-lc-209-minimum-size-subarry-sum.md": {"title": "\ud83d\udd25 Top 100: Minimum Size Subarray Sum", "short": "LC 209", "path": "top-100/s-lc-209-minimum-size-subarry-sum.md", "content": "# LeetCode 209. Minimum Size Subarray Sum (\u957f\u5ea6\u6700\u5c0f\u7684\u5b50\u6570\u7ec4)\n## Step-by-Step Code Walkthrough & Notes / \u4ee3\u7801\u9010\u884c\u8be6\u89e3\u4e0e\u77e5\u8bc6\u70b9\u603b\u7ed3\n\n- **Difficulty:** Medium (\u6ed1\u52a8\u7a97\u53e3\u7ecf\u5178\u5165\u95e8\u9898)\n- **Tags:** Array, Binary Search, Sliding Window, Prefix Sum\n- **Corresponding Python Files:**\n  - [`top-100/s-lc-209-minimum-size-subarry-sum.py`](file:///mnt/c/Users/steve/iCloudDrive/desktop/leetcode-sh/top-100/s-lc-209-minimum-size-subarry-sum.py)\n  - [`luffy/6-lc-209-minimum-size-subarray-sum.py`](file:///mnt/c/Users/steve/iCloudDrive/desktop/leetcode-sh/luffy/6-lc-209-minimum-size-subarray-sum.py)\n\n---\n\n## 1. Problem Statement / \u9898\u76ee\u63cf\u8ff0\n\n* **[EN]** Given an array of positive integers `nums` and a positive integer `target`, return the **minimal length** of a contiguous subarray `[nums[l], nums[l+1], ..., nums[r-1], nums[r]]` of which the sum is greater than or equal to `target`. If there is no such subarray, return `0` instead.\n* **[CN]** \u7ed9\u5b9a\u4e00\u4e2a\u542b\u6709 `n` \u4e2a\u6b63\u6574\u6570\u7684\u6570\u7ec4\u548c\u4e00\u4e2a\u6b63\u6574\u6570 `target` \u3002\u627e\u51fa\u8be5\u6570\u7ec4\u4e2d\u6ee1\u8db3\u5176\u603b\u548c\u5927\u4e8e\u7b49\u4e8e `target` \u7684\u957f\u5ea6\u6700\u5c0f\u7684 **\u8fde\u7eed\u5b50\u6570\u7ec4** `[nums[l], nums[l+1], ..., nums[r-1], nums[r]]` \uff0c\u5e76\u8fd4\u56de\u5176\u957f\u5ea6\u3002\u5982\u679c\u4e0d\u5b58\u5728\u7b26\u5408\u6761\u4ef6\u7684\u5b50\u6570\u7ec4\uff0c\u8fd4\u56de `0` \u3002\n\n---\n\n## 2. Core Idea: Variable-Size Sliding Window / \u6838\u5fc3\u89e3\u6cd5\uff1a\u53d8\u957f\u6ed1\u52a8\u7a97\u53e3\n\n```python\nfrom typing import List\n\nclass Solution:\n    def minSubArrayLen(self, target: int, nums: List[int]) -> int:\n        slow = 0\n        fast = 0\n        sum = 0\n        min_len = float('inf')\n        \n        while fast < len(nums):\n            sum += nums[fast]\n            \n            while sum >= target:\n                min_len = min(min_len, fast - slow + 1)\n                sum -= nums[slow]\n                slow += 1\n                \n            fast += 1\n            \n        return min_len if min_len != float('inf') else 0\n```\n\n---\n\n## 3. Step-by-Step Code Walkthrough / \u4ee3\u7801\u9010\u884c\u8be6\u89e3\n\n### 1. \u521d\u59cb\u5316\u6307\u9488\u4e0e\u72b6\u6001\u53d8\u91cf\n\n```python\nslow = 0\nfast = 0\nsum = 0\nmin_len = float('inf')\n```\n\n* **`slow` (\u5de6\u6307\u9488 / \u7a97\u53e3\u5de6\u8fb9\u754c)**\uff1a\u6307\u5411\u5f53\u524d\u6ed1\u52a8\u7a97\u53e3\u7684\u8d77\u59cb\u4f4d\u7f6e\u3002\n* **`fast` (\u53f3\u6307\u9488 / \u7a97\u53e3\u53f3\u8fb9\u754c)**\uff1a\u6307\u5411\u5f53\u524d\u6ed1\u52a8\u7a97\u53e3\u7684\u7ed3\u675f\u4f4d\u7f6e\u3002\n* **`sum` (\u7a97\u53e3\u5185\u5143\u7d20\u7d2f\u52a0\u548c)**\uff1a\u8bb0\u5f55\u533a\u95f4 `[slow, fast]` \u5185\u6240\u6709\u6b63\u6574\u6570\u7684\u548c\u3002\n* **`min_len = float('inf')` (\u6700\u5c0f\u957f\u5ea6)**\uff1a\u521d\u59cb\u5316\u4e3a\u6b63\u65e0\u7a77\u5927\uff0c\u7528\u4e8e\u540e\u7eed\u53d6 `min` \u66f4\u65b0\u3002\n\n---\n\n### 2. \u6269\u5f20\u7a97\u53e3 (Expand Window via `fast`)\n\n```python\nwhile fast < len(nums):\n    sum += nums[fast]\n```\n\n* **\u52a8\u4f5c**\uff1a\u5916\u5c42\u5faa\u73af\u904d\u5386\u6570\u7ec4\uff0c\u53f3\u6307\u9488 `fast` \u6bcf\u6b21\u5411\u53f3\u6269\u5c55\u4e00\u6b65\uff0c\u5c06\u65b0\u5143\u7d20 `nums[fast]` \u52a0\u5165\u7a97\u53e3\uff0c\u7d2f\u52a0\u5230 `sum` \u4e2d\u3002\n\n---\n\n### 3. \u6536\u7f29\u7a97\u53e3\u4e0e\u66f4\u65b0\u7b54\u6848 (Shrink Window via `slow`)\n\n```python\n    while sum >= target:\n        min_len = min(min_len, fast - slow + 1)\n        sum -= nums[slow]\n        slow += 1\n```\n\n* **\u89e6\u53d1\u6761\u4ef6**\uff1a\u5f53\u5f53\u524d\u7a97\u53e3\u7684\u7d2f\u52a0\u548c `sum >= target` \u65f6\uff0c\u8bf4\u660e\u5f53\u524d\u533a\u95f4 `[slow, fast]` \u5df2\u7ecf\u6ee1\u8db3\u6761\u4ef6\u3002\n* **\u52a8\u4f5c**\uff1a\n  1. **\u66f4\u65b0\u6700\u77ed\u957f\u5ea6**\uff1a\u5f53\u524d\u7a97\u53e3\u957f\u5ea6\u4e3a `fast - slow + 1`\uff0c\u7528 `min_len = min(min_len, fast - slow + 1)` \u8bb0\u5f55\u5386\u53f2\u6700\u5c0f\u503c\u3002\n  2. **\u6536\u7f29\u5de6\u8fb9\u754c**\uff1a\u5c1d\u8bd5\u5c06\u5de6\u7aef\u70b9 `nums[slow]` \u79fb\u51fa\u7a97\u53e3\uff08`sum -= nums[slow]`\uff09\uff0c\u5e76\u5c06\u5de6\u6307\u9488\u5411\u53f3\u79fb `slow += 1`\u3002\n  3. **\u5faa\u73af\u5224\u65ad**\uff1a\u53ea\u8981\u79fb\u51fa\u540e `sum` \u4ecd\u7136 `>= target`\uff0c\u5c31\u7ee7\u7eed\u6536\u7f29\uff0c\u4ee5\u5bfb\u627e\u66f4\u77ed\u7684\u5408\u6cd5\u7a97\u53e3\uff1b\u76f4\u5230 `sum < target` \u65f6\u9000\u51fa\u5185\u5c42\u5faa\u73af\u3002\n\n---\n\n### 4. \u6b65\u8fdb\u53f3\u6307\u9488\u4e0e\u8fd4\u56de\u7ed3\u679c\n\n```python\n    fast += 1\n    \nreturn min_len if min_len != float('inf') else 0\n```\n\n* **`fast += 1`**\uff1a\u53f3\u6307\u9488\u7ee7\u7eed\u5411\u53f3\u63a2\u7d22\u4e0b\u4e00\u4e2a\u5143\u7d20\u3002\n* **\u8fd4\u56de\u503c\u5224\u65ad**\uff1a\u5982\u679c\u6574\u8f6e\u626b\u63cf\u540e `min_len` \u4ecd\u4e3a\u521d\u59cb\u503c `float('inf')`\uff0c\u8bf4\u660e\u6ca1\u6709\u4efb\u4f55\u5b50\u6570\u7ec4\u7684\u548c\u80fd\u591f\u8fbe\u5230 `target`\uff0c\u6309\u9898\u610f\u8fd4\u56de `0`\uff1b\u5426\u5219\u8fd4\u56de\u627e\u5230\u7684\u6700\u77ed\u957f\u5ea6 `min_len`\u3002\n\n---\n\n## 4. Execution Trace Example / \u6a21\u62df\u8fd0\u884c\u5168\u8fc7\u7a0b\n\n\u5047\u8bbe `target = 7, nums = [2, 3, 1, 2, 4, 3]`\uff1a\n\n| \u6b65\u9aa4 | `fast` (`num`) | `slow` | \u7a97\u53e3\u5185\u5143\u7d20 `nums[slow..fast]` | \u7a97\u53e3\u548c `sum` | `sum >= 7`? | \u5f53\u524d\u66f4\u65b0 `min_len` |\n| :---: | :---: | :---: | :---: | :---: | :---: | :---: |\n| 1 | 0 (`2`) | 0 | `[2]` | 2 | \u5426 | $\\infty$ |\n| 2 | 1 (`3`) | 0 | `[2, 3]` | 5 | \u5426 | $\\infty$ |\n| 3 | 2 (`1`) | 0 | `[2, 3, 1]` | 6 | \u5426 | $\\infty$ |\n| 4 | 3 (`2`) | 0 | `[2, 3, 1, 2]` | **8** | **\u662f** | $\\min(\\infty, 3-0+1) = \\mathbf{4}$ |\n| 4a | (\u6536\u7f29) | 1 | `[3, 1, 2]` | 6 (\u51cf\u53bb2) | \u5426 | 4 |\n| 5 | 4 (`4`) | 1 | `[3, 1, 2, 4]` | **10** | **\u662f** | $\\min(4, 4-1+1) = \\mathbf{4}$ |\n| 5a | (\u6536\u7f29) | 2 | `[1, 2, 4]` | **7** (\u51cf\u53bb3) | **\u662f** | $\\min(4, 4-2+1) = \\mathbf{3}$ |\n| 5b | (\u6536\u7f29) | 3 | `[2, 4]` | 6 (\u51cf\u53bb1) | \u5426 | 3 |\n| 6 | 5 (`3`) | 3 | `[2, 4, 3]` | **9** | **\u662f** | $\\min(3, 5-3+1) = \\mathbf{3}$ |\n| 6a | (\u6536\u7f29) | 4 | `[4, 3]` | **7** (\u51cf\u53bb2) | **\u662f** | $\\min(3, 5-4+1) = \\mathbf{2}$ |\n| 6b | (\u6536\u7f29) | 5 | `[3]` | 3 (\u51cf\u53bb4) | \u5426 | 2 |\n\n* \u6700\u7ec8\u8fd4\u56de\u6700\u4f18\u89e3\uff1a**`2`** (\u5bf9\u5e94\u5b50\u6570\u7ec4 `[4, 3]`)\u3002\n\n---\n\n## 5. Complexity Analysis / \u590d\u6742\u5ea6\u5206\u6790\n\n* **\u65f6\u95f4\u590d\u6742\u5ea6 (Time Complexity):** $\\mathcal{O}(n)$\n  * \u6838\u5fc3\u5173\u952e\uff1a\u867d\u7136\u4ee3\u7801\u4e2d\u51fa\u73b0\u4e86\u4e24\u5c42\u5d4c\u5957\u7684 `while` \u5faa\u73af\uff0c\u4f46\u6bcf\u4e2a\u5143\u7d20\u5728\u6574\u4e2a\u8fc7\u7a0b\u4e2d**\u6700\u591a\u88ab `fast` \u8bbf\u95ee\u52a0\u5165\u7a97\u53e3 1 \u6b21\uff0c\u6700\u591a\u88ab `slow` \u79fb\u51fa\u7a97\u53e3 1 \u6b21**\u3002\n  * \u64cd\u4f5c\u603b\u6b21\u6570\u4e0d\u8d85\u8fc7 $2n$\uff0c\u5747\u644a\u65f6\u95f4\u590d\u6742\u5ea6\u4e3a\u4e25\u683c\u7684 $\\mathcal{O}(n)$\u3002\n* **\u7a7a\u95f4\u590d\u6742\u5ea6 (Space Complexity):** $\\mathcal{O}(1)$\n  * \u4ec5\u4f7f\u7528\u4e86\u51e0\u4e2a\u5e38\u6570\u7ea7\u522b\u7684\u6574\u578b\u6307\u9488\u4e0e\u6c42\u548c\u53d8\u91cf\uff0c\u65e0\u989d\u5916\u5185\u5b58\u5f00\u9500\u3002\n"}, "top-100/s-lc-167-two-sum-2.md": {"title": "\ud83d\udd25 Top 100: Two Sum II - Sorted Array", "short": "LC 167", "path": "top-100/s-lc-167-two-sum-2.md", "content": "# LeetCode 167. Two Sum II - Input Array Is Sorted\n## Step-by-Step Code Walkthrough & Notes / \u4ee3\u7801\u9010\u884c\u8be6\u89e3\u4e0e\u77e5\u8bc6\u70b9\u603b\u7ed3\n\n- **Difficulty:** Medium (\u9762\u8bd5\u9ad8\u9891 / \u7ecf\u5178\u53cc\u6307\u9488)\n- **Tags:** Array, Two Pointers, Binary Search\n- **Corresponding Python File:** [`s-lc-167.py`](file:///mnt/c/Users/steve/iCloudDrive/desktop/leetcode-sh/s-lc-167.py)\n\n---\n\n## 1. Problem Statement / \u9898\u76ee\u63cf\u8ff0\n\n* **[EN]** Given a **1-indexed** array of integers `numbers` that is already **sorted in non-decreasing order**, find two numbers such that they add up to a specific `target` number. Return the indices of the two numbers, `index1` and `index2`, added by one as an integer array `[index1, index2]` of length 2.\n  * **Constraints:** You must use only $\\mathcal{O}(1)$ extra space. There is exactly one solution. You may not use the same element twice.\n* **[CN]** \u7ed9\u4f60\u4e00\u4e2a\u4e0b\u6807\u4ece **1 \u5f00\u59cb** \u7684\u6574\u6570\u6570\u7ec4 `numbers` \uff0c\u8be5\u6570\u7ec4\u5df2\u6309 **\u975e\u9012\u51cf\u987a\u5e8f\u6392\u5217** \u3002\u8bf7\u4f60\u4ece\u6570\u7ec4\u4e2d\u627e\u51fa\u6ee1\u8db3\u76f8\u52a0\u4e4b\u548c\u7b49\u4e8e\u76ee\u6807\u6570 `target` \u7684\u4e24\u4e2a\u6570\u3002\u8fd4\u56de\u8fd9\u4e24\u4e2a\u6570\u7684\u4e0b\u6807 `index1` \u548c `index2`\uff08\u4ee5\u957f\u4e3a 2 \u7684\u6574\u6570\u6570\u7ec4 `[index1, index2]` \u5f62\u5f0f\u8fd4\u56de\uff0c\u4e0b\u6807\u4ece 1 \u5f00\u59cb\uff09\u3002\n  * **\u7ea6\u675f\u6761\u4ef6**\uff1a\u4f60\u53ea\u80fd\u4f7f\u7528 $\\mathcal{O}(1)$ \u7684\u989d\u5916\u7a7a\u95f4\uff1b\u6d4b\u8bd5\u7528\u4f8b\u6709\u4e14\u4ec5\u6709\u4e00\u4e2a\u6709\u6548\u7b54\u6848\uff1b\u4e0d\u80fd\u91cd\u590d\u4f7f\u7528\u76f8\u540c\u7684\u5143\u7d20\u3002\n\n---\n\n## 2. Step-by-Step Code Walkthrough / \u4ee3\u7801\u9010\u884c\u8be6\u89e3\n\n### \u65b9\u6848 1\uff1a\u53cc\u6307\u9488\u5bf9\u649e\u6cd5 (Two Pointers - Optimal $\\mathcal{O}(1)$ Space)\n\n```python\nclass Solution:\n    def twoSum(self, numbers: List[int], target: int) -> List[int]:\n        left = 0\n        right = len(numbers) - 1\n```\n\n* **[EN] Action:** Initializes `left` pointer at the first element index (`0`) and `right` pointer at the last element index (`len(numbers) - 1`).\n  * **Why Two Pointers?** Because the array is **sorted**. The smallest elements are on the left, and the largest elements are on the right.\n* **[CN] \u52a8\u4f5c**\uff1a\u521d\u59cb\u5316\u5de6\u6307\u9488 `left = 0` \u6307\u5411\u6570\u7ec4\u9996\u7aef\uff08\u6700\u5c0f\u503c\uff09\uff0c\u53f3\u6307\u9488 `right = len(numbers) - 1` \u6307\u5411\u6570\u7ec4\u672b\u7aef\uff08\u6700\u5927\u503c\uff09\u3002\n  * **\u4e3a\u4ec0\u4e48\u7528\u53cc\u6307\u9488\uff1f** \u56e0\u4e3a\u6570\u7ec4\u662f**\u6709\u5e8f\uff08\u975e\u9012\u51cf\uff09**\u7684\u3002\u5de6\u4fa7\u662f\u8f83\u5c0f\u6570\uff0c\u53f3\u4fa7\u662f\u8f83\u5927\u6570\uff0c\u53ef\u4ee5\u901a\u8fc7\u79fb\u52a8\u6307\u9488\u5355\u8c03\u6027\u5730\u6539\u53d8\u4e24\u6570\u4e4b\u548c\u3002\n\n---\n\n```python\n        while left < right:\n            curr_sum = numbers[left] + numbers[right]\n```\n\n* **[EN] Action:** Loops as long as `left < right`. Calculates the sum of the elements at the two pointers: `curr_sum = numbers[left] + numbers[right]`.\n  * **Why `left < right` instead of `left <= right`?** The problem forbids using the exact same element twice (`1 <= index1 < index2 <= n`).\n* **[CN] \u52a8\u4f5c**\uff1a\u5f53 `left < right` \u65f6\u8fdb\u5165\u5faa\u73af\uff0c\u8ba1\u7b97\u5f53\u524d\u5de6\u53f3\u6307\u9488\u6240\u6307\u4e24\u6570\u4e4b\u548c `curr_sum`\u3002\n  * **\u4e3a\u4ec0\u4e48\u662f `left < right` \u800c\u4e0d\u662f `<=`\uff1f** \u9898\u76ee\u660e\u786e\u8bf4\u660e\u4e0d\u80fd\u91cd\u590d\u4f7f\u7528\u540c\u4e00\u4e2a\u5143\u7d20\u4e24\u6b21\uff08\u5fc5\u987b\u662f\u4e24\u4e2a\u4e0d\u540c\u4f4d\u7f6e\u7684\u6570\uff09\u3002\n\n---\n\n```python\n            if curr_sum == target:\n                return [left + 1, right + 1]\n```\n\n* **[EN] Action:** If `curr_sum == target`, the target pair is found.\n  * **Why `+ 1`?** The problem states that the array is **1-indexed**, while Python lists are **0-indexed**. Adding `1` converts `0-based` indices into `1-based` indices.\n* **[CN] \u52a8\u4f5c**\uff1a\u82e5\u4e24\u6570\u4e4b\u548c\u521a\u597d\u7b49\u4e8e `target`\uff0c\u7acb\u5373\u8fd4\u56de\u4e0b\u6807\u6570\u7ec4\u3002\n  * **\u4e3a\u4ec0\u4e48\u8981 `+ 1`\uff1f** \u9898\u76ee\u8981\u6c42\u8fd4\u56de **1-based index**\uff08\u4e0b\u6807\u4ece 1 \u5f00\u59cb\u8ba1\uff09\uff0c\u800c Python \u5217\u8868\u662f 0-based \u7d22\u5f15\uff0c\u6240\u4ee5\u4e24\u7aef\u5747\u9700\u52a0 1\u3002\n\n---\n\n```python\n            elif curr_sum < target:\n                left += 1\n```\n\n* **[EN] Logic:** If `curr_sum < target`, the sum is too small.\n  * **Why `left += 1`?** Since the array is sorted in ascending order, moving `left` to the right (`left + 1`) increases the value of `numbers[left]`, thus increasing `curr_sum`.\n* **[CN] \u903b\u8f91**\uff1a\u5982\u679c\u5f53\u524d\u548c `curr_sum < target`\uff0c\u8bf4\u660e\u5f53\u524d\u548c\u504f\u5c0f\u3002\n  * **\u4e3a\u4ec0\u4e48 `left += 1`\uff1f** \u6570\u7ec4\u662f\u5347\u5e8f\u6392\u5217\u7684\uff0c\u5c06\u5de6\u6307\u9488\u5411\u53f3\u79fb\u52a8\u4e00\u4f4d\u53ef\u4ee5\u589e\u5927 `numbers[left]` \u7684\u503c\uff0c\u4ece\u800c\u4f7f\u4e24\u6570\u4e4b\u548c\u589e\u5927\u3002\n\n---\n\n```python\n            else:\n                right -= 1\n```\n\n* **[EN] Logic:** If `curr_sum > target`, the sum is too large.\n  * **Why `right -= 1`?** Moving `right` to the left (`right - 1`) decreases the value of `numbers[right]`, thus reducing `curr_sum`.\n* **[CN] \u903b\u8f91**\uff1a\u5982\u679c\u5f53\u524d\u548c `curr_sum > target`\uff0c\u8bf4\u660e\u5f53\u524d\u548c\u504f\u5927\u3002\n  * **\u4e3a\u4ec0\u4e48 `right -= 1`\uff1f** \u5c06\u53f3\u6307\u9488\u5411\u5de6\u79fb\u52a8\u4e00\u4f4d\u53ef\u4ee5\u51cf\u5c0f `numbers[right]` \u7684\u503c\uff0c\u4ece\u800c\u4f7f\u4e24\u6570\u4e4b\u548c\u51cf\u5c0f\u3002\n\n---\n\n```python\n        return []\n```\n\n* **[EN] Action:** Fallback return. (Per constraints, a solution is guaranteed to exist).\n* **[CN] \u52a8\u4f5c**\uff1a\u515c\u5e95\u8fd4\u56de\uff08\u9898\u76ee\u4fdd\u8bc1\u5fc5\u5b9a\u5b58\u5728\u552f\u4e00\u89e3\uff09\u3002\n\n---\n\n## 3. Key FAQs & Concept Clarifications / \u6838\u5fc3\u7b54\u7591\u4e0e\u539f\u7406\n\n### Q1: \u4e3a\u4ec0\u4e48\u5bf9\u649e\u53cc\u6307\u9488\u4e0d\u4f1a\u6f0f\u6389\u89e3\uff1f(Why are we sure no valid pair is missed?)\n* \u5047\u8bbe\u552f\u4e00\u6b63\u786e\u7684\u7b54\u6848\u662f\u4e0b\u6807\u5bf9 $(i^*, j^*)$\u3002\n* \u4e00\u5f00\u59cb $left = 0 \\le i^*$\uff0c$right = n-1 \\ge j^*$\u3002\n* \u5982\u679c $left$ \u8fd8\u6ca1\u5230 $i^*$ \u4f46 $right$ \u5df2\u7ecf\u5230\u4e86 $j^*$\uff1a\n  * \u6b64\u65f6 $numbers[left] + numbers[right] = numbers[left] + numbers[j^*] < numbers[i^*] + numbers[j^*] = target$\n  * \u56e0\u4e3a\u548c\u5fc5\u5b9a\u5c0f\u4e8e $target$\uff0c\u7b97\u6cd5\u53ea\u4f1a\u6267\u884c `left += 1`\uff0c**\u7edd\u4e0d\u4f1a\u628a\u5df2\u7ecf\u505c\u5728\u6b63\u786e\u4f4d\u7f6e\u7684 $right$ \u5de6\u79fb**\uff01\n* \u540c\u7406\uff0c\u82e5 $left$ \u5148\u5230\u8fbe $i^*$\uff0c\u548c\u5fc5\u5b9a\u5927\u4e8e $target$\uff0c\u7b97\u6cd5\u53ea\u4f1a\u6267\u884c `right -= 1`\u3002\n* \u56e0\u6b64\u4e24\u4e2a\u6307\u9488\u5fc5\u7136\u5728 $(i^*, j^*)$ \u5904\u6c47\u5408\uff0c**\u7edd\u4e0d\u4f1a\u9519\u8fc7\u6b63\u786e\u7b54\u6848**\u3002\n\n---\n\n### Q2: LC 1 (Two Sum) vs LC 167 (Two Sum II) \u7684\u5bf9\u6bd4\n\n| \u7ef4\u5ea6 | LeetCode 1 (\u65e0\u5e8f\u6570\u7ec4) | LeetCode 167 (\u6709\u5e8f\u6570\u7ec4) |\n| :--- | :--- | :--- |\n| **\u6570\u7ec4\u72b6\u6001** | \u65e0\u5e8f (Unsorted) | \u5df2\u5347\u5e8f\u6392\u5e8f (Sorted non-decreasing) |\n| **\u63a8\u8350\u89e3\u6cd5** | \u54c8\u5e0c\u8868 (Hash Map) | \u53cc\u6307\u9488\u5bf9\u649e (Two Pointers) |\n| **\u65f6\u95f4\u590d\u6742\u5ea6** | $\\mathcal{O}(n)$ | $\\mathcal{O}(n)$ |\n| **\u7a7a\u95f4\u590d\u6742\u5ea6** | $\\mathcal{O}(n)$ (\u9700\u8981\u989d\u5916\u5b57\u5178) | $\\mathcal{O}(1)$ (\u4ec5\u53cc\u6307\u9488\u53d8\u91cf\uff0c\u6ee1\u8db3\u8fdb\u9636\u8981\u6c42) |\n| **\u4e0b\u6807\u89c4\u8303** | 0-indexed | 1-indexed (\u9700 `+ 1`) |\n\n---\n\n## 4. Alternative Methods / \u5176\u4ed6\u89e3\u6cd5\u5bf9\u6bd4\n\n### \u65b9\u6848 2\uff1a\u4e8c\u5206\u67e5\u627e (Binary Search)\n* **\u601d\u8def**\uff1a\u904d\u5386\u6bcf\u4e2a\u5143\u7d20 `numbers[i]`\uff0c\u5728\u533a\u95f4 `[i + 1, n - 1]` \u4e2d\u4e8c\u5206\u67e5\u627e\u8865\u6570 `complement = target - numbers[i]`\u3002\n* **\u590d\u6742\u5ea6**\uff1a\u65f6\u95f4 $\\mathcal{O}(n \\log n)$\uff0c\u7a7a\u95f4 $\\mathcal{O}(1)$\u3002\n\n```python\nclass SolutionBinarySearch:\n    def twoSum(self, numbers: List[int], target: int) -> List[int]:\n        n = len(numbers)\n        for i in range(n):\n            complement = target - numbers[i]\n            low, high = i + 1, n - 1\n            while low <= high:\n                mid = low + (high - low) // 2\n                if numbers[mid] == complement:\n                    return [i + 1, mid + 1]\n                elif numbers[mid] < complement:\n                    low = mid + 1\n                else:\n                    high = mid - 1\n        return []\n```\n\n---\n\n## 5. Complexity Analysis / \u590d\u6742\u5ea6\u5206\u6790\n\n| \u65b9\u6cd5 | \u65f6\u95f4\u590d\u6742\u5ea6 (Time) | \u7a7a\u95f4\u590d\u6742\u5ea6 (Space) | \u8bc4\u4ef7 |\n| :--- | :--- | :--- | :--- |\n| **\u53cc\u6307\u9488\u5bf9\u649e\u6cd5 (Optimal)** | $\\mathcal{O}(n)$ | $\\mathcal{O}(1)$ | \u2b50 **\u6700\u4f18\u89e3**\uff0c\u7ebf\u6027\u626b\u63cf\uff0c\u96f6\u989d\u5916\u5185\u5b58\u5f00\u9500 |\n| **\u4e8c\u5206\u67e5\u627e\u6cd5** | $\\mathcal{O}(n \\log n)$ | $\\mathcal{O}(1)$ | \u6ee1\u8db3\u7a7a\u95f4\u8981\u6c42\uff0c\u4f46\u65f6\u95f4\u7a0d\u6162 |\n| **\u54c8\u5e0c\u8868\u6cd5** | $\\mathcal{O}(n)$ | $\\mathcal{O}(n)$ | \u4e0d\u7b26\u5408\u9898\u76ee $\\mathcal{O}(1)$ \u7a7a\u95f4\u9650\u5236 |\n"}, "top-100/s-lc-53-maxiumu-subarry.md": {"title": "\ud83d\udd25 Top 100: Maximum Subarray", "short": "LC 53", "path": "top-100/s-lc-53-maxiumu-subarry.md", "content": "# LeetCode 53. Maximum Subarray (\u6700\u5927\u5b50\u6570\u7ec4\u548c)\n## Step-by-Step Code Walkthrough & Notes / \u4ee3\u7801\u9010\u884c\u8be6\u89e3\u4e0e\u77e5\u8bc6\u70b9\u603b\u7ed3\n\n- **Difficulty:** Medium (\u7ecf\u5178\u52a8\u6001\u89c4\u5212 / Kadane \u7b97\u6cd5)\n- **Tags:** Array, Dynamic Programming, Divide and Conquer\n- **Corresponding Python File:** [`top-100/s-lc-53-maxiumu-subarry.py`](file:///mnt/c/Users/steve/iCloudDrive/desktop/leetcode-sh/top-100/s-lc-53-maxiumu-subarry.py)\n\n---\n\n## 1. Problem Statement / \u9898\u76ee\u63cf\u8ff0\n\n* **[EN]** Given an integer array `nums`, find the subarray with the largest sum, and return its sum.\n* **[CN]** \u7ed9\u4f60\u4e00\u4e2a\u6574\u6570\u6570\u7ec4 `nums` \uff0c\u8bf7\u4f60\u627e\u51fa\u4e00\u4e2a\u5177\u6709\u6700\u5927\u548c\u7684\u8fde\u7eed\u5b50\u6570\u7ec4\uff08\u5b50\u6570\u7ec4\u6700\u5c11\u5305\u542b\u4e00\u4e2a\u5143\u7d20\uff09\uff0c\u8fd4\u56de\u5176\u6700\u5927\u548c\u3002\n\n---\n\n## 2. Code Implementation / \u4ee3\u7801\u5b9e\u73b0\n\n```python\nfrom typing import List\n\nclass Solution:\n    def maxSubArray(self, nums: List[int]) -> int:\n        current_sum = 0\n        max_sum = float(\"-inf\")\n\n        for num in nums:\n            # \u72b6\u6001\u8f6c\u79fb\uff1a\u82e5\u524d\u9762\u7d2f\u52a0\u548c\u4e3a\u8d1f\u6570\uff0c\u5219\u820d\u5f03\u5e76\u4ece\u5f53\u524d\u5143\u7d20\u91cd\u65b0\u5f00\u59cb\n            current_sum = max(num, current_sum + num)\n            max_sum = max(max_sum, current_sum)\n            \n        return max_sum\n```\n\n---\n\n## 3. Kadane's Algorithm Intuition / \u7b97\u6cd5\u539f\u7406\u89e3\u6790\n\n1. **\u6838\u5fc3\u72b6\u6001\u8f6c\u79fb\u65b9\u7a0b**\uff1a\n   $$dp[i] = \\max(nums[i], dp[i-1] + nums[i])$$\n2. **\u8d2a\u5fc3/\u52a8\u6001\u89c4\u5212\u76f4\u89c9**\uff1a\n   * \u5982\u679c\u524d\u9762\u7684\u5b50\u6570\u7ec4\u548c `current_sum` \u53d8\u6210\u4e86\u8d1f\u6570\uff0c\u5b83\u5bf9\u540e\u7eed\u4efb\u4f55\u5143\u7d20\u7684\u7d2f\u52a0\u53ea\u4f1a\u8d77\u5230\u201c\u526f\u4f5c\u7528\u201d\uff08\u62d6\u540e\u817f\uff09\u3002\n   * \u56e0\u6b64\uff0c\u5f53 `current_sum + num < num`\uff08\u5373 `current_sum < 0`\uff09\u65f6\uff0c\u6211\u4eec\u5e94\u8be5\u76f4\u63a5\u679c\u65ad\u820d\u5f03\u524d\u9762\u7684\u7d2f\u52a0\uff0c\u5c06\u5f53\u524d\u5143\u7d20 `num` \u4f5c\u4e3a\u5168\u65b0\u5b50\u6570\u7ec4\u7684\u8d77\u70b9\u3002\n3. **\u5168\u5c40\u7ef4\u62a4\u6700\u5927\u503c**\uff1a\n   * \u6bcf\u6b21\u66f4\u65b0 `current_sum` \u540e\uff0c\u4f7f\u7528 `max_sum = max(max_sum, current_sum)` \u8bb0\u5f55\u5168\u5c40\u5386\u53f2\u6700\u9ad8\u503c\u3002\n\n---\n\n## 4. Complexity Analysis / \u590d\u6742\u5ea6\u5206\u6790\n\n* **\u65f6\u95f4\u590d\u6742\u5ea6 (Time):** $\\mathcal{O}(n)$ \u2014\u2014 \u4ec5\u9700\u5355\u6b21\u7ebf\u6027\u626b\u63cf\u3002\n* **\u7a7a\u95f4\u590d\u6742\u5ea6 (Space):** $\\mathcal{O}(1)$ \u2014\u2014 \u4ec5\u7ef4\u62a4\u4e24\u4e2a\u6d6e\u70b9/\u6574\u578b\u72b6\u6001\u53d8\u91cf\u3002\n"}, "top-100/s-lc-42-trapping-rain-water.md": {"title": "\ud83d\udd25 Top 100: Trapping Rain Water", "short": "LC 42", "path": "top-100/s-lc-42-trapping-rain-water.md", "content": "# LeetCode 42. Trapping Rain Water (\u63a5\u96e8\u6c34)\n## Step-by-Step Code Walkthrough & Notes / \u4ee3\u7801\u9010\u884c\u8be6\u89e3\u4e0e\u77e5\u8bc6\u70b9\u603b\u7ed3\n\n- **Difficulty:** Hard (\u9ad8\u9891\u9762\u8bd5\u7ecf\u5178\u9898 / \u524d\u540e\u7f00\u6700\u5927\u503c & \u53cc\u6307\u9488)\n- **Tags:** Array, Two Pointers, Dynamic Programming, Stack\n- **Corresponding Python File:** [`top-100/s-lc-42-trapping-rain-water.py`](file:///mnt/c/Users/steve/iCloudDrive/desktop/leetcode-sh/top-100/s-lc-42-trapping-rain-water.py)\n\n---\n\n## 1. Problem Statement / \u9898\u76ee\u63cf\u8ff0\n\n* **[EN]** Given `n` non-negative integers representing an elevation map where the width of each bar is 1, compute how much water it can trap after raining.\n* **[CN]** \u7ed9\u5b9a `n` \u4e2a\u975e\u8d1f\u6574\u6570\u8868\u793a\u6bcf\u4e2a\u5bbd\u5ea6\u4e3a 1 \u7684\u67f1\u5b50\u7684\u9ad8\u5ea6\u56fe\uff0c\u8ba1\u7b97\u6309\u6b64\u6392\u5217\u7684\u67f1\u5b50\uff0c\u4e0b\u96e8\u4e4b\u540e\u80fd\u63a5\u591a\u5c11\u96e8\u6c34\u3002\n\n---\n\n## 2. Core Principle / \u6838\u5fc3\u539f\u7406\n\n\u6bcf\u4e2a\u4f4d\u7f6e $i$ \u80fd\u63a5\u7684\u96e8\u6c34\u91cf\u53d6\u51b3\u4e8e\u5176**\u5de6\u4fa7\u6700\u9ad8\u67f1\u5b50**\u548c**\u53f3\u4fa7\u6700\u9ad8\u67f1\u5b50**\u7684\u8f83\u5c0f\u503c\uff1a\n$$\\text{water}[i] = \\max(0, \\min(\\text{pre\\_max}[i], \\text{suf\\_max}[i]) - \\text{height}[i])$$\n\n---\n\n## 3. Code Implementations / \u4ee3\u7801\u5b9e\u73b0\n\n### \u65b9\u6848 1\uff1a\u524d\u540e\u7f00\u6700\u5927\u503c\u6570\u7ec4 (Prefix & Suffix Max - DP)\n\n```python\nfrom typing import List\n\nclass Solution:\n    def trap(self, height: List[int]) -> int:\n        n = len(height)\n        pre_max = [0] * n\n        pre_max[0] = height[0]\n        for i in range(1, n):\n            pre_max[i] = max(pre_max[i - 1], height[i])\n\n        suf_max = [0] * n\n        suf_max[-1] = height[-1]\n        for i in range(n - 2, -1, -1):\n            suf_max[i] = max(suf_max[i + 1], height[i])\n\n        result = 0\n        for h, pre, suf in zip(height, pre_max, suf_max):\n            result += min(pre, suf) - h\n\n        return result\n```\n\n* **\u65f6\u95f4\u590d\u6742\u5ea6:** $\\mathcal{O}(n)$ | **\u7a7a\u95f4\u590d\u6742\u5ea6:** $\\mathcal{O}(n)$\n\n---\n\n### \u65b9\u6848 2\uff1a\u5bf9\u649e\u53cc\u6307\u9488\u7a7a\u95f4\u4f18\u5316 (Two Pointers - Optimal $\\mathcal{O}(1)$ Space)\n\n```python\nclass Solution2:\n    def trap(self, height: List[int]) -> int:\n        n = len(height)\n        result = 0\n        left = 0\n        right = n - 1\n        pre_max = 0\n        suf_max = 0\n        \n        while left <= right:\n            pre_max = max(pre_max, height[left])\n            suf_max = max(suf_max, height[right])\n            \n            # \u82e5\u5de6\u4fa7\u5386\u53f2\u6700\u9ad8 < \u53f3\u4fa7\u5386\u53f2\u6700\u9ad8\uff0c\u5219\u5f53\u524d left \u5904\u7684\u63a5\u6c34\u91cf\u7531 pre_max \u51b3\u5b9a\n            if pre_max < suf_max:\n                result += pre_max - height[left]\n                left += 1\n            else:\n                result += suf_max - height[right]\n                right -= 1\n                \n        return result\n```\n\n* **\u65f6\u95f4\u590d\u6742\u5ea6:** $\\mathcal{O}(n)$ | **\u7a7a\u95f4\u590d\u6742\u5ea6:** $\\mathcal{O}(1)$\n"}, "top-100/s-lc-15-3-sum.md": {"title": "\ud83d\udd25 Top 100: 3Sum", "short": "LC 15", "path": "top-100/s-lc-15-3-sum.md", "content": "# LeetCode 15. 3Sum (\u4e09\u6570\u4e4b\u548c)\n## Step-by-Step Code Walkthrough & Notes / \u4ee3\u7801\u9010\u884c\u8be6\u89e3\u4e0e\u77e5\u8bc6\u70b9\u603b\u7ed3\n\n- **Difficulty:** Medium (\u9ad8\u9891\u9762\u8bd5\u7ecf\u5178\u9898 / \u53cc\u6307\u9488 + \u6781\u81f4\u526a\u679d)\n- **Tags:** Array, Two Pointers, Sorting, Pruning\n- **Corresponding Python Files:**\n  - [`top-100/s-lc-15-3-sum.py`](file:///mnt/c/Users/steve/iCloudDrive/desktop/leetcode-sh/top-100/s-lc-15-3-sum.py)\n  - [`s-lc-15.py`](file:///mnt/c/Users/steve/iCloudDrive/desktop/leetcode-sh/s-lc-15.py)\n\n---\n\n## 1. Problem Statement / \u9898\u76ee\u63cf\u8ff0\n\n* **[EN]** Given an integer array `nums`, return all the triplets `[nums[i], nums[j], nums[k]]` such that `i != j`, `i != k`, and `j != k`, and `nums[i] + nums[j] + nums[k] == 0`.\n  * **Note:** The solution set must **not contain duplicate triplets**.\n* **[CN]** \u7ed9\u4f60\u4e00\u4e2a\u6574\u6570\u6570\u7ec4 `nums` \uff0c\u5224\u65ad\u662f\u5426\u5b58\u5728\u4e09\u5143\u7ec4 `[nums[i], nums[j], nums[k]]` \u6ee1\u8db3 `i != j`\u3001`i != k` \u4e14 `j != k` \uff0c\u540c\u65f6\u8fd8\u6ee1\u8db3 `nums[i] + nums[j] + nums[k] == 0` \u3002\n  * **\u6ce8\u610f\uff1a** \u7b54\u6848\u4e2d**\u4e0d\u53ef\u4ee5\u5305\u542b\u91cd\u590d\u7684\u4e09\u5143\u7ec4**\u3002\n\n---\n\n## 2. Updated Code Implementation / \u66f4\u65b0\u540e\u7684\u5b8c\u6574\u4ee3\u7801\n\n```python\nfrom typing import List\n\nclass Solution:\n    def threeSum(self, nums: List[int]) -> List[List[int]]:\n        nums.sort()\n        # the order of triplet does not matter\n        # i < j < k\n        # the result cannot include repeated triplets\n\n        result = []\n        n = len(nums)\n\n        for i in range(0, n - 2):\n            x = nums[i]\n            if i > 0 and x == nums[i - 1]:\n                continue\n\n            # Optimization 1: \u6700\u5c0f\u548c\u526a\u679d\n            if x + nums[i + 1] + nums[i + 2] > 0:\n                break\n\n            # Optimization 2: \u6700\u5927\u548c\u526a\u679d\n            if x + nums[-2] + nums[-1] < 0:\n                continue\n\n            j = i + 1\n            k = n - 1\n            while j < k:\n                s = x + nums[j] + nums[k]\n                if s > 0:\n                    k -= 1\n                elif s < 0:\n                    j += 1\n                else:\n                    result.append([x, nums[j], nums[k]])\n                    j += 1\n                    while j < k and nums[j] == nums[j - 1]:\n                        j += 1\n                    k -= 1\n                    while k > j and nums[k] == nums[k + 1]:\n                        k -= 1\n                        \n        return result\n```\n\n---\n\n## 3. Step-by-Step Code Walkthrough / \u4ee3\u7801\u9010\u884c\u8be6\u89e3\n\n### 1. \u6570\u7ec4\u6392\u5e8f\u4e0e\u521d\u59cb\u5316 (Sorting & Initialization)\n\n```python\nnums.sort()\nresult = []\nn = len(nums)\n```\n\n* **[EN] Action:** Sorts `nums` in ascending order. Initializes the empty list `result` and records array length `n`.\n  * **Why Sort?** Sorting provides monotonicity so we can adjust sums using two pointers and effortlessly skip duplicate numbers.\n* **[CN] \u52a8\u4f5c**\uff1a\u5c06\u6570\u7ec4\u6309\u5347\u5e8f\u539f\u5730\u6392\u5e8f\uff0c\u521d\u59cb\u5316\u7ed3\u679c\u5217\u8868 `result`\uff0c\u5e76\u83b7\u53d6\u6570\u7ec4\u957f\u5ea6 `n`\u3002\n  * **\u4e3a\u4ec0\u4e48\u6392\u5e8f\uff1f** \u6392\u5e8f\u8d4b\u4e88\u4e86\u6570\u7ec4\u5355\u8c03\u6027\uff0c\u4e0d\u4ec5\u80fd\u4f7f\u7528\u53cc\u6307\u9488\u6309\u9700\u8c03\u8282\u548c\u7684\u5927\u5c0f\uff0c\u8fd8\u80fd\u4f7f\u76f8\u540c\u6570\u5b57\u805a\u96c6\u5728\u4e00\u8d77\uff0c\u6781\u5927\u5730\u7b80\u5316\u4e86\u53bb\u91cd\u903b\u8f91\u3002\n\n---\n\n### 2. \u5916\u5c42\u5faa\u73af\u4e0e\u57fa\u51c6\u6570\u53bb\u91cd (Outer Loop & Anchor Deduplication)\n\n```python\nfor i in range(0, n - 2):\n    x = nums[i]\n    if i > 0 and x == nums[i - 1]:\n        continue\n```\n\n* **[EN] Action:** Fixes the first number `x = nums[i]`. We only need to iterate up to index `n - 3` because at least two elements (`j` and `k`) are required after `i`.\n  * **Deduplication Logic (`x == nums[i - 1]`):** If the current value `x` is equal to the previous value `nums[i - 1]`, all triplets starting with `x` were **already exhaustively found** in the previous iteration. We skip it (`continue`) to prevent duplicate triplets in the output.\n* **[CN] \u52a8\u4f5c**\uff1a\u5916\u5c42\u5faa\u73af\u679a\u4e3e\u7b2c\u4e00\u4e2a\u57fa\u51c6\u6570 `x = nums[i]`\uff0c\u904d\u5386\u5230 `n - 3`\uff08\u5373 `range(0, n - 2)`\uff09\u5373\u53ef\uff0c\u56e0\u4e3a\u540e\u9762\u5fc5\u987b\u81f3\u5c11\u4fdd\u7559\u4e24\u4e2a\u6570\u7ed9 `j` \u548c `k`\u3002\n  * **\u57fa\u51c6\u6570\u53bb\u91cd\u903b\u8f91 (`x == nums[i - 1]`)**\uff1a\u82e5\u5f53\u524d\u6570\u4e0e\u524d\u4e00\u4e2a\u6570\u76f8\u540c\uff0c\u8bf4\u660e\u4ee5\u8be5\u6570\u503c\u5f00\u5934\u7684\u6240\u6709\u4e09\u5143\u7ec4\u5728\u4e0a\u4e00\u8f6e\u5faa\u73af\u4e2d**\u5df2\u7ecf\u5168\u90e8\u88ab\u627e\u9f50\u4e86**\uff0c\u76f4\u63a5\u8df3\u8fc7\uff08`continue`\uff09\uff0c\u907f\u514d\u751f\u6210\u91cd\u590d\u4e09\u5143\u7ec4\u3002\n\n---\n\n### 3. \u53cc\u5411\u6781\u7aef\u526a\u679d\u4f18\u5316 (Two-Way Extreme Pruning) \u2b50\n\n\u8fd9\u4e24\u5904\u526a\u679d\u662f\u9762\u8bd5\u4e0e\u7ade\u8d5b\u4e2d\u7684\u9ad8\u7ea7\u4f18\u5316\u6280\u5de7\uff0c\u80fd\u5927\u5e45\u51cf\u5c11\u4e0d\u5fc5\u8981\u7684\u53cc\u6307\u9488\u5faa\u73af\uff1a\n\n```python\n# Optimization 1: \u6700\u5c0f\u548c\u526a\u679d\nif x + nums[i + 1] + nums[i + 2] > 0:\n    break\n```\n\n* **[EN] Why `break`?**\n  * In a sorted array, `nums[i + 1]` and `nums[i + 2]` are the **smallest possible numbers** that can pair with `x`.\n  * If the sum of `x` with the smallest available numbers is already `> 0`, then any other pair $(nums[j], nums[k])$ where $j > i+1$ or $k > i+2$ will produce an even strictly larger sum ($> 0$).\n  * Furthermore, all future anchors $x' = nums[i+1]$ will be $\\ge x$, so their sums will also strictly exceed $0$.\n  * **Conclusion:** No further triplets sum to $0$ anywhere in the array. We can safely **terminate the entire loop immediately (`break`)**.\n* **[CN] \u4e3a\u4ec0\u4e48\u76f4\u63a5 `break`\uff1f**\n  * \u5728\u5347\u5e8f\u6570\u7ec4\u4e2d\uff0c`nums[i + 1]` \u548c `nums[i + 2]` \u662f\u80fd\u4e0e `x` \u642d\u914d\u7684**\u4e24\u4e2a\u6700\u5c0f\u7684\u6570**\u3002\n  * \u5982\u679c `x` \u52a0\u4e0a\u540e\u9762\u6700\u5c0f\u7684\u4e24\u4e2a\u6570\u4e4b\u548c\u90fd\u5927\u4e8e 0\uff0c\u90a3\u4e48\u642d\u914d\u540e\u9762\u4efb\u4f55\u66f4\u5927\u7684\u6570\uff0c\u548c\u5fc5\u7136\u4e5f\u90fd\u5927\u4e8e 0\u3002\n  * \u4e0d\u4ec5\u5982\u6b64\uff0c\u540e\u7eed\u6240\u6709\u7684\u57fa\u51c6\u6570 $x'$ \u90fd\u4f1a\u66f4\u5927\uff08$\\ge x$\uff09\uff0c\u4e09\u6570\u4e4b\u548c\u5fc5\u5b9a\u5168\u90e8\u5927\u4e8e 0\u3002\n  * **\u7ed3\u8bba**\uff1a\u540e\u7eed\u4e0d\u53ef\u80fd\u518d\u5b58\u5728\u4efb\u4f55\u548c\u4e3a 0 \u7684\u4e09\u5143\u7ec4\uff0c\u76f4\u63a5 **\u5f7b\u5e95\u7ec8\u6b62\u5916\u5c42\u5faa\u73af (`break`)**\u3002\n\n---\n\n```python\n# Optimization 2: \u6700\u5927\u548c\u526a\u679d\nif x + nums[-2] + nums[-1] < 0:\n    continue\n```\n\n* **[EN] Why `continue`?**\n  * `nums[-2]` and `nums[-1]` are the **largest possible numbers** in the entire array.\n  * If `x` added to the two largest numbers is still `< 0`, then `x` is too small to reach $0$ with **any** pair in the remaining array.\n  * However, a future anchor $x' = nums[i+1] > x$ might be large enough to achieve a sum of $0$.\n  * **Conclusion:** We cannot use this specific `x`, but future anchors might work. We skip only this `x` and move to the next iteration (**`continue`**).\n* **[CN] \u4e3a\u4ec0\u4e48\u4f7f\u7528 `continue`\uff1f**\n  * `nums[-2]` \u548c `nums[-1]` \u662f\u6574\u4e2a\u6570\u7ec4\u4e2d**\u4e24\u4e2a\u6700\u5927\u7684\u6570**\u3002\n  * \u5982\u679c `x` \u8fde\u52a0\u4e0a\u5168\u6570\u7ec4\u6700\u5927\u7684\u4e24\u4e2a\u6570\uff0c\u548c\u90fd\u4f9d\u7136\u5c0f\u4e8e 0\uff0c\u8bf4\u660e\u5f53\u524d\u8fd9\u4e2a `x` \u5b9e\u5728\u592a\u5c0f\u4e86\uff0c\u8ddf\u540e\u9762\u7684\u4efb\u4f55\u4e24\u6570\u642d\u914d\u90fd\u4e0d\u53ef\u80fd\u8fbe\u5230 0\u3002\n  * \u4f46\u540e\u9762\u7684\u57fa\u51c6\u6570 $x' = nums[i+1]$ \u4f1a\u66f4\u5927\uff0c\u540e\u7eed\u53ef\u80fd\u6709\u673a\u4f1a\u8fbe\u5230 0\u3002\n  * **\u7ed3\u8bba**\uff1a\u5f53\u524d `x` \u65e0\u6cd5\u51d1\u6210 0\uff0c\u4f46\u540e\u7eed\u66f4\u5927\u7684 `x'` \u4ecd\u6709\u53ef\u80fd\uff0c\u6240\u4ee5**\u4ec5\u8df3\u8fc7\u5f53\u524d\u8fd9\u8f6e\u5faa\u73af (`continue`)**\u3002\n\n---\n\n### 4. \u53cc\u6307\u9488\u626b\u63cf\u4e0e\u5185\u5c42\u53bb\u91cd (Two Pointers & Inner Deduplication)\n\n```python\nj = i + 1\nk = n - 1\nwhile j < k:\n    s = x + nums[j] + nums[k]\n    if s > 0:\n        k -= 1\n    elif s < 0:\n        j += 1\n    else:\n        result.append([x, nums[j], nums[k]])\n        j += 1\n        while j < k and nums[j] == nums[j - 1]:\n            j += 1\n        k -= 1\n        while k > j and nums[k] == nums[k + 1]:\n            k -= 1\n```\n\n* **[EN] Logic:**\n  * If $s > 0$: Sum is too large $\\rightarrow$ decrease by moving right pointer left: `k -= 1`.\n  * If $s < 0$: Sum is too small $\\rightarrow$ increase by moving left pointer right: `j += 1`.\n  * If $s == 0$: Found a valid triplet!\n    1. Append `[x, nums[j], nums[k]]` to `result`.\n    2. Move `j += 1`, then skip consecutive identical elements with `while j < k and nums[j] == nums[j - 1]: j += 1`.\n    3. Move `k -= 1`, then skip consecutive identical elements with `while k > j and nums[k] == nums[k + 1]: k -= 1`.\n* **[CN] \u903b\u8f91**\uff1a\n  * \u82e5 $s > 0$\uff1a\u548c\u504f\u5927 $\\rightarrow$ \u53f3\u6307\u9488\u5de6\u79fb\u4ee5\u51cf\u5c0f\u548c\uff1a`k -= 1`\u3002\n  * \u82e5 $s < 0$\uff1a\u548c\u504f\u5c0f $\\rightarrow$ \u5de6\u6307\u9488\u53f3\u79fb\u4ee5\u589e\u5927\u548c\uff1a`j += 1`\u3002\n  * \u82e5 $s == 0$\uff1a\u627e\u5230\u4e00\u7ec4\u6709\u6548\u89e3\uff01\n    1. \u5c06 `[x, nums[j], nums[k]]` \u52a0\u5165 `result`\u3002\n    2. \u5de6\u6307\u9488\u5148\u8d70\u4e00\u6b65 `j += 1`\uff0c\u968f\u540e\u5229\u7528 `while j < k and nums[j] == nums[j - 1]: j += 1` \u8df3\u8fc7\u6240\u6709\u4e0e\u524d\u4e00\u4e2a\u76f8\u540c\u7684\u5143\u7d20\u3002\n    3. \u53f3\u6307\u9488\u5148\u8d70\u4e00\u6b65 `k -= 1`\uff0c\u968f\u540e\u5229\u7528 `while k > j and nums[k] == nums[k + 1]: k -= 1` \u8df3\u8fc7\u6240\u6709\u4e0e\u540e\u4e00\u4e2a\u76f8\u540c\u7684\u5143\u7d20\u3002\n\n---\n\n## 4. Key Takeaways & Comparison / \u6838\u5fc3\u77e5\u8bc6\u70b9\u5bf9\u6bd4\n\n### Optimization 1 vs Optimization 2\n\n| \u526a\u679d\u7b56\u7565 | \u5224\u65ad\u6761\u4ef6 | \u8bed\u4e49\u5206\u6790 | \u6267\u884c\u52a8\u4f5c |\n| :--- | :--- | :--- | :---: |\n| **\u6700\u5c0f\u548c\u526a\u679d (Optimization 1)** | `x + nums[i+1] + nums[i+2] > 0` | \u5373\u4f7f\u642d\u914d**\u6700\u5c0f\u7684\u4e24\u6570**\u548c\u4f9d\u7136 $> 0$\uff0c\u540e\u7eed\u5fc5\u7136\u5168\u90e8 $> 0$ | **`break`** (\u5168\u505c) |\n| **\u6700\u5927\u548c\u526a\u679d (Optimization 2)** | `x + nums[-2] + nums[-1] < 0` | \u5373\u4f7f\u642d\u914d**\u6700\u5927\u7684\u4e24\u6570**\u548c\u4f9d\u7136 $< 0$\uff0c\u5f53\u524d `x` \u592a\u5c0f\u65e0\u89e3\uff0c\u4f46\u540e\u5e8f\u66f4\u5927\u7684 $x'$ \u4ecd\u6709\u53ef\u80fd | **`continue`** (\u8df3\u8fc7\u5f53\u524d) |\n\n---\n\n## 5. Complexity Analysis / \u590d\u6742\u5ea6\u5206\u6790\n\n* **\u65f6\u95f4\u590d\u6742\u5ea6 (Time Complexity):** $\\mathcal{O}(n^2)$\n  * \u6392\u5e8f\u65f6\u95f4\u4e3a $\\mathcal{O}(n \\log n)$\u3002\n  * \u5916\u5c42\u904d\u5386 $n$ \u4e2a\u6570\uff0c\u5185\u5c42\u53cc\u6307\u9488\u626b\u63cf\u6700\u591a $\\mathcal{O}(n)$ \u6b21\u3002\u52a0\u4e0a\u53cc\u5411\u6781\u7aef\u526a\u679d\u540e\uff0c\u5b9e\u9645\u8fd0\u884c\u65f6\u95f4\u4f1a\u663e\u8457\u4f4e\u4e8e\u5e38\u89c4 $\\mathcal{O}(n^2)$ \u89e3\u6cd5\u3002\n* **\u7a7a\u95f4\u590d\u6742\u5ea6 (Space Complexity):** $\\mathcal{O}(1)$ \u6216 $\\mathcal{O}(\\log n)$\n  * \u4e0d\u8ba1\u7528\u4e8e\u4fdd\u5b58\u8fd4\u56de\u7b54\u6848\u7684 `result` \u5217\u8868\uff0c\u7b97\u6cd5\u53ea\u4f7f\u7528\u4e86\u51e0\u4e2a\u6307\u9488\u53d8\u91cf\uff0c\u989d\u5916\u8f85\u52a9\u7a7a\u95f4\u4e3a $\\mathcal{O}(1)$\u3002\n  * Python \u7684 `sort()` (Timsort) \u9700\u8981 $\\mathcal{O}(\\log n) \\sim \\mathcal{O}(n)$ \u7684\u6808\u7a7a\u95f4\u3002\n"}, "top-100/s-lc-11-contain-with-most-water.md": {"title": "\ud83d\udd25 Top 100: Container With Most Water", "short": "LC 11", "path": "top-100/s-lc-11-contain-with-most-water.md", "content": "# LeetCode 11. Container With Most Water (\u76db\u6700\u591a\u6c34\u7684\u5bb9\u5668)\n## Step-by-Step Code Walkthrough & Notes / \u4ee3\u7801\u9010\u884c\u8be6\u89e3\u4e0e\u77e5\u8bc6\u70b9\u603b\u7ed3\n\n- **Difficulty:** Medium (\u7ecf\u5178\u5bf9\u649e\u53cc\u6307\u9488)\n- **Tags:** Array, Two Pointers, Greedy\n- **Corresponding Python File:** [`top-100/s-lc-11-contain-with-most-water.py`](file:///mnt/c/Users/steve/iCloudDrive/desktop/leetcode-sh/top-100/s-lc-11-contain-with-most-water.py)\n\n---\n\n## 1. Problem Statement / \u9898\u76ee\u63cf\u8ff0\n\n* **[EN]** You are given an integer array `height` of length `n`. There are `n` vertical lines drawn such that the two endpoints of the $i^{th}$ line are `(i, 0)` and `(i, height[i])`. Find two lines that together with the x-axis form a container, such that the container contains the most water. Return the maximum amount of water a container can store.\n* **[CN]** \u7ed9\u5b9a\u4e00\u4e2a\u957f\u5ea6\u4e3a `n` \u7684\u6574\u6570\u6570\u7ec4 `height` \u3002\u6709 `n` \u6761\u5782\u7ebf\uff0c\u7b2c `i` \u6761\u7ebf\u7684\u4e24\u4e2a\u7aef\u70b9\u662f `(i, 0)` \u548c `(i, height[i])` \u3002\u627e\u51fa\u5176\u4e2d\u7684\u4e24\u6761\u7ebf\uff0c\u4f7f\u5f97\u5b83\u4eec\u4e0e x \u8f74\u5171\u540c\u6784\u6210\u7684\u5bb9\u5668\u53ef\u4ee5\u5bb9\u7eb3\u6700\u591a\u7684\u6c34\u3002\u8fd4\u56de\u5bb9\u5668\u53ef\u4ee5\u50a8\u5b58\u7684\u6700\u5927\u6c34\u91cf\u3002\n\n---\n\n## 2. Code Implementation / \u4ee3\u7801\u5b9e\u73b0\n\n```python\nfrom typing import List\n\nclass Solution:\n    def maxArea(self, height: List[int]) -> int:\n        left = 0\n        right = len(height) - 1\n        result = 0\n\n        while left < right:\n            area = (right - left) * min(height[left], height[right])\n            result = max(result, area)\n\n            # \u8d2a\u5fc3\u7b56\u7565\uff1a\u79fb\u52a8\u8f83\u77ed\u677f\u7684\u90a3\u4e00\u4fa7\u6307\u9488\n            if height[left] < height[right]:\n                left += 1\n            else:\n                right -= 1\n\n        return result\n```\n\n---\n\n## 3. Core Intuition & Proof / \u8d2a\u5fc3\u4e0e\u53cc\u6307\u9488\u539f\u7406\n\n1. **\u5bb9\u5668\u5bb9\u79ef\u516c\u5f0f**\uff1a\n   $$\\text{Area} = (right - left) \\times \\min(height[left], height[right])$$\n2. **\u4e3a\u4ec0\u4e48\u79fb\u52a8\u8f83\u77ee\u7684\u677f\uff1f**\n   * \u65e0\u8bba\u79fb\u52a8 `left` \u8fd8\u662f `right`\uff0c\u5bbd\u5ea6 $(right - left)$ \u90fd\u4f1a\u51cf\u5c0f $1$\u3002\n   * **\u82e5\u79fb\u52a8\u8f83\u9ad8\u677f**\uff1a\u5bb9\u5668\u9ad8\u5ea6\u7531\u8f83\u77ee\u677f\u51b3\u5b9a\uff0c\u9ad8\u5ea6\u81f3\u591a\u4e0d\u53d8\u751a\u81f3\u53d8\u5c0f\uff0c\u5bbd\u5ea6\u53c8\u53d8\u7a84\uff0c**\u9762\u79ef\u5fc5\u7136\u4e25\u683c\u51cf\u5c0f**\u3002\n   * **\u82e5\u79fb\u52a8\u8f83\u77ee\u677f**\uff1a\u867d\u7136\u5bbd\u5ea6\u53d8\u5c0f\uff0c\u4f46\u65b0\u677f\u53ef\u80fd\u66f4\u9ad8\uff0c**\u9762\u79ef\u6709\u53ef\u80fd\u589e\u5927**\u3002\n   * \u56e0\u6b64\uff0c\u6bcf\u6b21\u820d\u5f03\u5e76\u79fb\u52a8\u8f83\u77ee\u7684\u4e00\u7aef\u662f\u6700\u4f18\u8d2a\u5fc3\u51b3\u7b56\u3002\n\n---\n\n## 4. Complexity Analysis / \u590d\u6742\u5ea6\u5206\u6790\n\n* **\u65f6\u95f4\u590d\u6742\u5ea6 (Time):** $\\mathcal{O}(n)$ \u2014\u2014 \u5de6\u53f3\u6307\u9488\u5411\u5185\u626b\u63cf\uff0c\u6bcf\u4e2a\u5143\u7d20\u6700\u591a\u8bbf\u95ee\u4e00\u6b21\u3002\n* **\u7a7a\u95f4\u590d\u6742\u5ea6 (Space):** $\\mathcal{O}(1)$ \u2014\u2014 \u4ec5\u4f7f\u7528\u5e38\u6570\u4e2a\u6307\u9488\u53d8\u91cf\u3002\n"}, "daily-practice/s-lc-3471.md": {"title": "\ud83d\udcc5 Daily: Largest Almost Missing Integer", "short": "LC 3471", "path": "daily-practice/s-lc-3471.md", "content": "# LeetCode 3471. Find the Largest Almost Missing Integer\n## Step-by-Step Code Walkthrough & Notes / \u4ee3\u7801\u9010\u884c\u8be6\u89e3\u4e0e\u77e5\u8bc6\u70b9\u603b\u7ed3\n\n- **Difficulty:** Easy\n- **Tags:** Array, Hash Table, Sliding Window, Math\n- **Corresponding Python File:** [`s-lc-3471.py`](file:///C:/Users/steve/ICloudDrive/desktop/leetcode-sh/s-lc-3471.py)\n\n---\n\n## 1. Problem Statement / \u9898\u76ee\u63cf\u8ff0\n\n* **[EN]** You are given an integer array `nums` and an integer `k`. An integer `x` is defined as **\"almost missing\"** if it appears in **exactly one** contiguous subarray of size `k`. Return the **largest** almost missing integer. If no such integer exists, return `-1`.\n* **[CN]** \u7ed9\u4f60\u4e00\u4e2a\u6574\u6570\u6570\u7ec4 `nums` \u548c\u4e00\u4e2a\u6574\u6570 `k`\u3002\u5982\u679c\u4e00\u4e2a\u6574\u6570 `x` \u5728 `nums` \u4e2d**\u6070\u597d\u51fa\u73b0\u5728 1 \u4e2a**\u957f\u5ea6\u4e3a `k` \u7684\u8fde\u7eed\u5b50\u6570\u7ec4\u4e2d\uff0c\u5219\u79f0 `x` \u4e3a**\u201c\u51e0\u4e4e\u7f3a\u5931\u7684\u6574\u6570\u201d**\u3002\u8fd4\u56de**\u6700\u5927\u7684**\u51e0\u4e4e\u7f3a\u5931\u6574\u6570\uff1b\u82e5\u4e0d\u5b58\u5728\uff0c\u8fd4\u56de `-1`\u3002\n\n---\n\n## 2. Step-by-Step Code Walkthrough / \u4ee3\u7801\u9010\u884c\u8be6\u89e3\n\n### \u65b9\u6848 1\uff1a\u5b9a\u957f\u6ed1\u52a8\u7a97\u53e3 + Set \u53bb\u91cd + Dict \u8ba1\u6570 (Fixed Sliding Window)\n\n```python\nclass Solution:\n    def largestInteger(self, nums: List[int], k: int) -> int:\n        window_counts = {}\n```\n\n* **[EN] Action:** Initializes an empty dictionary `window_counts = {}`.\n  * **Why `{}` instead of `[]`?** `{}` is a **Dictionary (Hash Map)** that stores `Key : Value` pairs (`number : window_count`). A List `[]` cannot map arbitrary integers to counts in $\\mathcal{O}(1)$ time.\n* **[CN] \u52a8\u4f5c**\uff1a\u521d\u59cb\u5316\u4e00\u4e2a\u7a7a\u5b57\u5178 `window_counts = {}`\u3002\n  * **\u4e3a\u4ec0\u4e48\u7528 `{}` \u800c\u4e0d\u7528 `[]`\uff1f** `{}` \u662f**\u5b57\u5178\uff08\u54c8\u5e0c\u8868\uff09**\uff0c\u7528\u4e8e\u4fdd\u5b58 `\u6570\u5b57 : \u51fa\u73b0\u7a97\u53e3\u6b21\u6570` \u7684\u952e\u503c\u5bf9\u6620\u5c04\u3002\u5217\u8868 `[]` \u65e0\u6cd5\u4ee5 $\\mathcal{O}(1)$ \u65f6\u95f4\u628a\u4efb\u610f\u6570\u5b57\u5f53\u4f5c Key \u8fdb\u884c\u9891\u6570\u7edf\u8ba1\u3002\n\n---\n\n```python\n        # Slide a fixed window of size k across nums\n        for i in range(len(nums) - k + 1):\n            current_window = nums[i : i + k]\n```\n\n* **[EN] Action:** Iterates from `i = 0` to `n - k`, cutting out each contiguous slice `nums[i : i + k]` of fixed size `k`.\n  * **Pattern Difference from `lc4` & `lc6`:** `lc4` and `lc6` use **dynamic (variable-size)** windows that expand/shrink with two pointers. LC 3471 uses a **fixed-size** window of length `k`.\n* **[CN] \u52a8\u4f5c**\uff1a\u904d\u5386\u6240\u6709\u8d77\u70b9 `i`\uff0c\u6bcf\u6b21\u622a\u53d6\u957f\u5ea6\u56fa\u5b9a\u4e3a `k` \u7684\u5b50\u6570\u7ec4 `nums[i : i + k]`\u3002\n  * **\u4e0e `lc4` / `lc6` \u7684\u533a\u522b**\uff1a`lc4` / `lc6` \u662f**\u53d8\u957f\u6ed1\u52a8\u7a97\u53e3**\uff0c\u5de6\u53f3\u6307\u9488\u6839\u636e\u6761\u4ef6\u52a8\u6001\u4f38\u7f29\uff1b\u800c\u672c\u9898\u662f**\u5b9a\u957f\u6ed1\u52a8\u7a97\u53e3**\uff0c\u7a97\u53e3\u957f\u5ea6\u59cb\u7ec8\u4e3a $k$\u3002\n\n---\n\n```python\n            # Use set() so that duplicate numbers inside the SAME window are only counted once\n            for num in set(current_window):\n                window_counts[num] = window_counts.get(num, 0) + 1\n```\n\n* **[EN] Action:** Converts the current window into a `set()` and increments the count for each unique number.\n  * **What is `set()` used for?** `set()` automatically **removes duplicates** within the current window. If a window is `[7, 2, 1, 7]`, `set` reduces it to `{1, 2, 7}` so that the number `7` is counted as appearing in this window only **once**.\n  * **What does `.get(num, 0)` do?** Returns the existing count if `num` is already in the dictionary; otherwise returns `0`.\n* **[CN] \u52a8\u4f5c**\uff1a\u5c06\u5f53\u524d\u7a97\u53e3\u8f6c\u4e3a\u96c6\u5408 `set()`\uff0c\u5e76\u8ba9\u5176\u4e2d\u6bcf\u4e2a\u4e0d\u540c\u5143\u7d20\u7684\u8ba1\u6570\u52a0 1\u3002\n  * **`set()` \u7684\u4f5c\u7528**\uff1a**\u81ea\u52a8\u53bb\u91cd**\u3002\u5982\u679c\u4e00\u4e2a\u7a97\u53e3\u662f `[7, 2, 1, 7]`\uff0c\u8f6c\u6210 `set` \u540e\u53d8\u6210 `{1, 2, 7}`\uff0c\u786e\u4fdd\u6570\u5b57 `7` \u5728\u8fd9\u4e00\u4e2a\u7a97\u53e3\u4e2d\u53ea\u88ab\u8ba1\u5165 1 \u6b21\u3002\n  * **`.get(num, 0)` \u7684\u4f5c\u7528**\uff1a\u5982\u679c `num` \u5df2\u7ecf\u5728\u5b57\u5178\u91cc\uff0c\u53d6\u5176\u65e7\u503c\uff1b\u5982\u679c\u4e0d\u5728\uff0c\u7ed9\u9ed8\u8ba4\u503c `0`\u3002\n\n---\n\n```python\n        # Find the largest number that appeared in EXACTLY 1 window\n        max_val = -1\n        for num, count in window_counts.items():\n            if count == 1:\n                max_val = max(max_val, num)\n                \n        return max_val\n```\n\n* **[EN] Action:** Scans the dictionary to find all numbers where `count == 1`, returning the maximum value. If no number has `count == 1`, returns the default `-1`.\n* **[CN] \u52a8\u4f5c**\uff1a\u904d\u5386\u5b57\u5178\u4e2d\u6240\u6709 `count == 1` \u7684\u5019\u9009\u6570\u5b57\uff0c\u53d6\u6700\u5927\u503c `max_val` \u8fd4\u56de\uff1b\u82e5\u6ca1\u6709\u4efb\u4f55\u6570\u5b57\u6ee1\u8db3\u6761\u4ef6\uff0c\u76f4\u63a5\u8fd4\u56de\u521d\u59cb\u503c `-1`\u3002\n\n---\n\n## 3. Key FAQs & Concept Clarifications / \u6838\u5fc3\u7b54\u7591\n\n### Q1: \u793a\u4f8b 1 \u4e2d `nums = [3, 9, 2, 1, 7], k = 3`\uff0c\u4e3a\u4ec0\u4e48\u7b54\u6848\u662f 7 \u800c\u4e0d\u662f 9\uff1f\n* **\u6240\u6709\u957f\u5ea6\u4e3a 3 \u7684\u7a97\u53e3\uff1a**\n  1. `[3, 9, 2]`\n  2. `[9, 2, 1]`\n  3. `[2, 1, 7]`\n* **\u7edf\u8ba1\u51fa\u73b0\u7a97\u53e3\u6570\uff1a**\n  * `9` \u51fa\u73b0\u5728\u4e86\u7a97\u53e3 1 \u548c\u7a97\u53e3 2 $\\rightarrow$ **\u51fa\u73b0 2 \u6b21** \u274c\uff08\u88ab\u6dd8\u6c70\uff0c\u4e0d\u7b26\u5408\u201c\u6070\u597d 1 \u6b21\u201d\uff09\n  * `3` \u51fa\u73b0\u5728\u7a97\u53e3 1 $\\rightarrow$ **\u51fa\u73b0 1 \u6b21** \u2705\n  * `7` \u51fa\u73b0\u5728\u7a97\u53e3 3 $\\rightarrow$ **\u51fa\u73b0 1 \u6b21** \u2705\n* \u5728\u7b26\u5408\u6761\u4ef6\u7684 `{3, 7}` \u4e2d\uff0c\u6700\u5927\u7684\u662f **`7`** ($\\max(3, 7) = 7$)\u3002\n\n---\n\n### Q2: \u4ec0\u4e48\u65f6\u5019\u4f1a\u8fd4\u56de `-1`\uff1f\n* \u5f53\u6570\u7ec4\u4e2d\u7684**\u6bcf\u4e00\u4e2a\u6570\u5b57**\u90fd\u51fa\u73b0\u5728 0 \u4e2a\u6216 $\\ge 2$ \u4e2a\u957f\u5ea6\u4e3a $k$ \u7684\u5b50\u6570\u7ec4\u4e2d\u65f6\u3002\n* **\u4f8b\u5982 `nums = [0, 0], k = 1`\uff1a** \u4e24\u4e2a\u957f\u5ea6\u4e3a 1 \u7684\u7a97\u53e3 `[0]` \u548c `[0]` \u90fd\u5305\u542b 0\uff0c\u6240\u4ee5 0 \u51fa\u73b0\u4e86 2 \u6b21\uff0c\u6ca1\u6709\u7b26\u5408\u201c\u6070\u597d 1 \u6b21\u201d\u7684\u6570\u5b57\uff0c\u8fd4\u56de **`-1`**\u3002\n\n---\n\n### Q3: \u53d8\u957f\u6ed1\u52a8\u7a97\u53e3 (`lc4`, `lc6`) vs \u5b9a\u957f\u6ed1\u52a8\u7a97\u53e3 (\u672c\u9898) \u7684\u5bf9\u6bd4\n\n| \u7ef4\u5ea6 | `lc4` (LC 3) / `lc6` (LC 209) | `lc3471` (Almost Missing) |\n| :--- | :--- | :--- |\n| **\u7a97\u53e3\u5927\u5c0f** | **\u53d8\u957f**\uff1a\u7a97\u53e3\u5927\u5c0f\u52a8\u6001\u6539\u53d8 | **\u5b9a\u957f**\uff1a\u56fa\u5b9a\u4e3a $k$ |\n| **\u6c42\u89e3\u76ee\u6807** | \u6c42\u89e3\u6700\u957f/\u6700\u77ed\u7684**\u7a97\u53e3\u957f\u5ea6**\uff08`max_len` / `min_len`\uff09 | \u7edf\u8ba1\u843d\u5728\u7a97\u53e3\u5185\u7684**\u6570\u5b57\u9891\u6570** |\n| **\u6307\u9488\u79fb\u52a8** | `left` \u548c `right` \u6839\u636e\u6761\u4ef6\u52a8\u6001\u4f38\u7f29 | \u6bcf\u6b21\u6574\u4f53\u5e73\u79fb $k$ \u957f\u5ea6\u7684\u5207\u7247 |\n\n---\n\n## 4. \u65b9\u6848 2\uff1a$\\mathcal{O}(n)$ \u6700\u4f18\u6570\u5b66\u5206\u7c7b\u8ba8\u8bba (Optimal Math Approach)\n\n\u901a\u8fc7\u6570\u5b66\u63a8\u5bfc\uff0c\u4efb\u4f55\u5185\u90e8\u5143\u7d20\uff08$0 < i < n - 1$\uff09\u5728 $1 < k < n$ \u65f6\u5fc5\u7136\u88ab\u81f3\u5c11 2 \u4e2a\u7a97\u53e3\u8986\u76d6\u3002\u56e0\u6b64\u53ea\u6709\u4e24\u7aef\u5143\u7d20\u624d\u53ef\u80fd\u662f\u7b54\u6848\uff1a\n\n```python\nclass SolutionOptimal:\n    def largestInteger(self, nums: List[int], k: int) -> int:\n        n = len(nums)\n        freq = Counter(nums)\n        \n        # Case 1: k == 1 -> \u8fd4\u56de\u5168\u5c40\u53ea\u51fa\u73b0 1 \u6b21\u7684\u6700\u5927\u5143\u7d20\n        if k == 1:\n            unique_nums = [x for x, c in freq.items() if c == 1]\n            return max(unique_nums) if unique_nums else -1\n        \n        # Case 2: k == n -> \u6574\u4e2a\u6570\u7ec4\u5c31\u662f\u552f\u4e00\u7684\u7a97\u53e3\uff0c\u8fd4\u56de\u6700\u5927\u5143\u7d20\n        if k == n:\n            return max(nums)\n        \n        # Case 3: 1 < k < n -> \u53ea\u6709 nums[0] \u548c nums[-1] \u53ef\u80fd\u662f\u5019\u9009\n        candidates = []\n        if freq[nums[0]] == 1:\n            candidates.append(nums[0])\n        if freq[nums[-1]] == 1:\n            candidates.append(nums[-1])\n            \n        return max(candidates) if candidates else -1\n```\n\n---\n\n## 5. Complexity Analysis / \u590d\u6742\u5ea6\u5206\u6790\n\n* **\u5b9a\u957f\u6ed1\u52a8\u7a97\u53e3\u6cd5 (Method 1):**\n  * **\u65f6\u95f4\u590d\u6742\u5ea6 (Time):** $\\mathcal{O}(n \\times k)$ \u2014 \u904d\u5386 $n - k + 1$ \u4e2a\u7a97\u53e3\uff0c\u6bcf\u4e2a\u7a97\u53e3\u5207\u7247\u53ca\u8f6c set \u9700\u8981 $\\mathcal{O}(k)$\u3002\n  * **\u7a7a\u95f4\u590d\u6742\u5ea6 (Space):** $\\mathcal{O}(n)$ \u2014 \u54c8\u5e0c\u8868\u5b58\u50a8\u4e0d\u540c\u5143\u7d20\u9891\u6570\u3002\n* **\u6570\u5b66\u5206\u7c7b\u8ba8\u8bba\u6cd5 (Method 2):**\n  * **\u65f6\u95f4\u590d\u6742\u5ea6 (Time):** $\\mathcal{O}(n)$ \u2014 \u4ec5\u9700\u4e00\u6b21\u7ebf\u6027\u626b\u63cf\u7edf\u8ba1\u9891\u6570\u3002\n  * **\u7a7a\u95f4\u590d\u6742\u5ea6 (Space):** $\\mathcal{O}(n)$ \u2014 \u5b58\u50a8\u9891\u6570\u54c8\u5e0c\u8868\u3002\n"}, "daily-practice/s-lc-3090.md": {"title": "\ud83d\udcc5 Daily: Maximum Length Substring With <= 2", "short": "LC 3090", "path": "daily-practice/s-lc-3090.md", "content": "# LeetCode 3090. Maximum Length Substring With at Most Two Occurrences\n## Step-by-Step Code Walkthrough & Notes / \u4ee3\u7801\u9010\u884c\u8be6\u89e3\u4e0e\u77e5\u8bc6\u70b9\u603b\u7ed3\n\n- **Difficulty:** Easy (\u6ed1\u52a8\u7a97\u53e3\u9891\u6570\u7edf\u8ba1)\n- **Tags:** Hash Table, String, Sliding Window\n- **Corresponding Python File:** [`daily-practice/s-lc-3090.py`](file:///mnt/c/Users/steve/iCloudDrive/desktop/leetcode-sh/daily-practice/s-lc-3090.py)\n\n---\n\n## 1. Problem Statement / \u9898\u76ee\u63cf\u8ff0\n\n* **[EN]** Given a string `s`, return the **maximum length** of a substring such that each character in the substring appears **at most twice**.\n* **[CN]** \u7ed9\u4f60\u4e00\u4e2a\u5b57\u7b26\u4e32 `s` \uff0c\u8bf7\u627e\u51fa\u6ee1\u8db3\u6bcf\u4e2a\u5b57\u7b26 **\u6700\u591a\u51fa\u73b0\u4e24\u6b21** \u7684\u6700\u957f\u5b50\u5b57\u7b26\u4e32\uff0c\u5e76\u8fd4\u56de\u8be5\u5b50\u5b57\u7b26\u4e32\u7684 **\u6700\u5927\u957f\u5ea6** \u3002\n\n---\n\n## 2. Code Implementation / \u4ee3\u7801\u5b9e\u73b0\n\n```python\nclass Solution:\n    def maximumLengthSubstring(self, s: str) -> int:\n        right = 0\n        left = 0\n        counts = {}\n        max_len = 0\n\n        while right < len(s):\n            # \u5f53\u53f3\u7aef\u5b57\u7b26\u5df2\u7ecf\u51fa\u73b0\u4e86 2 \u6b21\uff0c\u52a0\u5165\u65b0\u5b57\u7b26\u5c31\u4f1a\u8d85\u6807 (\u8fbe\u5230 3 \u6b21)\n            # \u56e0\u6b64\u5fc5\u987b\u6536\u7f29\u5de6\u8fb9\u754c\uff0c\u76f4\u5230\u8be5\u5b57\u7b26\u9891\u6570\u51cf\u5c11\n            if counts.get(s[right], 0) == 2:\n                counts[s[left]] -= 1\n                left += 1\n            else:\n                counts[s[right]] = counts.get(s[right], 0) + 1\n                max_len = max(max_len, right - left + 1)\n                right += 1\n\n        return max_len\n```\n\n---\n\n## 3. Step-by-Step Walkthrough / \u9010\u6b65\u6838\u5fc3\u903b\u8f91\n\n1. **\u53d8\u957f\u6ed1\u52a8\u7a97\u53e3**\uff1a\u7ef4\u62a4\u5de6\u53f3\u6307\u9488 `left` \u548c `right` \u4ee5\u53ca\u5b57\u7b26\u9891\u6570\u54c8\u5e0c\u8868 `counts`\u3002\n2. **\u5408\u6cd5\u72b6\u6001\u6269\u5f20**\uff1a\u5f53 `counts.get(s[right], 0) < 2` \u65f6\uff0c\u5c06\u5b57\u7b26\u9891\u6570\u52a0 1\uff0c\u66f4\u65b0\u6700\u957f\u957f\u5ea6 `max_len = max(max_len, right - left + 1)`\uff0c\u5e76\u5c06 `right += 1`\u3002\n3. **\u8d85\u6807\u72b6\u6001\u6536\u7f29**\uff1a\u5f53 `counts.get(s[right], 0) == 2` \u65f6\uff0c\u5f53\u524d\u5b57\u7b26\u4e0d\u80fd\u518d\u52a0\u5165\u7a97\u53e3\u3002\u901a\u8fc7\u4e0d\u65ad\u4ece\u5de6\u7aef\u79fb\u51fa\u5b57\u7b26\uff08`counts[s[left]] -= 1; left += 1`\uff09\uff0c\u76f4\u5230\u5f53\u524d\u5b57\u7b26\u53ef\u4ee5\u5408\u6cd5\u52a0\u5165\u3002\n\n---\n\n## 4. Complexity Analysis / \u590d\u6742\u5ea6\u5206\u6790\n\n* **\u65f6\u95f4\u590d\u6742\u5ea6 (Time):** $\\mathcal{O}(n)$ \u2014\u2014 \u6bcf\u4e2a\u5b57\u7b26\u6700\u591a\u88ab `right` \u8bbf\u95ee\u4e00\u6b21\uff0c\u88ab `left` \u79fb\u51fa\u4e00\u6b21\u3002\n* **\u7a7a\u95f4\u590d\u6742\u5ea6 (Space):** $\\mathcal{O}(|\\Sigma|)$ \u2014\u2014 \u54c8\u5e0c\u8868\u6700\u591a\u5b58\u50a8 26 \u4e2a\u5c0f\u5199\u82f1\u6587\u5b57\u6bcd\uff0c\u7a7a\u95f4\u5f00\u9500\u4e3a $\\mathcal{O}(1)$\u3002\n"}, "daily-practice/s-lc-2029.md": {"title": "\ud83d\udcc5 Daily: Stone Game IX", "short": "LC 2029", "path": "daily-practice/s-lc-2029.md", "content": "Here is the bilingual Markdown file for the step-by-step code explanation. You can copy this and save it as a `.md` file.\n\n```markdown\n# LeetCode 2029. Stone Game IX \n## Step-by-Step Code Walkthrough / \u4ee3\u7801\u9010\u884c\u8be6\u89e3\n\n### 1. Initializing Counters (\u521d\u59cb\u5316\u8ba1\u6570\u5668)\n```python\ncnt0 = cnt1 = cnt2 = 0\n\n```\n\n* **[EN] Action:** Creates three variables initialized to 0.\n**Purpose:** Tracks the count of stones with remainders 0, 1, and 2 when divided by 3. Since the goal is to avoid sums divisible by 3, the exact values don't matter, only their remainders.\n* **[CN] \u52a8\u4f5c**\uff1a\u521b\u5efa\u4e86\u4e09\u4e2a\u53d8\u91cf\uff0c\u521d\u59cb\u503c\u90fd\u8bbe\u4e3a 0\u3002\n**\u76ee\u7684**\uff1a\u5206\u522b\u7528\u6765\u7edf\u8ba1\u9664\u4ee5 3 \u4f59\u6570\u5206\u522b\u4e3a 0\u30011\u30012 \u7684\u77f3\u5934\u7684\u6570\u91cf\u3002\u56e0\u4e3a\u6e38\u620f\u7684\u6838\u5fc3\u662f\u4e0d\u8ba9\u603b\u548c\u88ab 3 \u6574\u9664\uff0c\u6240\u4ee5\u77f3\u5934\u7684\u5177\u4f53\u9762\u503c\u4e0d\u91cd\u8981\uff0c\u4f59\u6570\u624d\u91cd\u8981\u3002\n\n---\n\n### 2. Categorizing Stones (\u904d\u5386\u77f3\u5934\u5e76\u5206\u7c7b)\n\n```python\nfor val in stones:\n    rem = val % 3\n    if rem == 0:\n        cnt0 += 1\n    elif rem == 1:\n        cnt1 += 1\n    else:\n        cnt2 += 1\n\n```\n\n* **[EN] Action:** Loops through each stone (`val`) in the `stones` array.\n**Math:** `rem = val % 3` calculates the remainder of the stone's value divided by 3.\n**Sorting:** The `if...elif...else` block categorizes the stones into their respective \"buckets\" (`cnt0`, `cnt1`, or `cnt2`) based on the remainder.\n* **[CN] \u52a8\u4f5c**\uff1a\u904d\u5386\u6570\u7ec4 `stones` \u4e2d\u7684\u6bcf\u4e00\u5757\u77f3\u5934\uff08`val`\uff09\u3002\n**\u8ba1\u7b97**\uff1a`rem = val % 3` \u8ba1\u7b97\u8fd9\u5757\u77f3\u5934\u7684\u9762\u503c\u9664\u4ee5 3 \u7684\u4f59\u6570\u3002\n**\u5206\u62e3**\uff1a`if...elif...else` \u8bed\u53e5\u6839\u636e\u4f59\u6570\u628a\u77f3\u5934\u653e\u8fdb\u5bf9\u5e94\u7684\u201c\u6876\u201d\u91cc\uff08\u4f59\u6570\u4e3a0\u589e\u52a0`cnt0`\uff0c\u4f59\u6570\u4e3a1\u589e\u52a0`cnt1`\uff0c\u4f59\u6570\u4e3a2\u589e\u52a0`cnt2`\uff09\u3002\n\n---\n\n### 3. Handling Even 0s (\u5904\u7406\u5076\u6570\u4e2a 0 \u7684\u60c5\u51b5)\n\n```python\nif cnt0 % 2 == 0:\n    return cnt1 >= 1 and cnt2 >= 1\n\n```\n\n* **[EN] Logic:** `cnt0 % 2 == 0` checks if the number of remainder-0 stones (\"skip turn\" cards) is even.\n**Game Theory:** If even, Alice playing a 0 is immediately countered by Bob playing a 0. They cancel out, maintaining Alice's first-mover advantage.\n**Conclusion:** With the advantage kept, Alice wins (`True`) as long as the pool has at least one `1` AND at least one `2` to start the game safely. If she lacks either, she eventually traps herself (`False`).\n* **[CN] \u5224\u65ad\u903b\u8f91**\uff1a`cnt0 % 2 == 0` \u7528\u6765\u68c0\u67e5\u4f59\u6570\u4e3a 0 \u7684\u77f3\u5934\uff08\u76f8\u5f53\u4e8e\u201c\u8df3\u8fc7\u56de\u5408\u201d\u724c\uff09\u7684\u6570\u91cf\u662f\u4e0d\u662f\u5076\u6570\u3002\n**\u535a\u5f08\u5206\u6790**\uff1a\u5982\u679c\u662f\u5076\u6570\uff0cAlice \u62ff\u4e00\u4e2a 0\uff0cBob \u4e5f\u4f1a\u8ddf\u7740\u62ff\u4e00\u4e2a 0\uff0c\u5b83\u4eec\u7684\u4f5c\u7528\u521a\u597d\u76f8\u4e92\u62b5\u6d88\u4e86\u3002\u6b64\u65f6\uff0c\u539f\u672c\u5c31\u5148\u51fa\u624b\u7684 Alice \u4fdd\u7559\u4e86\u5979\u7684\u5148\u624b\u4f18\u52bf\u3002\n**\u7ed3\u8bba**\uff1a\u5728\u8fd9\u79cd\u60c5\u51b5\u4e0b\uff0c\u53ea\u8981\u6c60\u5b50\u91cc\u81f3\u5c11\u6709\u4e00\u4e2a 1 \u4e14\u81f3\u5c11\u6709\u4e00\u4e2a 2\uff08\u786e\u4fdd\u5f00\u5c40\u6709\u724c\u53ef\u6253\uff09\uff0cAlice \u5c31\u80fd\u83b7\u80dc\uff1b\u5982\u679c\u7f3a\u4e86\u67d0\u79cd\u77f3\u5934\uff0cAlice \u5fc5\u8f93\u3002\n\n---\n\n### 4. Handling Odd 0s (\u5904\u7406\u5947\u6570\u4e2a 0 \u7684\u60c5\u51b5)\n\n```python\nreturn abs(cnt1 - cnt2) > 2\n\n```\n\n* **[EN] Logic:** If the code reaches here, `cnt0` is guaranteed to be odd.\n**Game Theory:** An odd number of 0s causes a permanent turn reversal. A losing move that Bob would have been forced to make now falls on Alice. Bob gains the advantage.\n**Conclusion:** To overcome this massive disadvantage, Alice must rely on a huge imbalance between 1s and 2s. She wins (`True`) only if the absolute difference (`abs`) between `cnt1` and `cnt2` is strictly greater than 2, allowing her to exhaust one type of stone and corner Bob.\n* **[CN] \u5224\u65ad\u903b\u8f91**\uff1a\u5982\u679c\u4ee3\u7801\u8fd0\u884c\u5230\u4e86\u6700\u540e\u8fd9\u4e00\u884c\uff0c\u8bf4\u660e `cnt0` \u80af\u5b9a\u662f\u5947\u6570\u3002\n**\u535a\u5f08\u5206\u6790**\uff1a\u5947\u6570\u4e2a 0 \u4f1a\u5bfc\u81f4\u56de\u5408\u987a\u5e8f\u53d1\u751f\u4e00\u6b21\u6839\u672c\u6027\u7684\u53cd\u8f6c\uff0c\u539f\u672c\u8f6e\u5230 Bob \u88ab\u903c\u4e0a\u7edd\u8def\u7684\u4e00\u6b65\uff0c\u73b0\u5728\u53d8\u6210 Alice \u53bb\u8d70\u4e86\uff0c\u4f18\u52bf\u88ab\u9001\u7ed9\u4e86 Bob\u3002\n**\u7ed3\u8bba**\uff1a\u5728\u8fd9\u79cd\u6781\u7aef\u52a3\u52bf\u4e0b\uff0cAlice \u60f3\u9006\u98ce\u7ffb\u76d8\u5c31\u5fc5\u987b\u5229\u7528 1 \u548c 2 \u6570\u91cf\u4e0a\u7684\u5de8\u5927\u60ac\u6b8a\u3002\u8fd9\u8981\u6c42 `cnt1` \u548c `cnt2` \u7684\u6570\u91cf\u5dee\u7684\u7edd\u5bf9\u503c\uff08`abs`\uff09\u5fc5\u987b\u4e25\u683c\u5927\u4e8e 2\u3002\u6ee1\u8db3\u6761\u4ef6\u5219\u8d62\uff0c\u5426\u5219\u8f93\u3002\n"}, "daily-practice/leetcode_2029_stone_game_ix.md": {"title": "\ud83d\udcc5 Daily: Stone Game IX Deep Dive", "short": "LC 2029 Math", "path": "daily-practice/leetcode_2029_stone_game_ix.md", "content": "# LeetCode 2029: Stone Game IX\n\n- **Difficulty:** Medium\n- **Tags:** Game Theory, Math, Greedy, Array\n- **Video Reference:** [Leetcode Daily - 2029. Stone Game IX](https://www.youtube.com/watch?v=4MRFDQtxGTk)\n\n---\n\n## Problem Statement\n\nAlice and Bob play a game with an array of positive integers `stones`.\n- Alice goes first.\n- On each turn, a player chooses and removes a stone.\n- If the **sum of all removed stones is divisible by 3**, the player who made that move **loses immediately**.\n- If all stones are removed and the sum was never divisible by 3, **Bob wins**.\n- Both players play optimally. Return `true` if Alice wins, or `false` if Bob wins.\n\n---\n\n## Key Game Theory Insights\n\n### 1. Modulo 3 Equivalence\nThe absolute values of stones do not matter, only their remainder modulo 3:\n- **Type 0:** `val % 3 == 0`\n- **Type 1:** `val % 3 == 1`\n- **Type 2:** `val % 3 == 2`\n\nCount the occurrences of each: `cnt0`, `cnt1`, and `cnt2`.\n\n### 2. The Role of Type 0 (\"Turn Skippers\")\n- Playing a Type 0 stone adds 0 to the sum modulo 3, maintaining the current valid sum state while flipping whose turn it is.\n- **Even number of Type 0 stones (`cnt0 % 2 == 0`):**\n  - Pairs of Type 0 stones cancel each other out.\n  - Alice wins if and only if she has both Type 1 and Type 2 stones available to start and steer the game:\n    $$\\text{cnt0} \\pmod 2 == 0 \\implies \\text{cnt1} \\ge 1 \\land \\text{cnt2} \\ge 1$$\n- **Odd number of Type 0 stones (`cnt0 % 2 == 1`):**\n  - Leaves 1 net turn skip, which flips the parity of the game.\n  - Alice needs a large imbalance between Type 1 and Type 2 stones to overwhelm Bob and force him into an invalid sum:\n    $$\\text{cnt0} \\pmod 2 == 1 \\implies |\\text{cnt1} - \\text{cnt2}| > 2$$\n\n---\n\n## Code Implementations\n\n### Python 3\n\n```python\nclass Solution:\n    def stoneGameIX(self, stones: list[int]) -> bool:\n        cnt0 = cnt1 = cnt2 = 0\n        for val in stones:\n            rem = val % 3\n            if rem == 0:\n                cnt0 += 1\n            elif rem == 1:\n                cnt1 += 1\n            else:\n                cnt2 += 1\n\n        if cnt0 % 2 == 0:\n            return cnt1 >= 1 and cnt2 >= 1\n        return abs(cnt1 - cnt2) > 2\n```\n\n### Java\n\n```java\nclass Solution {\n    public boolean stoneGameIX(int[] stones) {\n        int cnt0 = 0, cnt1 = 0, cnt2 = 0;\n        for (int val : stones) {\n            int rem = val % 3;\n            if (rem == 0) cnt0++;\n            else if (rem == 1) cnt1++;\n            else cnt2++;\n        }\n\n        if (cnt0 % 2 == 0) {\n            return cnt1 >= 1 && cnt2 >= 1;\n        }\n        return Math.abs(cnt1 - cnt2) > 2;\n    }\n}\n```\n\n### C++\n\n```cpp\n#include <vector>\n#include <cmath>\n\nclass Solution {\npublic:\n    bool stoneGameIX(std::vector<int>& stones) {\n        int cnt0 = 0, cnt1 = 0, cnt2 = 0;\n        for (int val : stones) {\n            int rem = val % 3;\n            if (rem == 0) cnt0++;\n            else if (rem == 1) cnt1++;\n            else cnt2++;\n        }\n\n        if (cnt0 % 2 == 0) {\n            return cnt1 >= 1 && cnt2 >= 1;\n        }\n        return std::abs(cnt1 - cnt2) > 2;\n    }\n};\n```\n\n### JavaScript / TypeScript\n\n```javascript\n/**\n * @param {number[]} stones\n * @return {boolean}\n */\nvar stoneGameIX = function(stones) {\n    let cnt0 = 0, cnt1 = 0, cnt2 = 0;\n    for (const val of stones) {\n        const rem = val % 3;\n        if (rem === 0) cnt0++;\n        else if (rem === 1) cnt1++;\n        else cnt2++;\n    }\n\n    if (cnt0 % 2 === 0) {\n        return cnt1 >= 1 && cnt2 >= 1;\n    }\n    return Math.abs(cnt1 - cnt2) > 2;\n};\n```\n\n---\n\n## Complexity Analysis\n\n- **Time Complexity:** $\\mathcal{O}(N)$ \u2014 Linear scan over the stones array.\n- **Space Complexity:** $\\mathcal{O}(1)$ \u2014 Constant space (3 integer counters).\n"}};
