<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LeetCode-SH</title>
  <!-- Marked for Markdown Rendering -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <!-- Highlight.js for Syntax Highlighting -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/python.min.js"></script>
  <!-- KaTeX for Math Formulas -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
  <style>
    :root {
      --bg-main: #0d1117;
      --bg-sidebar: #161b22;
      --bg-panel: #0d1117;
      --border-color: #30363d;
      --border-subtle: #21262d;
      --text-main: #c9d1d9;
      --text-bright: #f0f6fc;
      --text-muted: #8b949e;
      --accent: #58a6ff;
      --accent-hover: #1f6feb;
      --card-bg: #1c2128;
      --code-bg: #161b22;
      --diff-easy: #3fb950;
      --diff-medium: #d29922;
      --diff-hard: #f85149;
      --sidebar-width: 320px;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    /* Modern Minimalist Dark Theme Scrollbars (Fits Total Document Length) */
    ::-webkit-scrollbar {
      width: 7px;
      height: 7px;
      background-color: transparent;
    }
    ::-webkit-scrollbar-track {
      background-color: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background-color: rgba(139, 148, 158, 0.28);
      border-radius: 6px;
      border: 1px solid transparent;
      background-clip: padding-box;
      transition: background-color 0.2s ease;
    }
    ::-webkit-scrollbar-thumb:hover {
      background-color: rgba(139, 148, 158, 0.55);
    }
    /* Firefox */
    * {
      scrollbar-width: thin;
      scrollbar-color: rgba(139, 148, 158, 0.28) transparent;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Mobile Backdrop */
    #sidebar-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background-color: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(3px);
      z-index: 990;
      opacity: 0;
      transition: opacity 0.25s ease;
    }
    #sidebar-backdrop.active {
      display: block;
      opacity: 1;
    }

    /* Left Sidebar Navigation (Tree Explorer) */
    #sidebar {
      width: var(--sidebar-width);
      min-width: 220px;
      max-width: 650px;
      background-color: var(--bg-sidebar);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      height: 100%;
      position: relative;
      flex-shrink: 0;
      z-index: 20;
      transition: width 0.2s cubic-bezier(0.4, 0, 0.2, 1), margin-left 0.2s cubic-bezier(0.4, 0, 0.2, 1), transform 0.25s ease;
    }
    #sidebar.collapsed {
      width: 0 !important;
      min-width: 0 !important;
      max-width: 0 !important;
      margin-left: 0;
      border-right: none;
      overflow: hidden;
      pointer-events: none;
    }
    #sidebar.collapsed > * {
      display: none !important;
    }

    /* Resizer Handle */
    .resizer {
      position: absolute;
      top: 0;
      right: -3px;
      width: 6px;
      height: 100%;
      cursor: col-resize;
      z-index: 30;
      transition: background-color 0.15s;
    }
    .resizer:hover, .resizer.dragging {
      background-color: var(--accent);
    }

    /* Sidebar Header */
    .sidebar-header {
      padding: 12px 14px 8px;
      border-bottom: 1px solid var(--border-color);
    }
    .header-brand {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .brand-title {
      font-size: 13.5px;
      font-weight: 700;
      color: var(--text-bright);
      display: flex;
      align-items: center;
      gap: 7px;
      user-select: none;
    }
    .brand-icon {
      font-size: 15px;
    }
    .progress-badge {
      font-size: 11px;
      padding: 2px 7px;
      background: rgba(56, 139, 253, 0.12);
      border: 1px solid rgba(88, 166, 255, 0.25);
      border-radius: 10px;
      color: var(--accent);
      font-weight: 600;
      white-space: nowrap;
    }
    .search-box-wrapper {
      position: relative;
      margin-bottom: 2px;
    }
    .search-box {
      width: 100%;
      padding: 6px 26px 6px 28px;
      background-color: var(--bg-main);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: #fff;
      font-size: 12px;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .search-box:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(88, 166, 255, 0.2);
    }
    .search-icon {
      position: absolute;
      left: 8px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 11px;
      pointer-events: none;
    }
    .search-clear-btn {
      position: absolute;
      right: 7px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 11px;
      cursor: pointer;
      display: none;
      padding: 2px;
      line-height: 1;
    }
    .search-clear-btn:hover {
      color: #fff;
    }

    /* Explorer Bar (Header for Tree) */
    .explorer-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 14px 6px;
      border-bottom: 1px solid var(--border-subtle);
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 0.5px;
      user-select: none;
    }
    .explorer-actions {
      display: flex;
      gap: 4px;
    }
    .icon-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      font-size: 12px;
      cursor: pointer;
      padding: 2px 5px;
      border-radius: 4px;
      line-height: 1;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .icon-btn:hover {
      background: rgba(177, 186, 196, 0.12);
      color: var(--text-bright);
      border-color: var(--border-color);
    }

    /* Tree View Container */
    .tree-container {
      flex: 1;
      overflow-y: auto;
      padding: 6px 8px 20px;
    }
    .tree-folder {
      margin-bottom: 2px;
    }
    .tree-folder-header {
      display: flex;
      align-items: center;
      padding: 5px 8px;
      border-radius: 6px;
      cursor: pointer;
      user-select: none;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      transition: background-color 0.15s, color 0.15s;
      gap: 6px;
    }
    .tree-folder-header:hover {
      background-color: rgba(177, 186, 196, 0.08);
      color: var(--text-bright);
    }
    .tree-chevron {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 12px;
      color: var(--text-muted);
      transition: transform 0.15s cubic-bezier(0.4, 0, 0.2, 1);
      flex-shrink: 0;
    }
    .tree-folder.collapsed .tree-chevron {
      transform: rotate(-90deg);
    }
    .tree-folder-icon, .tree-file-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      color: var(--text-muted);
    }
    .tree-file-icon.code-icon {
      color: #58a6ff;
    }
    .tree-file-icon.doc-icon {
      color: #8b949e;
    }
    .pane-svg {
      color: var(--accent);
      vertical-align: middle;
      margin-right: 4px;
    }
    .tree-folder-name {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .tree-count-badge {
      font-size: 10px;
      padding: 1px 6px;
      border-radius: 10px;
      background: var(--card-bg);
      border: 1px solid var(--border-subtle);
      color: var(--text-muted);
      font-weight: 500;
      flex-shrink: 0;
    }
    .tree-children {
      position: relative;
      margin-left: 13px;
      padding-left: 6px;
      border-left: 1px solid rgba(240, 246, 252, 0.08);
      transition: all 0.2s ease-out;
    }
    .tree-folder.collapsed .tree-children {
      display: none;
    }

    /* Tree Node / Nav Item */
    .nav-item {
      display: flex;
      align-items: center;
      padding: 5px 8px;
      border-radius: 5px;
      color: var(--text-main);
      text-decoration: none;
      font-size: 12px;
      cursor: pointer;
      margin-bottom: 1px;
      transition: all 0.15s ease;
      gap: 6px;
      position: relative;
    }
    .nav-item:hover {
      background-color: rgba(177, 186, 196, 0.12);
      color: var(--text-bright);
    }
    .nav-item.active {
      background-color: rgba(56, 139, 253, 0.15);
      color: var(--accent);
      font-weight: 600;
    }
    .tree-title {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .tree-diff-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
      margin-left: auto;
    }
    .diff-Easy { background-color: var(--diff-easy); }
    .diff-Medium { background-color: var(--diff-medium); }
    .diff-Hard { background-color: var(--diff-hard); }
    .diff-All { display: none; }

    /* Main Workspace Container */
    #main-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      background-color: var(--bg-main);
      min-width: 0;
    }

    /* Top Toolbar */
    .top-toolbar {
      height: 46px;
      min-height: 46px;
      background-color: var(--bg-sidebar);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      gap: 12px;
      z-index: 10;
    }
    .toolbar-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      flex: 1;
    }
    .toggle-sidebar-btn {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      width: 28px;
      height: 28px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.15s;
    }
    .toggle-sidebar-btn:hover {
      background: rgba(177, 186, 196, 0.12);
      color: #fff;
      border-color: var(--accent);
    }
    .breadcrumb {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 12.5px;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .breadcrumb-folder {
      color: var(--text-muted);
    }
    .breadcrumb-sep {
      color: var(--text-muted);
      opacity: 0.5;
      font-size: 11px;
    }
    .breadcrumb-file {
      font-weight: 600;
      color: var(--text-bright);
    }
    .diff-badge {
      font-size: 10.5px;
      padding: 1px 7px;
      border-radius: 10px;
      font-weight: 600;
      margin-left: 4px;
    }
    .diff-badge.diff-Easy { background: rgba(63, 185, 80, 0.15); color: var(--diff-easy); border: 1px solid rgba(63, 185, 80, 0.3); }
    .diff-badge.diff-Medium { background: rgba(210, 153, 34, 0.15); color: var(--diff-medium); border: 1px solid rgba(210, 153, 34, 0.3); }
    .diff-badge.diff-Hard { background: rgba(248, 81, 73, 0.15); color: var(--diff-hard); border: 1px solid rgba(248, 81, 73, 0.3); }

    /* Toolbar Right Controls */
    .toolbar-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .segmented-control {
      display: inline-flex;
      background: var(--bg-main);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 2px;
      gap: 2px;
    }
    .seg-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 11.5px;
      padding: 3px 9px;
      border-radius: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      font-weight: 500;
      transition: all 0.15s;
      user-select: none;
    }
    .seg-btn:hover {
      color: var(--text-bright);
    }
    .seg-btn.active {
      background: rgba(56, 139, 253, 0.18);
      color: var(--accent);
      font-weight: 600;
    }
    .action-btn {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      font-size: 11.5px;
      padding: 4px 10px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      font-weight: 500;
      transition: all 0.15s;
      user-select: none;
    }
    .action-btn:hover {
      background: rgba(177, 186, 196, 0.15);
      color: #fff;
      border-color: var(--accent);
    }

    /* Split Pane Workspace */
    #workspace {
      flex: 1;
      display: flex;
      overflow: hidden;
      height: calc(100vh - 46px);
      position: relative;
    }
    .pane {
      overflow-y: auto;
      height: 100%;
      padding: 28px 36px;
    }
    #left-pane {
      width: calc(50% - 2.5px);
      background-color: var(--bg-panel);
      display: flex;
      flex-direction: column;
      padding: 20px 24px;
      min-width: 150px;
    }
    /* Draggable Splitter between Code & Notes */
    .workspace-resizer {
      width: 5px;
      background-color: var(--border-color);
      cursor: col-resize;
      transition: background-color 0.15s ease;
      z-index: 20;
      flex-shrink: 0;
      user-select: none;
    }
    .workspace-resizer:hover, .workspace-resizer.dragging {
      background-color: var(--accent);
    }
    #right-pane {
      width: calc(50% - 2.5px);
      background-color: var(--bg-main);
      overflow-y: auto;
      padding: 28px 36px;
      min-width: 150px;
    }
    .pane-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--border-color);
    }
    .pane-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-bright);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Markdown Body Styling */
    .markdown-body {
      max-width: 900px;
      margin: 0 auto;
      line-height: 1.65;
      font-size: 14.5px;
    }
    .markdown-body h1, .markdown-body h2, .markdown-body h3 {
      color: #f0f6fc;
      margin-top: 24px;
      margin-bottom: 12px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 6px;
    }
    .markdown-body p, .markdown-body ul, .markdown-body ol {
      margin-bottom: 14px;
    }
    .markdown-body code {
      background-color: var(--code-bg);
      padding: 2px 6px;
      border-radius: 4px;
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      font-size: 85%;
      border: 1px solid rgba(240, 246, 252, 0.1);
    }
    .markdown-body pre {
      background-color: var(--code-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 18px;
      overflow-x: auto;
    }
    .markdown-body pre code {
      border: none;
      padding: 0;
      background-color: transparent;
      font-size: 13px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    .markdown-body table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 20px;
    }
    .markdown-body th, .markdown-body td {
      border: 1px solid var(--border-color);
      padding: 8px 12px;
      text-align: left;
    }
    .markdown-body th {
      background-color: var(--bg-sidebar);
      color: #f0f6fc;
    }
    .markdown-body a {
      color: var(--accent);
      text-decoration: none;
    }
    .markdown-body a:hover {
      text-decoration: underline;
    }
    .markdown-body blockquote {
      border-left: 4px solid var(--accent);
      padding: 8px 16px;
      background-color: var(--card-bg);
      border-radius: 0 6px 6px 0;
      margin-bottom: 16px;
      color: #f0f6fc;
    }

    /* Code Pane Viewer */
    .code-viewer {
      flex: 1;
      background-color: var(--code-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      overflow: auto;
      padding: 16px;
    }
    .code-viewer pre code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: clamp(13px, 0.9vw, 14.5px);
      line-height: 1.65;
    }

    /* Responsive Breakpoints & Mobile Drawer */
    @media (max-width: 768px) {
      #sidebar {
        position: fixed;
        left: 0;
        top: 0;
        bottom: 0;
        width: min(85vw, 340px) !important;
        min-width: unset !important;
        max-width: unset !important;
        z-index: 1000;
        transform: translateX(-100%);
        transition: transform 0.25s ease;
        box-shadow: none;
      }
      #sidebar.mobile-open {
        transform: translateX(0);
        box-shadow: 4px 0 30px rgba(0, 0, 0, 0.7);
      }
      #sidebar.collapsed {
        transform: translateX(-100%);
        width: min(85vw, 340px) !important;
      }
      .resizer {
        display: none !important;
      }
      .top-toolbar {
        padding: 0 10px;
      }
      .breadcrumb {
        font-size: 11.5px;
      }
      .seg-label {
        display: none;
      }
      #workspace {
        flex-direction: column;
      }
      #left-pane {
        border-right: none;
        border-bottom: 1px solid var(--border-color);
        padding: 16px 20px;
      }
      #right-pane {
        padding: 16px 20px;
      }
    }
  </style>
</head>
<body>

  <!-- Mobile Backdrop -->
  <div id="sidebar-backdrop" onclick="toggleSidebar(false)"></div>

  <!-- Left Sidebar Navigation (Tree Explorer) -->
  <aside id="sidebar">
    <div class="sidebar-header">
      <div class="header-brand">
        <div class="brand-title">
          <svg class="brand-svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 17 10 11 4 5"></polyline><line x1="12" y1="19" x2="20" y2="19"></line></svg>
          <span>LeetCode-SH</span>
        </div>
        <span class="progress-badge" id="progressStats" title="Total Indexed Problems">0 Problems</span>
      </div>
      <div class="search-box-wrapper">
        <span class="search-icon"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg></span>
        <input type="text" id="search" class="search-box" placeholder="Search problems, patterns... (/)" oninput="handleSearch(this.value)">
        <button id="searchClear" class="search-clear-btn" onclick="clearSearch()" title="Clear search (Esc)">✕</button>
      </div>
    </div>

    <div class="explorer-bar">
      <span>EXPLORER</span>
      <div class="explorer-actions">
        <button class="icon-btn" onclick="expandAllFolders()" title="Expand All Folders">⊞</button>
        <button class="icon-btn" onclick="collapseAllFolders()" title="Collapse All Folders">⊟</button>
      </div>
    </div>

    <div class="tree-container" id="treeRoot">
      <!-- Injected dynamically by JavaScript -->
    </div>

    <!-- Draggable Resize Splitter Handle -->
    <div id="resizer" class="resizer" title="Drag to resize sidebar"></div>
  </aside>

  <!-- Main Content Workspace -->
  <main id="main-container">
    <header class="top-toolbar">
      <div class="toolbar-left">
        <button class="toggle-sidebar-btn" id="sidebarToggle" onclick="toggleSidebar()" title="Toggle Sidebar (Cmd+B / Ctrl+B)">
          <svg width="15" height="15" viewBox="0 0 16 16" fill="currentColor">
            <path fill-rule="evenodd" d="M1 2.75A.75.75 0 011.75 2h12.5a.75.75 0 010 1.5H1.75A.75.75 0 011 2.75zm0 5A.75.75 0 011.75 7h12.5a.75.75 0 010 1.5H1.75A.75.75 0 011 7.75zM1.75 12a.75.75 0 000 1.5h12.5a.75.75 0 000-1.5H1.75z"></path>
          </svg>
        </button>
        <div class="breadcrumb" id="itemBreadcrumb">Loading...</div>
      </div>

      <div class="toolbar-right">
        <div class="segmented-control" id="viewSwitcher">
          <button class="seg-btn" id="btnDual" onclick="setViewMode('dual')" title="Split Dual View">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="12" y1="3" x2="12" y2="21"></line></svg>

"notes": "# Problem Index \u2014 10. Dynamic Programming & Math / Game Theory\n\n### 10. Dynamic Programming & Math / Game Theory\n| # | Problem Title | LeetCode Link | Solution Code & Notes | Difficulty | Core Technique | Key Takeaways / Notes |\n| :-: | :--- | :-: | :--- | :-: | :--- | :--- |\n| **53** | Maximum Subarray | [LC 53](https://leetcode.com/problems/maximum-subarray/) | [`top-100/lc-0053-maximum-subarray.py`](top-100/lc-0053-maximum-subarray.py) | Medium | Kadane's Algorithm / DP | `curr_max = max(num, curr_max + num)`; maintains maximum contiguous sum in $O(n)$. |\n| **2029** | Stone Game IX | [LC 2029](https://leetcode.com/problems/stone-game-ix/) | [`daily-practice/lc-2029-stone-game-ix.py`](daily-practice/lc-2029-stone-game-ix.py) | Medium | Modulo Arithmetic / Game Theory | Count residues modulo 3 ($c_0, c_1, c_2$); analyze winning conditions based on $c_0 \\pmod 2$. |", "code": "", "diff": "All"}, "topic-11-oop": {"key": "topic-11-oop", "category": "Problem Index", "title": "11. OOP & Foundations", "short": "11. OOP & Foundations", "path": "problem-index/topic-11-oop", "type": "doc", "notes": "# Problem Index \u2014 11. OOP & Foundations\n\nNo content parsed.", "code": "", "diff": "All"}, "top-100/lc-0001-two-sum": {"key": "top-100/lc-0001-two-sum", "category": "Top 100 Liked Track", "title": "Top 100 Liked Track: LC 0001 two sum", "short": "LC 0001 two sum", "path": "top-100/lc-0001-two-sum", "type": "problem", "notes": "", "code": "from typing import List, Optional\n\nclass Solution:\n    pass\n", "diff": "Easy", "py_file": "top-100/lc-0001-two-sum.py", "md_file": ""}, "top-100/lc-0002-add-two-numbers": {"key": "top-100/lc-0002-add-two-numbers", "category": "Top 100 Liked Track", "title": "Top 100 Liked Track: LC 0002 add two numbers", "short": "LC 0002 add two numbers", "path": "top-100/lc-0002-add-two-numbers", "type": "problem", "notes": "", "code": "from typing import List, Optional\n\nclass Solution:\n    pass\n", "diff": "Medium", "py_file": "top-100/lc-0002-add-two-numbers.py", "md_file": ""}, "top-100/lc-0003-longest-substring-without-repeating-characters": {"key": "top-100/lc-0003-longest-substring-without-repeating-characters", "category": "Top 100 Liked Track", "title": "Top 100 Liked Track: LC 0003 longest substring without repeating characters", "short": "LC 0003 longest substring without repeating characters", "path": "top-100/lc-0003-longest-substring-without-repeating-characters", "type": "problem", "notes": "# LeetCode 3. Longest Substring Without Repeating Characters (\u65e0\u91cd\u590d\u5b57\u7b26\u7684\u6700\u957f\u5b50\u4e32)\n## Step-by-Step Code Walkthrough & Notes / \u4ee3\u7801\u9010\u884c\u8be6\u89e3\u4e0e\u77e5\u8bc6\u70b9\u603b\u7ed3\n\n- **Difficulty:** Medium (\u9ad8\u9891\u9762\u8bd5\u7ecf\u5178\u9898 / \u6ed1\u52a8\u7a97\u53e3\u6a21\u7248\u9898)\n- **Tags:** Hash Table, String, Sliding Window\n- **Corresponding Python Files:**\n  - [`top-100/lc-0003-longest-substring-without-repeating-characters.py`](file:///mnt/c/Users/steve/iCloudDrive/Desktop/leetcode-sh/top-100/lc-0003-longest-substring-without-repeating-characters.py)\n  - [`luffy/04-lc-0003-longest-substring-without-repeating-characters.py`](file:///mnt/c/Users/steve/iCloudDrive/Desktop/leetcode-sh/luffy/04-lc-0003-longest-substring-without-repeating-characters.py)\n\n---\n\n## 1. Problem Statement / \u9898\u76ee\u63cf\u8ff0\n\n* **[EN]** Given a string `s`, find the length of the **longest substring** without repeating characters.\n* **[CN]** \u7ed9\u5b9a\u4e00\u4e2a\u5b57\u7b26\u4e32 `s` \uff0c\u8bf7\u4f60\u627e\u51fa\u5176\u4e2d\u4e0d\u542b\u6709\u91cd\u590d\u5b57\u7b26\u7684 **\u6700\u957f\u5b50\u4e32** \u7684\u957f\u5ea6\u3002\n\n---\n\n## 2. Code Implementations / \u4ee3\u7801\u5b9e\u73b0\n\n### \u65b9\u6848 1\uff1a\u6ed1\u52a8\u7a97\u53e3 + \u96c6\u5408\u53bb\u91cd (Sliding Window + Hash Set)\n\n```python\nclass Solution:\n    def lengthOfLongestSubstring(self, s: str) -> int:\n        left = 0\n        right = 0\n        my_set = set()\n        max_len = 0\n\n        while right < len(s):\n            # \u5f53\u53f3\u7aef\u5b57\u7b26\u5df2\u5728\u96c6\u5408\u4e2d\uff08\u51fa\u73b0\u91cd\u590d\uff09\uff0c\u6536\u7f29\u5de6\u8fb9\u754c\n            if s[right] in my_set:\n                my_set.remove(s[left])\n                left += 1\n            else:\n                my_set.add(s[right])\n                max_len = max(max_len, right - left + 1)\n                right += 1\n\n        return max_len\n```\n\n---\n\n### \u65b9\u6848 2\uff1a\u6ed1\u52a8\u7a97\u53e3 + \u9891\u6570\u54c8\u5e0c\u8868 (Sliding Window + Frequency Map / Counter)\n\n```python\nclass SolutionCounter:\n    def lengthOfLongestSubstring(self, s: str) -> int:\n        left = 0\n        right = 0\n        cnt = {}\n        max_len = 0\n\n        while right < len(s):\n            # \u82e5\u53f3\u7aef\u5b57\u7b26\u5728\u5f53\u524d\u7a97\u53e3\u4e2d\u9891\u6570 >= 1\uff0c\u8bf4\u660e\u4ea7\u751f\u91cd\u590d\uff0c\u9700\u8981\u4ece\u5de6\u7aef\u79fb\u51fa\u5b57\u7b26\n            if cnt.get(s[right], 0) >= 1:\n                cnt[s[left]] -= 1\n                left += 1\n            else:\n                cnt[s[right]] = cnt.get(s[right], 0) + 1\n                max_len = max(max_len, right - left + 1)\n                right += 1\n\n        return max_len\n```\n\n---\n\n### \u65b9\u6848 3\uff1a\u54c8\u5e0c\u8868\u8bb0\u5f55\u6700\u540e\u51fa\u73b0\u4f4d\u7f6e (Direct Index Jump - $\\mathcal{O}(n)$ \u6700\u4f18\u8df3\u8dc3)\n\n```python\nclass SolutionJump:\n    def lengthOfLongestSubstring(self, s: str) -> int:\n        last_seen = {}\n        left = 0\n        max_len = 0\n\n        for right, ch in enumerate(s):\n            # \u5982\u679c\u5b57\u7b26\u51fa\u73b0\u8fc7\u4e14\u4e0a\u6b21\u51fa\u73b0\u7684\u4f4d\u7f6e\u5728\u5f53\u524d\u7a97\u53e3\u5185\uff0c\u76f4\u63a5\u628a left \u8df3\u5230\u5176\u4e0b\u4e00\u4f4d\n            if ch in last_seen and last_seen[ch] >= left:\n                left = last_seen[ch] + 1\n            last_seen[ch] = right\n            max_len = max(max_len, right - left + 1)\n\n        return max_len\n```\n\n---\n\n## 3. Deep Dive: Why `cnt[s[left]] -= 1`? / \u6838\u5fc3\u539f\u7406\u89e3\u6790\n\n### \ud83c\uddfa\ud83c\uddf8 English Explanation\n* **`s[left]`**: The leftmost character currently inside the sliding window `[left, right]`.\n* **`cnt`**: A dictionary / frequency table tracking the occurrence count of each character in the current window.\n* **`cnt[s[left]] -= 1`**: When `right` encounters a duplicate character, the window is invalid. To restore validity, we shrink the window from the left by advancing `left` (`left += 1`). Before advancing, `s[left]` is **evicted from the window**, so we must decrement its recorded count in `cnt` by `1`.\n\n### \ud83c\udde8\ud83c\uddf3 \u4e2d\u6587\u8be6\u89e3\n* **`s[left]`**\uff1a\u5f53\u524d\u6ed1\u52a8\u7a97\u53e3 `[left, right]` \u6700\u5de6\u7aef\u7684\u5b57\u7b26\uff08\u5373\u5c06\u88ab\u79fb\u51fa\u7a97\u53e3\u7684\u5b57\u7b26\uff09\u3002\n* **`cnt`**\uff1a\u9891\u6570\u54c8\u5e0c\u8868\uff0c\u7528\u4e8e\u8bb0\u5f55\u5f53\u524d\u7a97\u53e3\u5185\u5404\u4e2a\u5b57\u7b26\u51fa\u73b0\u7684\u6b21\u6570\u3002\n* **`cnt[s[left]] -= 1`**\uff1a\u5f53\u53f3\u6307\u9488 `right` \u6307\u5411\u7684\u5b57\u7b26\u5bfc\u81f4\u7a97\u53e3\u4ea7\u751f\u91cd\u590d\uff08\u4e0d\u5408\u6cd5\uff09\u65f6\uff0c\u5fc5\u987b\u5411\u53f3\u79fb\u52a8\u5de6\u6307\u9488 `left` \u6765\u7f29\u5c0f\u7a97\u53e3\u3002\u5728 `left += 1` \u4e4b\u524d\uff0c\u7531\u4e8e `s[left]` \u79bb\u5f00\u4e86\u7a97\u53e3\u8303\u56f4\uff0c\u5fc5\u987b\u5148\u5c06\u54c8\u5e0c\u8868\u4e2d\u8be5\u5b57\u7b26\u7684\u8ba1\u6570\u51cf 1\uff0c\u4ee5\u4fdd\u6301\u54c8\u5e0c\u8868\u4e0e\u7a97\u53e3\u5b9e\u9645\u5185\u5bb9\u7684\u4e00\u81f4\u6027\u3002\n\n---\n\n## 4. Step-by-Step Code Walkthrough / \u4ee3\u7801\u9010\u884c\u8be6\u89e3 (\u65b9\u6848 1 & \u65b9\u6848 2)\n\n### 1. \u521d\u59cb\u5316\u53cc\u6307\u9488\u4e0e\u72b6\u6001 (Initialization)\n\n```python\nleft = 0\nright = 0\nmy_set = set() # \u6216 cnt = {}\nmax_len = 0\n```\n\n* **[EN] Action:**\n  * `left`: Start index of the sliding window.\n  * `right`: End index of the sliding window.\n  * `my_set` / `cnt`: Tracks active characters inside `[left, right]`.\n  * `max_len`: Stores the maximum length found so far.\n* **[CN] \u52a8\u4f5c**\uff1a\n  * `left`\uff1a\u6ed1\u52a8\u7a97\u53e3\u5de6\u7aef\u70b9\u3002\n  * `right`\uff1a\u6ed1\u52a8\u7a97\u53e3\u53f3\u7aef\u70b9\u3002\n  * `my_set` / `cnt`\uff1a\u8bb0\u5f55\u5f53\u524d\u7a97\u53e3 `[left, right]` \u5185\u5305\u542b\u7684\u5b57\u7b26\u72b6\u6001\u3002\n  * `max_len`\uff1a\u8bb0\u5f55\u5386\u53f2\u6700\u5927\u65e0\u91cd\u590d\u5b50\u4e32\u957f\u5ea6\u3002\n\n---\n\n### 2. \u7a97\u53e3\u6536\u7f29\u9636\u6bb5 (Window Contraction)\n\n```python\nif s[right] in my_set:        # \u65b9\u6848 1\n    my_set.remove(s[left])\n    left += 1\n\n# \u6216\u8005\u65b9\u6848 2:\nif cnt.get(s[right], 0) >= 1: # \u65b9\u6848 2\n    cnt[s[left]] -= 1\n    left += 1\n```\n\n* **[EN] Logic:** If `s[right]` is already recorded, extending the window to `right` would cause a duplicate. We must shrink from the left:\n  1. Remove `s[left]` from the set or decrement `cnt[s[left]] -= 1`.\n  2. Advance `left += 1`.\n  * *Note:* Notice `right` does not increment in this branch, allowing the while loop to re-check `s[right]` until the duplicate is completely cleared.\n* **[CN] \u903b\u8f91**\uff1a\u5982\u679c `s[right]` \u5df2\u7ecf\u5728\u7a97\u53e3\u5185\u5b58\u5728\uff0c\u76f4\u63a5\u52a0\u5165\u4f1a\u5bfc\u81f4\u91cd\u590d\u3002\u56e0\u6b64\u8fdb\u5165\u6536\u7f29\u5206\u652f\uff1a\n  1. \u5c06\u5de6\u7aef\u5b57\u7b26 `s[left]` \u4ece\u96c6\u5408\u79fb\u9664\uff0c\u6216\u6267\u884c `cnt[s[left]] -= 1`\u3002\n  2. \u5de6\u6307\u9488\u53f3\u79fb `left += 1`\u3002\n  * *\u6ce8\u610f*\uff1a\u6b64\u65f6 `right` \u4e0d\u81ea\u589e\uff0c\u4e0b\u4e00\u8f6e\u5faa\u73af\u4f1a\u7ee7\u7eed\u68c0\u67e5 `s[right]`\uff0c\u76f4\u5230\u7a97\u53e3\u5185\u7684\u51b2\u7a81\u5b57\u7b26\u88ab\u5f7b\u5e95\u79fb\u51fa\u3002\n\n---\n\n### 3. \u7a97\u53e3\u6269\u5f20\u4e0e\u7b54\u6848\u66f4\u65b0 (Window Expansion & Update)\n\n```python\nelse:\n    my_set.add(s[right])       # \u6216 cnt[s[right]] = cnt.get(s[right], 0) + 1\n    max_len = max(max_len, right - left + 1)\n    right += 1\n```\n\n* **[EN] Logic:** When `s[right]` is not a duplicate:\n  1. Add `s[right]` to `my_set` (or increment `cnt[s[right]] += 1`).\n  2. Update `max_len` with current window size `right - left + 1`.\n  3. Expand window by advancing `right += 1`.\n* **[CN] \u903b\u8f91**\uff1a\u5f53 `s[right]` \u4e0d\u51b2\u7a81\u65f6\uff1a\n  1. \u5c06 `s[right]` \u52a0\u5165\u96c6\u5408\uff08\u6216\u54c8\u5e0c\u8868\u8ba1\u6570\u52a0 1\uff09\u3002\n  2. \u7528\u5f53\u524d\u7a97\u53e3\u957f\u5ea6 `right - left + 1` \u66f4\u65b0\u5168\u5c40\u6700\u5927\u503c `max_len`\u3002\n  3. \u53f3\u6307\u9488\u53f3\u79fb `right += 1` \u7ee7\u7eed\u63a2\u7d22\u65b0\u5b57\u7b26\u3002\n\n---\n\n## 5. Execution Trace Example / \u6a21\u62df\u8fd0\u884c\u5168\u8fc7\u7a0b\n\n\u4ee5\u8f93\u5165 `s = \"abcabcbb\"` \u4e3a\u4f8b\uff1a\n\n| \u6b65\u9aa4 (Step) | `right` (`s[right]`) | `left` | \u7a97\u53e3\u5185\u5bb9 `s[left..right]` | \u96c6\u5408\u72b6\u6001 `my_set` | \u52a8\u4f5c (Action) | \u5f53\u524d `max_len` |\n| :---: | :---: | :---: | :---: | :---: | :--- | :---: |\n| 1 | 0 (`'a'`) | 0 | `\"a\"` | `{'a'}` | \u65e0\u91cd\u590d\uff0c\u52a0\u5165\u5e76 `right += 1` | 1 |\n| 2 | 1 (`'b'`) | 0 | `\"ab\"` | `{'a', 'b'}` | \u65e0\u91cd\u590d\uff0c\u52a0\u5165\u5e76 `right += 1` | 2 |\n| 3 | 2 (`'c'`) | 0 | `\"abc\"` | `{'a', 'b', 'c'}` | \u65e0\u91cd\u590d\uff0c\u52a0\u5165\u5e76 `right += 1` | **3** |\n| 4 | 3 (`'a'`) | 0 | `\"abc\"` | `{'a', 'b', 'c'}` | **\u51b2\u7a81**\uff1a`remove('a')`, `left += 1` | 3 |\n| 5 | 3 (`'a'`) | 1 | `\"bca\"` | `{'b', 'c', 'a'}` | \u65e0\u91cd\u590d\uff0c\u52a0\u5165\u5e76 `right += 1` | 3 |\n| 6 | 4 (`'b'`) | 1 | `\"bca\"` | `{'b', 'c', 'a'}` | **\u51b2\u7a81**\uff1a`remove('b')`, `left += 1` | 3 |\n| 7 | 4 (`'b'`) | 2 | `\"cab\"` | `{'c', 'a', 'b'}` | \u65e0\u91cd\u590d\uff0c\u52a0\u5165\u5e76 `right += 1` | 3 |\n| 8 | 5 (`'c'`) | 2 | `\"cab\"` | `{'c', 'a', 'b'}` | **\u51b2\u7a81**\uff1a`remove('c')`, `left += 1` | 3 |\n| 9 | 5 (`'c'`) | 3 | `\"abc\"` | `{'a', 'b', 'c'}` | \u65e0\u91cd\u590d\uff0c\u52a0\u5165\u5e76 `right += 1` | 3 |\n| 10 | 6 (`'b'`) | 3 | `\"abc\"` | `{'a', 'b', 'c'}` | **\u51b2\u7a81**\uff1a`remove('a')`, `left += 1` | 3 |\n| 11 | 6 (`'b'`) | 4 | `\"bc\"` | `{'b', 'c'}` | **\u4ecd\u51b2\u7a81**\uff1a`remove('b')`, `left += 1` | 3 |\n| 12 | 6 (`'b'`) | 5 | `\"cb\"` | `{'c', 'b'}` | \u65e0\u91cd\u590d\uff0c\u52a0\u5165\u5e76 `right += 1` | 3 |\n| 13 | 7 (`'b'`) | 5 | `\"cb\"` | `{'c', 'b'}` | **\u51b2\u7a81**\uff1a`remove('c')`, `left += 1` | 3 |\n| 14 | 7 (`'b'`) | 6 | `\"b\"` | `{'b'}` | **\u4ecd\u51b2\u7a81**\uff1a`remove('b')`, `left += 1` | 3 |\n| 15 | 7 (`'b'`) | 7 | `\"b\"` | `{'b'}` | \u65e0\u91cd\u590d\uff0c\u52a0\u5165\u5e76 `right += 1` | 3 |\n\n* **\u6700\u7ec8\u8fd4\u56de**\uff1a`3`\uff08\u6700\u957f\u5b50\u4e32\u4e3a `\"abc\"`\uff09\u3002\n\n---\n\n## 6. Comparison & Complexity Analysis / \u89e3\u6cd5\u5bf9\u6bd4\u4e0e\u590d\u6742\u5ea6\u5206\u6790\n\n| \u89e3\u6cd5 (Approach) | \u65f6\u95f4\u590d\u6742\u5ea6 (Time) | \u7a7a\u95f4\u590d\u6742\u5ea6 (Space) | \u7279\u70b9\u4e0e\u9002\u7528\u573a\u666f |\n| :--- | :--- | :--- | :--- |\n| **\u65b9\u6848 1\uff1aSet \u96c6\u5408\u6ed1\u52a8\u7a97\u53e3** | $\\mathcal{O}(2n) = \\mathcal{O}(n)$ | $\\mathcal{O}(|\\Sigma|)$ | \u903b\u8f91\u6700\u76f4\u89c2\uff0c\u6ed1\u52a8\u7a97\u53e3\u7ecf\u5178\u6a21\u7248 |\n| **\u65b9\u6848 2\uff1aCounter \u9891\u6570\u54c8\u5e0c\u8868** | $\\mathcal{O}(2n) = \\mathcal{O}(n)$ | $\\mathcal{O}(|\\Sigma|)$ | \u901a\u7528\u6027\u6700\u5f3a\uff08\u53ef\u8f7b\u677e\u6269\u5c55\u5230 LC 3090 \u7b49\u201c\u6700\u591a\u5141\u8bb8 $k$ \u6b21\u201d\u7684\u53d8\u5f62\u9898\uff09 |\n| **\u65b9\u6848 3\uff1a\u54c8\u5e0c\u8868\u8bb0\u5f55\u4e0b\u6807\u8df3\u8dc3** | $\\mathcal{O}(n)$ | $\\mathcal{O}(|\\Sigma|)$ | \u5de6\u6307\u9488\u4e00\u6b65\u8df3\u5230\u4f4d\uff0c\u6bcf\u4e2a\u5b57\u7b26\u53ea\u8bbf\u95ee 1 \u6b21\uff0c\u5e38\u6570\u6700\u5c0f |\n\n*\u6ce8\uff1a$|\\Sigma|$ \u8868\u793a\u5b57\u7b26\u96c6\u5927\u5c0f\uff08ASCII \u7801\u5b57\u7b26\u96c6 $|\\Sigma| \\le 128$\uff09\uff0c\u56e0\u6b64\u7a7a\u95f4\u590d\u6742\u5ea6\u4e3a\u4e25\u683c\u7684 $\\mathcal{O}(1)$\u3002*\n", "code": "from collections import Counter\n\n\nclass Solution:\n    def lengthOfLongestSubstring(self, s: str) -> int:\n        ans = 0\n        cnt = Counter() #hashmap key: char; value: int\n        left = 0\n        for right, c in enumerate(s):\n            cnt[c] += 1 #\u5b57\u7b26\u7684\u51fa\u73b0\u6b21\u6570+1\n            while cnt[c]>1:\n                cnt[s[left]] -= 1 # remove s[left] from the set \n                left += 1\n            ans = max(ans, right - left + 1) #\u5b57\u7b26\u4e2a\u6570\n        return ans\n        ", "diff": "Medium", "py_file": "top-100/lc-0003-longest-substring-without-repeating-characters.py", "md_file": "top-100/lc-0003-longest-substring-without-repeating-characters.md"}, "top-100/lc-0004-median-of-two-sorted-arrays": {"key": "top-100/lc-0004-median-of-two-sorted-arrays", "category": "Top 100 Liked Track", "title": "Top 100 Liked Track: LC 0004 median of two sorted arrays", "short": "LC 0004 median of two sorted arrays", "path": "top-100/lc-0004-median-of-two-sorted-arrays", "type": "problem", "notes": "", "code": "from typing import List, Optional\n\nclass Solution:\n    pass\n", "diff": "Hard", "py_file": "top-100/lc-0004-median-of-two-sorted-arrays.py", "md_file": ""}, "top-100/lc-0005-longest-palindromic-substring": {"key": "top-100/lc-0005-longest-palindromic-substring", "category": "Top 100 Liked Track", "title": "Top 100 Liked Track: LC 0005 longest palindromic substring", "short": "LC 0005 longest palindromic substring", "path": "top-100/lc-0005-longest-palindromic-substring", "type": "problem", "notes": "", "code": "from typing import List, Optional\n\nclass Solution:\n    pass\n", "diff": "Medium", "py_file": "top-100/lc-0005-longest-palindromic-substring.py", "md_file": ""}, "top-100/lc-0010-regular-expression-matching": {"key": "top-100/lc-0010-regular-expression-matching", "category": "Top 100 Liked Track", "title": "Top 100 Liked Track: LC 0010 regular expression matching", "short": "LC 0010 regular expression matching", "path": "top-100/lc-0010-regular-expression-matching", "type": "problem", "notes": "", "code": "from typing import List, Optional\n\nclass Solution:\n    pass\n", "diff": "Hard", "py_file": "top-100/lc-0010-regular-expression-matching.py", "md_file": ""}, "top-100/lc-0011-container-with-most-water": {"key": "top-100/lc-0011-container-with-most-water", "category": "Top 100 Liked Track", "title": "Top 100 Liked Track: LC 0011 container with most water", "short": "LC 0011 container with most water", "path": "top-100/lc-0011-container-with-most-water", "type": "problem", "notes": "# LeetCode 11. Container With Most Water (\u76db\u6700\u591a\u6c34\u7684\u5bb9\u5668)\n## Step-by-Step Code Walkthrough & Notes / \u4ee3\u7801\u9010\u884c\u8be6\u89e3\u4e0e\u77e5\u8bc6\u70b9\u603b\u7ed3\n\n- **Difficulty:** Medium (\u7ecf\u5178\u5bf9\u649e\u53cc\u6307\u9488)\n- **Tags:** Array, Two Pointers, Greedy\n- **Corresponding Python File:** [`top-100/lc-0011-container-with-most-water.py`](file:///mnt/c/Users/steve/iCloudDrive/desktop/leetcode-sh/top-100/lc-0011-container-with-most-water.py)\n\n---\n\n## 1. Problem Statement / \u9898\u76ee\u63cf\u8ff0\n\n* **[EN]** You are given an integer array `height` of length `n`. There are `n` vertical lines drawn such that the two endpoints of the $i^{th}$ line are `(i, 0)` and `(i, height[i])`. Find two lines that together with the x-axis form a container, such that the container contains the most water. Return the maximum amount of water a container can store.\n* **[CN]** \u7ed9\u5b9a\u4e00\u4e2a\u957f\u5ea6\u4e3a `n` \u7684\u6574\u6570\u6570\u7ec4 `height` \u3002\u6709 `n` \u6761\u5782\u7ebf\uff0c\u7b2c `i` \u6761\u7ebf\u7684\u4e24\u4e2a\u7aef\u70b9\u662f `(i, 0)` \u548c `(i, height[i])` \u3002\u627e\u51fa\u5176\u4e2d\u7684\u4e24\u6761\u7ebf\uff0c\u4f7f\u5f97\u5b83\u4eec\u4e0e x \u8f74\u5171\u540c\u6784\u6210\u7684\u5bb9\u5668\u53ef\u4ee5\u5bb9\u7eb3\u6700\u591a\u7684\u6c34\u3002\u8fd4\u56de\u5bb9\u5668\u53ef\u4ee5\u50a8\u5b58\u7684\u6700\u5927\u6c34\u91cf\u3002\n\n---\n\n## 2. Code Implementation / \u4ee3\u7801\u5b9e\u73b0\n\n```python\nfrom typing import List\n\nclass Solution:\n    def maxArea(self, height: List[int]) -> int:\n        left = 0\n        right = len(height) - 1\n        result = 0\n\n        while left < right:\n            area = (right - left) * min(height[left], height[right])\n            result = max(result, area)\n\n            # \u8d2a\u5fc3\u7b56\u7565\uff1a\u79fb\u52a8\u8f83\u77ed\u677f\u7684\u90a3\u4e00\u4fa7\u6307\u9488\n            if height[left] < height[right]:\n                left += 1\n            else:\n                right -= 1\n\n        return result\n```\n\n---\n\n## 3. Core Intuition & Proof / \u8d2a\u5fc3\u4e0e\u53cc\u6307\u9488\u539f\u7406\n\n1. **\u5bb9\u5668\u5bb9\u79ef\u516c\u5f0f**\uff1a\n   $$\\text{Area} = (right - left) \\times \\min(height[left], height[right])$$\n2. **\u4e3a\u4ec0\u4e48\u79fb\u52a8\u8f83\u77ee\u7684\u677f\uff1f**\n   * \u65e0\u8bba\u79fb\u52a8 `left` \u8fd8\u662f `right`\uff0c\u5bbd\u5ea6 $(right - left)$ \u90fd\u4f1a\u51cf\u5c0f $1$\u3002\n   * **\u82e5\u79fb\u52a8\u8f83\u9ad8\u677f**\uff1a\u5bb9\u5668\u9ad8\u5ea6\u7531\u8f83\u77ee\u677f\u51b3\u5b9a\uff0c\u9ad8\u5ea6\u81f3\u591a\u4e0d\u53d8\u751a\u81f3\u53d8\u5c0f\uff0c\u5bbd\u5ea6\u53c8\u53d8\u7a84\uff0c**\u9762\u79ef\u5fc5\u7136\u4e25\u683c\u51cf\u5c0f**\u3002\n   * **\u82e5\u79fb\u52a8\u8f83\u77ee\u677f**\uff1a\u867d\u7136\u5bbd\u5ea6\u53d8\u5c0f\uff0c\u4f46\u65b0\u677f\u53ef\u80fd\u66f4\u9ad8\uff0c**\u9762\u79ef\u6709\u53ef\u80fd\u589e\u5927**\u3002\n   * \u56e0\u6b64\uff0c\u6bcf\u6b21\u820d\u5f03\u5e76\u79fb\u52a8\u8f83\u77ee\u7684\u4e00\u7aef\u662f\u6700\u4f18\u8d2a\u5fc3\u51b3\u7b56\u3002\n\n---\n\n## 4. Complexity Analysis / \u590d\u6742\u5ea6\u5206\u6790\n\n* **\u65f6\u95f4\u590d\u6742\u5ea6 (Time):** $\\mathcal{O}(n)$ \u2014\u2014 \u5de6\u53f3\u6307\u9488\u5411\u5185\u626b\u63cf\uff0c\u6bcf\u4e2a\u5143\u7d20\u6700\u591a\u8bbf\u95ee\u4e00\u6b21\u3002\n* **\u7a7a\u95f4\u590d\u6742\u5ea6 (Space):** $\\mathcal{O}(1)$ \u2014\u2014 \u4ec5\u4f7f\u7528\u5e38\u6570\u4e2a\u6307\u9488\u53d8\u91cf\u3002\n", "code": "# Container with Most water.\n\n# use two pointer method\n\nfrom typing import List\n\nclass Solution:\n    def maxArea(self, height: List[int]) -> int:\n        left=0\n        right=len(height)-1\n\n        result = 0\n\n        while left < right:\n            area = (right-left) * min(height[left], height[right])\n            result =  max(result, area)\n\n            if height[left]<height[right]:\n                left += 1\n            else:\n                right -= 1\n\n        return result\n\n# time complexity: O(n)\n# space complexity: O(1) \n# each time you move a pointer costs O(1)\n\n\n\n\n\n\n\n", "diff": "Medium", "py_file": "top-100/lc-0011-container-with-most-water.py", "md_file": "top-100/lc-0011-container-with-most-water.md"}, "top-100/lc-0015-3sum": {"key": "top-100/lc-0015-3sum", "category": "Top 100 Liked Track", "title": "Top 100 Liked Track: LC 0015 3sum", "short": "LC 0015 3sum", "path": "top-100/lc-0015-3sum", "type": "problem", "notes": "# LeetCode 15. 3Sum (\u4e09\u6570\u4e4b\u548c)\n## Step-by-Step Code Walkthrough & Notes / \u4ee3\u7801\u9010\u884c\u8be6\u89e3\u4e0e\u77e5\u8bc6\u70b9\u603b\u7ed3\n\n- **Difficulty:** Medium (\u9ad8\u9891\u9762\u8bd5\u7ecf\u5178\u9898 / \u53cc\u6307\u9488 + \u6781\u81f4\u526a\u679d)\n- **Tags:** Array, Two Pointers, Sorting, Pruning\n- **Corresponding Python Files:**\n  - [`top-100/lc-0015-3sum.py`](file:///mnt/c/Users/steve/iCloudDrive/desktop/leetcode-sh/top-100/lc-0015-3sum.py)\n  - [`s-lc-15.py`](top-100/lc-0015-3sum.py)\n\n---\n\n## 1. Problem Statement / \u9898\u76ee\u63cf\u8ff0\n\n* **[EN]** Given an integer array `nums`, return all the triplets `[nums[i], nums[j], nums[k]]` such that `i != j`, `i != k`, and `j != k`, and `nums[i] + nums[j] + nums[k] == 0`.\n  * **Note:** The solution set must **not contain duplicate triplets**.\n* **[CN]** \u7ed9\u4f60\u4e00\u4e2a\u6574\u6570\u6570\u7ec4 `nums` \uff0c\u5224\u65ad\u662f\u5426\u5b58\u5728\u4e09\u5143\u7ec4 `[nums[i], nums[j], nums[k]]` \u6ee1\u8db3 `i != j`\u3001`i != k` \u4e14 `j != k` \uff0c\u540c\u65f6\u8fd8\u6ee1\u8db3 `nums[i] + nums[j] + nums[k] == 0` \u3002\n  * **\u6ce8\u610f\uff1a** \u7b54\u6848\u4e2d**\u4e0d\u53ef\u4ee5\u5305\u542b\u91cd\u590d\u7684\u4e09\u5143\u7ec4**\u3002\n\n---\n\n## 2. Updated Code Implementation / \u66f4\u65b0\u540e\u7684\u5b8c\u6574\u4ee3\u7801\n\n```python\nfrom typing import List\n\nclass Solution:\n    def threeSum(self, nums: List[int]) -> List[List[int]]:\n        nums.sort()\n        # the order of triplet does not matter\n        # i < j < k\n        # the result cannot include repeated triplets\n\n        result = []\n        n = len(nums)\n\n        for i in range(0, n - 2):\n            x = nums[i]\n            if i > 0 and x == nums[i - 1]:\n                continue\n\n            # Optimization 1: \u6700\u5c0f\u548c\u526a\u679d\n            if x + nums[i + 1] + nums[i + 2] > 0:\n                break\n\n            # Optimization 2: \u6700\u5927\u548c\u526a\u679d\n            if x + nums[-2] + nums[-1] < 0:\n                continue\n\n            j = i + 1\n            k = n - 1\n            while j < k:\n                s = x + nums[j] + nums[k]\n                if s > 0:\n                    k -= 1\n                elif s < 0:\n                    j += 1\n                else:\n                    result.append([x, nums[j], nums[k]])\n                    j += 1\n                    while j < k and nums[j] == nums[j - 1]:\n                        j += 1\n                    k -= 1\n                    while k > j and nums[k] == nums[k + 1]:\n                        k -= 1\n                        \n        return result\n```\n\n---\n\n## 3. Step-by-Step Code Walkthrough / \u4ee3\u7801\u9010\u884c\u8be6\u89e3\n\n### 1. \u6570\u7ec4\u6392\u5e8f\u4e0e\u521d\u59cb\u5316 (Sorting & Initialization)\n\n```python\nnums.sort()\nresult = []\nn = len(nums)\n```\n\n* **[EN] Action:** Sorts `nums` in ascending order. Initializes the empty list `result` and records array length `n`.\n  * **Why Sort?** Sorting provides monotonicity so we can adjust sums using two pointers and effortlessly skip duplicate numbers.\n* **[CN] \u52a8\u4f5c**\uff1a\u5c06\u6570\u7ec4\u6309\u5347\u5e8f\u539f\u5730\u6392\u5e8f\uff0c\u521d\u59cb\u5316\u7ed3\u679c\u5217\u8868 `result`\uff0c\u5e76\u83b7\u53d6\u6570\u7ec4\u957f\u5ea6 `n`\u3002\n  * **\u4e3a\u4ec0\u4e48\u6392\u5e8f\uff1f** \u6392\u5e8f\u8d4b\u4e88\u4e86\u6570\u7ec4\u5355\u8c03\u6027\uff0c\u4e0d\u4ec5\u80fd\u4f7f\u7528\u53cc\u6307\u9488\u6309\u9700\u8c03\u8282\u548c\u7684\u5927\u5c0f\uff0c\u8fd8\u80fd\u4f7f\u76f8\u540c\u6570\u5b57\u805a\u96c6\u5728\u4e00\u8d77\uff0c\u6781\u5927\u5730\u7b80\u5316\u4e86\u53bb\u91cd\u903b\u8f91\u3002\n\n---\n\n### 2. \u5916\u5c42\u5faa\u73af\u4e0e\u57fa\u51c6\u6570\u53bb\u91cd (Outer Loop & Anchor Deduplication)\n\n```python\nfor i in range(0, n - 2):\n    x = nums[i]\n    if i > 0 and x == nums[i - 1]:\n        continue\n```\n\n* **[EN] Action:** Fixes the first number `x = nums[i]`. We only need to iterate up to index `n - 3` because at least two elements (`j` and `k`) are required after `i`.\n  * **Deduplication Logic (`x == nums[i - 1]`):** If the current value `x` is equal to the previous value `nums[i - 1]`, all triplets starting with `x` were **already exhaustively found** in the previous iteration. We skip it (`continue`) to prevent duplicate triplets in the output.\n* **[CN] \u52a8\u4f5c**\uff1a\u5916\u5c42\u5faa\u73af\u679a\u4e3e\u7b2c\u4e00\u4e2a\u57fa\u51c6\u6570 `x = nums[i]`\uff0c\u904d\u5386\u5230 `n - 3`\uff08\u5373 `range(0, n - 2)`\uff09\u5373\u53ef\uff0c\u56e0\u4e3a\u540e\u9762\u5fc5\u987b\u81f3\u5c11\u4fdd\u7559\u4e24\u4e2a\u6570\u7ed9 `j` \u548c `k`\u3002\n  * **\u57fa\u51c6\u6570\u53bb\u91cd\u903b\u8f91 (`x == nums[i - 1]`)**\uff1a\u82e5\u5f53\u524d\u6570\u4e0e\u524d\u4e00\u4e2a\u6570\u76f8\u540c\uff0c\u8bf4\u660e\u4ee5\u8be5\u6570\u503c\u5f00\u5934\u7684\u6240\u6709\u4e09\u5143\u7ec4\u5728\u4e0a\u4e00\u8f6e\u5faa\u73af\u4e2d**\u5df2\u7ecf\u5168\u90e8\u88ab\u627e\u9f50\u4e86**\uff0c\u76f4\u63a5\u8df3\u8fc7\uff08`continue`\uff09\uff0c\u907f\u514d\u751f\u6210\u91cd\u590d\u4e09\u5143\u7ec4\u3002\n\n---\n\n### 3. \u53cc\u5411\u6781\u7aef\u526a\u679d\u4f18\u5316 (Two-Way Extreme Pruning) \u2b50\n\n\u8fd9\u4e24\u5904\u526a\u679d\u662f\u9762\u8bd5\u4e0e\u7ade\u8d5b\u4e2d\u7684\u9ad8\u7ea7\u4f18\u5316\u6280\u5de7\uff0c\u80fd\u5927\u5e45\u51cf\u5c11\u4e0d\u5fc5\u8981\u7684\u53cc\u6307\u9488\u5faa\u73af\uff1a\n\n```python\n# Optimization 1: \u6700\u5c0f\u548c\u526a\u679d\nif x + nums[i + 1] + nums[i + 2] > 0:\n    break\n```\n\n* **[EN] Why `break`?**\n  * In a sorted array, `nums[i + 1]` and `nums[i + 2]` are the **smallest possible numbers** that can pair with `x`.\n  * If the sum of `x` with the smallest available numbers is already `> 0`, then any other pair $(nums[j], nums[k])$ where $j > i+1$ or $k > i+2$ will produce an even strictly larger sum ($> 0$).\n  * Furthermore, all future anchors $x' = nums[i+1]$ will be $\\ge x$, so their sums will also strictly exceed $0$.\n  * **Conclusion:** No further triplets sum to $0$ anywhere in the array. We can safely **terminate the entire loop immediately (`break`)**.\n* **[CN] \u4e3a\u4ec0\u4e48\u76f4\u63a5 `break`\uff1f**\n  * \u5728\u5347\u5e8f\u6570\u7ec4\u4e2d\uff0c`nums[i + 1]` \u548c `nums[i + 2]` \u662f\u80fd\u4e0e `x` \u642d\u914d\u7684**\u4e24\u4e2a\u6700\u5c0f\u7684\u6570**\u3002\n  * \u5982\u679c `x` \u52a0\u4e0a\u540e\u9762\u6700\u5c0f\u7684\u4e24\u4e2a\u6570\u4e4b\u548c\u90fd\u5927\u4e8e 0\uff0c\u90a3\u4e48\u642d\u914d\u540e\u9762\u4efb\u4f55\u66f4\u5927\u7684\u6570\uff0c\u548c\u5fc5\u7136\u4e5f\u90fd\u5927\u4e8e 0\u3002\n  * \u4e0d\u4ec5\u5982\u6b64\uff0c\u540e\u7eed\u6240\u6709\u7684\u57fa\u51c6\u6570 $x'$ \u90fd\u4f1a\u66f4\u5927\uff08$\\ge x$\uff09\uff0c\u4e09\u6570\u4e4b\u548c\u5fc5\u5b9a\u5168\u90e8\u5927\u4e8e 0\u3002\n  * **\u7ed3\u8bba**\uff1a\u540e\u7eed\u4e0d\u53ef\u80fd\u518d\u5b58\u5728\u4efb\u4f55\u548c\u4e3a 0 \u7684\u4e09\u5143\u7ec4\uff0c\u76f4\u63a5 **\u5f7b\u5e95\u7ec8\u6b62\u5916\u5c42\u5faa\u73af (`break`)**\u3002\n\n---\n\n```python\n# Optimization 2: \u6700\u5927\u548c\u526a\u679d\nif x + nums[-2] + nums[-1] < 0:\n    continue\n```\n\n* **[EN] Why `continue`?**\n  * `nums[-2]` and `nums[-1]` are the **largest possible numbers** in the entire array.\n  * If `x` added to the two largest numbers is still `< 0`, then `x` is too small to reach $0$ with **any** pair in the remaining array.\n  * However, a future anchor $x' = nums[i+1] > x$ might be large enough to achieve a sum of $0$.\n  * **Conclusion:** We cannot use this specific `x`, but future anchors might work. We skip only this `x` and move to the next iteration (**`continue`**).\n* **[CN] \u4e3a\u4ec0\u4e48\u4f7f\u7528 `continue`\uff1f**\n  * `nums[-2]` \u548c `nums[-1]` \u662f\u6574\u4e2a\u6570\u7ec4\u4e2d**\u4e24\u4e2a\u6700\u5927\u7684\u6570**\u3002\n  * \u5982\u679c `x` \u8fde\u52a0\u4e0a\u5168\u6570\u7ec4\u6700\u5927\u7684\u4e24\u4e2a\u6570\uff0c\u548c\u90fd\u4f9d\u7136\u5c0f\u4e8e 0\uff0c\u8bf4\u660e\u5f53\u524d\u8fd9\u4e2a `x` \u5b9e\u5728\u592a\u5c0f\u4e86\uff0c\u8ddf\u540e\u9762\u7684\u4efb\u4f55\u4e24\u6570\u642d\u914d\u90fd\u4e0d\u53ef\u80fd\u8fbe\u5230 0\u3002\n  * \u4f46\u540e\u9762\u7684\u57fa\u51c6\u6570 $x' = nums[i+1]$ \u4f1a\u66f4\u5927\uff0c\u540e\u7eed\u53ef\u80fd\u6709\u673a\u4f1a\u8fbe\u5230 0\u3002\n  * **\u7ed3\u8bba**\uff1a\u5f53\u524d `x` \u65e0\u6cd5\u51d1\u6210 0\uff0c\u4f46\u540e\u7eed\u66f4\u5927\u7684 `x'` \u4ecd\u6709\u53ef\u80fd\uff0c\u6240\u4ee5**\u4ec5\u8df3\u8fc7\u5f53\u524d\u8fd9\u8f6e\u5faa\u73af (`continue`)**\u3002\n\n---\n\n### 4. \u53cc\u6307\u9488\u626b\u63cf\u4e0e\u5185\u5c42\u53bb\u91cd (Two Pointers & Inner Deduplication)\n\n```python\nj = i + 1\nk = n - 1\nwhile j < k:\n    s = x + nums[j] + nums[k]\n    if s > 0:\n        k -= 1\n    elif s < 0:\n        j += 1\n    else:\n        result.append([x, nums[j], nums[k]])\n        j += 1\n        while j < k and nums[j] == nums[j - 1]:\n            j += 1\n        k -= 1\n        while k > j and nums[k] == nums[k + 1]:\n            k -= 1\n```\n\n* **[EN] Logic:**\n  * If $s > 0$: Sum is too large $\\rightarrow$ decrease by moving right pointer left: `k -= 1`.\n  * If $s < 0$: Sum is too small $\\rightarrow$ increase by moving left pointer right: `j += 1`.\n  * If $s == 0$: Found a valid triplet!\n    1. Append `[x, nums[j], nums[k]]` to `result`.\n    2. Move `j += 1`, then skip consecutive identical elements with `while j < k and nums[j] == nums[j - 1]: j += 1`.\n    3. Move `k -= 1`, then skip consecutive identical elements with `while k > j and nums[k] == nums[k + 1]: k -= 1`.\n* **[CN] \u903b\u8f91**\uff1a\n  * \u82e5 $s > 0$\uff1a\u548c\u504f\u5927 $\\rightarrow$ \u53f3\u6307\u9488\u5de6\u79fb\u4ee5\u51cf\u5c0f\u548c\uff1a`k -= 1`\u3002\n  * \u82e5 $s < 0$\uff1a\u548c\u504f\u5c0f $\\rightarrow$ \u5de6\u6307\u9488\u53f3\u79fb\u4ee5\u589e\u5927\u548c\uff1a`j += 1`\u3002\n  * \u82e5 $s == 0$\uff1a\u627e\u5230\u4e00\u7ec4\u6709\u6548\u89e3\uff01\n    1. \u5c06 `[x, nums[j], nums[k]]` \u52a0\u5165 `result`\u3002\n    2. \u5de6\u6307\u9488\u5148\u8d70\u4e00\u6b65 `j += 1`\uff0c\u968f\u540e\u5229\u7528 `while j < k and nums[j] == nums[j - 1]: j += 1` \u8df3\u8fc7\u6240\u6709\u4e0e\u524d\u4e00\u4e2a\u76f8\u540c\u7684\u5143\u7d20\u3002\n    3. \u53f3\u6307\u9488\u5148\u8d70\u4e00\u6b65 `k -= 1`\uff0c\u968f\u540e\u5229\u7528 `while k > j and nums[k] == nums[k + 1]: k -= 1` \u8df3\u8fc7\u6240\u6709\u4e0e\u540e\u4e00\u4e2a\u76f8\u540c\u7684\u5143\u7d20\u3002\n\n---\n\n## 4. Key Takeaways & Comparison / \u6838\u5fc3\u77e5\u8bc6\u70b9\u5bf9\u6bd4\n\n### Optimization 1 vs Optimization 2\n\n| \u526a\u679d\u7b56\u7565 | \u5224\u65ad\u6761\u4ef6 | \u8bed\u4e49\u5206\u6790 | \u6267\u884c\u52a8\u4f5c |\n| :--- | :--- | :--- | :---: |\n| **\u6700\u5c0f\u548c\u526a\u679d (Optimization 1)** | `x + nums[i+1] + nums[i+2] > 0` | \u5373\u4f7f\u642d\u914d**\u6700\u5c0f\u7684\u4e24\u6570**\u548c\u4f9d\u7136 $> 0$\uff0c\u540e\u7eed\u5fc5\u7136\u5168\u90e8 $> 0$ | **`break`** (\u5168\u505c) |\n| **\u6700\u5927\u548c\u526a\u679d (Optimization 2)** | `x + nums[-2] + nums[-1] < 0` | \u5373\u4f7f\u642d\u914d**\u6700\u5927\u7684\u4e24\u6570**\u548c\u4f9d\u7136 $< 0$\uff0c\u5f53\u524d `x` \u592a\u5c0f\u65e0\u89e3\uff0c\u4f46\u540e\u5e8f\u66f4\u5927\u7684 $x'$ \u4ecd\u6709\u53ef\u80fd | **`continue`** (\u8df3\u8fc7\u5f53\u524d) |\n\n---\n\n## 5. Complexity Analysis / \u590d\u6742\u5ea6\u5206\u6790\n\n* **\u65f6\u95f4\u590d\u6742\u5ea6 (Time Complexity):** $\\mathcal{O}(n^2)$\n  * \u6392\u5e8f\u65f6\u95f4\u4e3a $\\mathcal{O}(n \\log n)$\u3002\n  * \u5916\u5c42\u904d\u5386 $n$ \u4e2a\u6570\uff0c\u5185\u5c42\u53cc\u6307\u9488\u626b\u63cf\u6700\u591a $\\mathcal{O}(n)$ \u6b21\u3002\u52a0\u4e0a\u53cc\u5411\u6781\u7aef\u526a\u679d\u540e\uff0c\u5b9e\u9645\u8fd0\u884c\u65f6\u95f4\u4f1a\u663e\u8457\u4f4e\u4e8e\u5e38\u89c4 $\\mathcal{O}(n^2)$ \u89e3\u6cd5\u3002\n* **\u7a7a\u95f4\u590d\u6742\u5ea6 (Space Complexity):** $\\mathcal{O}(1)$ \u6216 $\\mathcal{O}(\\log n)$\n  * \u4e0d\u8ba1\u7528\u4e8e\u4fdd\u5b58\u8fd4\u56de\u7b54\u6848\u7684 `result` \u5217\u8868\uff0c\u7b97\u6cd5\u53ea\u4f7f\u7528\u4e86\u51e0\u4e2a\u6307\u9488\u53d8\u91cf\uff0c\u989d\u5916\u8f85\u52a9\u7a7a\u95f4\u4e3a $\\mathcal{O}(1)$\u3002\n  * Python \u7684 `sort()` (Timsort) \u9700\u8981 $\\mathcal{O}(\\log n) \\sim \\mathcal{O}(n)$ \u7684\u6808\u7a7a\u95f4\u3002\n", "code": "from typing import List\n\n\nclass Solution:\n    def threeSum(self, nums: list[int]) -> list[list[int]]:\n        nums.sort()\n        #the order of triple is not matter\n        # i< j < k\n        #the result cannot includ repeated triples\n\n\n        result=[]\n        n = len(nums)\n\n        for i in range(0, n-2):\n            x = nums[i]\n            if i > 0 and x == nums[i-1]:\n                continue\n\n            #optimization 1\n            if x + nums[i+1] + nums[i+2] > 0:\n                break\n\n            #optimization 2\n            if x + nums[-2] + nums[-1] < 0:\n                continue\n\n\n            j = i + 1\n            k = n - 1\n            while j < k:\n                s = x+ nums[j] + nums[k]\n                if s > 0:\n                    k-=1\n                elif s < 0:\n                    j += 1\n                else:\n                    result.append([x,nums[j],nums[k]])\n                    j += 1\n                    while j < k and nums[j] == nums[j-1]:\n                        j+=1\n                    k -= 1\n                    while k > j and nums[k] == nums[k+1]:\n                        k-=1\n        return result\n\n\n", "diff": "Medium", "py_file": "top-100/lc-0015-3sum.py", "md_file": "top-100/lc-0015-3sum.md"}, "top-100/lc-0016-3-sum-closest": {"key": "top-100/lc-0016-3-sum-closest", "category": "Top 100 Liked Track", "title": "Top 100 Liked Track: LC 0016 3 sum closest", "short": "LC 0016 3 sum closest", "path": "top-100/lc-0016-3-sum-closest", "type": "problem", "notes": "# LeetCode 16. 3Sum Closest (\u6700\u63a5\u8fd1\u7684\u4e09\u6570\u4e4b\u548c)\n## Step-by-Step Code Walkthrough & Notes / \u4ee3\u7801\u9010\u884c\u8be6\u89e3\u4e0e\u77e5\u8bc6\u70b9\u603b\u7ed3\n\n- **Difficulty:** Medium (\u9ad8\u9891\u9762\u8bd5\u7ecf\u5178\u9898 / \u53cc\u6307\u9488\u5bf9\u649e + \u6781\u81f4\u526a\u679d)\n- **Tags:** Array, Two Pointers, Sorting, Pruning\n- **Corresponding Python File:** [`top-100/lc-0016-3-sum-closest.py`](top-100/lc-0016-3-sum-closest.py)\n\n---\n\n## 1. Problem Statement / \u9898\u76ee\u63cf\u8ff0\n\n* **[EN]** Given an integer array `nums` of length `n` and an integer `target`, find three integers in `nums` such that the sum is closest to `target`.\n  * Return the **sum of the three integers**.\n  * You may assume that each input would have **exactly one solution**.\n* **[CN]** \u7ed9\u4f60\u4e00\u4e2a\u957f\u5ea6\u4e3a `n` \u7684\u6574\u6570\u6570\u7ec4 `nums` \u548c\u4e00\u4e2a\u76ee\u6807\u503c `target`\u3002\u8bf7\u4f60\u4ece `nums` \u4e2d\u9009\u51fa\u4e09\u4e2a\u6574\u6570\uff0c\u4f7f\u5b83\u4eec\u7684\u548c\u4e0e `target` \u6700\u63a5\u8fd1\u3002\n  * \u8fd4\u56de\u8fd9 **\u4e09\u4e2a\u6570\u7684\u548c**\u3002\n  * \u5047\u5b9a\u6bcf\u7ec4\u8f93\u5165\u53ea\u5b58\u5728 **\u6070\u597d\u4e00\u4e2a\u89e3**\u3002\n\n### Constraints / \u7ea6\u675f\u6761\u4ef6\n* $3 \\le \\text{nums.length} \\le 500$\n* $-1000 \\le \\text{nums}[i] \\le 1000$\n* $-10^4 \\le \\text{target} \\le 10^4$\n\n---\n\n## 2. Core Idea & Sister Problem Comparison / \u6838\u5fc3\u89e3\u6cd5\u4e0e LC 15 \u59ca\u59b9\u9898\u5bf9\u6bd4\n\n### \ud83d\udca1 \u6838\u5fc3\u89e3\u9898\u601d\u8def\n\u672c\u9898\u662f [LeetCode 15. 3Sum (\u4e09\u6570\u4e4b\u548c)](top-100/lc-0015-3sum.md) \u7684\u76f4\u63a5\u59ca\u59b9\u9898\uff0c\u89e3\u9898\u8109\u7edc\u9ad8\u5ea6\u4e00\u81f4\uff1a\n1. **\u6392\u5e8f**\uff1a\u5148\u5bf9\u6570\u7ec4\u8fdb\u884c\u5347\u5e8f\u6392\u5e8f\uff0c\u4f7f\u6574\u4e2a\u6570\u7ec4\u5177\u5907\u5355\u8c03\u6027\u3002\n2. **\u56fa\u5b9a\u57fa\u51c6\u6570**\uff1a\u5916\u5c42\u5faa\u73af\u904d\u5386\u56fa\u5b9a\u7b2c\u4e00\u4e2a\u6570 $nums[i]$\u3002\n3. **\u53cc\u6307\u9488\u5bf9\u649e**\uff1a\u5728\u5269\u4f59\u53f3\u4fa7\u533a\u95f4 $[i + 1, n - 1]$ \u5185\u653e\u7f6e\u9996\u5c3e\u53cc\u6307\u9488 $left$ \u548c $right$\uff1a\n   - \u8ba1\u7b97\u5f53\u524d\u4e09\u6570\u4e4b\u548c $s = nums[i] + nums[left] + nums[right]$\u3002\n   - \u82e5 $|s - target| < |ans - target|$\uff0c\u66f4\u65b0\u6700\u4f18\u89e3 $ans = s$\u3002\n   - \u82e5 $s == target$\uff1a\u7edd\u5bf9\u5dee\u4e3a 0\uff0c\u4e0d\u53ef\u80fd\u66f4\u63a5\u8fd1\u4e86\uff0c\u76f4\u63a5\u8fd4\u56de $target$\u3002\n   - \u82e5 $s > target$\uff1a\u548c\u504f\u5927\uff0c\u5c06\u53f3\u6307\u9488\u5de6\u79fb $right -= 1$ \u4ee5\u51cf\u5c0f\u548c\u3002\n   - \u82e5 $s < target$\uff1a\u548c\u504f\u5c0f\uff0c\u5c06\u5de6\u6307\u9488\u53f3\u79fb $left += 1$ \u4ee5\u589e\u5927\u548c\u3002\n\n### \ud83d\udd04 LC 15 vs LC 16 \u6838\u5fc3\u5f02\u540c\u70b9\u5bf9\u6bd4\uff1a\n\n| \u7ef4\u5ea6 | LC 15. 3Sum (\u4e09\u6570\u4e4b\u548c) | LC 16. 3Sum Closest (\u6700\u63a5\u8fd1\u7684\u4e09\u6570\u4e4b\u548c) |\n| :--- | :--- | :--- |\n| **\u76ee\u6807** | \u627e\u51fa\u6240\u6709\u548c\u4e3a `0` \u7684\u4e92\u4e0d\u76f8\u540c\u7684\u4e09\u5143\u7ec4 | \u627e\u51fa\u4e09\u6570\u4e4b\u548c\u4e0e `target` \u7edd\u5bf9\u5dee\u6700\u5c0f\u7684\u4e00\u4e2a\u548c |\n| **\u8fd4\u56de\u503c** | `List[List[int]]`\uff08\u4e09\u5143\u7ec4\u5217\u8868\uff09 | `int`\uff08\u4e09\u6570\u4e4b\u548c\u7684\u503c\uff09 |\n| **\u6307\u9488\u79fb\u52a8\u4f9d\u636e** | $s > 0 \\to right--$\uff1b$s < 0 \\to left++$\uff1b$s == 0 \\to$ \u8bb0\u5f55\u5e76\u53cc\u5411\u8df3\u8fc7\u91cd\u590d | \u52a8\u6001\u7ef4\u62a4\u5168\u5c40\u6700\u5c0f\u5dee $|s - target|$\uff0c\u6309 $s$ \u4e0e $target$ \u5927\u5c0f\u5173\u7cfb\u79fb\u52a8\u6307\u9488 |\n| **\u65f6\u95f4\u590d\u6742\u5ea6** | $\\mathcal{O}(n^2)$ | $\\mathcal{O}(n^2)$ |\n| **\u7a7a\u95f4\u590d\u6742\u5ea6** | $\\mathcal{O}(1)$ | $\\mathcal{O}(1)$ |\n\n---\n\n## 3. Code Implementation / \u4ee3\u7801\u5b9e\u73b0\n\n### \u65b9\u6848 1\uff1a\u6807\u51c6\u53cc\u6307\u9488\u89e3\u6cd5 (Standard Two Pointers)\n\n```python\nfrom typing import List\n\nclass Solution:\n    def threeSumClosest(self, nums: List[int], target: int) -> int:\n        nums.sort()\n        n = len(nums)\n        closest_sum = nums[0] + nums[1] + nums[2]\n        \n        for i in range(n - 2):\n            # \u57fa\u51c6\u6570\u53bb\u91cd\uff08\u5fae\u4f18\u5316\uff09\n            if i > 0 and nums[i] == nums[i - 1]:\n                continue\n            \n            left = i + 1\n            right = n - 1\n            \n            while left < right:\n                total = nums[i] + nums[left] + nums[right]\n                \n                # \u627e\u5230\u5b8c\u5168\u5339\u914d\uff0c\u76f4\u63a5\u8fd4\u56de\n                if total == target:\n                    return target\n                \n                # \u66f4\u65b0\u5168\u5c40\u6700\u63a5\u8fd1\u7684\u548c\n                if abs(total - target) < abs(closest_sum - target):\n                    closest_sum = total\n                \n                # \u8c03\u6574\u6307\u9488\n                if total < target:\n                    left += 1\n                else:\n                    right -= 1\n                    \n        return closest_sum\n```\n\n---\n\n### \u65b9\u6848 2\uff1a\u6781\u81f4\u53cc\u5411\u526a\u679d\u4f18\u5316 (Extreme 2-Way Pruning - \u51fb\u8d25 100%)\n\n\u5229\u7528\u6709\u5e8f\u6570\u7ec4\u4e24\u7aef\u7684\u6781\u7aef\u503c\uff0c\u53ef\u4ee5\u5728\u6bcf\u6b21\u5916\u5c42\u5faa\u73af\u4e2d\u6267\u884c **$\\mathcal{O}(1)$ \u6700\u5c0f\u548c\u4e0e\u6700\u5927\u548c\u526a\u679d**\uff1a\n\n```python\nclass SolutionOptimized:\n    def threeSumClosest(self, nums: List[int], target: int) -> int:\n        nums.sort()\n        n = len(nums)\n        closest_sum = nums[0] + nums[1] + nums[2]\n        \n        for i in range(n - 2):\n            x = nums[i]\n            if i > 0 and x == nums[i - 1]:\n                continue\n            \n            # \u526a\u679d 1: \u5f53\u524d i \u80fd\u6784\u6210\u7684\u6700\u5c0f\u548c (x + \u540e\u9762\u7d27\u63a5\u7740\u7684\u4e24\u4e2a\u6700\u5c0f\u6570)\n            min_s = x + nums[i + 1] + nums[i + 2]\n            if min_s > target:\n                # min_s \u5df2\u7ecf > target\uff0ci \u540e\u7eed\u7684\u4efb\u4f55\u7ec4\u5408\u53ea\u4f1a\u66f4\u5927\u3001\u79bb target \u66f4\u8fdc\n                if min_s - target < abs(closest_sum - target):\n                    closest_sum = min_s\n                break  # \u76f4\u63a5\u7ec8\u6b62\u6574\u4e2a\u5916\u5c42\u5faa\u73af\uff01\n            \n            # \u526a\u679d 2: \u5f53\u524d i \u80fd\u6784\u6210\u7684\u6700\u5927\u548c (x + \u6570\u7ec4\u672b\u5c3e\u4e24\u4e2a\u6700\u5927\u6570)\n            max_s = x + nums[-2] + nums[-1]\n            if max_s < target:\n                # max_s \u5df2\u7ecf < target\uff0c\u5f53\u524d i \u7684\u4efb\u4f55\u7ec4\u5408\u53ea\u4f1a\u66f4\u5c0f\u3001\u79bb target \u66f4\u8fdc\n                if target - max_s < abs(closest_sum - target):\n                    closest_sum = max_s\n                continue  # \u8df3\u8fc7\u5f53\u524d i\uff0c\u5c1d\u8bd5\u66f4\u5927\u7684 i\uff01\n            \n            # \u6b63\u5e38\u53cc\u6307\u9488\u5bf9\u649e\n            left = i + 1\n            right = n - 1\n            while left < right:\n                total = x + nums[left] + nums[right]\n                if total == target:\n                    return target\n                \n                if abs(total - target) < abs(closest_sum - target):\n                    closest_sum = total\n                \n                if total < target:\n                    left += 1\n                else:\n                    right -= 1\n                    \n        return closest_sum\n```\n\n---\n\n## 4. Step-by-Step Code Walkthrough / \u4ee3\u7801\u9010\u884c\u8be6\u89e3\n\n### 1. \u6570\u7ec4\u6392\u5e8f\u4e0e\u521d\u59cb\u89e3\u8bb0\u5f55 (Sorting & Base Value)\n\n```python\nnums.sort()\nn = len(nums)\nclosest_sum = nums[0] + nums[1] + nums[2]\n```\n\n* **[EN] Action:** Sorts `nums` in non-decreasing order and initializes `closest_sum` with the sum of the first 3 elements (`nums[0] + nums[1] + nums[2]`).\n  * **Why Sort?** Sorting introduces monotonicity, allowing us to deterministically increase the sum by moving `left` rightwards or decrease the sum by moving `right` leftwards.\n* **[CN] \u52a8\u4f5c**\uff1a\u5c06\u6570\u7ec4\u5347\u5e8f\u6392\u5e8f\uff0c\u5e76\u7528\u6570\u7ec4\u524d 3 \u4e2a\u6570\u7684\u548c\u521d\u59cb\u5316 `closest_sum`\u3002\n  * **\u4e3a\u4ec0\u4e48\u6392\u5e8f\uff1f** \u6392\u5e8f\u4f7f\u6570\u7ec4\u5177\u5907\u5355\u8c03\u6027\uff0c\u4f7f\u6211\u4eec\u80fd\u591f\u901a\u8fc7\u5de6\u6307\u9488\u53f3\u79fb\u5355\u8c03\u589e\u5927\u603b\u548c\u3001\u53f3\u6307\u9488\u5de6\u79fb\u5355\u8c03\u51cf\u5c0f\u603b\u548c\u3002\n\n---\n\n### 2. \u6700\u5c0f\u548c\u4e0e\u6700\u5927\u548c\u53cc\u5411\u526a\u679d\u539f\u7406 (2-Way Extreme Pruning Explained)\n\n```python\nmin_s = x + nums[i + 1] + nums[i + 2]\nif min_s > target:\n    if min_s - target < abs(closest_sum - target):\n        closest_sum = min_s\n    break\n```\n\n* **[EN] Logic:** `min_s` is the minimum possible triplet sum involving `nums[i]`.\n  * If `min_s > target`: All other triplets starting at `nums[i]` (and all triplets starting at subsequent larger `nums[i']`) will have a sum $\\ge min\\_s > target$, which will only be strictly farther away from `target`.\n  * Hence, after checking `min_s`, we can immediately **`break`** out of the outer loop!\n* **[CN] \u903b\u8f91**\uff1a`min_s` \u662f\u4ee5 `nums[i]` \u4e3a\u9996\u80fd\u6784\u6210\u7684**\u7edd\u5bf9\u6700\u5c0f\u503c**\u3002\n  * \u82e5 `min_s > target`\uff1a\u8bf4\u660e\u4ee5\u5f53\u524d `nums[i]` \u4ee5\u53ca\u540e\u7eed\u6240\u6709\u66f4\u5927\u7684 `nums[i']` \u4e3a\u9996\u7684\u4e09\u5143\u7ec4\u548c\u90fd\u4f1a $\\ge min\\_s > target$\uff0c\u53ea\u4f1a\u4e0e `target` \u5dee\u5f97\u8d8a\u6765\u8d8a\u8fdc\uff01\n  * \u56e0\u6b64\u5728\u6bd4\u8f83\u5e76\u66f4\u65b0 `min_s` \u540e\uff0c\u53ef\u76f4\u63a5 **`break`** \u5f7b\u5e95\u7ed3\u675f\u6574\u4e2a\u5916\u5c42\u5faa\u73af\uff01\n\n---\n\n```python\nmax_s = x + nums[-2] + nums[-1]\nif max_s < target:\n    if target - max_s < abs(closest_sum - target):\n        closest_sum = max_s\n    continue\n```\n\n* **[EN] Logic:** `max_s` is the maximum possible triplet sum involving `nums[i]`.\n  * If `max_s < target`: All other triplets starting at `nums[i]` will have a sum $\\le max\\_s < target$, which is farther from `target` than `max_s`.\n  * Hence, after checking `max_s`, no other combination with this `nums[i]` can improve the closeness. We can safely **`continue`** to the next `i`!\n* **[CN] \u903b\u8f91**\uff1a`max_s` \u662f\u4ee5 `nums[i]` \u4e3a\u9996\u80fd\u6784\u6210\u7684**\u7edd\u5bf9\u6700\u5927\u503c**\u3002\n  * \u82e5 `max_s < target`\uff1a\u8bf4\u660e\u4ee5\u5f53\u524d `nums[i]` \u4e3a\u9996\u7684\u6240\u6709\u5176\u4ed6\u7ec4\u5408\u548c\u90fd $\\le max\\_s < target$\uff0c\u4e0d\u53ef\u80fd\u6bd4 `max_s` \u66f4\u63a5\u8fd1 `target`\u3002\n  * \u56e0\u6b64\u5728\u6bd4\u8f83\u5e76\u66f4\u65b0 `max_s` \u540e\uff0c\u65e0\u9700\u8fdb\u5165\u5185\u5c42\u53cc\u6307\u9488\uff0c\u76f4\u63a5 **`continue`** \u8fdb\u5165\u4e0b\u4e00\u4e2a\u66f4\u5927\u7684 `i`\uff01\n\n---\n\n### 3. \u53cc\u6307\u9488\u5185\u5c42\u626b\u63cf (Two-Pointer Inward Search)\n\n```python\nwhile left < right:\n    total = x + nums[left] + nums[right]\n    if total == target:\n        return target\n    \n    if abs(total - target) < abs(closest_sum - target):\n        closest_sum = total\n    \n    if total < target:\n        left += 1\n    else:\n        right -= 1\n```\n\n* **[EN] Logic:**\n  * If `total == target`: Exact match found with difference 0. Return immediately.\n  * If `total < target`: The current sum is smaller than `target`. Increment `left` (`left += 1`) to increase `nums[left]`, thus increasing `total`.\n  * If `total > target`: The current sum is greater than `target`. Decrement `right` (`right -= 1`) to decrease `nums[right]`, thus decreasing `total`.\n* **[CN] \u903b\u8f91**\uff1a\n  * \u82e5 `total == target`\uff1a\u627e\u5230\u4e0e\u76ee\u6807\u5b8c\u5168\u4e00\u81f4\u7684\u548c\uff08\u5dee\u503c\u4e3a 0\uff09\uff0c\u65e0\u9700\u7ee7\u7eed\u641c\u7d22\uff0c\u76f4\u63a5\u8fd4\u56de `target`\u3002\n  * \u82e5 `total < target`\uff1a\u5f53\u524d\u548c\u504f\u5c0f\uff0c\u5de6\u6307\u9488\u53f3\u79fb `left += 1` \u4ee5\u589e\u5927 `nums[left]`\u3002\n  * \u82e5 `total > target`\uff1a\u5f53\u524d\u548c\u504f\u5927\uff0c\u53f3\u6307\u9488\u5de6\u79fb `right -= 1` \u4ee5\u51cf\u5c0f `nums[right]`\u3002\n\n---\n\n## 5. Step-by-Step Walkthrough with Examples / \u6837\u4f8b\u56fe\u89e3\u5206\u6790\n\n### \u6837\u4f8b 1: `nums = [-1, 2, 1, -4]`, `target = 1`\n\n* **\u6b65\u9aa4 1\uff1a\u5347\u5e8f\u6392\u5e8f**\n  * `nums = [-4, -1, 1, 2]` ($n = 4$)\n  * \u521d\u59cb `closest_sum = (-4) + (-1) + 1 = -4`\uff08\u5dee\u503c\u4e3a $|-4 - 1| = 5$\uff09\n\n* **\u6b65\u9aa4 2\uff1a\u5916\u5c42 $i = 0$ ($x = -4$)**\n  * `min_s = -4 + (-1) + 1 = -4 < 1`\n  * `max_s = -4 + 1 + 2 = -1 < 1` $\\to$ `abs(-1 - 1) = 2 < 5`\uff0c\u66f4\u65b0 `closest_sum = -1`\u3002\u89e6\u53d1 `max_s` \u526a\u679d\uff0c\u76f4\u63a5\u8df3\u8fc7\u5185\u5c42\u5faa\u73af\u3002\n\n* **\u6b65\u9aa4 3\uff1a\u5916\u5c42 $i = 1$ ($x = -1$)**\n  * `min_s = -1 + 1 + 2 = 2 > 1` $\\to$ `abs(2 - 1) = 1 < 2`\uff0c\u66f4\u65b0 `closest_sum = 2`\u3002\n  * \u56e0\u4e3a `min_s > 1`\uff0c\u89e6\u53d1 `min_s` \u526a\u679d\uff0c\u76f4\u63a5 **`break`** \u7ec8\u6b62\u6574\u4e2a\u5916\u5c42\u5faa\u73af\uff01\n\n* **\u6700\u7ec8\u8fd4\u56de**\uff1a`closest_sum = 2`\uff08\u5bf9\u5e94\u4e09\u5143\u7ec4 `[-1, 1, 2]`\uff0c\u548c\u4e3a 2\uff0c\u8ddd\u79bb `target = 1` \u4ec5\u76f8\u5dee 1\uff09\uff0c\u5b8c\u5168\u6b63\u786e\uff01\n\n---\n\n## 6. Key FAQs & Edge Cases / \u6838\u5fc3\u7b54\u7591\u4e0e\u8fb9\u754c\u5206\u6790\n\n### Q1: \u4e3a\u4ec0\u4e48\u4e0d\u80fd\u76f4\u63a5\u7528 `float(\"inf\")` \u521d\u59cb\u5316 `closest_sum`\uff1f\n* \u5982\u679c\u521d\u59cb\u5316 `closest_sum = float(\"inf\")`\uff0c\u5728\u8ba1\u7b97 `abs(closest_sum - target)` \u65f6\u53ef\u80fd\u4f1a\u6d89\u53ca\u6d6e\u70b9\u6570\u51cf\u6cd5\uff0c\u4e14\u6700\u7ec8\u8fd4\u56de\u9700\u8981\u8f6c\u6362\u4e3a `int`\u3002\n* \u6700\u6807\u51c6\u3001\u6700\u5b89\u5168\u7684\u505a\u6cd5\u662f\u7528\u6570\u7ec4\u524d\u4e09\u4e2a\u6570\u7684\u548c `nums[0] + nums[1] + nums[2]` \u521d\u59cb\u5316\uff0c\u4fdd\u8bc1\u7c7b\u578b\u59cb\u7ec8\u4e3a\u6574\u578b\u4e14\u5fc5\u7136\u6765\u81ea\u6570\u7ec4\u7684\u4e00\u4e2a\u5408\u6cd5\u4e09\u5143\u7ec4\u3002\n\n### Q2: \u4e3a\u4ec0\u4e48\u8fd9\u9053\u9898\u4e0d\u9700\u8981\u50cf LC 15 \u90a3\u6837\u5728\u5185\u5c42\u5faa\u73af\u5bf9 `left` \u548c `right` \u8fdb\u884c\u6df1\u5ea6\u8df3\u91cd\uff1f\n* \u5728 LC 15 \u4e2d\uff0c\u9700\u8981\u627e\u51fa**\u6240\u6709\u4e0d\u91cd\u590d**\u7684\u4e09\u5143\u7ec4\uff0c\u56e0\u6b64\u4e00\u65e6\u627e\u5230\u4e00\u4e2a\u89e3\u5fc5\u987b\u8df3\u8fc7\u6240\u6709\u76f8\u540c\u6570\u5b57\u4ee5\u9632\u91cd\u590d\u52a0\u5165\u7ed3\u679c\u5217\u8868\u3002\n* \u5728 LC 16 \u4e2d\uff0c\u76ee\u6807\u4ec5\u662f\u7ef4\u62a4\u4e00\u4e2a\u5168\u5c40\u6700\u4f18\u7684**\u5355\u4e00\u6570\u503c\u548c**\uff0c\u8df3\u91cd\u867d\u7136\u80fd\u5e26\u6765\u5fae\u91cf\u6027\u80fd\u63d0\u5347\uff0c\u4f46\u5373\u4f7f\u4e0d\u8df3\u91cd\u4e5f\u4e0d\u5f71\u54cd\u6b63\u786e\u6027\uff0c\u5355\u6b65 `left += 1` \u548c `right -= 1` \u4f9d\u7136\u80fd\u6b63\u786e\u904d\u5386\u5230\u6240\u6709\u5173\u952e\u72b6\u6001\u3002\n\n---\n\n## 7. Complexity Analysis / \u590d\u6742\u5ea6\u5206\u6790\n\n| \u6307\u6807 | \u590d\u6742\u5ea6 | \u8be6\u89e3 |\n| :--- | :--- | :--- |\n| **\u65f6\u95f4\u590d\u6742\u5ea6 (Time)** | $\\mathcal{O}(n^2)$ | \u6570\u7ec4\u6392\u5e8f\u8017\u65f6 $\\mathcal{O}(n \\log n)$\uff1b\u5916\u5c42\u5faa\u73af\u904d\u5386 $n$ \u4e2a\u6570\uff0c\u5185\u5c42\u53cc\u6307\u9488\u5bf9\u649e\u626b\u63cf\u6700\u591a $\\mathcal{O}(n)$ \u6b21\u3002\u52a0\u4e0a\u6781\u503c\u526a\u679d\u540e\u5b9e\u9645\u8fd0\u884c\u65f6\u95f4\u5927\u5e45\u4f18\u4e8e $\\mathcal{O}(n^2)$\u3002 |\n| **\u7a7a\u95f4\u590d\u6742\u5ea6 (Space)** | $\\mathcal{O}(1)$ (\u6216 $\\math
